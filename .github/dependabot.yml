version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "terraform"
    directory: "/deploy/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore(terraform)"

  # maven: osv-scanner ja escaneia o pom do motor (security.yml) e ACENA para
  # as vulnerabilidades, mas nada abria PR de patch-currency — o bump do
  # jackson-core (#583) foi manual. Estes sao os UNICOS dois poms rastreados
  # do repo; copias sob docs/audits sao arquivais (nao-rastreadas, logo
  # invisiveis ao Dependabot). `directory` aponta para cada pom: sem pom na
  # raiz nem <modules>/<parent> ligando os dois, directory "/" seria INERTE
  # (o file fetcher de maven so segue a arvore a partir de um pom raiz).
  - package-ecosystem: "maven"
    directory: "/src/maezo/portal/engine/java"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:05"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "maven"
    directory: "/src/maezo/portal/engine/read-provider"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:20"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
