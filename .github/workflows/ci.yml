name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # 03:00 BRT (UTC-3) — nightly eval run

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.26"

jobs:
  quality:
    name: lint / type / unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: make lint

      - name: Type check
        run: make type

      # T2.3 (B9 CI surgery): folded the coverage gate into the unit-test step itself
      # instead of a second pytest invocation, so the suite runs exactly once.
      # Measured 2026-07-16: 87.09% on src/maezo (588 tests) — >=85%, so the floor is
      # enforced at the real 85% target (not weakened, not fabricated). If a future PR
      # drops coverage below 85% this step fails the job — no more silent erosion.
      # This also finally makes the "Upload unit test results" step below honest: it has
      # always claimed to upload htmlcov/, but `make test` (plain `pytest tests/ -q`)
      # never generated an htmlcov/ directory, so that half of the artifact was
      # cargo-cult (silently empty every run, upload-artifact just warns and moves on).
      # --cov-report=html here makes htmlcov/ real.
      - name: Unit tests + coverage gate (>=85%)
        run: |
          uv run pytest tests/ -q --cov=src/maezo --cov-report=term --cov-report=html --cov-fail-under=85

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: unit-test-results
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7

  # ── Reativado em M13: o módulo maezo.platform.validation.cli está implementado
  # (construído em M2/M9). Os artefatos BPMN/DMN/policy em spec/ são validados.
  # ✅ Passa em CI (make validate-artifacts exit 0).
  artifact-validation:
    name: validate-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Validate BPMN / DMN / policies / agent definitions
        run: make validate-artifacts

      # ADR-0030 §2 boundary-proof gate: every WorkerBpmnError a worker raises must be a
      # consumption-covered spec-declared boundary code on its external task (b1/b2); an
      # uncatalogued/unproven raise fails the build. Dead-model (clause c) is warn-only during the
      # Tier-0..2 migration window (F5). Belt-and-suspenders with the arch-test in tests/unit/ci/.
      - name: Boundary-proof BPMN-error allowlist gate (ADR-0030)
        run: make check-bpmn-error-allowlist

      # T3.4 F1: repo-wide AST gate — a direct `transport.start_process_instance(...)` call (or a
      # hand-rolled raw REST start-path literal) anywhere outside the pinned 2-file transport
      # allowlist bypasses the `start_process_idempotent` fence (ADR-0007/T-C2 emit-before-effect
      # + business-key idempotency). Belt-and-suspenders with the arch-test in tests/unit/ci/.
      - name: Start-process fence gate (ADR-0007/T-C2)
        run: make check-start-process-fence

      # MZO-010 / XRG-3: the AMH contract is AMH-owned; this repo holds only the immutable pin
      # (config/integrations/amh/contracts.lock.json) plus the AMH-published, digest-gated fixture
      # bytes. ADR-0037 XRD-04 requires a divergent digest, an absent schema, a wrong topic or a
      # downgraded version to fail closed BEFORE merge. stdlib-only, no network — it verifies bytes
      # already in the tree. Belt-and-suspenders with the consumer tests in tests/contract/amh/.
      - name: AMH contract pin gate (ADR-0037 XRD-04)
        run: make verify-amh-contract-pin

  # ── Reativado em M13: o módulo maezo.platform.validation.cli está implementado
  # (construído em M2/M9). make validate-signoff funciona.
  # ✅ Passa em CI (greenfield stub, exit 0).
  content-signoff-gate:
    name: content-signoff-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Content sign-off gate (promotable artifacts require human sign-off)
        run: make validate-signoff

  validate-terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.0"

      - name: Terraform validate — modules
        run: |
          for dir in deploy/terraform/modules/*/; do
            echo "Validating $dir"
            cd "$dir"
            terraform init -backend=false -input=false
            terraform validate
            cd - > /dev/null
          done
        working-directory: ${{ github.workspace }}

      - name: Terraform validate — envs
        run: |
          for dir in deploy/terraform/envs/*/; do
            echo "Validating $dir"
            cd "$dir"
            terraform init -backend=false -input=false
            terraform validate
            cd - > /dev/null
          done
        working-directory: ${{ github.workspace }}

  validate-helm:
    name: helm lint + egress NetworkPolicy CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: "3.15.0"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Helm lint — maezo-tenant
        run: |
          helm lint deploy/helm/maezo-tenant/ --strict
          helm lint deploy/helm/maezo-tenant/ --strict \
            -f deploy/helm/maezo-tenant/values-amh.yaml

      - name: Helm template smoke test
        run: |
          helm template maezo-amh deploy/helm/maezo-tenant/ \
            -f deploy/helm/maezo-tenant/values-amh.yaml \
            --debug > /dev/null

      # ── DESABILITADO: tests/unit/platform/test_provision_tenant.py ainda não
      # existe. NetworkPolicy egress tests serão implementados quando o módulo
      # de provisionamento de tenant for construído (post-M13).
      # Reativar removendo o if: false após a implementação.
      - name: NetworkPolicy egress fail-closed tests (ADR-0006 / ADR-0017, gap #13)
        if: false
        # Runs the @requires_helm tests in test_provision_tenant.py that prove:
        #   (1) PHI egress = concrete BR CIDRs only, NEVER 0.0.0.0/0 (FIX 1)
        #   (2) intra-namespace egress is scoped to gateway only, not all pods (FIX 2)
        #   (3) zone mismatch between values and effectiveDefinition aborts render (FIX 3)
        #   (4) bare-default render fails closed (no concrete CIDRs = abort)
        #   (5) default-deny-egress NetworkPolicy is present in the committed render
        #   (6) PHI with zero brResidentEndpoints gets egress: null/[] (total deny)
        #   (7) generalZone.enabled=false leaves per-agent egress list empty
        # helm CLI is on PATH here so @requires_helm marks do NOT skip.
        run: |
          uv run pytest tests/unit/platform/test_provision_tenant.py -v \
            --tb=short -q

  # ── T2.3 (B9 CI surgery, guard-step pattern): tests/integration/ does not exist yet
  # (no code has landed there since M0). Previously this job ran `make test-integration`
  # unconditionally against a missing directory, which made it EXPECTED-RED on every
  # PR/push and kept main permanently red (red-main-alarm firing every ~2h). It is no
  # longer allowed to be silently disabled (`if: false`) OR expected-red — instead a
  # guard step checks for real, collectable tests and decides at runtime:
  #   - tests exist and collect  -> run them for real against the real engine, fail on
  #     failure (no mock, ADR-0011).
  #   - nothing to collect yet   -> emit a LOUD ::notice:: + step-summary marker and
  #     exit 0 (visible skip, not silent, not expected-red).
  # Unblock condition: T3.1 (V2-COMPLETION-PLAN) lands integration tests under
  # tests/integration/. The moment that happens this lane auto-activates — no
  # workflow edit needed.
  integration:
    name: integration tests (real engine)
    runs-on: ubuntu-latest
    # Sem "test coverage illusion": testes de integracao rodam contra engine REAL.
    needs: [quality]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      # Pin the compose postgres host port explicitly (docker-compose.yml defaults to 5433 for
      # local dev — see that file — to avoid colliding with other Postgres instances on a dev's
      # machine). CI has no such collision and tests/integration/**/conftest.py fall back to a
      # hardcoded localhost:5432 DSN when MAEZO_TEST_DATABASE_URL is unset (which it is here), so
      # pinning to 5432 keeps this job's behavior byte-for-byte unchanged.
      MAEZO_PG_HOST_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Three-bucket guard (verification cycle 1 caught a fail-open two-bucket version
      # that routed EVERY nonzero collect exit to the visible skip — a planted
      # import error, pytest exit 2, read as "no tests yet" and the job went GREEN):
      #   exit 0        -> tests collected: run the real lane
      #   exit 4 or 5   -> dir missing / nothing collected: visible skip (greenfield)
      #   anything else -> COLLECTION BROKEN (e.g. 2 = import/collection error):
      #                    FAIL the job. Broken tests must never masquerade as absent.
      - name: Check for collectable integration tests
        id: guard
        run: |
          set +e
          uv run pytest tests/integration --collect-only -q
          code=$?
          set -e
          echo "collect_code=${code}" >> "$GITHUB_OUTPUT"
          case "${code}" in
            0)
              echo "collect exit ${code}: tests collected — running the real lane"
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            4|5)
              echo "collect exit ${code}: no tests yet (4 = dir missing, 5 = nothing collected) — visible skip"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::COLLECTION BROKEN — tests/integration exists but cannot be collected (pytest --collect-only exit ${code}; 2 = import/collection error). This is NOT 'no tests yet' — failing the job."
              exit 1
              ;;
          esac

      - name: INTEGRATION LANE SKIPPED (visible)
        if: steps.guard.outputs.run == 'false'
        run: |
          echo "::notice::INTEGRATION LANE SKIPPED — no tests yet (pytest --collect-only exit ${{ steps.guard.outputs.collect_code }}); unblocks at T3.1 (V2-COMPLETION-PLAN)"
          {
            echo "## integration tests (real engine): SKIPPED"
            echo ""
            echo "No collectable tests under \`tests/integration/\` (pytest --collect-only exit"
            echo "${{ steps.guard.outputs.collect_code }}). This lane auto-activates the"
            echo "moment T3.1 (V2-COMPLETION-PLAN) lands tests there — no workflow edit needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start core stack
        if: steps.guard.outputs.run == 'true'
        run: docker compose --profile core up -d

      - name: Wait for stack to be healthy
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "Waiting for postgres..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U maezo -d maezo; do sleep 3; done'
          echo "Waiting for cibseven..."
          timeout 300 bash -c 'until curl -sf http://localhost:8080/engine-rest/version; do sleep 5; done'
          echo "Waiting for hapi-fhir..."
          timeout 300 bash -c 'until curl -sf http://localhost:8081/fhir/metadata; do sleep 5; done'
          echo "All services healthy."

      - name: Integration tests
        if: steps.guard.outputs.run == 'true'
        run: make test-integration

      - name: Upload integration test results
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: integration-test-results-${{ github.sha }}
          path: .pytest_cache/
          retention-days: 7

      - name: Collect stack logs on failure
        if: failure() && steps.guard.outputs.run == 'true'
        run: docker compose --profile core logs --no-color > docker-compose-failure.log

      - name: Upload failure logs
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-compose-failure-logs-${{ github.sha }}
          path: docker-compose-failure.log
          retention-days: 3

      - name: Tear down stack
        if: always() && steps.guard.outputs.run == 'true'
        run: docker compose --profile core down -v

  # ---------------------------------------------------------------------------
  # T3.3 W0/W1 — chaos / cross-process resilience: seam-level fault-injection suites
  # (docs/design/T3.3-chaos-resilience.md, orchestrator-ratified 2026-07-25). These suites
  # (B1a/B1b/C1-down under tests/integration/chaos/, marked `chaos`) inject faults at the PYTHON
  # SEAM — monkeypatched `PostgresAuditSink` methods / `CibSevenTransport` call sites against a
  # `FakeCibSevenTransport` — never a real container kill, never a real CIB Seven engine. This job
  # therefore brings up ONLY the `postgres` service from the `core` compose profile: a separate,
  # lean, fast lane that cannot contend with (or be contended by) the `integration` job's full
  # engine stack — each GitHub Actions job already runs on its own isolated runner, and this job
  # additionally never touches cibseven/hapi-fhir/kafka at all.
  #
  # W2 (container-control chaos — real worker pod-kill / worker-daemon restart / engine restart;
  # docs/design/T3.3-chaos-resilience.md §4 Wave W2, tests still to be written:
  # test_pod_kill_handoff.py / test_daemon_restart_readiness.py / test_engine_restart.py) is
  # DELIBERATELY NOT wired into this job — the ratified §5 policy is that destructive
  # container-control chaos lands as a SEPARATE, SERIALIZED, NIGHTLY job (mirroring
  # `evals-nightly`'s `if: github.event_name == 'schedule'` gating below) once W2 is actually
  # built, so it can never corrupt this job's (or `integration`'s) shared stack state mid-run.
  # This is a documented placeholder, not a stub job — add a `chaos-nightly` job here (schedule-
  # gated, its own `docker compose -p chaos` or testcontainers-controlled stack, `-m chaos and
  # destructive` or a distinct marker) when W2 lands.
  #
  # Guard-step pattern mirrors `integration`/`evals` (three-bucket: 0 = run; 4|5 = visible skip;
  # else = COLLECTION BROKEN fails the job — never masquerade a broken collection as "no tests").
  chaos:
    name: chaos (seam-level fault injection, PG-only)
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      # Same convention as the `integration` job — CI has no local-port collision to avoid.
      MAEZO_PG_HOST_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Check for collectable chaos tests
        id: guard
        run: |
          set +e
          uv run pytest tests/integration/chaos --collect-only -q -m chaos
          code=$?
          set -e
          echo "collect_code=${code}" >> "$GITHUB_OUTPUT"
          case "${code}" in
            0)
              echo "collect exit ${code}: chaos tests collected — running the real lane"
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            4|5)
              echo "collect exit ${code}: no chaos tests yet (4 = dir missing, 5 = nothing collected) — visible skip"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::COLLECTION BROKEN — tests/integration/chaos exists but cannot be collected (pytest --collect-only exit ${code}; 2 = import/collection error). This is NOT 'no tests yet' — failing the job."
              exit 1
              ;;
          esac

      - name: CHAOS LANE SKIPPED (visible)
        if: steps.guard.outputs.run == 'false'
        run: |
          echo "::notice::CHAOS LANE SKIPPED — no chaos-marked tests yet (pytest --collect-only exit ${{ steps.guard.outputs.collect_code }})"
          {
            echo "## chaos (seam-level fault injection): SKIPPED"
            echo ""
            echo "No collectable \`-m chaos\` tests under \`tests/integration/chaos/\` yet (pytest"
            echo "--collect-only exit ${{ steps.guard.outputs.collect_code }})."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start Postgres only (no cibseven — chaos seam suites are PG-only)
        if: steps.guard.outputs.run == 'true'
        run: docker compose --profile core up -d postgres

      - name: Wait for Postgres to be healthy
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "Waiting for postgres..."
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U maezo -d maezo; do sleep 3; done'
          echo "Postgres healthy."

      - name: Chaos tests (seam-level fault injection)
        if: steps.guard.outputs.run == 'true'
        run: uv run pytest tests/integration/chaos -q -m chaos

      - name: Upload chaos test results
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chaos-test-results-${{ github.sha }}
          path: .pytest_cache/
          retention-days: 7

      - name: Collect Postgres logs on failure
        if: failure() && steps.guard.outputs.run == 'true'
        run: docker compose --profile core logs postgres --no-color > chaos-postgres-failure.log

      - name: Upload failure logs
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chaos-postgres-failure-logs-${{ github.sha }}
          path: chaos-postgres-failure.log
          retention-days: 3

      - name: Tear down stack
        if: always() && steps.guard.outputs.run == 'true'
        run: docker compose --profile core down -v

  # ---------------------------------------------------------------------------
  # Tasy simulator smoke test (ADR-0013 gap #33):
  # Validates that the simulator profile starts and produces CDC events without
  # error. Runs after the core integration job to reuse the already-built images.
  # The simulator is a permanent CI deliverable (not a dev-only hack) — see ADR-0013.
  # ---------------------------------------------------------------------------
  # ── T2.3 (B9 CI surgery, guard-step pattern): the 'simulator' compose profile
  # (tasy-simulator service) was REMOVED in T0.4 (defect B14) — it built from
  # deploy/tasy_simulator.Dockerfile, which never existed in this repo, and there is
  # no simulator source under src/ (confirmed via `git log --all`: zero history for
  # that Dockerfile path). This job must NOT attempt `--profile simulator` blindly —
  # that profile is gone from docker-compose.yml and the command would fail.
  # Real double blocker: (1) tasy-simulator removed T0.4, (2) reintroduction tracked
  # in T2.6 / ADR-0013 (which documents the simulator as a planned *permanent* CI
  # deliverable, not a temporary hack — just not built yet).
  # Guard step detects the profile's reintroduction via `docker compose config
  # --profiles` (pure YAML parse, no daemon dependency) so this lane auto-activates
  # the moment T2.6 lands the profile — no workflow edit needed.
  fhir-sync-simulator:
    name: "fhir-sync simulator smoke (ADR-0013 gap #33)"
    runs-on: ubuntu-latest
    # Hard safety net: job CANNOT hang longer than 12 minutes regardless of step timeouts.
    # Root cause of CI run 27511267203 hang: KAFKA_ADVERTISED_LISTENERS was localhost:9092 only,
    # so the broker told tasy-simulator to connect to 127.0.0.1:9092 (its own loopback) —
    # AIOKafkaProducer.start() retried indefinitely. Fixed in docker-compose.yml (dual listener).
    timeout-minutes: 12
    needs: [quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Two-phase guard (verification cycle 1 caught a fail-open version that piped
      # `docker compose config` straight into grep with stderr discarded — a BROKEN
      # docker-compose.yml exited nonzero, produced no profile list, and read as
      # "profile absent" -> false visible skip). Phase 1: `docker compose config`
      # must itself succeed, else the job FAILS loudly. Phase 2: only then is the
      # profile list inspected for 'simulator'.
      - name: Check for reintroduced 'simulator' compose profile
        id: guard
        run: |
          set +e
          profiles="$(docker compose config --profiles 2>compose-config.stderr)"
          code=$?
          set -e
          if [ "${code}" -ne 0 ]; then
            echo "::error::docker compose config failed (exit ${code}) — docker-compose.yml is broken. Refusing to read a parse failure as 'simulator profile absent' — failing the job."
            echo "--- docker compose config stderr ---"
            cat compose-config.stderr
            exit 1
          fi
          echo "compose profiles found:"
          printf '%s\n' "${profiles}"
          if printf '%s\n' "${profiles}" | grep -qx simulator; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: FHIR-SYNC-SIMULATOR LANE SKIPPED (visible)
        if: steps.guard.outputs.run == 'false'
        run: |
          echo "::notice::FHIR-SYNC-SIMULATOR LANE SKIPPED — tasy-simulator service/profile removed in T0.4 (defect B14: dangling Dockerfile that never existed); reintroduction tracked in T2.6/ADR-0013"
          {
            echo "## fhir-sync-simulator: SKIPPED"
            echo ""
            echo "The \`simulator\` docker-compose profile (tasy-simulator service) was removed in"
            echo "T0.4 (defect B14) — it built from a Dockerfile that never existed in this repo"
            echo "and there was no simulator source under \`src/\`."
            echo ""
            echo "ADR-0013 documents the simulator as a planned *permanent* CI deliverable."
            echo "Reintroduction is tracked in T2.6. This lane auto-activates the moment the"
            echo "\`simulator\` profile is reintroduced to docker-compose.yml — no workflow edit needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Tasy simulator image
        if: steps.guard.outputs.run == 'true'
        # Bounded build step — prevents stalled layer pulls from eating the whole job budget.
        run: |
          timeout 300 docker compose --profile core --profile simulator build tasy-simulator
          echo "Simulator image built."

      - name: Start Kafka and wait for readiness
        if: steps.guard.outputs.run == 'true'
        run: |
          docker compose --profile core --profile simulator up -d kafka
          echo "Waiting for Kafka to be ready (INTERNAL listener kafka:29092)..."
          # Use the INTERNAL listener (kafka:29092) — the healthcheck runs inside the kafka
          # container where the hostname resolves via Docker DNS.
          timeout 90 bash -c 'until docker compose exec -T kafka kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1; do sleep 5; done' \
            || { echo "ERROR: Kafka did not become ready within 90s"; exit 1; }
          echo "Kafka ready."

      - name: Run Tasy simulator (one-shot)
        if: steps.guard.outputs.run == 'true'
        # TASY_SIM_LOOP=0 → exits after emitting all scenarios (deterministic one-shot).
        # KAFKA_BOOTSTRAP_SERVERS=kafka:29092 → uses the cross-container INTERNAL listener.
        # timeout 120 ensures a hung AIOKafkaProducer.start() never blocks past this step.
        run: |
          timeout 120 docker compose --profile core --profile simulator run --rm \
            -e TASY_SIM_LOOP=0 \
            -e KAFKA_BOOTSTRAP_SERVERS=kafka:29092 \
            tasy-simulator
          echo "Tasy simulator exited successfully (one-shot complete)."

      - name: Collect simulator logs on failure
        if: failure() && steps.guard.outputs.run == 'true'
        run: docker compose --profile core --profile simulator logs --no-color > simulator-failure.log

      - name: Upload simulator failure logs
        if: failure() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: simulator-failure-logs-${{ github.sha }}
          path: simulator-failure.log
          retention-days: 3

      - name: Tear down stack
        if: always() && steps.guard.outputs.run == 'true'
        run: docker compose --profile core --profile simulator down -v

  # ── T2.3 (B9 CI surgery, guard-step pattern): no golden datasets exist yet under
  # tests/evals/ (no agent code has landed that needs eval gating). Previously this
  # whole job was permanently disabled via `if: false`, an invisible skip with no
  # runtime signal. Now: the existing dorny/paths-filter gate (only run when
  # agent-touching paths change) is preserved as-is, and a second guard step checks
  # for real, collectable eval-marked tests. If agent paths changed but there is
  # nothing to collect yet, a LOUD visible skip fires instead of silently no-op'ing.
  # Unblock condition: T3.2 (V2-COMPLETION-PLAN) lands golden datasets under
  # tests/evals/. The moment that happens this lane auto-activates — no workflow
  # edit needed.
  evals:
    name: evals (agent-touching paths)
    runs-on: ubuntu-latest
    needs: [quality]
    # dorny/paths-filter cai no fallback da API listFiles (pulls/{n}/files) em alguns PRs; sem
    # `pull-requests: read` o GITHUB_TOKEN (default read-only deste repo) recebe "Resource not
    # accessible by integration" e o gate falha (falso-negativo). Concede a permissão mínima.
    permissions:
      contents: read
      pull-requests: read
    # Gate: run when agent-touching files change (ADR-0009 golden datasets).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check if agent-touching files changed
        id: agent_changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        with:
          filters: |
            agents:
              - 'src/maezo/agents/**'
              - 'src/maezo/runtime/**'
              - 'src/maezo/gateway/**'
              - 'tests/evals/**'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.agent_changes.outputs.agents == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: steps.agent_changes.outputs.agents == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: steps.agent_changes.outputs.agents == 'true'
        run: uv sync --locked --extra dev

      # Three-bucket guard (see the `integration` job for the verification-cycle-1
      # fail-open this replaces): 0 -> run; 4/5 -> visible skip; else -> job FAILS
      # (broken collection must never masquerade as "no golden datasets yet").
      - name: Check for collectable eval golden datasets
        id: guard
        if: steps.agent_changes.outputs.agents == 'true'
        run: |
          set +e
          uv run pytest tests/evals --collect-only -q -m eval
          code=$?
          set -e
          echo "collect_code=${code}" >> "$GITHUB_OUTPUT"
          case "${code}" in
            0)
              echo "collect exit ${code}: eval tests collected — running the real gate"
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            4|5)
              echo "collect exit ${code}: no golden datasets yet (4 = dir missing, 5 = nothing collected) — visible skip"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::COLLECTION BROKEN — tests/evals exists but cannot be collected (pytest --collect-only exit ${code}; 2 = import/collection error). This is NOT 'no golden datasets yet' — failing the job."
              exit 1
              ;;
          esac

      - name: EVALS LANE SKIPPED (visible)
        if: steps.agent_changes.outputs.agents == 'true' && steps.guard.outputs.run == 'false'
        run: |
          echo "::notice::EVALS LANE SKIPPED — no golden datasets yet (pytest --collect-only exit ${{ steps.guard.outputs.collect_code }}); unblocks at T3.2 (V2-COMPLETION-PLAN)"
          {
            echo "## evals (agent-touching paths): SKIPPED"
            echo ""
            echo "Agent-touching paths changed, but no collectable eval-marked tests exist under"
            echo "\`tests/evals/\` yet (pytest --collect-only exit ${{ steps.guard.outputs.collect_code }})."
            echo "This lane auto-activates the moment T3.2 (V2-COMPLETION-PLAN) lands golden"
            echo "datasets there — no workflow edit needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run eval gate
        if: steps.agent_changes.outputs.agents == 'true' && steps.guard.outputs.run == 'true'
        run: make evals
        env:
          LLM_GENERAL_API_KEY: ${{ secrets.LLM_GENERAL_API_KEY }}

      - name: Upload eval results
        if: always() && steps.agent_changes.outputs.agents == 'true' && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: eval-results-${{ github.sha }}
          path: .pytest_cache/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Nightly eval job — full eval suite against HEAD of main.
  # Runs at 03:00 BRT (06:00 UTC) to catch silent prompt/model drift.
  # Triggers on: schedule only (not on PRs to avoid API key usage in forks).
  # ---------------------------------------------------------------------------
  # ── T2.3 (B9 CI surgery, guard-step pattern): same real blocker as `evals` — no
  # golden datasets exist yet under tests/evals/. Previously disabled via `if: false`
  # (invisible). Also fixes a latent bug: the comment above always claimed this job
  # "Triggers on: schedule only (not on PRs to avoid API key usage in forks)", but
  # there was no `if:` enforcing that — only the blanket `if: false` masked it. Now
  # both are real: the job is schedule-gated at the job level, and a guard step
  # decides whether there is anything to run. Unblock condition: T3.2
  # (V2-COMPLETION-PLAN) lands golden datasets under tests/evals/. This lane
  # auto-activates the moment that happens — no workflow edit needed.
  evals-nightly:
    name: evals-nightly (full suite)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # Three-bucket guard (see the `integration` job for the verification-cycle-1
      # fail-open this replaces): 0 -> run; 4/5 -> visible skip; else -> job FAILS.
      - name: Check for collectable eval golden datasets
        id: guard
        run: |
          set +e
          uv run pytest tests/evals --collect-only -q -m eval
          code=$?
          set -e
          echo "collect_code=${code}" >> "$GITHUB_OUTPUT"
          case "${code}" in
            0)
              echo "collect exit ${code}: eval tests collected — running the full nightly suite"
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            4|5)
              echo "collect exit ${code}: no golden datasets yet (4 = dir missing, 5 = nothing collected) — visible skip"
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::COLLECTION BROKEN — tests/evals exists but cannot be collected (pytest --collect-only exit ${code}; 2 = import/collection error). This is NOT 'no golden datasets yet' — failing the job."
              exit 1
              ;;
          esac

      - name: EVALS-NIGHTLY LANE SKIPPED (visible)
        if: steps.guard.outputs.run == 'false'
        run: |
          echo "::notice::EVALS-NIGHTLY LANE SKIPPED — no golden datasets yet (pytest --collect-only exit ${{ steps.guard.outputs.collect_code }}); unblocks at T3.2 (V2-COMPLETION-PLAN)"
          {
            echo "## evals-nightly (full suite): SKIPPED"
            echo ""
            echo "No collectable eval-marked tests exist under \`tests/evals/\` yet (pytest"
            echo "--collect-only exit ${{ steps.guard.outputs.collect_code }}). This lane"
            echo "auto-activates the moment T3.2 (V2-COMPLETION-PLAN) lands golden datasets"
            echo "there — no workflow edit needed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Full nightly eval run
        if: steps.guard.outputs.run == 'true'
        run: make evals
        env:
          LLM_GENERAL_API_KEY: ${{ secrets.LLM_GENERAL_API_KEY }}
          NIGHTLY_EVAL: "1"

      - name: Upload nightly eval results
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nightly-eval-results-${{ github.sha }}
          path: .pytest_cache/
          retention-days: 30
