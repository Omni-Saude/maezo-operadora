name: red-main-alarm

# ---------------------------------------------------------------------------
# Complementary (non-blocking) main-red alarm — ADR-0023 decision 8.
#
# This does NOT gate merges. It PAGES when main's tip has a failing latest
# completed push-event run, so a red main is discovered by a schedule instead
# of by the next PR author. Contract (ADR-0023 §8, facts 1-2 of Contexto):
#   - Fix the PUSH-EVENT run of the tip (gh run list --event push), never the
#     per-SHA check-runs — the nightly cron (ci.yml:7-8, 06:00 UTC) re-runs on
#     the SAME sha and REWRITES that sha's check-run verdicts.
#   - Ignore cancelled/skipped runs — ci.yml's concurrency group cancels the
#     in-flight run of the tip on every new push; a cancelled run must not page.
#   - in_progress (non-"completed") is pending, not red — exit 0.
#   - Only page when the latest COMPLETED, non-cancelled/skipped push run of
#     the CURRENT tip concluded failure/timed_out.
#
# T2.3 (B9 CI surgery) recalibration note:
#   Before T2.3, this alarm fired on (almost) every scheduled run because main's
#   push-event CI runs were genuinely red: ci.yml's `integration` job ran
#   `make test-integration` unconditionally against a nonexistent tests/integration/,
#   which always failed and always failed the whole CI run's conclusion.
#   T2.3 converted `integration`, `evals`, `evals-nightly`, and `fhir-sync-simulator`
#   to a guard-step pattern: each checks its real precondition at runtime (collectable
#   tests present / compose profile reintroduced) and either runs for real or emits a
#   LOUD `::notice::` + step-summary skip and exits 0 — never a silent `if: false`,
#   never continue-on-error, never a job that fails for a reason unrelated to the
#   code under test. A visible skip is a successful step, so it does not fail the job,
#   so it does not fail the workflow run, so it does NOT trip this alarm — a visible
#   skip is deliberately indistinguishable from "nothing needed to run" as far as this
#   alarm is concerned. The detection logic above (workflow-run granularity, ignore
#   cancelled/skipped, only page on failure/timed_out of the latest completed
#   push-event run) was already correct for this and needed no functional change —
#   the fix was upstream, in ci.yml, removing the sources of genuine (or previously
#   fake-genuine) red.
#   Expected state after this PR merges to main: the next push-event CI run on the
#   new tip is fully green (lint/type/unit+coverage-gate/artifact-validation/
#   content-signoff/terraform/helm all pass for real; integration/evals/
#   evals-nightly/fhir-sync-simulator all report a visible, loud, non-failing skip),
#   and the next scheduled run of red-main-alarm reports "main is GREEN".
#
# Nightly-canary leg (IMPL-7, 2026-10-02):
#   The push-only scope above has a blind spot BY CONSTRUCTION: ci.yml's
#   integration shards run only on `pull_request`/`schedule` (ci.yml:1382) — a red
#   nightly canary never produces a failing push-event run on main's tip, so it
#   paged nobody. Measured: 36223240788..36972852809, seven consecutive red
#   nightlies (2026-09-26..10-02), zero alarms. The second step below applies the
#   SAME detection (latest COMPLETED, non-cancelled/skipped run; page only on
#   failure/timed_out) to ci.yml's `schedule` event on the default branch, annotated
#   as "nightly canary (run <id>, head <short-sha>)": a schedule run tests the
#   PREVIOUS tip, so its verdict is annotated, never correlated to the current tip.
#   Staleness guard: a verdict older than 36h (24h nightly cadence + 12h margin —
#   one missed/cancelled night is tolerated, since the next nightly re-covers it)
#   emits a WARNING, not a page — a missed cron is an observability gap, not a red
#   main, and paging it as if main were red is the noise T2.3 tuned away.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2h; :17 offset dodges the 06:00 UTC CI nightly (ci.yml:8)
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  red-main-alarm:
    name: red-main-alarm
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # No checkout: this is pure `gh api`/`gh run` — keep the job fast/cheap.
      - name: Detect red main (push-event run of the current tip only)
        shell: bash
        run: |
          set -euo pipefail

          tip_sha="$(gh api "repos/${REPO}/branches/main" --jq .commit.sha)"
          echo "main tip: ${tip_sha}"

          runs_json="$(gh run list --repo "${REPO}" --commit "${tip_sha}" --event push \
            --json databaseId,name,status,conclusion,url)"
          run_count="$(printf '%s' "${runs_json}" | jq 'length')"
          echo "push-event runs found for tip: ${run_count}"

          if [ "${run_count}" -eq 0 ]; then
            echo "## red-main-alarm: no push-event run yet for tip \`${tip_sha}\` — fresh tip, run pending." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Latest COMPLETED run per workflow (CI, CD), dropping cancelled/skipped.
          # status != "completed" (queued/in_progress/waiting/...) is pending, not red,
          # so it is excluded here rather than treated as a verdict.
          latest_json="$(printf '%s' "${runs_json}" | jq -c '
            [ .[] | select(.status == "completed")
                   | select(.conclusion != "cancelled" and .conclusion != "skipped") ]
            | group_by(.name)
            | map(max_by(.databaseId))
          ')"

          echo "latest completed, non-cancelled/skipped push run per workflow:"
          printf '%s' "${latest_json}" | jq .

          red_json="$(printf '%s' "${latest_json}" | jq -c \
            '[ .[] | select(.conclusion == "failure" or .conclusion == "timed_out") ]')"
          red_count="$(printf '%s' "${red_json}" | jq 'length')"

          if [ "${red_count}" -eq 0 ]; then
            {
              echo "## red-main-alarm: main is GREEN"
              echo ""
              echo "Tip \`${tip_sha}\`: latest completed push-event run(s) are clean."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## red-main-alarm: main is RED"
            echo ""
            echo "Tip \`${tip_sha}\` has a failing latest completed push-event run:"
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s' "${red_json}" | jq -c '.[]' | while IFS= read -r run; do
            run_id="$(printf '%s' "${run}" | jq -r '.databaseId')"
            wf_name="$(printf '%s' "${run}" | jq -r '.name')"
            conclusion="$(printf '%s' "${run}" | jq -r '.conclusion')"
            run_url="$(printf '%s' "${run}" | jq -r '.url')"
            echo "RED: ${wf_name} run ${run_id} (${conclusion})"

            {
              echo ""
              echo "### ${wf_name} — run ${run_id} (${conclusion})"
              echo "${run_url}"
              echo ""
              echo "Failed jobs:"
            } >> "$GITHUB_STEP_SUMMARY"

            gh run view "${run_id}" --repo "${REPO}" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- " + .name + " (" + .conclusion + ")"' \
              >> "$GITHUB_STEP_SUMMARY"
          done

          echo "main is RED — see step summary for failing run(s)/job(s)."
          exit 1

      # Nightly-canary leg. `!cancelled()` (house style, cf. cd.yml:372) so the
      # canary verdict still lands in the summary when the push leg above already
      # paged: one red run should show BOTH legs, not just whichever fired first.
      - name: Detect red nightly canary (schedule-event CI run of ci.yml on main)
        if: ${{ !cancelled() }}
        env:
          # 24h nightly cadence (ci.yml:8) + 12h of margin: ONE missed/cancelled
          # night is tolerated silently — the next nightly re-covers it — and only
          # a verdict older than this (or no usable verdict at all) warns. A
          # warning, NOT a page: a missed cron is an observability gap, not a red
          # main, and paging it as if main were red is the noise T2.3 tuned away.
          CANARY_MAX_AGE_HOURS: "36"
        shell: bash
        run: |
          set -euo pipefail

          # `--workflow ci.yml` by FILENAME, not display name — a rename of the
          # `name:` field must not blind this leg. `--branch main` = default branch.
          # limit 10, not 1: the SAME detection as the push leg needs the latest
          # COMPLETED, non-cancelled/skipped run, and ci.yml's concurrency group
          # cancels an in-flight schedule run on every push to main (ci.yml:14-16),
          # so a cancelled canary must be skipped over, not mistaken for "no canary".
          runs_json="$(gh run list --repo "${REPO}" --workflow ci.yml --event schedule \
            --branch main --limit 10 \
            --json databaseId,name,status,conclusion,url,headSha,createdAt)"

          # Same detection as the push leg: latest COMPLETED run per the query,
          # dropping cancelled/skipped (in_progress is pending, not a verdict).
          # `max_by` over an empty list yields null in jq — guarded back to [].
          latest_json="$(printf '%s' "${runs_json}" | jq -c '
            [ .[] | select(.status == "completed")
                   | select(.conclusion != "cancelled" and .conclusion != "skipped") ]
            | max_by(.databaseId)
            | if . == null then [] else [.] end
          ')"

          if [ "$(printf '%s' "${latest_json}" | jq 'length')" -eq 0 ]; then
            {
              echo "## red-main-alarm: nightly-canary leg — canary missing (WARNING)"
              echo ""
              echo "No COMPLETED, non-cancelled/skipped \`schedule\` run of \`ci.yml\` on"
              echo "\`main\` exists — the nightly canary has never produced a verdict"
              echo "this alarm can read. Check whether the \`0 6 * * *\` cron is firing."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::nightly-canary leg: no completed schedule run of ci.yml on main — canary missing, not paging."
            exit 0
          fi

          run_id="$(printf '%s' "${latest_json}" | jq -r '.[0].databaseId')"
          head_sha="$(printf '%s' "${latest_json}" | jq -r '.[0].headSha')"
          conclusion="$(printf '%s' "${latest_json}" | jq -r '.[0].conclusion')"
          run_url="$(printf '%s' "${latest_json}" | jq -r '.[0].url')"
          short_sha="${head_sha:0:8}"

          # Age in hours, computed in jq (fromdateiso8601 + now) so the math is
          # identical on any runner image — no GNU/BSD `date -d` divergence.
          age_hours="$(printf '%s' "${latest_json}" | jq -r \
            '.[0].createdAt | ((now - fromdateiso8601) / 3600) | floor')"
          echo "nightly canary: run ${run_id}, head ${short_sha}, ${conclusion}, age ${age_hours}h (max ${CANARY_MAX_AGE_HOURS}h)"

          if [ "${age_hours}" -gt "${CANARY_MAX_AGE_HOURS}" ]; then
            {
              echo "## red-main-alarm: nightly-canary leg — canary STALE (WARNING, not a page)"
              echo ""
              echo "Latest usable \`schedule\` run of \`ci.yml\` on \`main\` is ${age_hours}h old"
              echo "(max ${CANARY_MAX_AGE_HOURS}h = 24h nightly cadence + 12h margin):"
              echo "the canary is stale or its cron stopped firing."
              echo ""
              echo "### nightly canary (run ${run_id}, head ${short_sha}) — last known: ${conclusion}"
              echo "${run_url}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::nightly-canary leg: latest schedule run ${run_id} (head ${short_sha}) is ${age_hours}h old (max ${CANARY_MAX_AGE_HOURS}h) — canary stale/missing, not paging."
            exit 0
          fi

          if [ "${conclusion}" = "failure" ] || [ "${conclusion}" = "timed_out" ]; then
            {
              echo "## red-main-alarm: nightly canary is RED"
              echo ""
              echo "Latest completed \`schedule\` run of \`ci.yml\` on \`main\` is failing."
              echo "It tested head \`${short_sha}\` — the tip main had at 06:00 UTC, which may"
              echo "predate the current tip; the lanes involved run only on"
              echo "\`pull_request\`/\`schedule\` (ci.yml:1382), so this redness is otherwise"
              echo "invisible to the push leg above."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "RED: nightly canary (run ${run_id}, head ${short_sha}) (${conclusion})"

            {
              echo ""
              echo "### nightly canary (run ${run_id}, head ${short_sha}) — ${conclusion}"
              echo "${run_url}"
              echo ""
              echo "Failed jobs:"
            } >> "$GITHUB_STEP_SUMMARY"

            gh run view "${run_id}" --repo "${REPO}" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- " + .name + " (" + .conclusion + ")"' \
              >> "$GITHUB_STEP_SUMMARY"

            echo "nightly canary is RED — see step summary for failing job(s)."
            exit 1
          fi

          {
            echo "## red-main-alarm: nightly canary is GREEN"
            echo ""
            echo "nightly canary (run ${run_id}, head \`${short_sha}\`) concluded \`${conclusion}\`"
            echo "(${age_hours}h old, max ${CANARY_MAX_AGE_HOURS}h)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
