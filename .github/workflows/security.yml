name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly at 01:00 BRT (UTC-3)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Desabilitado: dependency-review-action requer GitHub Advanced Security
  # (Dependency graph + Advanced Security) habilitado no repositório.
  # O repo Omni-Saude/maezo-operadora não tem Advanced Security ativado
  # e o erro é: "Dependency review is not supported on this repository."
  # Reativar quando Advanced Security for provisionado nas settings do repo.
  # dependency-review:
  #   name: dependency review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   steps:
  #     - name: Dependency review
  #       uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: high

  # ── Desabilitado temporariamente: CodeQL v3 autobuild.sh não reconhece
  # layout pyproject.toml + src/maezo/ (procura setup.py). O extractor
  # Python roda com `python3 -S` (sem site-packages), então mesmo após
  # `pip install -e ".[dev]"` o tracer encontra 0 módulos.
  #
  # Correção definitiva: atualizar para github/codeql-action@v4 e usar
  # build-mode: "none" (disponível a partir do CodeQL v4).
  # O Dependabot PR #2 (github/codeql-action de v3 para v4) já está aberto.
  #
  # codeql:
  #   name: codeql / python
  #   runs-on: ubuntu-latest
  #   permissions:
  #     actions: read
  #     contents: read
  #     security-events: write
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       language: ["python"]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Initialize CodeQL
  #       uses: github/codeql-action/init@v4
  #       with:
  #         languages: ${{ matrix.language }}
  #         build-mode: none
  #     - name: Perform CodeQL analysis
  #       uses: github/codeql-action/analyze@v4

  gitleaks:
    name: gitleaks / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 exige licença paga para organizações
      # (Omni-Saude) a partir de 2026. Usamos o CLI open-source diretamente.
      # Ref: https://github.com/gitleaks/gitleaks-action#-announcement
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1
