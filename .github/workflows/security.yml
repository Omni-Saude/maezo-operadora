name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly at 01:00 BRT (UTC-3)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Desabilitado: dependency-review-action requer GitHub Advanced Security
  # (Dependency graph + Advanced Security) habilitado no repositório.
  # O repo Omni-Saude/maezo-operadora não tem Advanced Security ativado
  # e o erro é: "Dependency review is not supported on this repository."
  # Reativar quando Advanced Security for provisionado nas settings do repo.
  # dependency-review:
  #   name: dependency review
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'pull_request'
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   steps:
  #     - name: Dependency review
  #       uses: actions/dependency-review-action@v4
  #       with:
  #         fail-on-severity: high

  # ── Desabilitado temporariamente: CodeQL v3 autobuild.sh não reconhece
  # layout pyproject.toml + src/maezo/ (procura setup.py). O extractor
  # Python roda com `python3 -S` (sem site-packages), então mesmo após
  # `pip install -e ".[dev]"` o tracer encontra 0 módulos.
  #
  # Correção definitiva: atualizar para github/codeql-action@v4 e usar
  # build-mode: "none" (disponível a partir do CodeQL v4).
  # O Dependabot PR #2 (github/codeql-action de v3 para v4) já está aberto.
  #
  # codeql:
  #   name: codeql / python
  #   runs-on: ubuntu-latest
  #   permissions:
  #     actions: read
  #     contents: read
  #     security-events: write
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       language: ["python"]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Initialize CodeQL
  #       uses: github/codeql-action/init@v4
  #       with:
  #         languages: ${{ matrix.language }}
  #         build-mode: none
  #     - name: Perform CodeQL analysis
  #       uses: github/codeql-action/analyze@v4

  gitleaks:
    name: gitleaks / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 exige licença paga para organizações
      # (Omni-Saude) a partir de 2026. Usamos o CLI open-source diretamente.
      # Ref: https://github.com/gitleaks/gitleaks-action#-announcement
      #
      # T2.4: v8.24.1 (versão anterior) nunca existiu como release
      # (tags publicadas pulam de v8.24.0 para v8.24.2) — o download
      # retornava a página HTML/texto "Not Found" (404) do GitHub, que o
      # `tar xzf` tentava descompactar como gzip, causando o erro
      # "gzip: stdin: not in gzip format". Corrigido fixando uma versão
      # existente (v8.30.1, publicada 2026-03-21) e verificando o
      # download contra o checksum sha256 publicado oficialmente pelo
      # projeto, com fail-closed em qualquer divergência (--fail no
      # curl + sha256sum -c + set -euo pipefail).
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 de gitleaks_8.30.1_linux_x64.tar.gz, publicado em:
          # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          # (verificado manualmente em 2026-07-16 contra o asset do release v8.30.1)
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          tar xzf "${ARCHIVE}" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Detect secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1
