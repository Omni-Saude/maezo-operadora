name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly at 01:00 BRT (UTC-3)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── T2.4 (remainder): dependency-review-action requires GitHub Advanced
  # Security on PRIVATE repositories — confirmed via an admin-scoped
  # `gh api repos/Omni-Saude/maezo-operadora` on 2026-07-17:
  #   security_and_analysis.code_security.status == "disabled"
  #
  # MECHANISM — try-and-classify (R2 verification cycle 2 fix). The first
  # version of this guard pre-checked that status field with the workflow's
  # own GITHUB_TOKEN, which lacks permission to see repo security settings
  # and reads "unknown" FOREVER (verified live in jobs 87926112581/
  # 87926112433: workflow token -> "unknown" while an admin token ->
  # "disabled") — so its promised auto-activation was structurally false.
  # Now this job TRIES the actual gated operation instead and classifies
  # the failure:
  #   - Step `probe` performs the exact API call dependency-review-action
  #     is built on — GET /repos/{repo}/dependency-graph/compare/{basehead}
  #     — with the workflow's own token (the same call/token/permissions
  #     the real action would use).
  #   - Success        -> the real, pinned action runs (fail-on-severity).
  #   - Bare-Forbidden 403 ("gh: Forbidden (HTTP 403)", the gate's exact
  #     live-verified shape) -> the GHAS gate; the upstream action maps
  #     this same 403 to "Dependency review is not supported on this
  #     repository." Emits a LOUD visible skip naming the blocker — never
  #     `if: false` — and exits 0. NOTE (cycle-2 verifier fix): the match
  #     is deliberately NOT any-403 — a rate-limit 403 ("API rate limit
  #     exceeded ... (HTTP 403)") must NOT green-skip a real review
  #     post-GHAS, so it falls through to the fail branch instead
  #     (retry-able red).
  #   - ANY other error -> the job FAILS (fail-closed; an unexpected
  #     failure must never masquerade as the documented blocker).
  # Because the probe exercises the real gated resource with the real
  # token, auto-activation is genuine: the moment GHAS is provisioned the
  # probe succeeds and the real scan runs — no workflow edit needed.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Try the dependency-review compare API (classify the GHAS gate)
        id: probe
        env:
          # SHAs from the event payload are trusted hex strings (not
          # attacker-controlled text like branch names / PR bodies); passed
          # via env anyway per this repo's script-injection discipline.
          BASEHEAD: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          out="$(gh api "repos/${{ github.repository }}/dependency-graph/compare/${BASEHEAD}" 2>&1)"
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "dependency-graph compare succeeded — GHAS gate open; running the real scan"
            echo "run=true" >> "$GITHUB_OUTPUT"
          # Cycle-2 verifier fix: discriminate on the GHAS gate's exact
          # live-verified shape — the bare-Forbidden 403 (body
          # '{"message":"Forbidden",...}', gh error line
          # "gh: Forbidden (HTTP 403)"). Matching '(HTTP 403)' alone was
          # proven fail-open: a rate-limit 403 ("API rate limit exceeded ...
          # (HTTP 403)", plausible on GITHUB_TOKEN's shared 1k/hr budget)
          # would have green-skipped a real dependency review post-GHAS.
          # Rate-limit (and every other) 403 shape now falls through to the
          # else branch -> exit 1 (fail-closed, retry-able red).
          elif printf '%s' "${out}" | grep -qF 'gh: Forbidden (HTTP 403)'; then
            echo "compare returned the bare-Forbidden 403 — the GHAS gate (the upstream action maps this same 403 to 'Dependency review is not supported on this repository.')"
            printf '%s\n' "${out}" > dependency-review-probe-output.txt
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::dependency-graph compare failed for a reason OTHER than the GHAS gate (exit ${code}; not the bare-Forbidden 'gh: Forbidden (HTTP 403)' shape — e.g. a rate-limit 403 lands here DELIBERATELY, as a retry-able red) — failing the job (fail-closed; an unexpected error must never masquerade as the documented blocker). Output:"
            printf '%s\n' "${out}"
            exit 1
          fi

      # Pin-only note: pinned by SHA to actions/dependency-review-action
      # v5.0.0 (dependabot bump #117, 4.9.0 -> 5.0.0). GHAS is still
      # disabled on this repo (see the T2.4 job header above), so this step
      # stays probe-gated by `steps.probe.outputs.run` and has never
      # actually executed — the version bump is functionally inert until
      # GHAS is provisioned.
      - name: Dependency review
        if: steps.probe.outputs.run == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

      - name: DEPENDENCY-REVIEW SKIPPED (visible)
        if: steps.probe.outputs.run == 'false'
        run: |
          echo "::notice::DEPENDENCY-REVIEW SKIPPED — the dependency-graph compare API (the exact call dependency-review-action is built on) returned HTTP 403 with this job's own token: the GitHub Advanced Security gate ('Dependency review is not supported on this repository.'). Blocked(external: repo/org setting — GHAS not provisioned; admin-scoped check 2026-07-17 read code_security.status='disabled'). The probe exercises the real gated resource, so provisioning GHAS auto-activates the real scan — no workflow edit needed."
          {
            echo "## dependency review: SKIPPED (GHAS gate, classified from a real attempt)"
            echo ""
            echo "This job TRIED the exact API call \`dependency-review-action\` is built on"
            echo "(\`GET /repos/.../dependency-graph/compare/{basehead}\`) with its own"
            echo "\`GITHUB_TOKEN\` and got HTTP 403 — the GitHub Advanced Security gate."
            echo "The upstream action maps this same 403 to:"
            echo ""
            echo '```'
            echo "Dependency review is not supported on this repository."
            echo '```'
            echo ""
            echo "Probe output:"
            echo ""
            echo '```'
            cat dependency-review-probe-output.txt
            echo '```'
            echo ""
            echo "Blocked(external: repo/org setting — GitHub Advanced Security not"
            echo "provisioned; admin-scoped API check on 2026-07-17 read"
            echo "\`security_and_analysis.code_security.status\` = \`disabled\`)."
            echo "Re-enablement tracked as T2.4 in \`docs/prompts/V2-COMPLETION-PLAN.md\`."
            echo "Any non-403 probe failure fails this job (fail-closed). Because the probe"
            echo "hits the real gated resource with the real token, provisioning GHAS"
            echo "(Settings -> Code security and analysis) auto-activates the real scan on"
            echo "the next PR run — no workflow edit needed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── T2.4 (remainder): CodeQL re-enabled WITHOUT autobuild. The prior
  # disablement (see git history) hit CodeQL v3's autobuild.sh, which never
  # recognized the pyproject.toml + src/maezo/ layout (it looks for
  # setup.py). Autobuild was the wrong tool for an interpreted language in
  # the first place: Python needs no build step to be analyzed, so this uses
  # `build-mode: none` (github/codeql-action v4+) via an explicit init/
  # analyze pair — no autobuild anywhere.
  #
  # Scan coverage: CodeQL's Python extractor walks the whole checkout and
  # picks up every *.py file, so src/ + scripts/ (the two directories named
  # in scope) are covered by default alongside tests/ — no `paths:`
  # restriction is needed or applied (a narrower scan would be a silent
  # coverage cut, not an improvement).
  #
  # BLOCKED(external: repo/org setting) — ONLY the SARIF upload, not the
  # scan. Observed on this task's own PR run (29592100816 / job
  # 87923445084, 2026-07-17), before any guard existed: init + analyze ran
  # successfully end-to-end (CodeQL database built, all Python security
  # queries executed, SARIF produced), and only the final SARIF-upload step
  # failed, with this exact upstream error:
  #
  #   ##[error]Please verify that the necessary features are enabled: Code
  #   Security must be enabled for this repository to use code scanning. -
  #   https://docs.github.com/rest
  #
  # MECHANISM — try-and-classify (R2 verification cycle 2 fix). The first
  # guard pre-checked `security_and_analysis.code_security.status` with the
  # workflow's own GITHUB_TOKEN, which lacks permission to see repo
  # security settings and reads "unknown" FOREVER (verified live in jobs
  # 87926112581/87926112433: workflow token -> "unknown"; admin token ->
  # "disabled") — so its promised auto-activation was structurally false,
  # AND it skipped the scan itself, which was never blocked. Now:
  #   - init + analyze ALWAYS run — the scan is real on every trigger, and
  #     any genuine scan failure fails the job (fail-closed). `analyze`
  #     runs with `upload: never` + `upload-database: false` so the only
  #     GHAS-gated call (SARIF upload) is deferred to a step we can
  #     classify without `continue-on-error` (which is forbidden here).
  #   - The upload step then POSTs the produced SARIF to the real
  #     code-scanning API (/repos/{repo}/code-scanning/sarifs) with the
  #     workflow's own token and classifies the outcome:
  #       success -> results live in the Security tab (fully active).
  #       error matching "must be enabled for this repository to use code
  #       scanning" (the exact message observed above, verified byte-equal
  #       against a direct API call on 2026-07-17) -> LOUD visible skip
  #       naming the blocker — never `if: false` — exit 0.
  #       ANY other error -> the job FAILS (fail-closed).
  # Because the upload step attempts the real gated operation with the
  # real token, auto-activation is genuine: the moment GHAS is provisioned
  # the POST succeeds and results appear — no workflow edit needed.
  codeql:
    name: codeql / python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          languages: python
          build-mode: none

      # The scan itself needs no GHAS and always runs for real; a scan
      # failure here is a plain red job. Upload is deferred (see above).
      - name: Perform CodeQL analysis (scan always real; upload deferred)
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          upload: never
          upload-database: false
          output: sarif-results

      - name: Upload SARIF (try-and-classify the GHAS gate)
        run: |
          set -euo pipefail
          sarif="sarif-results/python.sarif"
          if [ ! -f "${sarif}" ]; then
            echo "::error::expected SARIF at ${sarif} was not produced by the analyze step — failing (fail-closed; a missing scan result must never read as a successful scan)."
            ls -la sarif-results/ 2>/dev/null || true
            exit 1
          fi
          gzip -c "${sarif}" | base64 -w0 > sarif.b64
          jq -n \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --rawfile sarif sarif.b64 \
            '{commit_sha: $commit_sha, ref: $ref, sarif: ($sarif | rtrimstr("\n"))}' \
            > sarif-payload.json
          set +e
          out="$(gh api --method POST "repos/${{ github.repository }}/code-scanning/sarifs" --input sarif-payload.json 2>&1)"
          code=$?
          set -e
          if [ "${code}" -eq 0 ]; then
            echo "SARIF uploaded — code scanning results are live in the Security tab:"
            printf '%s\n' "${out}"
          elif printf '%s' "${out}" | grep -qiE 'must be enabled for this repository to use code scanning'; then
            echo "::notice::CODEQL SARIF UPLOAD SKIPPED (the SCAN itself RAN to completion in this job) — the code-scanning API rejected the upload with the GitHub Advanced Security gate: 'Code Security must be enabled for this repository to use code scanning.' Blocked(external: repo/org setting — GHAS not provisioned; admin-scoped check 2026-07-17 read code_security.status='disabled'). This step attempts the real upload every run, so provisioning GHAS auto-activates it — no workflow edit needed."
            {
              echo "## codeql / python: scan RAN; SARIF upload SKIPPED (GHAS gate, classified from a real attempt)"
              echo ""
              echo "CodeQL init + analyze completed the full Python scan in this job"
              echo "(database build, all security queries, SARIF produced). This step then"
              echo "TRIED the real upload (\`POST /repos/.../code-scanning/sarifs\`) with its"
              echo "own \`GITHUB_TOKEN\` and was rejected by the GitHub Advanced Security"
              echo "gate:"
              echo ""
              echo '```'
              printf '%s\n' "${out}"
              echo '```'
              echo ""
              echo "Blocked(external: repo/org setting — GitHub Advanced Security not"
              echo "provisioned; admin-scoped API check on 2026-07-17 read"
              echo "\`security_and_analysis.code_security.status\` = \`disabled\`)."
              echo "Re-enablement tracked as T2.4 in \`docs/prompts/V2-COMPLETION-PLAN.md\`."
              echo "Any upload failure NOT matching this exact gate message fails this job"
              echo "(fail-closed). Because this step attempts the real gated operation with"
              echo "the real token, provisioning GHAS (Settings -> Code security and"
              echo "analysis) auto-activates live results on the next run — no workflow"
              echo "edit needed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::SARIF upload failed for a reason OTHER than the GHAS gate (gh api exit ${code}) — failing the job (fail-closed; an unexpected error must never masquerade as the documented blocker). Output:"
            printf '%s\n' "${out}"
            exit 1
          fi

      # ── T2.4 (GHAS-substitute lane, orchestrator ruling: GHAS downgraded
      # from blocker to toggle). The steps above are byte-untouched — this
      # is a pure addition after them. Independently of whether the GHAS
      # SARIF upload above succeeded or was skipped, publish the SARIF that
      # `analyze` already produced as a downloadable workflow artifact, so
      # findings are reviewable without GitHub Advanced Security at all.
      # Reuses the exact actions/upload-artifact pin already vetted
      # elsewhere in this repo (ci.yml) — no new SHA to independently trust.
      - name: Upload SARIF as workflow artifact (GHAS-substitute review path)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codeql-python-sarif
          path: sarif-results/python.sarif
          retention-days: 30
          if-no-files-found: error

      # Compact human-readable summary (python3 stdlib only — no new
      # dependency) so findings are visible directly in the run's Summary
      # tab without downloading the artifact. Counts by SARIF `level`
      # (falling back to each rule's `defaultConfiguration.level` when a
      # result omits its own level, per the SARIF spec) plus the
      # highest-frequency rules. A parse failure here is a real defect (the
      # SARIF `analyze` just produced should always be well-formed), so it
      # is NOT swallowed — the step fails closed rather than silently
      # skipping the summary.
      - name: Summarize SARIF findings (step-summary, GHAS-substitute)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import os
          import sys

          SARIF_PATH = "sarif-results/python.sarif"

          with open(SARIF_PATH, encoding="utf-8") as fh:
              sarif = json.load(fh)

          level_counts: collections.Counter[str] = collections.Counter()
          rule_counts: collections.Counter[str] = collections.Counter()
          rule_names: dict[str, str] = {}
          total = 0

          for run in sarif.get("runs", []):
              tool = run.get("tool", {})
              # CodeQL (github/codeql-action v4+) publishes the actual query
              # pack's rules under `tool.extensions[].rules` (e.g. the
              # `codeql/python-queries` extension), NOT under
              # `tool.driver.rules` (empty on a real scan, live-observed on
              # this task's own PR artifact) — both are read here so rule
              # names/levels resolve regardless of which one a given
              # CodeQL version populates.
              rule_sources = [tool.get("driver", {}).get("rules", [])]
              for extension in tool.get("extensions", []) or []:
                  rule_sources.append(extension.get("rules", []))

              default_level_by_id = {}
              for rules in rule_sources:
                  for rule in rules:
                      rule_id = rule.get("id", "")
                      if not rule_id:
                          continue
                      default_level_by_id[rule_id] = rule.get("defaultConfiguration", {}).get("level", "warning")
                      short_desc = rule.get("shortDescription", {}).get("text", "")
                      rule_names[rule_id] = rule.get("name") or short_desc

              for result in run.get("results", []):
                  rule_id = result.get("ruleId", "unknown")
                  level = result.get("level") or default_level_by_id.get(rule_id, "warning")
                  level_counts[level] += 1
                  rule_counts[rule_id] += 1
                  total += 1

          known_order = ["error", "warning", "note", "none"]
          lines = [
              "## codeql / python — SARIF summary (GHAS-substitute review path)",
              "",
              f"Total results in this scan: **{total}**",
              "",
              "Full SARIF is attached as the `codeql-python-sarif` workflow artifact",
              "(30-day retention) for offline review without GitHub Advanced Security.",
              "",
              "| Severity (SARIF `level`) | Count |",
              "|---|---|",
          ]
          for level in known_order:
              if level_counts.get(level):
                  lines.append(f"| {level} | {level_counts[level]} |")
          for level, count in level_counts.items():
              if level not in known_order:
                  lines.append(f"| {level} | {count} |")
          if total == 0:
              lines.append("| (none) | 0 |")

          lines += ["", "### Top rules by finding count", "", "| Rule ID | Name | Count |", "|---|---|---|"]
          if rule_counts:
              for rule_id, count in rule_counts.most_common(10):
                  name = rule_names.get(rule_id, "").replace("|", "\\|")
                  lines.append(f"| `{rule_id}` | {name} | {count} |")
          else:
              lines.append("| (none) | — | 0 |")

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")

          print(f"SARIF summary written: {total} result(s) across {len(level_counts)} level(s), {len(rule_counts)} distinct rule(s).", file=sys.stderr)
          PY

  gitleaks:
    name: gitleaks / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 exige licença paga para organizações
      # (Omni-Saude) a partir de 2026. Usamos o CLI open-source diretamente.
      # Ref: https://github.com/gitleaks/gitleaks-action#-announcement
      #
      # T2.4: v8.24.1 (versão anterior) nunca existiu como release
      # (tags publicadas pulam de v8.24.0 para v8.24.2) — o download
      # retornava a página HTML/texto "Not Found" (404) do GitHub, que o
      # `tar xzf` tentava descompactar como gzip, causando o erro
      # "gzip: stdin: not in gzip format". Corrigido fixando uma versão
      # existente (v8.30.1, publicada 2026-03-21) e verificando o
      # download contra o checksum sha256 publicado oficialmente pelo
      # projeto, com fail-closed em qualquer divergência (--fail no
      # curl + sha256sum -c + set -euo pipefail).
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 de gitleaks_8.30.1_linux_x64.tar.gz, publicado em:
          # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          # (verificado manualmente em 2026-07-16 contra o asset do release v8.30.1)
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          tar xzf "${ARCHIVE}" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # ── ci-gitleaks-scan-scope: scan SCOPE is split by trigger so a PR is
      # judged ONLY on its own commits, while already-merged code keeps
      # full-history coverage.
      #
      # ROOT CAUSE this replaces: the previous single step ran
      #   `gitleaks detect --source . ... --exit-code 1`
      # with NO `--log-opts`. gitleaks `detect` in that mode walks EVERY
      # reachable commit (locally reproduced: 382 commits scanned, and it
      # flagged a business key at commit 6c698193 that is NOT an ancestor of
      # HEAD — i.e. it reaches commits beyond the checked-out ref's own
      # history). Combined with `fetch-depth: 0`, a NEW business-key shape
      # introduced by ANY in-flight PR (e.g. #109's `ANSSUB-...` keys)
      # reddened gitleaks on ALL other concurrent open PRs until that PR's
      # `.gitleaks.toml` allowlist stanza reached their HEAD — forcing a
      # serialized merge order purely to clear false positives. The rules,
      # entropy thresholds and business-key allowlists are UNCHANGED; only
      # the commit RANGE each trigger scans changed.
      #
      # `--config .gitleaks.toml` still extends the default ruleset with the
      # NARROW business-key allowlist (anchored shapes; no blanket path
      # allowlist). Mutation proof (PR #28): a planted fake secret is still
      # detected, including inside the referenced docs files.

      # PR GATE — scan ONLY the PR's own commit range `base..head`, so a
      # secret is caught in the PR that INTRODUCES it and unrelated
      # concurrent PRs are never reddened by another PR's in-flight business
      # keys. `fetch-depth: 0` above guarantees both base.sha and head.sha
      # (the merge ref's two parents) are present locally. SHAs come from the
      # trusted event payload (hex, not attacker-controlled text) and are
      # passed via env per this repo's script-injection discipline.
      - name: Detect secrets (PR diff — base..head only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks detect --source . --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --verbose --redact --exit-code 1

      # FULL SWEEP — on push to main and on the weekly schedule, scan the
      # ENTIRE reachable history (the prior behavior). This preserves
      # defense-in-depth for already-merged code: every merge to main
      # re-scans full history, and the weekly cron is a periodic backstop, so
      # nothing that the old always-full scan caught is lost. Together the PR
      # gate (introduction-time) + this sweep (post-merge + periodic) cover
      # >= what the single full scan covered before.
      - name: Detect secrets (full history — push to main + weekly sweep)
        if: github.event_name != 'pull_request'
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1

  # ── T2.4 (GHAS-substitute lane, orchestrator ruling: GHAS downgraded from
  # blocker to toggle for R2). This COMPLEMENTS, does not replace, the
  # dependency-review job above (which stays exactly as-is and still
  # auto-activates the moment GHAS is provisioned): osv-scanner runs
  # unconditionally, needs no GitHub Advanced Security entitlement at all,
  # and scans the real uv.lock on every trigger.
  #
  # Install pattern mirrors the gitleaks job above (pinned version +
  # checksum-verified static-binary download, no floating tag, no
  # third-party Action to trust) rather than a `uses:` action, since
  # google/osv-scanner does not publish a first-party GitHub Action pinnable
  # to a commit SHA with the same guarantee as a plain checksummed binary.
  #
  # FAIL-CLOSED semantics (see the gating step below for the full contract):
  #   - A scan tool error (any osv-scanner exit code other than the two
  #     documented ones, 0 = clean and 1 = findings) fails the job — never
  #     `|| true`, never swallowed.
  #   - Findings are bucketed by severity (CVSS base score from
  #     osv-scanner's own per-group `max_severity`, widened by any member
  #     advisory's GHSA `database_specific.severity` of CRITICAL). Any
  #     non-allowlisted finding AT OR ABOVE `OSV_FAIL_ON_SEVERITY` FAILS the
  #     job — a red job here on a genuine finding is the correct, intended
  #     outcome, not something to allowlist away.
  #   - THRESHOLD = HIGH since 2026-09-04 (owner decision R-042 / gap D6-05;
  #     it was CRITICAL before). The reason is not "stricter is nicer": the
  #     `dependency-review` job above, which uses `fail-on-severity: high`,
  #     sits behind the GHAS probe and — as `:96-100` of this file states in
  #     its own words — "has never actually executed" because
  #     `code_security.status='disabled'`. This OSV lane is therefore the
  #     ONLY LIVE dependency gate in the repository, and leaving the only
  #     live gate at its loosest setting pushed every HIGH into a job summary
  #     nobody is obliged to read — fail-open by construction. The
  #     pressure-release valve against noise is the allowlist below, which is
  #     itself fail-closed (every entry needs a non-empty `reason`), so the
  #     friction that would justify CRITICAL is absorbable without switching
  #     the gate off. Enumerated at the flip (osv-scanner v2.4.0, the same
  #     pinned version and the same `scan source --lockfile=uv.lock` command
  #     this job runs): 122 packages, ZERO findings at any severity — so the
  #     allowlist stays EMPTY and no HIGH was silenced to make this green.
  #   - Severities below the threshold do not fail the job; they are rendered
  #     into the step summary so they stay visible without requiring GHAS's
  #     dependency graph / Dependabot alerts UI.
  #   - The allowlist (`.github/osv-allowlist.json`) starts EMPTY and every
  #     entry must carry a non-empty `reason`; a malformed entry fails the
  #     job closed rather than being ignored.
  #   - Known-exploited-in-the-wild (CISA KEV) status is NOT independently
  #     cross-referenced here — osv.dev / osv-scanner data does not carry a
  #     KEV flag, and fabricating one would violate this task's no-
  #     fabricated-results constraint. CRITICAL CVSS severity is used as the
  #     practical proxy; this is a documented limitation, not a claim of KEV
  #     coverage.
  osv-scan:
    name: osv-scanner / dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install osv-scanner (pinned + checksum-verified)
        env:
          OSV_SCANNER_VERSION: "2.4.0"
          # sha256 of osv-scanner_linux_amd64 from the v2.4.0 release,
          # published at:
          # https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_SHA256SUMS
          # (independently re-downloaded and re-hashed locally on 2026-07-17
          # to confirm it matches the published checksums file byte-for-byte
          # before pinning here.)
          OSV_SCANNER_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
        run: |
          set -euo pipefail
          BIN="osv-scanner_linux_amd64"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/${BIN}" \
            -o "${BIN}"
          echo "${OSV_SCANNER_SHA256}  ${BIN}" | sha256sum --check --strict -
          chmod +x "${BIN}"
          sudo mv "${BIN}" /usr/local/bin/osv-scanner
          osv-scanner --version

      # osv-scanner's own documented exit codes: 0 = scan completed, no
      # vulnerabilities matched; 1 = scan completed, vulnerabilities found
      # (an expected, non-error outcome to be classified below — NOT
      # swallowed with `|| true`); anything else (e.g. 127 = failed to
      # resolve the lockfile path, 128 = failed to load config) is a real
      # tool/config error and fails the job immediately, fail-closed.
      - name: Scan uv.lock (osv-scanner, JSON)
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan source --lockfile=uv.lock --format=json --output-file=osv-results.json
          code=$?
          set -e
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 1 ]; then
            echo "::error::osv-scanner exited ${code} — not one of the two documented outcomes (0 = clean, 1 = findings); treating as a scan error (fail-closed, no swallowed '|| true')."
            exit 1
          fi
          if [ ! -f osv-results.json ]; then
            echo "::error::osv-scanner exited ${code} but produced no osv-results.json — failing closed (a missing scan result must never read as a clean scan)."
            exit 1
          fi
          echo "osv-scanner exit code: ${code} (0 = no findings, 1 = findings present)"

      # Severity gate + step-summary rendering (python3 stdlib only). See
      # the job-level comment above for the full fail-closed contract.
      # OSV_FAIL_ON_SEVERITY is the tunable threshold. HIGH since 2026-09-04
      # (owner decision R-042 / gap D6-05) — see the job-level comment for
      # why the only live dependency gate must not sit at its loosest
      # setting. The allowlist path is likewise a single tunable env var, but
      # the file itself starts empty and every entry requires a reason.
      # `tests/unit/ci/test_security_osv_threshold.py` pins this value, so
      # loosening it back is a visible, reviewed change and not a one-word
      # edit that nothing notices.
      - name: Gate on severity + render summary (allowlist-aware, fail-closed)
        env:
          OSV_RESULTS_PATH: osv-results.json
          OSV_ALLOWLIST_PATH: .github/osv-allowlist.json
          OSV_FAIL_ON_SEVERITY: "HIGH"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import os
          import sys

          SEVERITY_ORDER = ["UNKNOWN", "LOW", "MEDIUM", "HIGH", "CRITICAL"]


          def bucket_from_score(score_str):
              if not score_str:
                  return "UNKNOWN"
              try:
                  score = float(score_str)
              except (TypeError, ValueError):
                  return "UNKNOWN"
              if score >= 9.0:
                  return "CRITICAL"
              if score >= 7.0:
                  return "HIGH"
              if score >= 4.0:
                  return "MEDIUM"
              if score > 0.0:
                  return "LOW"
              return "UNKNOWN"


          def bucket_from_db_specific(sev_str):
              if not sev_str:
                  return None
              upper = str(sev_str).strip().upper()
              return upper if upper in SEVERITY_ORDER else None


          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)


          results_path = os.environ["OSV_RESULTS_PATH"]
          allowlist_path = os.environ["OSV_ALLOWLIST_PATH"]
          # The fallback matches the value the step sets above. It is only reachable if the
          # env block is deleted, and in that case the SAFE guess is the stricter threshold:
          # a dropped env var must not silently relax the gate back to CRITICAL-only.
          fail_on = os.environ.get("OSV_FAIL_ON_SEVERITY", "HIGH").strip().upper()
          if fail_on not in SEVERITY_ORDER:
              fail(f"OSV_FAIL_ON_SEVERITY={fail_on!r} is not one of {SEVERITY_ORDER} — refusing to guess a threshold (fail-closed).")
          fail_threshold = SEVERITY_ORDER.index(fail_on)

          # --- load + validate the allowlist (fail-closed on any malformed entry) ---
          try:
              with open(allowlist_path, encoding="utf-8") as fh:
                  allow_doc = json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"could not read/parse allowlist {allowlist_path}: {exc}")

          raw_entries = allow_doc.get("entries") if isinstance(allow_doc, dict) else None
          if not isinstance(raw_entries, list):
              fail(f"allowlist {allowlist_path} is malformed: missing/invalid top-level 'entries' list.")

          allow_reason_by_id = {}
          for idx, entry in enumerate(raw_entries):
              if not isinstance(entry, dict):
                  fail(f"allowlist entry #{idx} is not an object.")
              vid = entry.get("id")
              reason = entry.get("reason")
              if not isinstance(vid, str) or not vid.strip():
                  fail(f"allowlist entry #{idx} is missing a non-empty 'id'.")
              if not isinstance(reason, str) or not reason.strip():
                  fail(f"allowlist entry #{idx} (id={vid!r}) is missing a non-empty 'reason' — every allowlist entry requires a justification.")
              allow_reason_by_id[vid.strip()] = reason.strip()

          # --- load the scan results ---
          try:
              with open(results_path, encoding="utf-8") as fh:
                  osv = json.load(fh)
          except (OSError, json.JSONDecodeError) as exc:
              fail(f"could not read/parse osv-scanner output {results_path}: {exc}")

          findings = []
          for result in osv.get("results", []) or []:
              for pkgres in result.get("packages", []) or []:
                  pkg = pkgres.get("package", {}) or {}
                  vulns_by_id = {v.get("id"): v for v in (pkgres.get("vulnerabilities", []) or [])}
                  groups = pkgres.get("groups") or []

                  if groups:
                      for group in groups:
                          ids = list(group.get("ids", []) or [])
                          aliases = list(group.get("aliases", []) or [])
                          all_ids = list(dict.fromkeys(ids + aliases))
                          bucket = bucket_from_score(group.get("max_severity"))
                          summary_text = ""
                          for vid in ids:
                              v = vulns_by_id.get(vid)
                              if not v:
                                  continue
                              db_bucket = bucket_from_db_specific((v.get("database_specific") or {}).get("severity"))
                              if db_bucket and SEVERITY_ORDER.index(db_bucket) > SEVERITY_ORDER.index(bucket):
                                  bucket = db_bucket
                              if not summary_text and v.get("summary"):
                                  summary_text = v.get("summary")
                          allow_id = next((i for i in all_ids if i in allow_reason_by_id), None)
                          findings.append(
                              {
                                  "package": pkg.get("name"),
                                  "version": pkg.get("version"),
                                  "ecosystem": pkg.get("ecosystem"),
                                  "ids": ids,
                                  "max_severity_score": group.get("max_severity") or "",
                                  "bucket": bucket,
                                  "summary": summary_text,
                                  "allowlisted": allow_id is not None,
                                  "allowlist_reason": allow_reason_by_id.get(allow_id) if allow_id else "",
                              }
                          )
                  else:
                      # Defensive fallback if a future osv-scanner version omits
                      # per-package `groups` metadata: treat each vulnerability
                      # entry standalone rather than silently dropping it.
                      for vid, v in vulns_by_id.items():
                          bucket = bucket_from_db_specific((v.get("database_specific") or {}).get("severity")) or "UNKNOWN"
                          findings.append(
                              {
                                  "package": pkg.get("name"),
                                  "version": pkg.get("version"),
                                  "ecosystem": pkg.get("ecosystem"),
                                  "ids": [vid] if vid else [],
                                  "max_severity_score": "",
                                  "bucket": bucket,
                                  "summary": v.get("summary") or "",
                                  "allowlisted": vid in allow_reason_by_id,
                                  "allowlist_reason": allow_reason_by_id.get(vid, ""),
                              }
                          )

          bucket_counts = collections.Counter(f["bucket"] for f in findings)
          allowlisted_findings = [f for f in findings if f["allowlisted"]]
          gating_findings = [f for f in findings if not f["allowlisted"]]
          failing_findings = [f for f in gating_findings if SEVERITY_ORDER.index(f["bucket"]) >= fail_threshold]

          lines = [
              "## osv-scanner / dependencies — summary (GHAS-substitute dependency lane)",
              "",
              "Lockfile scanned: `uv.lock`",
              f"Fail threshold: **{fail_on}** and above (tunable via `OSV_FAIL_ON_SEVERITY`); KEV is not cross-referenced (see job comment) — CRITICAL CVSS is the practical proxy.",
              f"Total vulnerable dependency findings: **{len(findings)}** ({len(allowlisted_findings)} allowlisted, {len(gating_findings)} subject to the gate)",
              "",
              "| Severity | Count |",
              "|---|---|",
          ]
          for level in reversed(SEVERITY_ORDER):
              if bucket_counts.get(level):
                  lines.append(f"| {level} | {bucket_counts[level]} |")
          if not findings:
              lines.append("| (none) | 0 |")

          lines += [
              "",
              "### Findings",
              "",
              "| Package | Version | IDs | Max CVSS | Severity | Allowlisted | Summary |",
              "|---|---|---|---|---|---|---|",
          ]
          if findings:
              for f in sorted(findings, key=lambda x: SEVERITY_ORDER.index(x["bucket"]), reverse=True):
                  ids_str = ", ".join(f["ids"]) or "—"
                  allow_str = f"yes — {f['allowlist_reason']}" if f["allowlisted"] else "no"
                  summary_str = (f["summary"] or "—").replace("|", "\\|")
                  lines.append(
                      f"| {f['package']} | {f['version']} | {ids_str} | {f['max_severity_score'] or '—'} | {f['bucket']} | {allow_str} | {summary_str} |"
                  )
          else:
              lines.append("| (none) | — | — | — | — | — | no findings |")

          if failing_findings:
              lines += ["", f"### VERDICT: FAIL — {len(failing_findings)} finding(s) at or above {fail_on}", ""]
              for f in failing_findings:
                  lines.append(f"- **{f['package']} {f['version']}** ({', '.join(f['ids'])}) — {f['bucket']} (max CVSS {f['max_severity_score'] or 'n/a'}): {f['summary'] or 'no summary'}")
          else:
              lines += ["", "### VERDICT: PASS — no non-allowlisted finding at or above the fail threshold", ""]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")

          print(f"osv-scan: {len(findings)} finding(s), {len(failing_findings)} at/above {fail_on} (non-allowlisted).", file=sys.stderr)

          if failing_findings:
              fail(
                  f"{len(failing_findings)} non-allowlisted finding(s) at or above {fail_on} severity — "
                  "see the step summary for details. This is a genuine finding, not a tooling defect: "
                  "triage it (fix/upgrade the dependency, or add a justified .github/osv-allowlist.json "
                  "entry) rather than suppressing the gate."
              )
          PY
