name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly at 01:00 BRT (UTC-3)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── T2.4 (remainder): dependency-review-action requires GitHub Advanced
  # Security (dependency graph + code/dependency scanning) on PRIVATE
  # repositories — confirmed via `gh api repos/Omni-Saude/maezo-operadora`
  # (admin-scoped token) on 2026-07-17:
  #   security_and_analysis.code_security.status == "disabled"
  # This job re-checks the SAME field at runtime with the workflow's own
  # GITHUB_TOKEN (which typically lacks admin visibility into repo settings —
  # hence the "unknown" fallback is the common case even when the setting
  # genuinely is disabled) and ONLY runs the real scan when it can positively
  # confirm "enabled". Otherwise it emits a LOUD, non-silent skip — never
  # `if: false`. The moment GHAS is provisioned on this repo, this job
  # auto-activates the real scan on the next PR run — no workflow edit
  # needed (same auto-activating guard-step pattern as ci.yml's
  # integration/evals/fhir-sync-simulator lanes).
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check GitHub Advanced Security (code_security) availability
        id: ghas
        run: |
          set -euo pipefail
          status="$(gh api "repos/${{ github.repository }}" --jq '.security_and_analysis.code_security.status // "unknown"')"
          echo "code_security.status=${status}"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      # Pin-only note: the floating "v4" tag was DELETED upstream after
      # actions/dependency-review-action shipped v5.0.0 — confirmed 404 via
      # `gh api repos/actions/dependency-review-action/git/ref/tags/v4` on
      # 2026-07-17. v4.9.0 is the last existing v4.x.y release (i.e. what
      # "v4" resolved to immediately before removal) — pinning to it is NOT
      # a version bump to v5.
      - name: Dependency review
        if: steps.ghas.outputs.status == 'enabled'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: high

      - name: DEPENDENCY-REVIEW SKIPPED (visible)
        if: steps.ghas.outputs.status != 'enabled'
        run: |
          echo "::notice::DEPENDENCY-REVIEW SKIPPED — security_and_analysis.code_security.status='${{ steps.ghas.outputs.status }}' (needs 'enabled'); dependency-review-action is not supported on this private repo without GitHub Advanced Security. Confirmed DISABLED via an admin-scoped API check on 2026-07-17. Provisioning GHAS auto-activates this job — no workflow edit needed."
          {
            echo "## dependency review: SKIPPED"
            echo ""
            echo "\`dependency-review-action\` requires GitHub Advanced Security on private"
            echo "repositories. This job's own \`GITHUB_TOKEN\` read"
            echo "\`security_and_analysis.code_security.status\` = \`${{ steps.ghas.outputs.status }}\`"
            echo "(the token commonly lacks admin visibility into repo settings, hence"
            echo "\`unknown\` even when the setting genuinely is disabled — separately"
            echo "confirmed DISABLED via an admin-scoped \`gh api\` call on 2026-07-17)."
            echo ""
            echo "Blocked(external: repo/org setting — GitHub Advanced Security not"
            echo "provisioned). Re-enablement tracked as T2.4 in"
            echo "\`docs/prompts/V2-COMPLETION-PLAN.md\`. Provisioning GHAS (Settings ->"
            echo "Code security and analysis) auto-activates the real scan on the next PR"
            echo "run — no workflow edit needed."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── T2.4 (remainder): CodeQL re-enabled WITHOUT autobuild. The prior
  # disablement (see git history) hit CodeQL v3's autobuild.sh, which never
  # recognized the pyproject.toml + src/maezo/ layout (it looks for
  # setup.py). Autobuild was the wrong tool for an interpreted language in
  # the first place: Python needs no build step to be analyzed, so this uses
  # `build-mode: none` (github/codeql-action v4+) via an explicit init/
  # analyze pair — no autobuild anywhere.
  #
  # Scan coverage: CodeQL's Python extractor walks the whole checkout and
  # picks up every *.py file, so src/ + scripts/ (the two directories named
  # in scope) are covered by default alongside tests/ — no `paths:`
  # restriction is needed or applied (a narrower scan would be a silent
  # coverage cut, not an improvement).
  #
  # NOTE: like dependency-review above, GitHub code scanning (CodeQL SARIF
  # upload) also requires GitHub Advanced Security on private repositories.
  # This job is intentionally NOT pre-gated on that check: item 1 of this
  # task requires observing the REAL run outcome on this PR before deciding
  # whether/how to guard it, rather than assuming the blocker without
  # evidence. See the PR body for the actual run result and (if blocked) the
  # exact upstream error text.
  codeql:
    name: codeql / python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # v4.37.1

  gitleaks:
    name: gitleaks / secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 exige licença paga para organizações
      # (Omni-Saude) a partir de 2026. Usamos o CLI open-source diretamente.
      # Ref: https://github.com/gitleaks/gitleaks-action#-announcement
      #
      # T2.4: v8.24.1 (versão anterior) nunca existiu como release
      # (tags publicadas pulam de v8.24.0 para v8.24.2) — o download
      # retornava a página HTML/texto "Not Found" (404) do GitHub, que o
      # `tar xzf` tentava descompactar como gzip, causando o erro
      # "gzip: stdin: not in gzip format". Corrigido fixando uma versão
      # existente (v8.30.1, publicada 2026-03-21) e verificando o
      # download contra o checksum sha256 publicado oficialmente pelo
      # projeto, com fail-closed em qualquer divergência (--fail no
      # curl + sha256sum -c + set -euo pipefail).
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 de gitleaks_8.30.1_linux_x64.tar.gz, publicado em:
          # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          # (verificado manualmente em 2026-07-16 contra o asset do release v8.30.1)
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}" \
            -o "${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          tar xzf "${ARCHIVE}" gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # T2.4: --config .gitleaks.toml estende o ruleset default com uma
      # allowlist ESTREITA (regex ancorada em 2 shapes de identificadores
      # BPM de docs — nao segredos; sem allowlist por path). Prova de
      # mutacao no PR #28: segredo fake plantado continua detectado,
      # inclusive dentro dos proprios arquivos de docs referenciados.
      - name: Detect secrets
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1
