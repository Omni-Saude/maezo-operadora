# Gitleaks config — maezo-operadora
#
# T2.4 (2026-07-16): disposicao NARROW de 6 falsos positivos da regra
# generic-api-key sobre identificadores BPM em documentacao (NAO segredos).
# Politica fail-closed: estende o ruleset default (useDefault = true) e
# permite APENAS os shapes exatos abaixo, ancorados no valor detectado
# (regexTarget = "secret"). NAO ha allowlist por path — um segredo real
# plantado nos mesmos arquivos de docs continua sendo detectado
# (prova de mutacao no PR #28).

[extend]
# Mantem TODAS as regras default do gitleaks; este arquivo apenas adiciona
# allowlists — nunca substitui ou remove regras.
useDefault = true

[[allowlists]]
# O que casa: exatamente o process key BPM `SP-OP-INADIMPLENCIA-001`
# (docs/processes/test-specs/SP-OP-INADIMPLENCIA-001.md:12).
# Por que nao e segredo: e o identificador publico do processo BPMN
# (mesmo nome do proprio arquivo de spec), nao uma credencial.
# Data: 2026-07-16 | Task: T2.4
description = "T2.4 2026-07-16: BPM process key SP-OP-INADIMPLENCIA-001 (identificador publico de processo, nao credencial)"
regexTarget = "secret"
regexes = ['''^SP-OP-INADIMPLENCIA-001$''']

[[allowlists]]
# O que casa: business keys BPM no shape exato `ESC-amh-conv-<3 digitos>`
# (docs/runbooks/engine-processes.md:113,118,139,191,303 — todos
# `ESC-amh-conv-001`).
# Por que nao e segredo: e a business key sintetica de instancia de
# processo usada nos exemplos do runbook (tenant amh + id de conversa),
# nao uma credencial. Entropia 3.58, formato deterministico.
# Data: 2026-07-16 | Task: T2.4
description = "T2.4 2026-07-16: BPM business key ESC-amh-conv-NNN (identificador sintetico de instancia, nao credencial)"
regexTarget = "secret"
regexes = ['''^ESC-amh-conv-\d{3}$''']

[[allowlists]]
# O que casa: business keys BPM de submissao ANS no shape documentado
# `ANSSUB-<tenant>-<report_type>-<competencia>`. O construtor real e
# `_ans_business_key` em src/maezo/tools/workers/ans_submit.py (T2.6-1,
# f"ANSSUB-{tenant_id}-{report_type}-{competencia}"), consumido por
# transmit_to_ans -> AnsGatewayTransport (contrato SP-OP-ANS-SUBMIT-001
# "Business key"). Literais sinteticos flagrados pela generic-api-key nos
# testes T2.6-1 (entropia alta + "key" no identificador):
#   ANSSUB-amh-RN_124_SIP-2026-06        (test_ans_submit.py)
#   ANSSUB-amh-DIOPS_TRIMESTRAL-2026-Q2  (test_ans_submit.py)
# demais literais introduzidos cobertos pela mesma ancora:
#   ANSSUB-amh-RN_124_SIP-2026-GUARD / -2026-01 / ANSSUB-amh-SIP-2026-06
#   (test_ans_submit.py, test_sp_op_ans_submit_001.py).
# Por que nao e segredo: identificador sintetico de instancia de processo
# (tenant minusculo + report_type ANS maiusculo [A-Z0-9_] + competencia
# \d{4}-(mes|Qn|palavra)), formato deterministico, nao uma credencial.
# Ancora ^...$ no shape: um segredo real (AKIA.../sk-.../hex/base64) nao
# comeca com `ANSSUB-<tenant minusculo>-` e nao casa.
# Data: 2026-07-19 | Task: T2.6-1 (construtor ANSSUB real chegou — cf. a
# reserva de prefixo na entrada generica abaixo; stanza dedicada como a
# ESC-amh-conv acima)
description = "T2.6-1 2026-07-19: BPM business key ANSSUB-<tenant>-<report_type>-<competencia> (identificador sintetico de instancia de submissao ANS, nao credencial)"
regexTarget = "secret"
regexes = ['''^ANSSUB-[a-z][a-z0-9]{0,15}-[A-Z0-9_]+-\d{4}-(\d{2}|Q\d|[A-Z]+)$''']

[[allowlists]]
# T2.4 (2026-07-17): classe sistemica de falso positivo — a regra
# generic-api-key casa literais de business key BPM (`business_key=
# "<PREFIX>-<tenant>-<sufixo>"`) porque "key" aparece no identificador e
# literais realistas passam o limiar de entropia (ex.: entropia 4.03 em
# CONTAS-amh-IT-MARINA-CONTAS-fdde8b00). Como o lane escaneia TODAS as
# refs (fetch-depth 0), o literal de qualquer branch em voo derruba o
# gitleaks de TODOS os PRs (incidentes: test_fernando.py @ 72c865e —
# fingerprint em .gitleaksignore, mantido como cinto-e-suspensorio;
# test_marina.py:680,691 @ 9ef098e + evidence-ledger.md:63 @ 7c4b871).
#
# CONTENCAO DUPLA — condition = "AND" exige que AMBOS os criterios casem
# (um caminho sozinho NUNCA allowlista nada; um shape sozinho fora dos
# caminhos tambem nao):
#
# (a) regexTarget="secret", ancorado ^...$ no shape documentado de
#     business key: prefixo de processo em maiusculas, derivado dos
#     construtores reais `f"<PREFIX>-{tenant}-..."` nos grafos de agente
#     (todas as branches) + suites T3.1:
#       ESC     (helena,   SP-OP-ESCALATION-001,   graph.py:199)
#       AUTH    (rafael,   SP-OP-AUTH-001,         graph.py:163)
#       CONTAS  (marina,   SP-OP-CONTAS-001)
#       RECURSO (marina,   SP-OP-RECURSO-001)
#       REEMB   (marina,   SP-OP-REEMBOLSO-001)
#       INAD    (fernando, SP-OP-INADIMPLENCIA-001)
#       CRED    (fernando, SP-OP-CRED-001)
#       CANCEL  (suites T3.1, SP-OP-CANCEL-001: "CANCEL-amh-{contrato}")
#       FRAUDE  (beatriz,  SP-OP-FRAUDE-001: construtor real
#                f"FRAUDE-{tenant_id}-{numero_caso}" em
#                agents/beatriz/graph.py:202 — adicionado assim que o
#                construtor chegou, conforme a politica desta entrada;
#                primeiro literal FRAUDE-t1-caso-001 ja disparava a regra)
#       PAGTO   (andre,    SP-OP-PAGTO-001: construtores reais
#                f"PAGTO-{tenant}-{ordem}" e
#                f"PAGTO-{tenant}-{numero_lote_tiss}-{prestador_id}" em
#                agents/andre/graph.py:442-443 (branch t1.12-andre-graph)
#                — builder-first, mesma politica; literais de teste
#                (PAGTO-amh-op-0001, test_andre.py) ja disparavam a
#                regra e foram ponte-fingerprint no PR #85 ate este
#                merge)
#     NAO incluidos (sem construtor de business key em codigo ainda —
#     literais curtos tipo NIP-005 sao numeros de protocolo sem segmento
#     <tenant> e nao disparam a regra). Naming corrigido na verificacao
#     R1 para os prefixos que os specs BPMN REALMENTE definem (formatos
#     `<PREFIX>-{tenant_id}-...` em spec/processes/bpmn/): NIP, PROG,
#     ADEQ, DSR (ANSSUB ja NAO esta pendente — seu construtor real
#     `_ans_submit._ans_business_key` chegou no T2.6-1 e ganhou uma stanza
#     dedicada propria acima, no estilo ESC-amh-conv). Quando um construtor
#     real chegar, adicionar aqui EXATAMENTE essas strings de prefixo (nao
#     "ANS"/"ADEQUACAO"/"LGPD" — nomes de familia de processo, nao de
#     business key). Adicionar SOMENTE quando o construtor real existir.
#     Depois do prefixo: `-<tenant>-` (id de tenant minusculo, ex. amh) e
#     um sufixo de id/hash com charset estrito [A-Za-z0-9:_-] (colons
#     cobrem conversation ids ESC `wa:amh:...`; sufixo vazio cobre o
#     literal real `CONTAS-amh-GUIA-001-`), limitado a 64 chars. Um
#     segredo arbitrario (AKIA..., sk-..., 40-hex, base64) NAO comeca com
#     `<PREFIX>-<tenant minusculo>-` e nao casa a ancora.
#
# (b) paths restritos aos TRES lares legitimos desses literais como
#     artefatos de evidencia:
#       1. tests/**                    (fixtures sinteticas de teste)
#       2. docs/evidence-ledger.md     (celulas de evidencia do ledger)
#       3. docs/gates/<arquivo>.md     (gate records G1/G2/G3/... — citam
#          business keys reais de probes ao vivo como evidencia, mesma
#          classe de artefato que o ledger; adicionado quando o G1 record
#          do PR #78 derrubou o lane)
#     Nenhum escopo em src/ — o mesmo literal plantado em src/ continua
#     sendo detectado (prova de replay no PR), e segredos reais plantados
#     NOS caminhos escopados continuam detectados (shape nao casa).
#
# RESIDUAL registrado (verificacao R1, aceito): um insider que
# deliberadamente nomeie um segredo real NO shape de business key dentro
# dos tres caminhos escopados escaparia das deteccoes por regra generica
# ali — custo irredutivel de QUALQUER allowlist, limitado pela ancora de
# shape + pelos tres paths (regras especificas tipo aws-access-token /
# openai-api-key continuam ativas em toda parte).
# Data: 2026-07-17 (paths docs/gates/ + prefixos FRAUDE/PAGTO: 2026-07-18) | Task: T2.4
description = "T2.4: business keys BPM <PREFIX>-<tenant>-<sufixo> em tests/**, docs/evidence-ledger.md e docs/gates/*.md (identificadores sinteticos de instancia de processo, nao credenciais; AND path+shape)"
condition = "AND"
regexTarget = "secret"
regexes = ['''^(ESC|AUTH|CONTAS|RECURSO|REEMB|INAD|CRED|CANCEL|FRAUDE|PAGTO)-[a-z][a-z0-9]{1,15}-[A-Za-z0-9:_-]{0,64}$''']
paths = [
  '''^tests/.*''',
  '''^docs/evidence-ledger\.md$''',
  '''^docs/gates/[^/]+\.md$''',
]

[[allowlists]]
# ci-attack-suite-kwarg-fp 2026-08-12 (Train E, envelope signing): a regra
# generic-api-key da falso positivo em dois fragmentos de kwarg Python da suite
# de ataque de assinatura de envelope — `epoch=_EPOCH` e `signed_at=_NOW` — cujo
# RHS e uma constante de teste UPPERCASE de modulo (um int / um datetime), nunca
# uma credencial. Contencao dupla AND(path+shape): escopo neste UNICO arquivo de
# teste E numa atribuicao `<kwarg>=_<UPPERCASE>` nua, entao um segredo real de
# alta entropia plantado no MESMO arquivo continua detectado (prova de mutacao
# CI-mode: PAT plantado = 1 leak, os 2 FPs suprimidos). Sem allowlist por path.
description = "Train E 2026-08-12: attack-suite kwarg fragments epoch=_EPOCH / signed_at=_NOW (constantes de teste, nao credenciais; AND path+shape)"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^epoch=_[A-Z][A-Z_]*$''',
  '''^signed_at=_[A-Z][A-Z_]*$''',
]
paths = [
  '''^tests/unit/a2a/attacks/test_envelope_signing_attacks\.py$''',
]

[[allowlists]]
# SEC-GITLEAKS-HISTORY-ALLOWLIST 2026-09-03: o job `gitleaks / secrets` em
# `push` (.github/workflows/security.yml, fetch-depth 0) varre o HISTORICO
# INTEIRO (`gitleaks detect --source . --exit-code 1`), diferente do lane de
# `pull_request` que varre so `base..head`. Duas fixtures sinteticas de teste
# (variaveis locais parecidas com app_secret/whatsapp_token em asserts de
# nao-vazamento) foram substituidas por construcoes de baixa entropia
# ("seg-" + "z"*24 / "tok-" + "x"*24) NOS DOIS ARQUIVOS ja em main — mas os
# valores antigos permanecem, imutaveis, nos dois commits historicos que os
# introduziram, e continuam disparando generic-api-key numa varredura de
# historico completo. Como o conteudo de um commit ja mesclado nao pode ser
# editado, a correcao so pode ser feita aqui (allowlist), nunca no arquivo.
#
# CONTENCAO TRIPLA — condition = "AND" exige que OS TRES criterios casem
# (commit especifico E path exato E shape do secret); qualquer um sozinho
# fora dos outros dois nao allowlista nada:
#
# (a) commits: exatamente os dois SHAs completos (40 hex) que introduziram
#     os literais — historia imutavel, nao pode crescer;
# (b) paths: exatamente os dois arquivos de teste onde esses literais
#     historicos vivem;
# (c) regexTarget = "secret", ancorado ^...$ no shape do valor fake
#     encontrado em cada commit (string alfanumerica maiuscula+minuscula
#     sinteticamente legivel, sem espacos/pontuacao, sem prefixo de
#     credencial real) — nao o valor literal em si.
#
# Stanza 1: commit 15512f1969ac5b43ad6ea2d84ea63ee4f0bb4703,
#   tests/unit/platform/webhooks/whatsapp/test_settings.py:131 (variavel
#   local `secret`, reaproveitada para app_secret/verify_token/
#   whatsapp_token no mesmo teste de nao-vazamento). Shape: 27 caracteres
#   alfanumericos mistos.
# Stanza 2: commit 53d2824e92cd4cd8504f7756f472f1aa9daff82d,
#   tests/unit/tools/test_mcp_whatsapp.py:111,188,214 (`_SECRET` no topo do
#   modulo e duas ocorrencias de `token` no mesmo teste de fluxo de envio).
#   Shape: 24 caracteres alfanumericos mistos (dois valores distintos dessa
#   mesma forma nesse commit; um regex de shape+tamanho cobre ambos sem
#   precisar de uma stanza por linha).
#
# Por que nao e segredo: fixtures deterministicas de teste unitario para
# afirmar que WhatsAppWebhookSettings/WhatsAppSettings nunca renderizam
# credenciais (repr/model_dump) e que o token nunca vaza para logs/URL; o
# codigo de producao correspondente (settings.py, server.py) ja usa env vars
# reais via pydantic-settings, nao estes literais. Em main HOJE (2026-09-03)
# os dois arquivos ja usam construcoes de baixa entropia — os literais
# antigos so existem nesses dois commits historicos.
#
# RESIDUAL registrado: allowlist e commit-bound, nao path-bound — um segredo
# real plantado HOJE nesses mesmos dois arquivos, num commit novo, tem SHA
# novo e nao esta em `commits`, entao continua detectado (prova de mutacao
# 2: clone + replant + commit novo -> leak com fingerprint do commit novo).
# Um segredo real plantado fora de qualquer checkout continua detectado
# pelas regras default (prova de mutacao 1). Nenhum outro arquivo, commit ou
# branch e afetado por esta stanza.
# Data: 2026-09-03 | Task: SEC-GITLEAKS-HISTORY-ALLOWLIST
description = "SEC-GITLEAKS-HISTORY-ALLOWLIST 2026-09-03: fixture sintetica app_secret/whatsapp_token (27 chars) em test_settings.py, historico imutavel (nao credencial; AND commit+path+shape)"
condition = "AND"
regexTarget = "secret"
commits = [
  "15512f1969ac5b43ad6ea2d84ea63ee4f0bb4703",
]
paths = [
  '''^tests/unit/platform/webhooks/whatsapp/test_settings\.py$''',
]
regexes = [
  '''^[A-Za-z0-9]{27}$''',
]

