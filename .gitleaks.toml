# Gitleaks config — maezo-operadora
#
# T2.4 (2026-07-16): disposicao NARROW de 6 falsos positivos da regra
# generic-api-key sobre identificadores BPM em documentacao (NAO segredos).
# Politica fail-closed: estende o ruleset default (useDefault = true) e
# permite APENAS os shapes exatos abaixo, ancorados no valor detectado
# (regexTarget = "secret"). NAO ha allowlist por path — um segredo real
# plantado nos mesmos arquivos de docs continua sendo detectado
# (prova de mutacao no PR #28).

[extend]
# Mantem TODAS as regras default do gitleaks; este arquivo apenas adiciona
# allowlists — nunca substitui ou remove regras.
useDefault = true

[[allowlists]]
# O que casa: exatamente o process key BPM `SP-OP-INADIMPLENCIA-001`
# (docs/processes/test-specs/SP-OP-INADIMPLENCIA-001.md:12).
# Por que nao e segredo: e o identificador publico do processo BPMN
# (mesmo nome do proprio arquivo de spec), nao uma credencial.
# Data: 2026-07-16 | Task: T2.4
description = "T2.4 2026-07-16: BPM process key SP-OP-INADIMPLENCIA-001 (identificador publico de processo, nao credencial)"
regexTarget = "secret"
regexes = ['''^SP-OP-INADIMPLENCIA-001$''']

[[allowlists]]
# O que casa: business keys BPM no shape exato `ESC-amh-conv-<3 digitos>`
# (docs/runbooks/engine-processes.md:113,118,139,191,303 — todos
# `ESC-amh-conv-001`).
# Por que nao e segredo: e a business key sintetica de instancia de
# processo usada nos exemplos do runbook (tenant amh + id de conversa),
# nao uma credencial. Entropia 3.58, formato deterministico.
# Data: 2026-07-16 | Task: T2.4
description = "T2.4 2026-07-16: BPM business key ESC-amh-conv-NNN (identificador sintetico de instancia, nao credencial)"
regexTarget = "secret"
regexes = ['''^ESC-amh-conv-\d{3}$''']

[[allowlists]]
# T2.4 (2026-07-17): classe sistemica de falso positivo — a regra
# generic-api-key casa literais de business key BPM (`business_key=
# "<PREFIX>-<tenant>-<sufixo>"`) porque "key" aparece no identificador e
# literais realistas passam o limiar de entropia (ex.: entropia 4.03 em
# CONTAS-amh-IT-MARINA-CONTAS-fdde8b00). Como o lane escaneia TODAS as
# refs (fetch-depth 0), o literal de qualquer branch em voo derruba o
# gitleaks de TODOS os PRs (incidentes: test_fernando.py @ 72c865e —
# fingerprint em .gitleaksignore, mantido como cinto-e-suspensorio;
# test_marina.py:680,691 @ 9ef098e + evidence-ledger.md:63 @ 7c4b871).
#
# CONTENCAO DUPLA — condition = "AND" exige que AMBOS os criterios casem
# (um caminho sozinho NUNCA allowlista nada; um shape sozinho fora dos
# caminhos tambem nao):
#
# (a) regexTarget="secret", ancorado ^...$ no shape documentado de
#     business key: prefixo de processo em maiusculas, derivado dos
#     construtores reais `f"<PREFIX>-{tenant}-..."` nos grafos de agente
#     (todas as branches) + suites T3.1:
#       ESC     (helena,   SP-OP-ESCALATION-001,   graph.py:199)
#       AUTH    (rafael,   SP-OP-AUTH-001,         graph.py:163)
#       CONTAS  (marina,   SP-OP-CONTAS-001)
#       RECURSO (marina,   SP-OP-RECURSO-001)
#       REEMB   (marina,   SP-OP-REEMBOLSO-001)
#       INAD    (fernando, SP-OP-INADIMPLENCIA-001)
#       CRED    (fernando, SP-OP-CRED-001)
#       CANCEL  (suites T3.1, SP-OP-CANCEL-001: "CANCEL-amh-{contrato}")
#     NAO incluidos (sem construtor de business key ainda — literais
#     curtos tipo FRAUDE-001/NIP-005 sao numeros de protocolo sem
#     segmento <tenant> e nao disparam a regra): FRAUDE, NIP, PAGTO,
#     PROG(RAMA), ANS, ADEQUACAO, LGPD. Adicionar aqui SOMENTE quando um
#     construtor real existir.
#     Depois do prefixo: `-<tenant>-` (id de tenant minusculo, ex. amh) e
#     um sufixo de id/hash com charset estrito [A-Za-z0-9:_-] (colons
#     cobrem conversation ids ESC `wa:amh:...`; sufixo vazio cobre o
#     literal real `CONTAS-amh-GUIA-001-`), limitado a 64 chars. Um
#     segredo arbitrario (AKIA..., sk-..., 40-hex, base64) NAO comeca com
#     `<PREFIX>-<tenant minusculo>-` e nao casa a ancora.
#
# (b) paths restritos a onde esses literais legitimamente vivem: tests/**
#     e docs/evidence-ledger.md APENAS. Nenhum escopo em src/ — o mesmo
#     literal plantado em src/ continua sendo detectado (prova de
#     replay no PR), e segredos reais plantados NOS caminhos escopados
#     continuam detectados (shape nao casa).
# Data: 2026-07-17 | Task: T2.4
description = "T2.4 2026-07-17: business keys BPM <PREFIX>-<tenant>-<sufixo> em tests/** e docs/evidence-ledger.md (identificadores sinteticos de instancia de processo, nao credenciais; AND path+shape)"
condition = "AND"
regexTarget = "secret"
regexes = ['''^(ESC|AUTH|CONTAS|RECURSO|REEMB|INAD|CRED|CANCEL)-[a-z][a-z0-9]{1,15}-[A-Za-z0-9:_-]{0,64}$''']
paths = [
  '''^tests/.*''',
  '''^docs/evidence-ledger\.md$''',
]
