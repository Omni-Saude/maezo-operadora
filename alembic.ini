# Alembic configuration — Maezo Operadora (greenfield)
# script_location aponta para src/maezo/platform/migrations (relativo a /app).
# Usa asyncpg (padrao do projeto) com URL formato postgresql+asyncpg://

[alembic]
script_location = src/maezo/platform/migrations
sqlalchemy.url = postgresql+asyncpg://${MAEZO_PG_USER:-maezo}:${MAEZO_PG_PASSWORD:-maezo}@postgres:5432/${MAEZO_PG_DB:-maezo}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
