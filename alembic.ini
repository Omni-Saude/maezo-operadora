# Alembic configuration — placeholder (greenfield M0)
# Preenchido em M3 quando as migrations forem implementadas.
# script_location aponta para src/maezo/platform/migrations (relativo a /app).

[alembic]
script_location = src/maezo/platform/migrations
sqlalchemy.url = postgresql+psycopg://maezo:maezo@postgres:5432/maezo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
