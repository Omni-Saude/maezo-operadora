{{- /*
Per-agent agent-runtime factory (ADR-0004 federated Agent Definitions, ADR-0006 PHI zones).

Renders ONE Deployment per entry in `.Values.agents`. Each agent runs the same
LangGraph harness image but is parameterised by:
  - AGENT_ID            -> which agent.yaml graph the harness loads
  - maezo.io/phi-zone   -> "true|false" pod label (drives the per-agent NetworkPolicy)
  - per-agent ServiceAccount (IRSA role scoped to that agent — no shared cloud identity)
  - per-agent replicaCount / resources
  - the EFFECTIVE (merged L0+overlay) Agent Definition, mounted from the per-agent ConfigMap

The legacy single `agentRuntime` block is gone: `.Values.agents` is the source of truth.
Gateway / fhir-sync / webhook-receiver Deployments are unchanged (separate templates).
*/ -}}
{{- include "maezo-tenant.validateAgents" . }}
{{- range $agent := .Values.agents }}
{{- if $agent.enabled }}
{{- $phiZone := include "maezo-tenant.agentPhiZoneLabel" (dict "zone" $agent.securityZone) }}
{{- $component := include "maezo-tenant.agentComponent" (dict "name" $agent.name) }}
{{- $saName := include "maezo-tenant.agentServiceAccountName" (dict "name" $agent.name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-{{ $agent.name }}
  namespace: {{ include "maezo-tenant.namespace" $ }}
  labels:
    {{- include "maezo-tenant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    maezo.io/agent: {{ $agent.name | quote }}
    maezo.io/security-zone: {{ $agent.securityZone | quote }}
    maezo.io/phi-zone: {{ $phiZone | quote }}
spec:
  replicas: {{ $agent.replicaCount | default 2 }}
  selector:
    matchLabels:
      {{- include "maezo-tenant.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
      maezo.io/agent: {{ $agent.name | quote }}
  template:
    metadata:
      labels:
        {{- include "maezo-tenant.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        maezo.io/agent: {{ $agent.name | quote }}
        maezo.io/security-zone: {{ $agent.securityZone | quote }}
        # ADR-0006 PHI two-zone guardrail. PHI-zone agents (rafael/marina) -> "true";
        # the per-agent NetworkPolicy selects on this label to RESTRICT egress.
        maezo.io/phi-zone: {{ $phiZone | quote }}
        # PodMonitor jobLabel target (podmonitor.yaml): jobLabel names a POD LABEL KEY
        # to copy from, not a literal job value — this is that key. Its value must stay
        # in sync with the `up{job="maezo-agent-runtime"}` matcher in alert-rules.yaml.
        maezo.io/scrape-job: "maezo-agent-runtime"
      annotations:
        # Roll the pods when the effective Agent Definition changes (provenance: ADR-0007).
        checksum/agent-definition: {{ $agent.definitionHash | default "unset" | quote }}
        # Roll on secret change (ESO bumps this).
        checksum/secrets: {{ include (print $.Template.BasePath "/externalsecret.yaml") $ | sha256sum | quote }}
    spec:
      serviceAccountName: {{ $saName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: {{ include "maezo-tenant.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["python", "-m", "maezo.runtime.agent_runtime"]
          env:
            - name: TENANT_ID
              value: {{ $.Values.tenant.id | quote }}
            - name: AGENT_ID
              value: {{ $agent.name | quote }}
            - name: AGENT_SECURITY_ZONE
              value: {{ $agent.securityZone | quote }}
            - name: AGENT_RUNTIME_MODE
              value: "kubernetes"
            # Effective (merged) Agent Definition mounted from the per-agent ConfigMap.
            - name: AGENT_DEFINITION_PATH
              value: "/etc/maezo/agent/effective-agent-definition.yaml"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.aurora.secretName }}
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: maezo-kafka-config
                  key: bootstrap-servers
            {{- if $.Values.externalSecrets.enabled }}
            # PHI pseudonymizer HMAC key (ADR-0006, res-phi-hmac-env-injection). Same gate as the
            # phi-hmac-key ExternalSecret (externalsecret.yaml: `.Values.externalSecrets.enabled`)
            # so we never reference a Secret that ESO wasn't asked to create.
            - name: PHI_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: maezo-phi-hmac
                  key: phi-hmac-key
            {{- end }}
            - name: CIBSEVEN_BASE_URL
              value: "http://cibseven:8080/engine-rest"
            - name: FHIR_BASE_URL
              value: "http://hapi-fhir:8080/fhir"
            {{- if eq ($agent.securityZone | toString) "phi" }}
            # PHI-zone agents use the BR-resident PHI LLM key (never the general cloud key).
            - name: LLM_PHI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: maezo-llm-keys
                  key: phi-api-key
            {{- else }}
            # General-zone agents use the pseudonymized cloud-LLM key.
            - name: LLM_GENERAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: maezo-llm-keys
                  key: general-api-key
            {{- end }}
            {{- include "maezo-tenant.otelEnv" $ | nindent 12 }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "tenant={{ $.Values.tenant.id }},agent={{ $agent.name }},zone={{ $agent.securityZone }}"
            {{- range $k, $v := $agent.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            # Metrics + health endpoint (scraped by the per-agent Service / PodMonitor).
            # Named port lets podmonitor.yaml's `port: metrics` selector resolve.
            - name: metrics
              containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml ($agent.resources | default $.Values.agentDefaults.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: agent-definition
              mountPath: /etc/maezo/agent
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: agent-definition
          configMap:
            name: agent-def-{{ $agent.name }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: {{ $component }}
              maezo.io/tenant: {{ $.Values.tenant.id | quote }}
              maezo.io/agent: {{ $agent.name | quote }}
---
{{- end }}
{{- end }}
