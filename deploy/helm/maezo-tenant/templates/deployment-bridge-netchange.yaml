{{- /*
Network-change bridge daemon (GAP-XPROC-2) — Kafka -> process-start.

Sibling do notifications-bridge e do worker-daemon: mesma imagem, command
`python -m maezo.platform.integrations.network_change_bridge`. Consome o topico Kafka de EVENTO DE
DOMINIO `agents.events.cred.network_changed` (fato de rede publicado por SP-OP-CRED-001) e, para
cada tipo_mudanca (prestador_credenciado / prestador_descredenciado / substituicao_registrada),
inicia SP-OP-ADEQUACAO-001 via mcp-cibseven.start_process (idempotente; correlacao
tenant_id+regiao_saude+especialidade). Identidade = principal de SERVICO PROPRIO
`maezo-network-change-bridge` (allowlist MINIMA: so start_process) — DISTINTO do
notifications-bridge (R-198 / NETBRIDGE-SERVICE-PRINCIPAL-IDENTITY, OWNER-DECISIONS-REGISTER:
menor privilegio + trilha de auditoria atribuivel por ponte).

PROBE (seam): o daemon da ponte NAO sobe um servidor de health (o `main.py` so roda o loop do
consumer). Liveness `exec` (processo vivo) em vez de httpGet /healthz — espelha o notifications-bridge.
*/ -}}
{{- if .Values.networkChangeBridge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-change-bridge
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-change-bridge
spec:
  replicas: {{ .Values.networkChangeBridge.replicaCount }}
  selector:
    matchLabels:
      {{- include "maezo-tenant.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: network-change-bridge
  template:
    metadata:
      labels:
        {{- include "maezo-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: network-change-bridge
        # A ponte so carrega identificadores de celula/refs de processo (regiao/especialidade
        # cadastral), nunca PHI cru de beneficiario.
        maezo.io/phi-zone: "false"
    spec:
      serviceAccountName: {{ include "maezo-tenant.networkChangeBridgeServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: network-change-bridge
          image: {{ include "maezo-tenant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "maezo.platform.integrations.network_change_bridge"]
          env:
            - name: TENANT_ID
              value: {{ .Values.tenant.id | quote }}
            - name: CIBSEVEN_BASE_URL
              value: "http://cibseven:8080/engine-rest"
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: maezo-kafka-config
                  key: bootstrap-servers
            {{- include "maezo-tenant.otelEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.networkChangeBridge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # SEAM: a ponte nao expoe /healthz (sem app de health). Liveness por processo vivo.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pgrep -f maezo.platform.integrations.network_change_bridge > /dev/null"
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
