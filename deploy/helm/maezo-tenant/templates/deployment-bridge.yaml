{{- /*
Notifications bridge daemon (W-R2 / R8) — Kafka -> process-start.

Sibling do worker-daemon e do fhir-sync: mesma imagem, command
`python -m maezo.platform.integrations.notifications_bridge`. Consome o UNICO topico Kafka
`operadora.notifications.internal` e, nos `type` acionaveis (contas.start_fraude /
nip.handoff_ans_submit), inicia SP-OP-RECURSO-001 / SP-OP-ANS-SUBMIT-001 via
mcp-cibseven.start_process (idempotente). Identidade = principal de SERVICO
`notifications-bridge` (allowlist MINIMA: so start_process).

PROBE (seam): o daemon da ponte NAO sobe um servidor de health (o `main.py` so roda o loop do
consumer — diferente do worker-daemon/agent-runtime). Por isso usamos uma liveness `exec`
(heartbeat em BRIDGE_HEARTBEAT_PATH, R-061/F-149 — a imagem nao tem `pgrep`) em vez de httpGet /healthz. Seam: adicionar um app de health (mirror R7) e
trocar por probes HTTP /healthz+/readyz quando o consumer ganhar readiness.
*/ -}}
{{- if .Values.notificationsBridge.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-bridge
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications-bridge
spec:
  replicas: {{ .Values.notificationsBridge.replicaCount }}
  selector:
    matchLabels:
      {{- include "maezo-tenant.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notifications-bridge
  template:
    metadata:
      labels:
        {{- include "maezo-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: notifications-bridge
        # A ponte so carrega identificadores/refs de processo (pseudo_ids), nunca PHI cru.
        maezo.io/phi-zone: "false"
    spec:
      serviceAccountName: {{ include "maezo-tenant.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifications-bridge
          image: {{ include "maezo-tenant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "maezo.platform.integrations.notifications_bridge"]
          env:
            - name: TENANT_ID
              value: {{ .Values.tenant.id | quote }}
            - name: CIBSEVEN_BASE_URL
              value: "http://cibseven:8080/engine-rest"
            # R-061 (decisao do dono 2026-10-31, #1084): `build_bridge` recusa subir sem isto —
            # o sink de auditoria duravel (PostgresAuditSink) e' pre-condicao de todo start de
            # processo (fail-closed, ADR-0007). Mesmo ExternalSecret Aurora (ESO) e mesma chave
            # dos demais consumidores (a2a-outbox-relay, worker-daemon, webhook-receiver) —
            # nunca literal. O egress de rede ate' o Aurora segue dependente dos CIDRs de
            # `networkPolicy.daemonEgress.endpoints` (dado de infra, TODO-OWNER em values-amh).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aurora.secretName }}
                  key: database-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: maezo-kafka-config
                  key: bootstrap-servers
            {{- include "maezo-tenant.otelEnv" . | nindent 12 }}
            {{- include "maezo-tenant.bridgeHeartbeatEnv" (dict "name" "notifications-bridge") | nindent 12 }}
          resources:
            {{- toYaml .Values.notificationsBridge.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # R-061 / F-149: a imagem nao tem `pgrep` (sem procps — exit 127, restart-loop). Liveness
          # por heartbeat (maezo-tenant.bridgeHeartbeatProbe em _helpers.tpl).
          livenessProbe:
            {{- include "maezo-tenant.bridgeHeartbeatProbe" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
