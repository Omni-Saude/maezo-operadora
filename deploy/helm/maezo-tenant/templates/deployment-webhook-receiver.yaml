{{- if .Values.webhookReceiver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-receiver
spec:
  replicas: {{ .Values.webhookReceiver.replicaCount }}
  selector:
    matchLabels:
      {{- include "maezo-tenant.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webhook-receiver
  template:
    metadata:
      labels:
        {{- include "maezo-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: webhook-receiver
        maezo.io/phi-zone: "general"
    spec:
      serviceAccountName: {{ include "maezo-tenant.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook-receiver
          image: {{ include "maezo-tenant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "maezo.platform.webhooks"]
          env:
            - name: TENANT_ID
              value: {{ .Values.tenant.id | quote }}
            - name: WHATSAPP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maezo-whatsapp-config
                  key: waba-token
            # Meta App Secret (HMAC-SHA256 signature validation) + Verify Token (GET
            # /webhook handshake) — REQUIRED, no default (WhatsAppWebhookSettings.app_secret
            # / .verify_token). Missing either raises a pydantic ValidationError at
            # startup -> CrashLoopBackOff (predeploy DB-2).
            - name: WHATSAPP_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: maezo-whatsapp-config
                  key: app-secret
            - name: WHATSAPP_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: maezo-whatsapp-config
                  key: verify-token
            # Tenant Postgres DSN (ADR-0007, T-C2, T4b) — Helena's in-process dispatch needs this
            # BOTH to construct the durable audit sink her escalation start (SP-OP-ESCALATION-001)
            # fails closed on AND to open the durable LangGraph checkpointer (multi-turn state that
            # survives webhook invocations / receiver restarts — service.py's `_build_dispatcher` /
            # `_provision_dispatch_checkpointer`). Injected from the SAME Aurora ExternalSecret the
            # other DATABASE_URL consumers read (deployment-agent-runtime.yaml,
            # deployment-worker-daemon.yaml) — identical secretName/key, mirror-exact. FAIL-CLOSED:
            # absent -> `_build_dispatcher` raises -> dispatcher None -> `/webhook` 501 (never an
            # un-audited escalation start, never a silently-stateless prod dispatch).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aurora.secretName }}
                  key: database-url
            # Kafka producer target (predeploy DB-3) — same secret/key the other
            # Kafka-producing components use (deployment-agent-runtime.yaml,
            # deployment-worker-daemon.yaml, deployment-bridge*.yaml).
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: maezo-kafka-config
                  key: bootstrap-servers
            # Production runtime mode (ADR-0035). Any deployed pod is production, so an absent
            # PHI_HMAC_KEY fails closed at Pseudonymizer construction (service.py `_build_dispatcher`).
            # Mirrors `deployment-agent-runtime.yaml`'s AGENT_RUNTIME_MODE: "kubernetes".
            - name: RUNTIME_MODE
              value: "kubernetes"
            {{- if .Values.externalSecrets.enabled }}
            # PHI pseudonymizer HMAC key (ADR-0006/ADR-0035, res-phi-hmac-env-injection). This is
            # the daemon that actually constructs+calls the Pseudonymizer (Helena's dispatch), so
            # the key MUST be injected here — same secret the agent-runtime/worker-daemon read.
            # Same gate as the phi-hmac-key ExternalSecret (`.Values.externalSecrets.enabled`) so
            # we never reference a Secret ESO wasn't asked to create.
            - name: PHI_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: maezo-phi-hmac
                  key: phi-hmac-key
            {{- end }}
            {{- include "maezo-tenant.otelEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.webhookReceiver.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-receiver
spec:
  type: {{ .Values.webhookReceiver.service.type }}
  ports:
    - port: {{ .Values.webhookReceiver.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "maezo-tenant.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-receiver
{{- end }}
