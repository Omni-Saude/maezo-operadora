{{- if .Values.externalSecrets.enabled }}
# SecretStore — authenticates ESO to AWS Secrets Manager via IRSA.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: maezo-aws-secrets
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: sa-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "maezo-tenant.serviceAccountName" . }}
---
# ExternalSecret: Aurora master credentials -> composed database_url (predeploy DB-4).
#
# aurora-postgres/main.tf sets manage_master_user_password=true, so AWS/RDS OWNS the master
# secret at `rds!cluster-…` with schema {username,password} ONLY. There is no `database_url`
# property, and that ARN lives OUTSIDE `${secretPathPrefix}` — the old remoteRef
# `${secretPathPrefix}/aurora/master-user-secret` property `database_url` was never created by
# terraform (secrets module shells only whatsapp/llm/tasy) and could never sync, which ABORTS
# the pre-install migrations hook (job-migrations.yaml) and every runtime that mounts it.
#
# Fix: read the AWS-managed secret BY FULL ARN (aurora.masterSecretArn = terraform output
# aurora_master_user_secret_arn) for username+password, and COMPOSE the asyncpg DSN at
# ESO sync time via target.template. host/port/db come from terraform outputs plumbed into
# aurora.{endpoint,port,database}. The synced Secret exposes ONLY `database-url` (template
# mergePolicy defaults to Replace) — the exact key the runtimes / migrations / lifecycle consume.
# This is rotation-safe: on RDS password rotation ESO re-reads the managed secret and re-composes.
#
# DEPLOY-DAY PREREQ (§6.2 — not verifiable without a cluster): the IRSA role that ESO assumes
# (serviceAccount annotation eks.amazonaws.com/role-arn) MUST be granted
# secretsmanager:GetSecretValue on this rds! ARN. That ARN is OUTSIDE the `maezo/${env}/*` grant
# and the role is provisioned out-of-repo (static ARN in values), so the grant is a manual op.
# Password is percent-encoded (urlquery) since an asyncpg DSN treats `:@/?#` as reserved; RDS
# master passwords exclude space/`@`/`/` so urlquery's form-encoding is safe. See
# docs/Tarefas_Pendentes.md §1.1 and README §Deploy.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aurora-master-credentials
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maezo-aws-secrets
    kind: SecretStore
  target:
    name: {{ .Values.aurora.secretName }}
    creationPolicy: Owner
    template:
      engine: v2
      # Compose the asyncpg DSN from the AWS-managed {username,password} + tf-sourced host/port/db.
      # The `{{ "{{" }} … {{ "}}" }}` sequences below are LITERAL at Helm render time (backtick raw
      # strings) and are evaluated by ESO at SYNC time — never by Helm.
      data:
        database-url: "postgresql+asyncpg://{{ `{{ .username }}` }}:{{ `{{ .password | urlquery }}` }}@{{ required "aurora.endpoint is required — set it to the Aurora writer endpoint (terraform output `aurora_writer_endpoint`)." .Values.aurora.endpoint }}:{{ .Values.aurora.port | default 5432 }}/{{ required "aurora.database is required — set it to the Aurora database name (terraform output `aurora_database_name`)." .Values.aurora.database }}"
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "aurora.masterSecretArn is required — set it to the AWS-managed RDS master secret ARN (terraform output `aurora_master_user_secret_arn`)." .Values.aurora.masterSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "aurora.masterSecretArn is required — set it to the AWS-managed RDS master secret ARN (terraform output `aurora_master_user_secret_arn`)." .Values.aurora.masterSecretArn | quote }}
        property: password
---
# ExternalSecret: LLM API keys (BLOCKED until credentials delivered)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-api-keys
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
  annotations:
    maezo.io/blocked: "true"
    maezo.io/blocker: "LLM-contract"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maezo-aws-secrets
    kind: SecretStore
  target:
    name: maezo-llm-keys
    creationPolicy: Owner
  data:
    - secretKey: general-api-key
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/llm/api-keys"
        property: general_api_key
    - secretKey: phi-api-key
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/llm/api-keys"
        property: phi_api_key
---
# ExternalSecret: WhatsApp webhook credentials — WABA token, Meta App Secret (HMAC
# signature validation) and Verify Token (GET /webhook handshake). All three are
# delivered as part of the same Meta/WABA onboarding, hence one blocked annotation
# covers the whole resource (BLOCKED until credentials delivered).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: whatsapp-config
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
  annotations:
    maezo.io/blocked: "true"
    maezo.io/blocker: "WABA-onboarding"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maezo-aws-secrets
    kind: SecretStore
  target:
    name: maezo-whatsapp-config
    creationPolicy: Owner
  data:
    - secretKey: waba-token
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/whatsapp/waba-token"
        property: token
    # predeploy DB-2: app_secret/verify_token are REQUIRED (no default) by
    # WhatsAppWebhookSettings — these are NEW Secrets Manager entries; ops must
    # populate them (§6.2) before deploy, same as the waba-token entry above.
    - secretKey: app-secret
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/whatsapp/app-secret"
        property: app_secret
    - secretKey: verify-token
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/whatsapp/verify-token"
        property: verify_token
---
# ExternalSecret: MSK bootstrap servers (from amh-data-platform Secrets Manager)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-config
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: maezo-aws-secrets
    kind: SecretStore
  target:
    name: maezo-kafka-config
    creationPolicy: Owner
  data:
    - secretKey: bootstrap-servers
      remoteRef:
        # amh-data-platform convention (their MSK Serverless)
        key: "debezium/msk-bootstrap-servers"
        property: bootstrap_servers
---
# ExternalSecret: PHI pseudonymizer HMAC key (ADR-0006 — gap #12 vault injection).
# Synced from AWS Secrets Manager into env PHI_HMAC_KEY on the agent-runtime, worker-daemon and
# webhook-receiver Deployments; read at runtime via Pseudonymizer.from_settings (ADR-0035:
# fail-closed in production when absent/blank).
# BLOCKED: populating the real key in the vault is a manual step (§6.2) — the wiring is complete.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phi-hmac-key
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
  annotations:
    maezo.io/blocked: "true"
    maezo.io/blocker: "PHI-HMAC-key-population"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maezo-aws-secrets
    kind: SecretStore
  target:
    name: maezo-phi-hmac
    creationPolicy: Owner
  data:
    - secretKey: phi-hmac-key
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/phi/hmac-key"
        property: hmac_key
---
# ExternalSecret: Tasy Oracle credentials (BLOCKED until credentials delivered)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tasy-config
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
  annotations:
    maezo.io/blocked: "true"
    maezo.io/blocker: "Tasy-integration-agreement"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maezo-aws-secrets
    kind: SecretStore
  target:
    name: maezo-tasy-config
    creationPolicy: Owner
  data:
    - secretKey: oracle-dsn
      remoteRef:
        key: "{{ .Values.externalSecrets.secretPathPrefix }}/tasy/oracle"
        property: oracle_dsn
{{- end }}
