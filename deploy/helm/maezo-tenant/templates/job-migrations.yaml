{{- /*
Job de MIGRATIONS (Helm hook pre-install/pre-upgrade). Roda `alembic upgrade head` contra o
schema-por-tenant do Postgres ANTES dos runtimes subirem, garantindo que o schema do tenant
(audit_chain, agent_memory, a2a_idempotency, índice de retenção) exista. A extensão pgvector
em `public` saiu da lista: `0009_drop_pgvector` (DU-01-b) a remove junto com a coluna
`agent_memory.embedding`. Mesma imagem dos demais runtimes; zona general (sem PHI cru — só DDL).

Detalhes não-óbvios:
  - alembic exige URL SÍNCRONA (psycopg); o secret Aurora é `postgresql+asyncpg://...` → o
    container normaliza removendo `+asyncpg` (igual a runtime.checkpoint.normalize_conn_string).
  - env.py lê ALEMBIC_DATABASE_URL + MAEZO_TENANT_ID (não DATABASE_URL/TENANT_ID; e NÃO
    `MAEZO_TENANT` — ver DU-02/R-002: esse nome nunca existiu no código, e exportá-lo fazia o
    `search_path` cair em silêncio no schema `public` em qualquer deploy Helm, exit 0, sem erro
    algum). O schema é derivado de MAEZO_TENANT_ID e o `search_path` é fixado lá dentro.
    `scripts/ci/check_chart_env_reconciliation.py` (Makefile `check-chart-env-reconciliation`,
    job `validate-helm` em ci.yml) falha fechado se este nome divergir de novo do que
    `src/maezo/platform/migrations/env.py` lê.
  - alembic.ini precisa estar na imagem (deploy/Dockerfile copia-o para /app).

Pré-requisito (ver docs/Tarefas_Pendentes.md §1.1/§1.3): o secret Aurora (ESO-synced) deve existir
ANTES do `helm upgrade` — já é pré-requisito do app. backoffLimit cobre atrasos transitórios de
sincronização do ESO. O papel do DB precisa de privilégio para `CREATE EXTENSION vector` (rds_superuser).
*/ -}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "maezo-tenant.namespace" . }}-migrate
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "maezo-tenant.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
        # Só DDL / IDs internos — sem PHI cru. Zona general.
        maezo.io/phi-zone: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "maezo-tenant.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # DB-7: GATE the migration on the ESO-composed Aurora Secret being PRESENT, WITHOUT
        # mounting it via secretKeyRef. A missing secretKeyRef makes the kubelet fail container
        # creation (CreateContainerConfigError) — a never-Running pod that backoffLimit cannot
        # retry and that only activeDeadlineSeconds can end, tripping `helm --atomic` into a
        # full-release rollback. Here we poll an OPTIONAL secret VOLUME (mounts empty when the
        # Secret is absent; the kubelet projects it once ESO syncs) so the pod reaches Running
        # and WAITS (bounded). With the documented two-phase deploy (cd.yml / runbook §3) the
        # Secret already exists → this passes on the first poll and pre-UPGRADE is unaffected;
        # on a bare `helm install` it degrades to a clear, bounded, backoffLimit-retryable
        # failure instead of an opaque stuck pod.
        - name: await-db-secret
          image: {{ include "maezo-tenant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              secret_name='{{ .Values.aurora.secretName }}'
              timeout={{ .Values.migrations.secretWaitSeconds | default 300 }}
              deadline=$(( $(date +%s) + $timeout ))
              until [ -s /aurora-secret/database-url ]; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "await-db-secret: TIMED OUT after ${timeout}s waiting for the External Secrets Operator to sync secret '${secret_name}' (key database-url). Is ESO running and is ExternalSecret/aurora-master-credentials Ready? See docs/runbooks/devops-stack.md §3 (two-phase deploy)." >&2
                  exit 1
                fi
                echo "await-db-secret: secret '${secret_name}' not yet ESO-synced; waiting…"
                sleep 5
              done
              echo "await-db-secret: secret '${secret_name}' present — starting migrations."
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: aurora-secret
              mountPath: /aurora-secret
              readOnly: true
      containers:
        - name: migrate
          image: {{ include "maezo-tenant.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # alembic exige URL síncrona; o secret Aurora é +asyncpg → normaliza p/ psycopg.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              export ALEMBIC_DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed 's/+asyncpg//')"
              exec python -m alembic upgrade head
          env:
            # DU-02/R-002: o nome LIDO por env.py e' MAEZO_TENANT_ID (nao MAEZO_TENANT — ver o
            # comentario no topo deste arquivo). Renomeado 2026-09-04; antes deste fix toda
            # migration aplicada por Helm rodava no schema `public` em silencio, exit 0.
            - name: MAEZO_TENANT_ID
              value: {{ .Values.tenant.id | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aurora.secretName }}
                  key: database-url
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            {{- include "maezo-tenant.otelEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        # DB-7: OPTIONAL mount of the ESO-synced Aurora Secret so the await-db-secret init
        # container can POLL for it without a secretKeyRef (which would CreateContainerConfigError
        # while the Secret is absent). `optional: true` lets the pod START when the Secret is not
        # yet present; the kubelet projects the `database-url` key once ESO creates it. The main
        # `migrate` container still consumes it via secretKeyRef (unchanged) — it only starts
        # AFTER this init exits, by which point the Secret is guaranteed present.
        - name: aurora-secret
          secret:
            secretName: {{ .Values.aurora.secretName }}
            optional: true
{{- end }}
