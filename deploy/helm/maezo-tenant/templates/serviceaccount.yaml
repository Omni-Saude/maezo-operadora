{{- /*
ServiceAccounts.

1. Shared/legacy SA — used by the gateway / fhir-sync / webhook-receiver / notifications-bridge
   Deployments and by ESO (SecretStore JWT auth). Unchanged.
2. Per-agent SAs — one per `.Values.agents` entry, each carrying its OWN IRSA
   role-arn annotation (ADR-0006: no shared cloud identity across PHI/general zones;
   a PHI agent's IAM role can be scoped to BR-resident resources only).
3. network-change-bridge SA (R-198 / NETBRIDGE-SERVICE-PRINCIPAL-IDENTITY) — its OWN service
   principal, distinct from (1), so the two bridges' start_process calls are attributable to
   different identities in the audit trail (least privilege, owner+security decided).
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maezo-tenant.serviceAccountName" . }}
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- include "maezo-tenant.validateAgents" . }}
{{- range $agent := .Values.agents }}
{{- if $agent.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maezo-tenant.agentServiceAccountName" (dict "name" $agent.name) }}
  namespace: {{ include "maezo-tenant.namespace" $ }}
  labels:
    {{- include "maezo-tenant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ include "maezo-tenant.agentComponent" (dict "name" $agent.name) }}
    maezo.io/agent: {{ $agent.name | quote }}
    maezo.io/security-zone: {{ $agent.securityZone | quote }}
  annotations:
    {{- if $agent.irsaRoleArn }}
    eks.amazonaws.com/role-arn: {{ $agent.irsaRoleArn | quote }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if and .Values.networkChangeBridge.enabled .Values.networkChangeBridge.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "maezo-tenant.networkChangeBridgeServiceAccountName" . }}
  namespace: {{ include "maezo-tenant.namespace" . }}
  labels:
    {{- include "maezo-tenant.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-change-bridge
  annotations:
    {{- toYaml .Values.networkChangeBridge.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
