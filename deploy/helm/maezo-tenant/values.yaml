  # qual derivar um teto de concorrencia. `null`, nunca um numero inventado.
  capacity:
    declaredCeilingPerReplica: null
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# A2A fact-outbox relay (SC-01 / R-004) — Postgres outbox -> Kafka, at-least-once
#
# Deployment dedicado rodando `python -m maezo.a2a.outbox_relay` em loop (opcao B do memorando
# M-04, ratificada — espelha o sibling `notificationsBridge` acima). Antes deste template, nada
# no repo invocava o relay: `runtime/agent_runtime/a2a_composition.py` documenta que ele e'
# "explicitly-invoked ... never auto-started" e que a entrega de fatos A2A e' uma decisao de
# DEPLOYMENT — este bloco + `deployment-a2a-outbox-relay.yaml` SAO essa decisao. Mecanismo (lease
# expiravel, `claimed_by`, batch/TTL parametricos) ja' pronto em `src/maezo/a2a/outbox_relay.py`;
# faltava so' o invocador.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Daemon de despacho de intake AUTH (WP-J1-01)
# ---------------------------------------------------------------------------
# Deployment dedicado rodando `python -m maezo.runtime.intake_dispatch` em loop: drena
# `portal_intake.native_outbox` para o seam auditado de start/resposta. Ate' ele, NADA chamava
# `dispatch_prepared_start`/`dispatch_prepared_documents` e uma admissao do portal nunca iniciava
# processo algum.
#
# `enabled: false` POR PADRAO, por dois motivos independentes:
#   1. drenar uma admissao e' um EFEITO no motor — quem autoriza e' o deployment, nunca um
#      composition root (mesma postura do a2a-outbox-relay antes de R-004);
#   2. hoje o start do portal RECUSA antes de qualquer efeito: `dispatch_prepared_start` le
#      `numero_guia_tiss` dos fatos publicados e levanta `AuthIntakeGuideNumberUnavailableError`
#      quando a fonte nao publica o numero (`gateway/intake/native_composition.py:43-61`), que e'
#      o caso de hoje. Ligar isto antes da fonte publicar rende varreduras que recusam POR NOME.
# Antes de virar `true`: o hunk de binding de `intake_service_factory` no composition root de
# producao (WP-J1-00) tem de existir, senao o portal nao admite nada para drenar.
intakeDispatch:
  enabled: false
  # UMA replica por desenho — a lease do outbox serializa linha a linha; ver o comentario do
  # template. Mais replicas competem pela mesma lease sem ganho.
  replicaCount: 1
  # Linhas lidas por sweep (`MAEZO_INTAKE_DISPATCH_BATCH_SIZE`). Limita a LEITURA: o sweep e'
  # sequencial e despacha no maximo um item por dominio de chave de negocio.
  batchSize: 16
  # Segundos entre sweeps quando o anterior nao despachou nada
  # (`MAEZO_INTAKE_DISPATCH_POLL_INTERVAL_S`). NAO e' so' latencia: uma linha admitida so' pode
  # ser despachada enquanto seu `authorization_until` (o teto da sessao que admitiu) vale, entao
  # um poll lento EXPIRA trabalho em vez de apenas atrasa-lo.
  pollIntervalS: 2
  # Teto DECLARADO (segundos) para drenar UMA linha, somado ao limiar da liveness probe
  # (`MAEZO_INTAKE_DISPATCH_ROW_BUDGET_S`; consumida so' pela probe — o daemon nao impoe timeout
  # proprio). O heartbeat e' tocado por LINHA (arranque + fim de sweep + cada linha), entao o
  # limiar cobre o pior caso de UMA linha, nunca um sweep inteiro de `batchSize`: ida e volta no
  # engine limitada a 10s (`gateway/human/auth_transport.py` recusa `timeout_seconds` acima de 10)
  # + statements protegidos a 5s (`asyncpg command_timeout`,
  # `gateway/intake/native_authority.py:842`) numa cadeia limitada, com folga. Reiniciar no meio
  # de um sweep deixaria a linha em `sending`, permanentemente `awaiting_receipt`.
  rowBudgetS: 120
  # Secret com os materiais protegidos do dono: `lifecycle.json`
  # (`AuthLifecycleConfiguration` — o MESMO arquivo que o portal carrega), `definition.json`
  # (o pin da definition implantada), `definition-digest` e `identity-writer-url`.
  # Montado 0400; `protected_bytes` recusa qualquer bit de grupo/outros.
  materialsSecretName: maezo-auth-lifecycle
  capacity:
    declaredCeilingPerReplica: 16
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

a2aOutboxRelay:
  enabled: true
  replicaCount: 1
  # Linhas por sweep de drain (`A2A_OUTBOX_RELAY_BATCH_SIZE` — outbox.py `DEFAULT_BATCH_SIZE`).
  batchSize: 100
  # Segundos de espera entre sweeps QUANDO o sweep anterior nao achou nada
  # (`A2A_OUTBOX_RELAY_POLL_INTERVAL_S` — outbox_relay.py `DEFAULT_POLL_INTERVAL_S`).
  pollIntervalS: 2
  # R-023 / SC-02: declaredCeilingPerReplica DERIVADO diretamente de `batchSize` acima — linhas
  # do outbox drenadas por sweep, por replica (o relay e' 1 replica por desenho, uma unica lease
  # exclusiva por linha via `claimed_by`).
  capacity:
    declaredCeilingPerReplica: 100
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# External Secrets Operator — SecretStore + ExternalSecrets
# ---------------------------------------------------------------------------
externalSecrets:
  enabled: true
  # Secrets Manager secret path prefix (must match Terraform module)
  secretPathPrefix: "maezo/staging"
  # IAM role for ESO to assume (IRSA)
  irsaRoleArn: ""

# ---------------------------------------------------------------------------
# NetworkPolicy (ADR-0006 PHI two-zone model)
#
# Egress is rendered PER AGENT (see networkpolicy.yaml): each agent gets a policy
# selecting on maezo.io/agent=<name> + maezo.io/phi-zone. The allowlists below are
# the per-zone egress targets those per-agent policies open:
#   - PHI-zone agents (rafael, marina) -> phiZone.brResidentEndpoints ONLY.
#   - general-zone agents (helena)     -> generalZone.llmEndpoints + MSK.
# ---------------------------------------------------------------------------
networkPolicy:
  # Default deny all egress; allowlists below open specific holes.
  defaultDenyEgress: true

  # FIX 2 — intra-namespace egress is SCOPED to these components (by
  # app.kubernetes.io/component), NOT to every pod. Agents may egress to the
  # gateway (pseudonymizing PEP) + genuinely-shared infra ONLY; agent <-> peer-agent
  # egress stays DENIED so a PHI pod can never relay through the general-zone agent's
  # cloud-LLM egress. Do NOT add `agent-*` components here.
  intraNamespaceEgressComponents:
    - gateway

  # General Zone: agents with PHI pseudonymized (Helena, Lucas, Fernando, Gustavo).
  # May reach: pseudonymized LLM endpoint + intra-namespace + Kafka MSK.
  generalZone:
    enabled: true
    # Named egress allowlists — configure per environment.
    # FIX 1: each endpoint MUST carry a concrete `cidr`. NetworkPolicy ipBlock is
    # IP-based, not hostname-based — 0.0.0.0/0 is rejected (it is not an allowlist).
    # True FQDN allowlisting needs an egress proxy / Cilium FQDN policy.
    llmEndpoints:
      - host: "api.anthropic.com"
        port: 443
        cidr: ""   # REQUIRED — pin the cloud-LLM NLB/VIP CIDR per environment.
    # Kafka MSK Serverless endpoint (from amh-data-platform)
    mskEndpoint:
      host: ""   # populated from ESO/env var at deploy time
      port: 9098
      cidr: ""   # REQUIRED when host is set — pin the MSK ENI/subnet CIDR.

  # W-R2 daemons (worker-daemon R7 + notifications-bridge R8): general-zone NON-agents that
  # must reach CIB Seven (fetch-and-lock / start_process) + Kafka. FIX 1: each endpoint MUST
  # carry a concrete `cidr` (0.0.0.0/0 is rejected — not an allowlist). Empty `endpoints` =>
  # all external egress for the daemons DENIED (fail-closed). Configure per environment.
  daemonEgress:
    enabled: true
    endpoints: []
      # - host: "cibseven"        # in-cluster engine VIP/ENI CIDR
      #   port: 8080
      #   cidr: "10.20.1.0/24"    # REQUIRED — pin the CIB Seven endpoint CIDR.
      # - host: "kafka-msk"       # MSK Serverless ENI/subnet
      #   port: 9098
      #   cidr: "10.20.2.0/24"    # REQUIRED — pin the MSK CIDR.

  # PHI Zone: agents with full PHI (Rafael, Marina, Beatriz, Valentina, Carolina, Andre).
  # Egress ONLY to BR-resident endpoints.
  phiZone:
    enabled: true
    # Only BR-resident endpoints — model as named allowlist.
    # Empty by default; tenant must explicitly configure approved endpoints.
    # FIX 1: each endpoint MUST carry a concrete BR-resident `cidr`. A missing or
    # 0.0.0.0/0 cidr ABORTS rendering (fail-closed; ADR-0006) — we NEVER permit a PHI
    # agent to egress to the whole internet.
    brResidentEndpoints: []
      # - host: "llm-br.internal.example.com"
      #   port: 443
      #   cidr: "10.20.0.0/24"   # REQUIRED — concrete BR-resident endpoint CIDR.

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------
observability:
  otel:
    endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
    protocol: grpc

  # OTel Collector in-cluster sidecar/daemonset (PROD config).
  # Gated OFF by default. When enabled, renders the collector ConfigMap
  # (configmap-otel-collector.yaml) with insecure:false + SigV4 for AMP.
  # The collector Deployment/DaemonSet is managed externally (e.g. via the
  # opentelemetry-operator Helm chart); this chart only owns the ConfigMap.
  # Required env vars for the collector pod:
  #   PROMETHEUS_REMOTE_WRITE_ENDPOINT — AMP workspace remote-write URL
  #   OTLP_TRACES_ENDPOINT             — AWS X-Ray / ADOT gRPC endpoint
  #   AWS_REGION                       — injected automatically by EKS IRSA
  collector:
    enabled: false
    # IRSA role ARN for the collector ServiceAccount (SigV4 credentials for AMP).
    # Must be set when enabled=true. Provisioned by deploy/terraform/modules/observability/.
    irsaRoleArn: ""
    # AMP remote-write endpoint (injected via ESO or values override)
    ampRemoteWriteEndpoint: ""
    # OTLP traces endpoint (AWS X-Ray ADOT or custom)
    otlpTracesEndpoint: ""

  # Prometheus-operator PodMonitor for agent-runtime + fhir-sync (podmonitor.yaml).
  # Gated OFF by default: a default render emits NO PodMonitor, so clusters without
  # prometheus-operator (no monitoring.coreos.com CRD) stay a no-op. The per-agent
  # and fhir-sync Services also carry prometheus.io/scrape annotations as a
  # non-operator fallback. Flip enabled=true on clusters running the operator.
  podMonitor:
    enabled: false
    # Scrape interval for the generated PodMonitors.
    interval: "30s"
    # Extra labels merged onto each PodMonitor (e.g. the operator's release selector
    # label, commonly `release: kube-prometheus-stack`). Empty by default.
    labels: {}
    # Override the namespaceSelector matchName (defaults to this tenant namespace).
    namespaceSelectorMatchName: ""

# ---------------------------------------------------------------------------
# CIB Seven (governance engine — per-tenant instance)
# ---------------------------------------------------------------------------
cibseven:
  enabled: true
  externalUrl: ""   # set if using an external CIB Seven instance

  # In-cluster CIB Seven (ADR-0021). GATED OFF by default: the default chart points the
  # agent-runtime at the EXTERNAL CIB Seven (unchanged CIBSEVEN_BASE_URL). Flip
  # `enabled: true` to render statefulset-cibseven.yaml (StatefulSet + Service + headless
  # Service) IN-CLUSTER under the same `cibseven` Service name. CIB Seven needs its OWN DB,
  # separate from the agent checkpointer/Aurora — supply `db.url` (or a secret) below; this
  # chart does NOT provision a second Postgres. Running it is OUT OF SCOPE (operator/AWS).
  inCluster:
    enabled: false
    replicaCount: 1
    image:
      repository: "cibseven/cibseven"
      tag: "2.0.0"
      pullPolicy: ""   # defaults to .Values.image.pullPolicy when empty
    # CIB Seven's OWN external database (NOT a second Postgres provisioned by this chart).
    db:
      url: ""                 # e.g. "jdbc:postgresql://cibseven-db.example:5432/cibseven"
      existingSecret: ""      # preferred: secret holding the DB URL (overrides `url`)
      existingSecretKey: "database-url"
    healthPath: "/engine-rest/engine"
    env: {}
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"

# ---------------------------------------------------------------------------
# FHIR (HAPI-FHIR R4 server — holds raw clinical PHI, ADR-0006 PHI zone)
# ---------------------------------------------------------------------------
fhir:
  # In-cluster HAPI-FHIR (ADR-0021). GATED OFF by default: the default chart points the
  # agent-runtime / fhir-sync at the EXTERNAL HAPI-FHIR (unchanged FHIR_BASE_URL). Flip
  # `enabled: true` to render statefulset-hapi-fhir.yaml (StatefulSet + Service + headless
  # Service) IN-CLUSTER under the same `hapi-fhir` Service name. HAPI-FHIR holds raw PHI ->
  # PHI zone. It needs its OWN DB, separate from the agent checkpointer/Aurora — supply
  # `db.url` (or a secret) below; this chart does NOT provision a second Postgres. Running
  # it is OUT OF SCOPE (operator/AWS).
  inCluster:
    enabled: false
    replicaCount: 1
    image:
      repository: "hapiproject/hapi"
      tag: "v7.4.0"
      pullPolicy: ""   # defaults to .Values.image.pullPolicy when empty
    # HAPI-FHIR's OWN external database (NOT a second Postgres provisioned by this chart).
    db:
      url: ""                 # e.g. "jdbc:postgresql://hapi-fhir-db.example:5432/hapi"
      existingSecret: ""      # preferred: secret holding the DB URL (overrides `url`)
      existingSecretKey: "database-url"
    healthPath: "/fhir/metadata"
    env: {}
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"

# ---------------------------------------------------------------------------
# PostgreSQL (Aurora) connection (injected via External Secrets)
# ---------------------------------------------------------------------------
aurora:
  secretName: "aurora-master-credentials"   # ESO-synced secret name in namespace
  # database_url is COMPOSED at ESO sync from the AWS-managed RDS master secret
  # (manage_master_user_password=true) — see templates/externalsecret.yaml (predeploy DB-4).
  # These four are PER-ENV and MUST be sourced from the env-root `terraform output`. They are
  # left empty/defaulted here so a bare render fails CLOSED (required); env overlays carry them.
  masterSecretArn: ""       # terraform output aurora_master_user_secret_arn — rds!cluster-… ARN (REQUIRED)
  endpoint: ""              # terraform output aurora_writer_endpoint — Aurora writer endpoint host (REQUIRED)
  port: 5432                # terraform output aurora_port
  database: "maezo"         # terraform output aurora_database_name

# ---------------------------------------------------------------------------
# SC-05 / R-025+R-026 (OWNER-DECISIONS-REGISTER, APROVADO-APOS-REVISAO-HUMANA): connection
# arithmetic — DERIVADO a partir do que ja esta neste repositorio, NAO MEDIDO contra um cluster
# real. Sem proxy de conexao provisionado ainda (R-026 escolheu RDS Proxy, `enable_rds_proxy =
# false` em `deploy/terraform/modules/aurora-postgres/`), cada processo Python abre seu PROPRIO
# pool `asyncpg` — este bloco e' o teto que nenhum gate detecta hoje sem ele.
#
# GATEKEEPER FINDING F1 (VERIFY-A2-HELM-CAPACITY.md): a revisao anterior derivava o pod count de
# `values.yaml` PURO (bare, sem overlay) mas cruzava esse numero contra o `max_connections` de
# PROD — que roda com o overlay `values-amh.yaml`, nao com o bare file. Este bloco agora declara
# as TRES linhas (bare + as duas overlays reais) e deriva o teto/headroom da linha que o proprio
# ambiente prod usa (`values-amh.yaml`), nunca da bare.
#
# 1) Conexoes por processo (pior caso): ha' EXATAMENTE QUATRO sitios `asyncpg.create_pool` nesta
#    arvore, cada um `min_size=1, max_size=10` (D4-02/R-108, comentario-ancora em cada um):
#      src/maezo/a2a/idempotency.py, src/maezo/a2a/outbox.py,
#      src/maezo/platform/integrations/amh_inbox.py, src/maezo/gateway/audit_postgres.py
#    Nenhum processo abre mais que estes quatro (nao ha' um quinto `create_pool` em `src/`) — o
#    teto POR PROCESSO, no pior caso em que um unico processo alcance os quatro, e'
#      4 pools x max_size 10 = 40 conexoes/processo
#    Isto e' deliberadamente conservador (a maioria dos processos abre um subconjunto, nao os
#    quatro) — o objetivo e' um TETO que nao subestima, nao uma medicao exata de cada pod.
#
# 2) Processos por pod: 1. Nenhum entrypoint desta arvore usa multiplos workers OS (sem
#    `--workers`/gunicorn — `deploy/Dockerfile` roda `python -m maezo.<modulo>` direto; grep
#    `workers=|--workers|gunicorn` em `deploy/` e nos `__main__.py` = 0 hits).
#
# 3) Pods por tenant — TRES linhas, citadas por CHAVE (gatekeeper finding F8: nao por numero de
#    linha, que muda a cada edicao), nenhuma delas incluindo os componentes desligados por padrao
#    (`gateway`, `fhirSync`, `networkChangeBridge`, `consentRevocationBridge`, agentes
#    `gustavo`/`lucas`):
#
#      (a) BARE `values.yaml` (leitura direta das chaves abaixo — este arquivo NAO renderiza
#          standalone: `networkPolicy.generalZone.llmEndpoints[0].cidr` e `aurora.endpoint` ficam
#          deliberadamente vazios ate' um overlay os preencher — entao este numero e' um PISO
#          teorico, nunca o de um tenant real):
#            agents[helena].replicaCount(2) + agents[rafael].replicaCount(2) +
#            agents[marina].replicaCount(2) + workerDaemon.replicaCount(2) +
#            notificationsBridge.replicaCount(1) + webhookReceiver.replicaCount(1) +
#            a2aOutboxRelay.replicaCount(1)                    = 11 pods -> 440 conexoes
#
#      (b) `values-staging.yaml` (RENDERIZADO — `helm template ... -f values-staging.yaml`,
#          somando `spec.replicas` de todo `Deployment` do chart, nao uma soma manual de chaves):
#            8 pods -> 320 conexoes
#
#      (c) `values-amh.yaml` == PROD (RENDERIZADO, mesmo metodo):
#            14 pods -> 560 conexoes
#
#    O ambiente onde o Aurora PROVISIONADO (nao serverless) do item 5 realmente vive e' (c), nao
#    (a) — o teto/headroom abaixo usa (c).
#
# 4) Conexoes TRANSIENTES fora dos 4 pools do item 1 (gatekeeper finding F9) — nenhuma delas usa
#    `asyncpg.create_pool`, entao nao estao no item 3, mas `migrations.enabled`/`lifecycle.enabled`
#    sao `true` por padrao e rodam contra o MESMO cluster:
#      - `migrations` Job (hook pre-install/pre-upgrade, `templates/job-migrations.yaml`): UMA
#        conexao SINCRONA (psycopg via alembic — nao um pool asyncpg) por execucao. Roda ANTES dos
#        pods do release subirem, mas pode coexistir com o release ANTERIOR do mesmo tenant ainda
#        servindo trafego durante um `helm upgrade` — aloca-se +1 de folga transiente por tenant.
#      - as 3 CronJobs de `lifecycle` (`expurgo-working`/`verify-erasure`/`audit-retention`): HOJE
#        abrem ZERO conexoes Postgres — `src/maezo/platform/lifecycle/__init__.py` recusa (exit 78,
#        T2.8) ANTES de qualquer acesso a banco, so' lendo um arquivo de matriz de retencao. A
#        folga transiente delas e' +0 HOJE — revisitar esta linha (e a folga do item 5) no dia em
#        que qualquer uma das tres deixar de ser um stub fail-closed.
#
# 5) Demanda no pior caso, por tenant = conexoes/processo(40) x processos/pod(1) x pods + folga
#    transiente do item 4 (+1, so' migrations):
#      bare      -> 11 pods -> 440   (piso teorico do item 3a, nunca um tenant real)
#      staging   ->  8 pods -> 320 + 1 = 321
#      amh/prod  -> 14 pods -> 560 + 1 = 561
#    Multiplica por N tenants (cada release Helm = 1 tenant contra o MESMO cluster Aurora), usando
#    a linha amh/prod (561 — a que roda contra o Aurora provisionado do item 6):
#      N=1 -> 561   N=2 -> 1122   N=4 -> 2244   N=6 -> 3366   N=7 -> 3927
#
# 6) Lado do Aurora — `aws_rds_cluster_parameter_group.this` / `aws_db_parameter_group.instance`
#    (`deploy/terraform/modules/aurora-postgres/main.tf`) NAO sobrescrevem `max_connections`, entao
#    a formula PADRAO da AWS para a familia `aurora-postgresql16` vale:
#      max_connections = LEAST({DBInstanceClassMemory/9531392}, 5000)
#    PROD (`deploy/terraform/envs/prod-amh-sa-east-1/main.tf`): `serverless = false`,
#    `instance_class = "db.r6g.xlarge"` (32 GiB) -> max_connections ~ 3604.
#      Folga (numero, nao adjetivo), usando a linha amh/prod (561) do item 5: N=1 -> 3043 de
#      folga (~6x o pior caso); teto ultrapassado a partir de N=7 (3927 > 3604); N=6 (3366) ainda
#      cabe, com 238 de margem.
#    STAGING (`deploy/terraform/envs/staging-sa-east-1/main.tf`): `serverless = true`,
#    `serverless_max_acu = 4.0` — o `max_connections` da Serverless v2 ESCALA com a capacidade
#    (ACU) ALOCADA NO MOMENTO, nao e' um numero fixo derivavel do Terraform; leia
#    `SHOW max_connections;` contra o cluster staging vivo em vez de assumir um valor daqui.
#
# Cruzamento com R-026: RDS Proxy foi escolhido como caminho a partir do SEGUNDO tenant real —
# bem ANTES do teto calculado acima em qualquer um dos dois ambientes; e' margem de seguranca
# deliberada, nao um remedio de ultima hora.

# ---------------------------------------------------------------------------
# Migrations Job — Helm hook pre-install/pre-upgrade. Roda `alembic upgrade head`
# contra o schema-por-tenant ANTES dos runtimes subirem (cria audit_chain, agent_memory,
# a2a_idempotency, indice de retencao). Ver templates/job-migrations.yaml.
# Pre-requisito: o secret Aurora (ESO-synced) deve existir antes do helm upgrade.
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  # backoffLimit cobre atrasos transitorios de sincronizacao do ESO (secret Aurora).
  backoffLimit: 6
  activeDeadlineSeconds: 600
  # DB-7: teto (segundos) do initContainer `await-db-secret`, que ESPERA o secret Aurora
  # (ESO-synced) aparecer ANTES do container de migracao mmontar via secretKeyRef. Poll de
  # volume OPCIONAL (nunca secretKeyRef) => pod chega a Running e espera, em vez de
  # CreateContainerConfigError. No deploy two-phase (cd.yml / runbook §3) o secret ja existe e
  # isto passa no 1o poll; folga confortavel dentro de activeDeadlineSeconds (600s).
  secretWaitSeconds: 300
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Lifecycle CronJobs — expurgo / retencao PHI-LGPD (ADR-0002 §4, ADR-0007).
# Cada job roda `python -m maezo.platform.lifecycle <command>` contra o Postgres do tenant.
# ---------------------------------------------------------------------------
lifecycle:
  enabled: true
  # R-040/SC-07 (WP-GOVERNANCA-DPO, decidido 2026-09-04, OWNER-DECISIONS-REGISTER): os 3 CronJobs
  # abaixo falham POR DESENHO hoje (fail-closed T2.8/T2.9 — nenhum dos tres esta implementado, ver
  # src/maezo/platform/lifecycle/__init__.py). templates/cronjob-lifecycle.yaml grava este valor
  # como anotacao `maezo.io/expected-fail-until` no jobTemplate de cada Job, e
  # deploy/observability/alert-rules.yml exclui `MaezoLifecycleJobFailed` para jobs que carregam
  # essa anotacao — sem ela, o scrape de kube-state-metrics (ALERTS-WITHOUT-METRICS-b / R-056)
  # converte 3 falhas por desenho em alarme diario.
  #
  # CONDICAO DO OPERADOR (leia antes de contar com a exclusao): ela SO existe se o kube-state-metrics
  # do cluster estiver rodando com `--metric-annotations-allowlist=jobs=[maezo.io/expected-fail-until]`.
  # Esse exporter NAO e' deste chart nem deste repositorio (ver o comentario do job
  # `kube-state-metrics` em deploy/observability/prometheus.yml) — sem essa flag a serie
  # `kube_job_annotations{annotation_maezo_io_expected_fail_until=~".+"}` nunca materializa, o
  # `unless` do alerta nao casa nada e `MaezoLifecycleJobFailed` PAGINA nas 3 falhas por desenho
  # assim mesmo. E fail-open honesto (nunca um buraco fail-closed silencioso), mas e' fail-open:
  # anotar aqui NAO fecha a exposicao sozinho, so' a torna fechavel pelo operador.
  #
  # NUNCA gravar o literal "AF-07" aqui — a data e
  # o teto rastreado, a mesma que spec/policies/autonomy/action-approvals.yaml:151 ja torna
  # merge-bloqueante. scripts/ci/check_lifecycle_expected_fail_expiry.py reprova a build a partir
  # do dia seguinte a esta data (fail-closed, sem renovacao silenciosa) — quem sair do vermelho
  # remove a anotacao (AF-07 fechou, os jobs agora sao reais e DEVEM paginar) ou renova a data em
  # PR de dados revisado.
  expectedFailUntil: "2026-11-11"
  # Teto de execucao por job (segundos) — bounded para nunca travar um Job.
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  jobs:
    # gap #3 — sweep TTL da camada working (threads/checkpoints vencidos). Diario, madrugada.
    - name: expurgo-working
      command: "expurgo-working"
      schedule: "0 3 * * *"
