# Default values for maezo-tenant.
# Override with values-amh.yaml (or per-tenant values file).

# ---------------------------------------------------------------------------
# Tenant identity
# ---------------------------------------------------------------------------
tenant:
  id: "default"
  name: "Default Tenant"

# ---------------------------------------------------------------------------
# Namespace
# ---------------------------------------------------------------------------
namespace:
  name: "maezo-default"
  create: true
  labels:
    app.kubernetes.io/part-of: maezo
    maezo.io/tenant: "default"

# ---------------------------------------------------------------------------
# Global image settings
# ---------------------------------------------------------------------------
image:
  repository: "123456789012.dkr.ecr.sa-east-1.amazonaws.com/maezo-agent"
  tag: "latest"
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# ServiceAccount (IRSA) — shared SA used by gateway / fhir-sync / webhook + ESO.
# Per-AGENT ServiceAccounts (with their own IRSA roles) are derived from the
# `agents` list below — see serviceaccount.yaml.
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: "maezo-agent"
  annotations: {}
    # eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/maezo-agent-irsa-TENANT"

# ---------------------------------------------------------------------------
# Agent defaults — fallback resources for any agent that omits `resources`.
# ---------------------------------------------------------------------------
agentDefaults:
  # R-023 / SC-02: declaredCeilingPerReplica NAO DERIVADO — `agent-runtime` (T1.6/Q-6) e' hoje um
  # scaffold health-only (grafo LangGraph so' executa quando `MAEZO_AGENT_INGRESS_ENABLED=1` E o
  # agente declara `ingress:`); nenhum Semaphore/pool de concorrencia de turno existe em
  # `src/maezo/runtime/agent_runtime/` (grep confirmado). Sem knob do qual derivar um teto por
  # replica honestamente. `null`. Fallback de TODO agente que nao sobrescrever `capacity` na sua
  # entrada em `agents:` abaixo — mesmo padrao de fallback que `resources` ja usa.
  capacity:
    declaredCeilingPerReplica: null
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ---------------------------------------------------------------------------
# Agents — the PER-AGENT runtime factory (ADR-0004 / ADR-0006).
#
# Each entry renders: a Deployment (with a `maezo.io/phi-zone: "true|false"` pod
# label), a per-agent ServiceAccount (+ IRSA role), a per-agent NetworkPolicy
# (PHI-zone agents get egress RESTRICTED to BR endpoints + gateway; general-zone
# agents get the pseudonymized cloud-LLM path), and a ConfigMap carrying the
# EFFECTIVE merged Agent Definition.
#
# Fields per agent:
#   name             agent id (matches src/maezo/agents/<name>/agent.yaml)
#   enabled          render this agent's resources (false = ready-to-enable stub)
#   securityZone     "general" | "phi"  (ADR-0006 — drives the NetworkPolicy)
#   replicaCount     Deployment replicas (default 2 if omitted)
#   resources        container resources (default `agentDefaults.resources`)
#   irsaRoleArn      IAM role for this agent's ServiceAccount (per-agent identity)
#   env              extra env vars (map)
#   definitionHash   ADR-0007 effective-definition hash (set by provision_tenant.py)
#   effectiveDefinition  merged L0+overlay agent.yaml as a string (set by the script)
#
# This default list is the platform-wide baseline; tenant overlays (values-<tenant>.yaml)
# override per-agent zone/replicas/resources/irsa and inject effectiveDefinition.
#
# T1.6 (defect B1 — CrashLoop hazard the T1.1 verifier re-flagged): every entry below with
# `enabled: true` renders a Deployment whose command (`python -m maezo.runtime.agent_runtime`,
# deployment-agent-runtime.yaml:71) used to point at a module that did not exist —
# `src/maezo/runtime/agent_runtime/` is now a real, health-first scaffold (design
# docs/design/T1.1-runtime-spine.md §10/§17 Q-6): /healthz|/readyz|/metrics, no LangGraph
# execution yet (T1.11). The pods below no longer CrashLoop.
# ---------------------------------------------------------------------------
agents:
  - name: helena
    enabled: true
    securityZone: general
    replicaCount: 2
    irsaRoleArn: ""
    env: {}
  - name: rafael
    enabled: true
    securityZone: phi
    replicaCount: 2
    irsaRoleArn: ""
    env: {}
  - name: marina
    enabled: true
    securityZone: phi
    replicaCount: 2
    irsaRoleArn: ""
    env: {}
  # gustavo / lucas land in a concurrent wave (Wave B). Ready-to-enable stubs:
  # flip enabled=true (and add their effectiveDefinition via provision_tenant.py)
  # once their agent.yaml is merged.
  - name: gustavo
    enabled: false
    securityZone: general
    replicaCount: 2
    irsaRoleArn: ""
    env: {}
  - name: lucas
    enabled: false
    securityZone: general
    replicaCount: 2
    irsaRoleArn: ""
    env: {}

# ---------------------------------------------------------------------------
# Tool Gateway (PEP + pseudonymizer + audit)
# ---------------------------------------------------------------------------
# T1.6 (defect B1, gateway-deployment-crashloop-no-main / DB-1): `src/maezo/gateway/__main__.py`
# now exists — `deployment-gateway.yaml`'s `command: ["python", "-m", "maezo.gateway"]` is a real,
# runnable module (health-only: /healthz, /readyz, /metrics; /readyz reflects
# `maezo.gateway.pep.build_pep()` — fail-closed policy load). The CrashLoop hazard this comment
# used to document is closed.
#
# STILL disabled by default, though — NOT because it would crash, but because there is still no
# standalone HTTP business surface: the PEP / pseudonymizer / audit gateway is an IN-PROCESS
# library imported by the general-zone runtimes (agent-runtime, worker-daemon) per ADR-0006 (see
# docs/runbooks/gateway.md's deployment-model note); `src/maezo/gateway/` has zero FastAPI routes
# today. Its metrics (maezo_gateway_*, runtime/metrics.py) are emitted in-process by those runtime
# pods and scraped from their /metrics endpoints — so the gateway.json dashboard and
# MaezoPEPDenySpike / MaezoAuditLagHigh alerts keep their data source with or without this pod.
# Flip `enabled: true` if this pod earns an operational purpose (e.g. a policy-freshness canary
# independent of agent pods) or the library gains a real HTTP business surface — both would arrive
# as a deliberate follow-up, not a default flip.
gateway:
  enabled: false
  replicaCount: 2
  # R-023 / SC-02: declaredCeilingPerReplica NAO DERIVADO — `src/maezo/gateway/` tem ZERO rotas
  # HTTP de negocio hoje (so' /healthz, /readyz, /metrics, ver o comentario acima); nao ha' knob
  # de concorrencia de request (sem Semaphore, sem `--workers`/gunicorn no Dockerfile) do qual
  # derivar um teto. `null` em vez de um numero inventado.
  capacity:
    declaredCeilingPerReplica: null
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  service:
    type: ClusterIP
    port: 8000

# ---------------------------------------------------------------------------
# Webhook Receiver (WhatsApp Cloud API inbound)
# ---------------------------------------------------------------------------
# T1.6 (defect B1): this was already `enabled: true` with `command: ["python", "-m",
# "maezo.platform.webhooks"]` pointing at a module that did not exist at all —
# `src/maezo/platform/webhooks/` is now real: Meta GET-verification handshake + real HMAC-SHA256
# POST signature verification (`whatsapp/security.py`); message queuing (Kafka publish) is
# deliberately NOT wired — a signature-verified POST returns 501 (no downstream consumer yet,
# Helena's intake graph is T1.11). See `src/maezo/platform/webhooks/whatsapp/app.py`'s module
# docstring for the full capability-honesty note.
webhookReceiver:
  enabled: true
  replicaCount: 1
  # R-023 / SC-02: declaredCeilingPerReplica NAO DERIVADO — nenhum Semaphore/pool de concorrencia
  # de request existe em `src/maezo/platform/webhooks/` (grep confirmado), e o Dockerfile roda
  # `python -m maezo.<modulo>` direto (sem `--workers`/gunicorn). Concorrencia estruturalmente
  # ilimitada pelo event loop asyncio; sem teto para derivar honestamente. `null`.
  capacity:
    declaredCeilingPerReplica: null
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  service:
    type: ClusterIP
    port: 8080

# ---------------------------------------------------------------------------
# WhatsApp Cloud API — non-secret configuration (WHATSAPP-ENV-PREFIX-b / R-061,
# OWNER-DECISIONS-REGISTER, APROVADO-APOS-REVISAO-HUMANA)
#
# `phoneNumberId` is the WABA sender number's Graph id — NOT a secret (see
# `src/maezo/tools/mcp_whatsapp/server.py::WhatsAppSettings.phone_number_id`'s own comment), so
# it lives here as a plain per-tenant value instead of a key in `maezo-whatsapp-config` (the
# ExternalSecret that carries the three real credentials: token/app-secret/verify-token).
# `send_message` (`server.py`, achado 9.4) fails closed with a `ValueError` when this is empty —
# `scripts/ci/check_chart_env_reconciliation.py`'s `chart_required` marker on the field makes an
# unset value here a CI-time RED, not a production surprise. Leave empty per-tenant until the
# WABA number is provisioned for that tenant; the credentials in `maezo-whatsapp-config`
# (`D6-04`) remain BLOCKED independently of this value.
# ---------------------------------------------------------------------------
whatsapp:
  phoneNumberId: ""

# ---------------------------------------------------------------------------
# FHIR Sync (HAPI FHIR R4 ↔ Tasy integration)
# ---------------------------------------------------------------------------
# DEFAULT FLIPPED TO false (t5-deploy-hygiene, crash-loop footgun): `deployment-fhir-sync.yaml`'s
# `command: ["python", "-m", "maezo.platform.integrations.fhir_sync"]` targets a module that does
# NOT exist in src/ — `src/maezo/platform/integrations/` only holds `notifications_bridge.py` (+
# `__init__.py`); there is no `fhir_sync` package/module anywhere in this repo (grep-confirmed,
# zero Python references to `maezo.platform.integrations.fhir_sync` outside this Helm chart's
# command array and the runbook prose). Every fhir-sync pod would crash-loop immediately on start
# (`ModuleNotFoundError`) — same class of bug as the already-fixed gateway crash-loop above (DB-1).
# Also contract-gated: fhir-sync's Tasy Oracle DSN secret has no real value yet
# (docs/Tarefas_Pendentes.md §1.1, gap #33 — "acordo Tasy" pending), so even a working module
# couldn't reach Tasy in production today. Flip `enabled: true` only once BOTH land: (1) the
# `maezo.platform.integrations.fhir_sync` consumer module is actually built (see
# docs/runbooks/fhir-sync.md for the intended shape) and (2) the Tasy Oracle credentials are
# populated in the secret vault (gap #33). Do NOT flip this back to true as a quick fix.
fhirSync:
  enabled: false
  replicaCount: 1
  # R-023 / SC-02: declaredCeilingPerReplica NAO DERIVADO — `maezo.platform.integrations.fhir_sync`
  # NAO EXISTE em `src/` (comentario acima); nao ha' codigo do qual derivar um teto. `null`.
  capacity:
    declaredCeilingPerReplica: null
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Scraper-only metrics/health Service (ClusterIP) — see service-fhir-sync.yaml.
  # PHI guardrail (ADR-0006): this Service is scrape-only; it opens no egress and
  # does NOT relax the NetworkPolicy.
  service:
    type: ClusterIP
    port: 8000

# ---------------------------------------------------------------------------
# Ingress (public edge) — ALB via aws-load-balancer-controller (DL-0018).
#
# Gated OFF by default: a default render emits NO Ingress. ALB/ACM/Route53
# provisioning is out of scope — flip `enabled: true` and set certificateArn +
# host per environment to opt in. Fronts the webhook-receiver (general zone,
# ADR-0006); set consoleHost to also expose the console. NEVER front a PHI-zone
# service from the public edge.
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  # IngressClass that maps to the aws-load-balancer-controller (ALB).
  className: "alb"
  # Public hostname for the webhook-receiver edge (external-dns Route53 record).
  host: ""
  # ACM certificate ARN for ALB TLS termination (REQUIRED when enabled).
  certificateArn: ""
  # Optional second host for the console UI. Leave empty to skip the console rule.
  consoleHost: ""
  # Service port the console listens on (used only when consoleHost is set).
  consolePort: 80
  # Extra ALB / external-dns annotations merged onto the Ingress (optional).
  annotations: {}

# ---------------------------------------------------------------------------
# Worker daemon (W-R2 / R7) — external-task worker harness (CIB Seven fetch-and-lock)
#
# Supervisiona o loop fetch-and-lock do WorkerHarness e publica eventos/notificacoes de
# dominio no Kafka. WORKER_ID vem do metadata.name do pod (Downward API) — distinto por
# replica (dono do lock de external task). lockDurationMs >= pior latencia de handler.
# ---------------------------------------------------------------------------
workerDaemon:
  enabled: true
  replicaCount: 2
  # lock_duration >= pior latencia de handler (auth_analyze/RafaelGraph e lento). 30s e folgado.
  lockDurationMs: 30000
  pollIntervalMs: 5000
  # Nome do secret (em namespace) com a chave `cibseven-auth-token` (BLOQUEADO/seam — vazio = sem auth).
  cibsevenAuthTokenSecret: ""
  # R-023 / SC-02 (OWNER-DECISIONS-REGISTER, APROVADO-APOS-REVISAO-HUMANA, resposta_sugerida
  # verbatim: "declarar os tetos estruturais deriváveis hoje e carimbar explicitamente como NÃO
  # MEDIDO o que só carga real responde"). NENHUM HPA/autoscaling e construido por esta chave —
  # documentation-as-data ate o primeiro volume real (SC-04-a/ADR).
  #
  # declaredCeilingPerReplica DERIVADO do unico knob de concorrencia real deste daemon:
  # `WorkerRuntimeSettings.max_tasks_per_poll` (default 10, env `WORKER_MAX_TASKS_PER_POLL`,
  # `src/maezo/runtime/worker_runtime/settings.py:73`) — o numero de external tasks que
  # `fetch_and_lock` pode manter LOCKED simultaneamente numa unica replica (harness.py:672-677,
  # 1251, 1383-1386). O proprio repo ja usa este numero como teto derivado (nao adivinhado) em
  # `src/maezo/gateway/rate_limit.py:76-78`: "10 tasks / 5 s per replica". O chart NAO sobrescreve
  # este env var hoje (nao ha' `WORKER_MAX_TASKS_PER_POLL` em deployment-worker-daemon.yaml), entao
  # o default do codigo e' o teto vigente.
  capacity:
    declaredCeilingPerReplica: 10
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---------------------------------------------------------------------------
# Notifications bridge (W-R2 / R8) — Kafka -> process-start
#
# Consome `operadora.notifications.internal` e inicia SP-OP-RECURSO-001 / SP-OP-ANS-SUBMIT-001
# via mcp-cibseven.start_process (idempotente). Principal de SERVICO `notifications-bridge`
# (allowlist minima: so start_process). NAO sobe app de health (liveness por processo).
#
# `replicaCount: 1` e' SINGLETON POR DESENHO, nao esquecimento (SC-04-b / R-024,
# OWNER-DECISIONS-REGISTER, resposta_sugerida verbatim: "registrar replicaCount: 1 como
# singleton por desenho ate SC-04-a, no comentario e numa chave explicita do values"). A chave
# `singletonByDesignUntil` abaixo e' essa declaracao formal.
#
# ATUALIZACAO DE FATO (o codigo mudou depois que R-024 foi decidido): SC-04-a JA ATERRISSOU em
# main — `events_kafka_producer.py` recusa `publish()` sem chave de particao por entidade a
# menos que o chamador declare `unordered=True` (:73-81) e `notifications_bridge.py` tem DLQ
# real (`BRIDGE_DLQ_REASONS`, :64-76,167-259) — os DOIS bloqueios TECNICOS que motivaram o `1`
# original ja NAO existem mais. O que falta para subir `replicaCount` deixou de ser codigo: e'
# OPERACIONAL — confirmar que o topico `operadora.notifications.internal` foi de fato criado com
# mais de uma particao no broker de producao (o default do registry, `topic_registry.py:75`, e'
# uma DECLARACAO do repo, nao um fato do broker medido) — ver docs/review-queue.md, secao "SC-04
# — escala do notifications-bridge". So' remova a chave abaixo (e suba o numero) quando essa
# confirmacao operacional entrar.
# ---------------------------------------------------------------------------
notificationsBridge:
  enabled: true
  replicaCount: 1
  # SC-04-b / R-024: singleton por desenho ate a confirmacao operacional de particionamento
  # descrita no comentario acima (docs/review-queue.md, secao SC-04). Ver
  # tests/unit/deploy/test_notifications_bridge_singleton.py — GATEKEEPER FINDING F2
  # (VERIFY-A2-HELM-CAPACITY.md): falha se `Deployment/notifications-bridge` renderizar com
  # replicas > 1 (via `helm template`, para CADA overlay real — `values-staging.yaml` e
  # `values-amh.yaml`) enquanto esta chave existir; a leitura direta deste arquivo sozinho NAO
  # basta, porque um overlay pode sobrescrever `replicaCount` sem tocar esta linha.
  singletonByDesignUntil: "SC-04-a"
  # R-023 / SC-02: declaredCeilingPerReplica DERIVADO do proprio loop de consumo —
  # `run_consumer_loop` (src/maezo/platform/integrations/notifications_bridge.py:892-946) e'
  # `async for message in consumer:` seguido de `await consumer.commit()` ANTES da proxima
  # iteracao: NENHUM batching, NENHUM `asyncio.gather` — exatamente UMA mensagem em voo por vez
  # por replica. measurementStatus continua NAO_MEDIDO (teto estrutural, nunca validado contra
  # carga real).
  capacity:
    declaredCeilingPerReplica: 1
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Network-change bridge (GAP-XPROC-2) — Kafka -> process-start
#
# Consome `agents.events.cred.network_changed` (fato de rede de SP-OP-CRED-001) e INICIA
# SP-OP-ADEQUACAO-001 via mcp-cibseven.start_process (idempotente; correlacao
# tenant_id+regiao_saude+especialidade). Sibling do notifications-bridge, mas com principal de
# SERVICO PROPRIO (`serviceAccount.name` abaixo — allowlist minima: so start_process). NAO sobe
# app de health (liveness por processo).
#
# NETBRIDGE-SERVICE-PRINCIPAL-IDENTITY / R-198 (OWNER-DECISIONS-REGISTER, APROVADO-APOS-REVISAO-
# HUMANA, decisor dono(arquitetura)+seguranca, resposta_sugerida verbatim: "A — principals
# DISTINTOS por ponte, que e' o menor privilegio e o que torna a trilha de auditoria atribuivel"):
# esta ponte usava, ate esta decisao, a MESMA ServiceAccount do notifications-bridge
# (`maezo-tenant.serviceAccountName`) — duas pontes com poderes de start de processo apareceriam
# na trilha de auditoria sob uma UNICA identidade. Agora tem a sua PROPRIA ServiceAccount
# (`maezo-network-change-bridge`, ver serviceaccount.yaml), gated pelo mesmo `enabled` deste
# bloco. `automountServiceAccountToken: false` e' preservado (deployment-bridge-netchange.yaml
# nao monta token — a identidade e' so' para o IRSA role-arn de allowlist, nunca para chamar a
# API do Kubernetes).
#
# DEFAULT FLIPPED TO false (AF-01 / R-001, mesmo padrao que `fhirSync` ja adota acima):
# `deployment-bridge-netchange.yaml`'s `command: ["python", "-m",
# "maezo.platform.integrations.network_change_bridge"]` aponta para um modulo que NAO existe em
# src/ — `ls src/maezo/platform/integrations/` so tem `notifications_bridge.py` (+
# `events_kafka_producer.py`, `amh_inbox.py`, `partition_key.py`, `__init__.py`). Todo pod desta
# ponte entraria em CrashLoopBackOff imediato (`ModuleNotFoundError`) — mesma classe de defeito do
# fhir-sync acima (DB-1/t5-deploy-hygiene). `scripts/ci/check_helm_entrypoints.py` (Makefile target
# `check-helm-entrypoints`, job `validate-helm` em ci.yml) agora falha fechado se este flag voltar
# a `true` sem o modulo existir — NAO reverta so' este valor sem construir
# `maezo.platform.integrations.network_change_bridge` primeiro (isso e' a opcao D do memorando
# M-01, recusada; ver OWNER-DECISIONS-REGISTER R-001).
# ---------------------------------------------------------------------------
networkChangeBridge:
  enabled: false
  replicaCount: 1
  # R-198: principal de servico PROPRIO desta ponte (distinto do notifications-bridge).
  serviceAccount:
    create: true
    name: "maezo-network-change-bridge"
    annotations: {}
      # eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/maezo-network-change-bridge-irsa-TENANT"
  # R-023 / SC-02: declaredCeilingPerReplica NAO DERIVADO — `maezo.platform.integrations
  # .network_change_bridge` NAO EXISTE em `src/` ainda (AF-01/R-001, comentario acima); nao ha'
  # codigo real do qual derivar um teto de concorrencia. `null` em vez de um numero inventado.
  # Quando o modulo for construido como sibling do notifications-bridge (mesmo loop
  # consume-process-commit serial), o teto esperado e' 1 — mas isso e' PROJECAO de design, nao
  # fato de codigo, entao nao entra aqui como numero.
  capacity:
    declaredCeilingPerReplica: null
    measurementStatus: "NAO_MEDIDO"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# Consent-revocation bridge (GAP-PROG-4) — Kafka -> BPMN message correlation
#
# Consome `agents.events.lgpd_dsr.completed` (fato de SP-OP-LGPD-DSR-001) e CORRELACIONA
# `msg.programa.consent_revoked` em SP-OP-PROGRAMA-001 via mcp-cibseven.correlate_message
# (correlation_keys tenant_id+beneficiario_pseudo_id, all_matching=True — fan-out a TODAS as
