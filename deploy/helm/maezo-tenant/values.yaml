#
# DEFAULT FLIPPED TO false (AF-01 / R-001, mesmo padrao que `fhirSync` ja adota acima):
# `deployment-bridge-consent-revocation.yaml`'s `command: ["python", "-m",
# "maezo.platform.integrations.consent_revocation_bridge"]` aponta para um modulo que NAO existe em
