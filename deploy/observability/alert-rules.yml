# Alert rules for Maezo Operadora (ADR-0010, ADR-0014)
#
# Shared between dev (Prometheus rule_files) and prod (AMP Rules API via Terraform).
# ADR-0014: same YAML, different destination — no bifurcation.
#
# Categories:
#   1. SLA breach — agent/worker latency or error rate exceeds thresholds
#   2. Crash-loop — frequent worker/agent restarts
#   3. Dead-letter — unprocessed messages accumulating in DLQ
#
# `runbook_url` (D12-01-b / R-007): every `alert:` rule below carries one, pointing at the
# SPECIFIC docs/runbooks/alerts/<AlertName>.md that covers it (never a generic index). Fenced by
# `scripts/ci/check_alert_runbook_urls.py` (`make check-alert-runbook-urls`) — a new rule without
# one, or one whose path does not resolve in the repo, fails CI. Burn-rate/multi-window SLO
# rewrites are OUT of this scope (R-007: "deixando burn-rate para depois de D12-01-a").

groups:
  # ---------------------------------------------------------------------------
  # SLA Breach Alerts
  # ---------------------------------------------------------------------------
  - name: maezo_sla
    rules:
      # Worker latency SLA: p95 > 5s for 5 minutes
      - alert: MaezoSLAWorkerLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(maezo_worker_execution_time_seconds_bucket[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
          category: sla
          component: workers
        annotations:
          summary: "Worker execution latency P95 exceeds 5s (SLA breach)"
          description: >
            Worker {{ $labels.worker }} on topic {{ $labels.topic }}
            has P95 latency of {{ $value }}s over the last 5 minutes.
            SLA threshold: 5s. Investigate upstream dependency or resource contention.
          runbook_url: "docs/runbooks/alerts/MaezoSLAWorkerLatencyHigh.md"

      # Agent error rate SLA: > 1% error rate sustained for 5 minutes
      #
      # ALERT-COUNTER-LABELS (R-063): `maezo_agent_errors_total`/`maezo_tool_calls_total` now
      # carry `labelnames=["agent","error_type"]` (metrics.py) — widened from label-free in the
      # SAME PR that wires them (ALERTS-WITHOUT-METRICS-a is already CLOSED on main, so the
      # "same PR" clause is moot; this is that follow-up PR). `sum by (agent)` on BOTH sides of
      # the division below is what keeps the binary operation's vector matching valid despite the
      # mismatched `error_type` label between numerator and denominator (`tool_calls` always
      # carries the `error_type="nao_aplicavel"` sentinel — see metrics.py) — `by (agent)`
      # aggregates it away on both sides instead of requiring the label sets to be identical.
      - alert: MaezoSLAAgentErrorRateHigh
        expr: |
          (
            sum by (agent) (rate(maezo_agent_errors_total[5m]))
            /
            sum by (agent) (rate(maezo_tool_calls_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          category: sla
          component: agents
        annotations:
          summary: "Agent error rate exceeds 1% (SLA breach)"
          description: >
            Agent {{ $labels.agent }} error rate is {{ $value | humanizePercentage }}
            over the last 5 minutes. SLA threshold: 1%.
            Check agent logs and LLM provider health.
          runbook_url: "docs/runbooks/alerts/MaezoSLAAgentErrorRateHigh.md"

      # Worker error rate SLA: > 5% error rate sustained for 5 minutes
      - alert: MaezoSLAWorkerErrorRateHigh
        expr: |
          (
            rate(maezo_worker_error_count_total[5m])
            /
            rate(maezo_worker_execution_time_seconds_count[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          category: sla
          component: workers
        annotations:
          summary: "Worker error rate exceeds 5% (SLA breach)"
          description: >
            Worker {{ $labels.worker }} on topic {{ $labels.topic }}
            has error rate of {{ $value | humanizePercentage }} over last 5m.
            Error type: {{ $labels.error_type }}. Check worker logs.
          runbook_url: "docs/runbooks/alerts/MaezoSLAWorkerErrorRateHigh.md"

  # ---------------------------------------------------------------------------
  # Crash-Loop Alerts
  # ---------------------------------------------------------------------------
  - name: maezo_crash_loop
    rules:
      # Worker crash-loop: > 3 restarts in 5 minutes
      - alert: MaezoWorkerCrashLoop
        expr: |
          rate(maezo_worker_error_count_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          category: crash_loop
          component: workers
        annotations:
          summary: "Worker crash-loop detected: {{ $labels.worker }}"
          description: >
            Worker {{ $labels.worker }} on topic {{ $labels.topic }}
            is experiencing sustained error rate of {{ $value }} errors/s
            (error type: {{ $labels.error_type }}).
            This may indicate a crash-loop. Check worker health and recent deployments.
          runbook_url: "docs/runbooks/alerts/MaezoWorkerCrashLoop.md"

      # Agent restart loop: errors > 0 within 1 minute, sustained for 2 minutes
      #
      # ALERT-COUNTER-LABELS (R-063): `sum by (agent)` names WHICH agent is crash-looping instead
      # of collapsing all 10 agents into one series — see the note on MaezoSLAAgentErrorRateHigh.
      - alert: MaezoAgentCrashLoop
        expr: |
          sum by (agent) (rate(maezo_agent_errors_total[1m])) > 0
        for: 2m
        labels:
          severity: critical
          category: crash_loop
          component: agents
        annotations:
          summary: "Agent crash-loop detected: {{ $labels.agent }}"
          description: >
            Agent {{ $labels.agent }} errors detected at rate {{ $value }}/s sustained for 2 minutes.
            Possible crash-loop or persistent upstream failure.
            Check agent health endpoint and restart policy.
          runbook_url: "docs/runbooks/alerts/MaezoAgentCrashLoop.md"

  # ---------------------------------------------------------------------------
  # Dead-Letter Queue Alerts
  # ---------------------------------------------------------------------------
  - name: maezo_dead_letter
    rules:
      # Dead-letter backlog: messages in DLQ > 0 for 10 minutes
      #
      # ALERTS-WITHOUT-METRICS-b / R-056 (2026-09-04, Bold-Decision Review v2 CEO): the dev/CI
      # Kafka broker already exists (docker-compose.yml service `kafka`, profile `core`) — this
      # decision instruments a Kafka Exporter (danielqsj/kafka_exporter, NO JMX) against it rather
      # than waiting on production MSK. `maezo_dead_letter_queue_size` (read below) is now a REAL
      # series in dev/CI, DERIVED by the `maezo_dead_letter_derived` recording-rule group further
      # down this file from the exporter's `kafka_topic_partition_current_offset`, labelled
      # `environment="dev"` (scrape-time label, prometheus.yml job `kafka-exporter`) — it is no
      # longer a synthetic/undefined series, but it is also NOT yet a production fact: see the
      # HONESTY LIMIT comment on that recording rule for exactly what the derived number does and
      # does not mean. REOPENING TRIGGER: revalidar contra o broker de produção (MSK) quando
      # existir — the derived rule and this alert must be re-checked against the real exporter
      # target the day G4 (Terraform apply, `TF-ALERT-RULES-EXT`/staging plan) stops being
      # external-blocked. DLQ-EXPORTER-GAUGE (R-069) is a scope precision of this same decision
      # (OWNER-DECISIONS-REGISTER pergunta 56, memo M-28) — it opens no work item of its own.
      - alert: MaezoDeadLetterBacklog
        expr: |
          maezo_dead_letter_queue_size > 0
        for: 10m
        labels:
          severity: warning
          category: dead_letter
          component: messaging
        annotations:
          summary: "Dead-letter queue backlog detected"
          description: >
            Dead-letter queue has {{ $value }} unprocessed messages
            for more than 10 minutes.
            Investigate message payloads and consumer health.
            Topics affected may need manual replay or purge.
          runbook_url: "docs/runbooks/alerts/MaezoDeadLetterBacklog.md"

      # Dead-letter growth rate: > 5 messages/sec inflow, sustained for 5m.
      # See MaezoDeadLetterBacklog above (R-056) for `maezo_dead_letter_queue_size`'s derivation
      # and honesty limit. This alert deliberately does NOT read that series: reads
      # `maezo_dead_letter_inflow_rate` instead (defined in the `maezo_dead_letter_derived` group
      # below), which sums a per-PARTITION `rate()` rather than taking `rate()` of the
      # already-summed gauge — see that recording rule's own HONEST CAVEAT for why the ordering
      # matters and what this reading does and does not mean (a growth proxy, never an
      # instantaneous backlog count).
      - alert: MaezoDeadLetterGrowth
        expr: |
          maezo_dead_letter_inflow_rate > 5
        for: 5m
        labels:
          severity: critical
          category: dead_letter
          component: messaging
        annotations:
          summary: "Dead-letter queue growing rapidly"
          description: >
            Dead-letter queue is growing at {{ $value }}/s.
            This indicates a systemic consumer failure.
            Pause producer if necessary and investigate root cause immediately.
          runbook_url: "docs/runbooks/alerts/MaezoDeadLetterGrowth.md"

  # ---------------------------------------------------------------------------
  # Derived series (ALERTS-WITHOUT-METRICS-b / R-056) — dev/CI DLQ backlog proxy
  # ---------------------------------------------------------------------------
  - name: maezo_dead_letter_derived
    rules:
      # `maezo_dead_letter_queue_size` (read by `MaezoDeadLetterBacklog` above) has no direct
      # application emitter — depth is a broker-side fact, `src/` only ever sees the records it
      # itself produces (see the DLQ-emitter comment in src/maezo/runtime/metrics.py). This
      # recording rule derives a REAL dev/CI series for it from the Kafka Exporter's
      # `kafka_topic_partition_current_offset` (job `kafka-exporter`, prometheus.yml; exporter
      # service in docker-compose.yml, profile `observability`, pointed at the dev/CI broker
      # already running in profile `core`) — summed across partitions, for every dead-letter
      # topic (`{base}.dlq`, the one sanctioned suffix: maezo.platform.topic_registry.DLQ_SUFFIX).
      #
      # HONESTY LIMIT (the R-056 reopening trigger, spelled out because a recording rule hides the
      # derivation from anyone reading only the alert): `current_offset` is a MONOTONIC total —
      # Kafka never decrements it on read, and nothing in this stack consumes/acks DLQ topics — it
      # is NOT a true "current unprocessed count". `MaezoDeadLetterBacklog`'s `> 0` reads this as a
      # COARSE proxy only: it fires on the first message ever routed to any DLQ topic in this
      # broker's lifetime and does not clear on its own (no replay/purge tooling resets a
      # partition's offset). A true backlog reading needs either a consumer-group lag metric
      # against a DLQ-draining consumer group (none exists — nothing drains a DLQ automatically,
      # by design) or the production MSK/JMX exporter series this rule stands in for.
      # `environment="dev"` is a scrape-time label the `kafka-exporter` job attaches
      # (prometheus.yml) — carried through unchanged by `sum by`, so this series can never be
      # mistaken for a production reading in Grafana/alert routing. `MaezoDeadLetterGrowth`
      # deliberately does NOT read this raw-offset series — see `maezo_dead_letter_inflow_rate`
      # below for why, and for that series' own honest caveat.
      - record: maezo_dead_letter_queue_size
        expr: |
          sum by (topic, environment) (
            kafka_topic_partition_current_offset{topic=~".*\\.dlq"}
          )

      # maezo_dead_letter_inflow_rate — `MaezoDeadLetterGrowth`'s series, kept SEPARATE from
      # `maezo_dead_letter_queue_size` above on purpose. A naive derivation would have
      # `MaezoDeadLetterGrowth` apply `rate()` to the already-`sum`-med gauge above
      # (`rate(sum(counter))`) — the ordering Prometheus's own instrumentation guidance forbids
      # ("always take `rate()` before aggregating"). A single partition's counter resetting
      # (exporter restart, partition reassignment, a topic recreate) makes the SUMMED series drop;
      # `rate()` applied afterward reads that drop as a counter reset on the whole series and
      # extrapolates a spurious spike, which can trip a threshold alert that nothing produced. This
      # rule takes `rate()` PER PARTITION first (each partition's own counter resets are handled
      # correctly and independently by `rate()`'s own reset-detection), and only THEN sums —
      # `sum by (...) (rate(...))`, not `rate(sum by (...) (...))`.
      #
      # HONEST CAVEAT: this is a real per-second inflow rate for messages routed to the DLQ topic
      # — but it is a proxy for GROWTH, never an instantaneous backlog reading (that remains
      # `maezo_dead_letter_queue_size` above, a coarse proxy per its own HONESTY LIMIT). A burst
      # that arrives and immediately stops still reads a nonzero rate for up to the `[5m]` window
      # after it ends; conversely a slow, steady trickle below the alert threshold produces no
      # signal here even while genuinely never draining (that is `MaezoDeadLetterBacklog`'s job).
      - record: maezo_dead_letter_inflow_rate
        expr: |
          sum by (topic, environment) (
            rate(kafka_topic_partition_current_offset{topic=~".*\\.dlq"}[5m])
          )

  # ---------------------------------------------------------------------------
  # Lifecycle CronJob Alerts (T2.9 — closes the gap self-documented at
  # deploy/helm/maezo-tenant/values.yaml `lifecycle.jobs` comment block)
  # ---------------------------------------------------------------------------
  - name: maezo_lifecycle
    rules:
      # Lifecycle Job failure: expurgo-working / verify-erasure / audit-retention
      # (deploy/helm/maezo-tenant/templates/cronjob-lifecycle.yaml) ALL currently
      # refuse and exit 78 by design (T2.8 fail-closed stub) — that non-zero exit is
      # already visible via `kubectl get jobs`/failedJobsHistory, but had no active
      # Prometheus alert. This rule makes it loud in the same alerting path as every
      # other Maezo alert.
      # Note: uses the standard kube-state-metrics `kube_job_status_failed` metric. A
      # `kube-state-metrics` scrape job now exists in prometheus.yml (ALERTS-WITHOUT-METRICS-b /
      # R-056) for tenant clusters that run kube-prometheus-stack (kube-state-metrics ships WITH
      # the operator there — same "cluster-provided" assumption podmonitor.yaml already makes,
      # docs/runbooks/devops-stack.md). Dev docker-compose has no Kubernetes API, so that job has
      # no reachable target locally (shows `down` in Prometheus's targets page — expected, not a
      # defect, and does not affect any other job); this rule has no series to evaluate there. It
      # does not fire falsely, it simply has nothing to alert on yet in dev — same "not yet wired,
      # not faked" posture as the DLQ rule above, now scoped to "not wireable outside a real
      # cluster" rather than "no scrape job configured anywhere".
      #
      # R-040/SC-07 (owner-decision, 2026-09-04): all 3 jobs fail BY DESIGN today (see the
      # description below) — without an exclusion, the kube-state-metrics scrape this rule now
      # depends on (R-056) would convert 3 by-design failures into a daily page, which is the
      # exact alarm-normalisation defect D12-01-b's own justification cites. The `unless` clause
      # excludes jobs carrying `maezo.io/expected-fail-until`
      # (deploy/helm/maezo-tenant/templates/cronjob-lifecycle.yaml,
      # values.yaml:lifecycle.expectedFailUntil, default 2026-11-11) via kube-state-metrics'
      # annotation-derived series — see the required `--metric-annotations-allowlist` flag in
      # prometheus.yml's kube-state-metrics job comment; without it this `unless` matches nothing
      # and the alert fires anyway (fail-open, never a silent fail-closed hole). The exclusion does
      # NOT itself expire in PromQL (a string annotation carries no date arithmetic here) —
      # `scripts/ci/check_lifecycle_expected_fail_expiry.py` is the mechanism that fails the build
      # the day `expectedFailUntil` passes, forcing a human to either drop the annotation (the job
      # is now real and SHOULD page) or renew the date in a reviewed PR. SEM RENOVACAO SILENCIOSA.
      - alert: MaezoLifecycleJobFailed
        expr: |
          kube_job_status_failed{job_name=~"lifecycle-.*"} > 0
          unless on (job_name) (
            kube_job_annotations{annotation_maezo_io_expected_fail_until=~".+"}
          )
        for: 5m
        labels:
          severity: warning
          category: lifecycle
          component: lifecycle
        annotations:
          summary: "Lifecycle CronJob failed: {{ $labels.job_name }}"
          description: >
            Kubernetes Job {{ $labels.job_name }} (a lifecycle-* CronJob —
            expurgo-working/verify-erasure/audit-retention) reported a failed
            status. Every lifecycle subcommand is an intentional fail-closed
            refusal today (exit 78, T2.8/T2.9) — this confirms the failure is
            visible beyond `kubectl get jobs`. Check pod logs for the precise
            blocker (ADR-0020/ADR-0029 for audit-retention; the DPO
            legal-bases/retention matrix, plus the thread_id->fhir_patient_id
            mapping gap for verify-erasure, for the other two). If you are
            seeing this page, either the `maezo.io/expected-fail-until`
            annotation is missing/expired (R-040/SC-07 — check
            values.yaml:lifecycle.expectedFailUntil) or a job that was
            expected to succeed genuinely failed; either way this is a real
            signal, not noise.
          runbook_url: "docs/runbooks/alerts/MaezoLifecycleJobFailed.md"
