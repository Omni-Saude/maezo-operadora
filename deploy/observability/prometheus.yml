# Prometheus scrape configuration for Maezo Operadora (ADR-0010, ADR-0014)
#
# Dev local: Prometheus in docker-compose scrapes the app metrics endpoint.
# Staging/Prod: Same config logic; remote-write to AMP via OTel Collector.
#
# Rules: alert-rules.yml loaded via rule_files.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert rules file (shared between dev and prod; ADR-0014)
rule_files:
  - "alert-rules.yml"

# Scrape configurations
scrape_configs:
  # Maezo application metrics (Prometheus client library endpoint)
  - job_name: "maezo-app"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "maezo-app:8000"
        labels:
          service: "maezo-operadora"
          component: "app"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):\\d+"
        replacement: "${1}"

  # Maezo workers metrics endpoint
  - job_name: "maezo-workers"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "maezo-workers:8001"
        labels:
          service: "maezo-operadora"
          component: "workers"

  # OTel Collector self-metrics (collector process/pipeline internals)
  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "otel-collector:8888"
        labels:
          service: "maezo-operadora"
          component: "otel-collector"

  # OTel Collector `prometheus` exporter (T0.4) — metrics forwarded through the
  # collector's OTLP metrics pipeline (deploy/observability/otel-collector.yaml),
  # distinct from the self-telemetry scraped above on 8888.
  - job_name: "otel-collector-metrics"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "otel-collector:8889"
        labels:
          service: "maezo-operadora"
          component: "otel-collector-forwarded"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"

  # Kafka Exporter (ALERTS-WITHOUT-METRICS-b / R-056) — danielqsj/kafka_exporter, NO JMX. Scrapes
  # the dev/CI broker (docker-compose.yml service `kafka`, profile `core`) via the Kafka protocol
  # directly and exposes `kafka_topic_partition_current_offset` (among others), which the
  # `maezo_dead_letter_derived` recording rule group in alert-rules.yml turns into
  # `maezo_dead_letter_queue_size`. `environment: dev` on this job is the label that keeps the
  # derived series honestly scoped: it is a real dev/CI series, never a production reading (see
  # that recording rule's HONESTY LIMIT comment). Service defined in docker-compose.yml, profile
  # `observability` (depends on `kafka`, profile `core` — the two profiles run together per this
  # repo's documented `docker compose --profile core --profile observability up -d` usage).
  - job_name: "kafka-exporter"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "kafka-exporter:9308"
        labels:
          service: "maezo-operadora"
          component: "kafka-exporter"
          environment: "dev"

  # kube-state-metrics (ALERTS-WITHOUT-METRICS-b / R-056) — feeds `MaezoLifecycleJobFailed`'s
  # `kube_job_status_failed` (alert-rules.yml). Standard in-cluster service DNS: tenant clusters
  # that run kube-prometheus-stack ship kube-state-metrics WITH the operator (same
  # "cluster-provided" assumption deploy/helm/maezo-tenant/templates/podmonitor.yaml already makes
  # for prometheus-operator itself — see docs/runbooks/devops-stack.md). Dev docker-compose has no
  # Kubernetes API server, so THIS TARGET IS UNREACHABLE IN DEV BY DESIGN — the job will show
  # `down` in Prometheus's targets page; that is expected (no k8s here to scrape), not a defect,
  # and it does not affect any other scrape job. `MaezoLifecycleJobFailed` documents the same
  # "not yet wired, not faked" posture at its own rule comment.
  - job_name: "kube-state-metrics"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "kube-state-metrics.kube-system.svc.cluster.local:8080"
        labels:
          service: "maezo-operadora"
          component: "kube-state-metrics"
