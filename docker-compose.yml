# Stack de desenvolvimento local — espelha a instancia-por-tenant de producao (K8s)
#
# Profiles:
#   core         — postgres, cibseven, hapi-fhir, kafka  (default dev stack)
#   observability — otel-collector, prometheus, grafana
#   app          — gateway, agent-runtime, worker-runtime, webhook-receiver (T1.6, defect B1):
#                  the four `python -m maezo.*` entrypoints Helm's Deployments run, built from
#                  the SAME `deploy/Dockerfile` and differing only by `command:` — exactly how
#                  the chart shares one image across components. Requires `core` (CIB Seven +
#                  Kafka + Postgres) up first.
#
# T0.4 (defect B14): the 'simulator' profile (tasy-simulator service) was removed —
# deploy/tasy_simulator.Dockerfile never existed and there is no simulator source
# under src/ (ADR-0013 describes it as a planned permanent CI deliverable, not yet
# built; see .github/workflows/ci.yml job `fhir-sync-simulator`, disabled `if: false`
# with the same rationale). The Tasy boundary gets an explicit interface + labeled
# mock in T2.6 — reintroduce this profile then.
#
# Usage:
#   make dev-stack                          # core only
#   docker compose --profile observability up -d
#   docker compose --profile core --profile observability up -d
#   docker compose --profile core --profile app up -d --build   # + the 4 app daemons

services:
  # ---------------------------------------------------------------------------
  # Core profile
  # ---------------------------------------------------------------------------
  postgres:
    # DU-01-b (decisao do dono R-005, 2026-09-04): a imagem era `pgvector/pgvector:pg16`. pgvector
    # deixou de ser dependencia da plataforma — `0009_drop_pgvector` remove a coluna
    # `agent_memory.embedding` e a extensao `vector`, e nao ha nenhum indice/consumidor vetorial no
    # repositorio. Mesmo major (16), imagem oficial. `0001_schema_agents` foi tornada tolerante a
    # ausencia da extensao no mesmo PR — sem isso o primeiro passo de `alembic upgrade head` morre
    # aqui com `extension "vector" is not available`.
    image: postgres:16
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${MAEZO_PG_USER:-maezo}
      POSTGRES_PASSWORD: ${MAEZO_PG_PASSWORD:-maezo}
      POSTGRES_DB: ${MAEZO_PG_DB:-maezo}
    # Host port override (default 5433): avoids clobbering other local Postgres instances that
    # publish 0.0.0.0:5432 (e.g. intensicare-postgres, a sibling project on this host). Internal
    # container-to-container traffic (cibseven/hapi-fhir DB_URL below) always uses 5432 — unaffected.
    # CI pins MAEZO_PG_HOST_PORT=5432 explicitly (see ci.yml `integration` job) so the runner keeps
    # its pre-existing port, matching the unchanged localhost:5432 test defaults in tests/integration/.
    ports: ["${MAEZO_PG_HOST_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maezo -d maezo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cibseven:
    image: cibseven/cibseven:2.1.0   # governanca (2.1.3 sem imagem publicada — DL-0006): BPMN compliance, User Tasks HITL, DMN
    profiles: ["core"]
    ports: ["8080:8080"]
    environment:
      DB_DRIVER: org.postgresql.Driver   # obrigatorio: sem ele o engine tenta H2 e o webapp nao sobe
      DB_URL: jdbc:postgresql://postgres:5432/maezo
      DB_USERNAME: maezo
      DB_PASSWORD: maezo
      WAIT_FOR: postgres:5432
      WAIT_FOR_TIMEOUT: "60"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    profiles: ["core"]
    ports: ["8081:8080"]
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/maezo
      spring.datasource.username: maezo
      spring.datasource.password: maezo
      # Sem driver/dialect explicitos o starter assume H2 e quebra no boot
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # hapiproject/hapi:v7.4.0 é distroless (sem /bin/sh) — CMD-SHELL não funciona.
      # Usamos java -version como healthcheck mínimo (valida que a JVM está viva).
      # A disponibilidade HTTP é monitorada pelo otel-collector (profile observability).
      test: ["CMD", "java", "-version"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    profiles: ["core"]
    ports:
      - "9092:9092"     # EXTERNAL — host access (localhost:9092); used by host-side integration tests
      - "29092:29092"   # INTERNAL — cross-container (kafka:29092); reserved for future Tasy CDC
                        # consumers (ADR-0013: fhir-sync, tasy-simulator) — not yet implemented,
                        # see T2.6. Dual-listener setup kept regardless (see rationale below).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Dual-listener setup (root cause fix for CI run 27511267203 hang):
      #   EXTERNAL (9092):  advertised as localhost:9092  — host machine / port-forwarded access
      #   INTERNAL (29092): advertised as kafka:29092     — Docker-network container-to-container
      # Without INTERNAL, broker metadata told all clients "connect to localhost:9092". A
      # future tasy-simulator container receiving that address would try 127.0.0.1:9092 (its
      # own loopback), and AIOKafkaProducer.start() would retry indefinitely — this is what
      # caused the 50-minute hang in CI run 27511267203. Kept even after the tasy-simulator
      # service was removed (T0.4) so this class of bug can't resurface when it's rebuilt.
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: maezo-dev-cluster-01
      # KAFKA-NUM-PARTITIONS-COMPOSE (gap fix): unset here, cp-kafka's own default
      # (`num.partitions=1`) governs EVERY auto-created topic — the only kind this stack ever
      # produces (no production code in this repo calls the Admin API's `create_topics`; only
      # test-only readiness helpers do, and only inside their own suites). On 1 partition,
      # key-based partition assignment and per-key ordering defects are structurally invisible:
      # any producer — keyed or not — lands every message on the same lone partition, so a
      # keyless-publish regression or a broken key-derivation chain (GAP-SC-04-a,
      # `partition_key.py`) cannot be observed. `.github/workflows/ci.yml:490` starts this SAME
      # service (`docker compose --profile core up -d postgres kafka cibseven`) with no override,
      # so CI's auto-created topics inherit whatever this stanza sets too. 3 matches the
      # platform's own declared per-topic default (`maezo.platform.topic_registry.
      # TopicEntry.partitions`, ~:89) — the partition count the ordering/DLQ/ESCALA-key
      # guarantees actually have to hold under in production. Affects auto-created topics ONLY:
      # a topic already created (by an explicit Admin `create_topics(NewTopic(...))` call, e.g.
      # this repo's own test readiness helpers) keeps whatever count it was created with —
      # this setting never resizes an existing topic. No `KAFKA_DEFAULT_REPLICATION_FACTOR` or
      # `KAFKA_TRANSACTION_STATE_LOG_*` pin is added alongside this: Kafka's own built-in
      # `default.replication.factor` is already 1 (fine for this single-node broker), and this
      # codebase has no transactional/idempotent producer (`enable_idempotence`/
      # `transactional_id` are unused — grepped clean), so `__transaction_state` is never
      # created and its replication/min-isr settings would be dead config — proven by a cold
      # start with only this one variable added (see docs/evidence-ledger.md,
      # KAFKA-NUM-PARTITIONS-COMPOSE row).
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # Healthcheck runs inside the kafka container — uses INTERNAL listener (kafka:29092)
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ---------------------------------------------------------------------------
  # App profile (T1.6, defect B1) — the four `python -m maezo.*` entrypoints Helm's
  # Deployments run. All four build from the SAME image (deploy/Dockerfile) and differ only
  # by `command:` — exactly how the chart shares `image.repository`/`tag` across gateway,
  # agent-runtime, worker-runtime, webhook-receiver. `image:` is pinned to the same tag on all
  # four so `docker compose build` builds it once (layer cache) and reuses it.
  # ---------------------------------------------------------------------------
  gateway:
    image: maezo-app:dev
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "maezo.gateway"]
    environment:
      TENANT_ID: amh
      GATEWAY_PORT: "8000"
    ports: ["8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/healthz',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-runtime:
    image: maezo-app:dev
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "maezo.runtime.agent_runtime"]
    environment:
      TENANT_ID: amh
      AGENT_ID: helena
      AGENT_SECURITY_ZONE: general
      AGENT_RUNTIME_MODE: local
      # Mirrors deployment-agent-runtime.yaml's per-agent ConfigMap mount (:82-83,160-168) —
      # same env var, same target path, so compose exercises the identical code path as K8s
      # (rather than the spec/agents/ fallback, which the wheel's packaging doesn't ship —
      # see pyproject.toml's force-include note).
      AGENT_DEFINITION_PATH: /etc/maezo/agent/effective-agent-definition.yaml
      CIBSEVEN_BASE_URL: http://cibseven:8080/engine-rest
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_PORT: "8000"
    volumes:
      - ./spec/agents/helena/agent.yaml:/etc/maezo/agent/effective-agent-definition.yaml:ro
    ports: ["8010:8000"]
    depends_on:
      cibseven:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/healthz',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-runtime:
    image: maezo-app:dev
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "maezo.runtime.worker_runtime"]
    environment:
      TENANT_ID: amh
      WORKER_ID: maezo-worker-local
      CIBSEVEN_BASE_URL: http://cibseven:8080/engine-rest
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_PORT: "8000"
      # Found live-booting `--profile app` (2026-08-12): without DATABASE_URL the durable
      # audit sink cannot be built, the harness fails closed and registers ZERO workers —
      # the K8s deployment gets this var from the Aurora ExternalSecret
      # (deployment-worker-daemon.yaml), but compose never injected it. Requires the
      # tenant migrations applied to the compose Postgres (alembic -x tenant=amh).
      DATABASE_URL: postgresql+asyncpg://${MAEZO_PG_USER:-maezo}:${MAEZO_PG_PASSWORD:-maezo}@postgres:5432/${MAEZO_PG_DB:-maezo}
      AGENT_RUNTIME_MODE: local
    ports: ["8020:8000"]
    depends_on:
      cibseven:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8000/healthz',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  webhook-receiver:
    image: maezo-app:dev
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "maezo.platform.webhooks"]
    environment:
      TENANT_ID: amh
      # Dev-only dummy values — required (fail-closed, no default; see
      # src/maezo/platform/webhooks/whatsapp/settings.py). NEVER real secrets in git.
      WHATSAPP_APP_SECRET: dev-app-secret-not-for-prod
      WHATSAPP_VERIFY_TOKEN: dev-verify-token-not-for-prod
      # T1.11: Helena's in-process dispatch (DMN evaluation + starting SP-OP-ESCALATION-001)
      # needs the engine — same var/value as worker-runtime/agent-runtime above.
      CIBSEVEN_BASE_URL: http://cibseven:8080/engine-rest
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      HEALTH_PORT: "8080"
      # Same live-boot finding as worker-runtime (2026-08-12): Helena's dispatcher
      # requires DATABASE_URL (fail-closed — /webhook degrades to 501 without it); the
      # Helm chart injects it from the Aurora ExternalSecret (deployment-webhook-
      # receiver.yaml:66-70) but compose never did.
      DATABASE_URL: postgresql+asyncpg://${MAEZO_PG_USER:-maezo}:${MAEZO_PG_PASSWORD:-maezo}@postgres:5432/${MAEZO_PG_DB:-maezo}
      AGENT_RUNTIME_MODE: local
    # Host 8030 (not 8080) — cibseven already claims host 8080:8080 in this same compose file;
    # the container's own port stays 8080 (matches Helm's containerPort, deployment-webhook-
    # receiver.yaml:67-69).
    ports: ["8030:8080"]
    depends_on:
      cibseven:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://localhost:8080/healthz',timeout=3).status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Observability profile
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      # T0.4 (defect B14): was ./config/otel-collector.yaml — config/ only ever
      # held a .gitkeep, so this mount never resolved. Real file now lives at
      # deploy/observability/otel-collector.yaml.
      - ./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # collector self-telemetry (see otel-collector.yaml telemetry.metrics)
      - "8889:8889"    # `prometheus` exporter — forwarded OTLP metrics (see otel-collector.yaml)
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      # T0.4 (defect B14): was ./config/prometheus.yml — config/ only ever held a
      # .gitkeep, so this mount never resolved. Real file lives at
      # deploy/observability/prometheus.yml.
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # ADR-0010 gap#32: mount alert rules so they are actually loaded (previously dead config)
      # T0.4: fixed extension mismatch — actual file is alert-rules.yml, not alert-rules.yaml.
      - ./deploy/observability/alert-rules.yml:/etc/prometheus/rules/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: maezo-dev
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON lives in a SIBLING dir (deploy/observability/dashboards/), not
      # nested under grafana-provisioning/ — mount it under the file-provider's `path`
      # (grafana-provisioning/dashboards/dashboards.yaml) as a nested subdirectory so it
      # doesn't shadow dashboards.yaml itself. Keep in sync with that provider's `path`.
      - ./deploy/observability/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Tasy CDC Simulator — REMOVED (T0.4, defect B14).
  #
  # This service previously built from deploy/tasy_simulator.Dockerfile, which
  # never existed in this repo, and there is no simulator source under src/
  # (no src/maezo/platform/integrations/tasy_simulator/ package; confirmed via
  # `git log --all` — the Dockerfile path has zero history, it was never created).
  #
  # ADR-0013 documents the simulator as a planned *permanent* CI deliverable (the
  # "contrato vivo" of the Debezium CDC envelope for Tasy), not a temporary hack —
  # but it has not been built yet. .github/workflows/ci.yml already carries a
  # `fhir-sync-simulator` job with `if: false` and an explicit comment: "o código
  # do simulador Tasy e os eventos CDC ainda não foram implementados... post-M13".
  #
  # Decision: remove the dangling service + profile rather than fabricate a
  # Dockerfile/image for code that doesn't exist. The Tasy integration boundary
  # gets an explicit interface + labeled mock in T2.6; re-add this service (and
  # the 'simulator' profile) then, once src/.../tasy_simulator/ and
  # deploy/tasy_simulator.Dockerfile actually exist.
  # ---------------------------------------------------------------------------

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
