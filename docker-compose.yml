# Stack de desenvolvimento local — espelha a instancia-por-tenant de producao (K8s)
#
# Profiles:
#   core         — postgres, cibseven, hapi-fhir, kafka  (default dev stack)
#   simulator    — stub services for offline/offline dev without external deps
#   observability — otel-collector, prometheus, grafana
#
# Usage:
#   make dev-stack                          # core only
#   docker compose --profile observability up -d
#   docker compose --profile core --profile observability up -d

services:
  # ---------------------------------------------------------------------------
  # Core profile
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["core"]
    environment:
      POSTGRES_USER: maezo
      POSTGRES_PASSWORD: maezo
      POSTGRES_DB: maezo
    # Host port override (default 5433): avoids clobbering other local Postgres instances that
    # publish 0.0.0.0:5432 (e.g. intensicare-postgres, a sibling project on this host). Internal
    # container-to-container traffic (cibseven/hapi-fhir DB_URL below) always uses 5432 — unaffected.
    # CI pins MAEZO_PG_HOST_PORT=5432 explicitly (see ci.yml `integration` job) so the runner keeps
    # its pre-existing port, matching the unchanged localhost:5432 test defaults in tests/integration/.
    ports: ["${MAEZO_PG_HOST_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maezo -d maezo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cibseven:
    image: cibseven/cibseven:2.1.0   # governanca (2.1.3 sem imagem publicada — DL-0006): BPMN compliance, User Tasks HITL, DMN
    profiles: ["core"]
    ports: ["8080:8080"]
    environment:
      DB_DRIVER: org.postgresql.Driver   # obrigatorio: sem ele o engine tenta H2 e o webapp nao sobe
      DB_URL: jdbc:postgresql://postgres:5432/maezo
      DB_USERNAME: maezo
      DB_PASSWORD: maezo
      WAIT_FOR: postgres:5432
      WAIT_FOR_TIMEOUT: "60"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/version || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  hapi-fhir:
    image: hapiproject/hapi:v7.4.0
    profiles: ["core"]
    ports: ["8081:8080"]
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/maezo
      spring.datasource.username: maezo
      spring.datasource.password: maezo
      # Sem driver/dialect explicitos o starter assume H2 e quebra no boot
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/fhir/metadata || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    profiles: ["core", "simulator"]
    ports:
      - "9092:9092"     # EXTERNAL — host access (localhost:9092); used by host-side integration tests
      - "29092:29092"   # INTERNAL — cross-container (kafka:29092); used by tasy-simulator + fhir-sync
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Dual-listener setup (root cause fix for CI run 27511267203 hang):
      #   EXTERNAL (9092):  advertised as localhost:9092  — host machine / port-forwarded access
      #   INTERNAL (29092): advertised as kafka:29092     — Docker-network container-to-container
      # Without INTERNAL, broker metadata told all clients "connect to localhost:9092". The
      # tasy-simulator container received that address, tried 127.0.0.1:9092 (its own loopback),
      # and AIOKafkaProducer.start() retried indefinitely, causing the 50-minute hang.
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: maezo-dev-cluster-01
    healthcheck:
      # Healthcheck runs inside the kafka container — uses INTERNAL listener (kafka:29092)
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ---------------------------------------------------------------------------
  # Observability profile
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # collector metrics
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # ADR-0010 gap#32: mount alert rules so they are actually loaded (previously dead config)
      - ./deploy/observability/alert-rules.yaml:/etc/prometheus/rules/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: maezo-dev
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON lives in a SIBLING dir (deploy/observability/dashboards/), not
      # nested under grafana-provisioning/ — mount it under the file-provider's `path`
      # (grafana-provisioning/dashboards/dashboards.yaml) as a nested subdirectory so it
      # doesn't shadow dashboards.yaml itself. Keep in sync with that provider's `path`.
      - ./deploy/observability/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Tasy CDC Simulator — profile 'simulator' (ADR-0013)
  # Produtor de eventos Debezium sintéticos enquanto acesso Oracle AMH é BLOCKED.
  # Deliverable permanente de CI — não é hack temporário.
  # ---------------------------------------------------------------------------
  tasy-simulator:
    build:
      context: .
      dockerfile: deploy/tasy_simulator.Dockerfile
    profiles: [simulator]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # INTERNAL listener — cross-container Docker network
      TASY_SIM_SEED: "0"
      TASY_SIM_LOOP: "0"   # one-shot em CI; "1" para interativo
    depends_on:
      - kafka
    restart: "no"

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
