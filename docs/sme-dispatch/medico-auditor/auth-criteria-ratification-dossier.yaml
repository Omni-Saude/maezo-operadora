    conteudo_atual: "hitPolicy FIRST, 7 regras (`r01`..`r06` + catch-all `r99`). Entradas `imc` (integer), `imc_acima_35_com_comorbidade`, `imc_acima_40`, `tentativas_previas_tratamento_clinico` (integer), `sem_contraindicacao_cirurgica`, `avaliacao_multidisciplinar_completa`; saidas `dut_atendida` (boolean) e `motivo` (string). Limiares declarados **SINTETICOS**: IMC >= 40 (grau III), IMC >= 35 com comorbidade, >= 1 tentativa previa documentada de tratamento clinico. Nenhuma regra nega: `dut_atendida=false` encaminha ao medico auditor; catch-all `r99` cobre combinacao nao mapeada ou dados ausentes."
    fonte_a_conferir: "Citado pelo repositorio (cabecalho da DMN e `observacao` do manifesto): **DUT ANS de cirurgia bariatrica vigente** (portal ANS) e **Resolucao CFM 2.131/2015** e atualizacoes. **A conferir sem fonte no repositorio:** a definicao exata de comorbidade qualificante (a DMN lista \"DM2, HAS, apneia obstrutiva, dislipidemia\" como DRAFT/verify), a lista completa de contraindicacoes cirurgicas, e o periodo/documentacao exigidos das tentativas previas (o cabecalho menciona \"minimo 2 anos\" mas a tabela conta apenas `>= 1` tentativa) — nenhuma dessas tres definicoes tem lastro em `docs/compliance/`."
    o_que_muda_ao_ratificar: "As 7 regras passam a decidir de fato para procedimentos cujo `dut_ref` resolva `DUT-BARIATRICA-001` (mapeamento declarado no manifesto). Com **dut_rol_coverage tambem ratificada**, `dut_atendida=true` faz o criterio TECNICO PASSAR e `dut_atendida=false` vira `TECNICO_DUT_NAO_ATENDIDA` (analise humana, nunca negativa automatica). Ratificada sozinha, sem `dut_rol_coverage`, **nao muda nada**: o criterio continua `TECNICO_FONTE_NAO_RATIFICADA`."
    papel_indicado_no_manifesto: "medico auditor + cirurgiao bariatrico + juridico/regulatorio"
