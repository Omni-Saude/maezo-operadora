    conteudo_atual: "hitPolicy FIRST, 12 regras (`r01`..`r11` + catch-all `r99`). Entradas `tipo_procedimento` (string: `urgencia_emergencia|parto|eletivo|alta_complexidade|outros`), `dias_desde_adesao` (integer) e `cpt_declarada` (boolean); saidas `carencia_cumprida` (boolean), `prazo_restante_dias` (integer) e `fonte` (string). Prazos declarados **SINTETICOS** pelo proprio cabecalho: urgencia/emergencia **24 horas (1 dia)**, parto **300 dias**, eletivo **180 dias**, CPT para doenca pre-existente **24 meses (730 dias)**. Portabilidade de carencia **nao esta implementada**; a tabela manda encaminhar esses casos ao medico auditor."
    fonte_a_conferir: "Citado pelo repositorio (cabecalho da DMN e `observacao` do manifesto): **Lei 9.656/1998** art. 11, art. 12 II \"a\" e art. 35-C; **RN 195/2009**; **RN 259/2011** (art. 7); **RN 162/2007** (CPT); **RN 465/2021**; **RN 186/2009** para portabilidade (nao implementada). `docs/review-queue.md` acrescenta a advertencia geral de que \"RN 259 pode ter sido consolidada/substituida\". **A conferir sem fonte no repositorio:** o mapeamento de `tipo_procedimento` para prazo (a DMN o marca DRAFT/verify) e o tratamento de portabilidade/migracao de plano."
    o_que_muda_ao_ratificar: "`sources.is_ratified(\"carencia_check\")` passa a `True` e o criterio **REGULATORIO** deixa de sair `false` com `REGULATORIO_FONTE_NAO_RATIFICADA`. **Mas o criterio continua falhando fechado por outro motivo:** as tres entradas (`tipo_procedimento`, `dias_desde_adesao`, `cpt_declarada`) **nao existem no contrato de start de SP-OP-AUTH-001** — sao dado cadastral da fronteira AMH (MZO-050b, bloqueado). O criterio sai `false` com `REGULATORIO_ENTRADA_AUSENTE`, que e um problema de MECANISMO, distinto de `*_FONTE_NAO_RATIFICADA` e deliberadamente nao mascarado por ele. Ratificar esta tabela **nao** abre aprovacao automatica enquanto as entradas nao existirem."
    papel_indicado_no_manifesto: "juridico/regulatorio + medico auditor"
