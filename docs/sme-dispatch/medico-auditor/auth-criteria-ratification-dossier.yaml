# `bloqueio_atual` e CAMPO ESTRUTURADO, RE-VERIFICADO CONTRA O VALOR AO VIVO de
# spec/policies/autonomy/tenants-amh.yaml por
# tests/unit/docs/test_sme_dispatch_dossiers.py::test_the_stated_ceiling_matches_the_live_tenant_policy
# — se o teto ou o status da D-07 mudarem no arquivo fonte sem este campo ser atualizado, o teste
# fica RED. `tipo: criterios_nao_ratificados` significa: o cadeado que resta HOJE e a falta de
# ratificacao das fontes consultadas (`auth.py::_gate_on_ratification`), NAO um teto financeiro
# zerado — o teto de `authorization_approval` ja esta fechado (D-07) e o criterio financeiro ja
# passa sozinho para pedidos precificados ate ele.
bloqueio_atual:
  tipo: criterios_nao_ratificados
  teto_financeiro_brl: 500
  fonte: spec/policies/autonomy/tenants-amh.yaml
  decisao_d07: FECHADA em 25/08/2026 para authorization_approval
