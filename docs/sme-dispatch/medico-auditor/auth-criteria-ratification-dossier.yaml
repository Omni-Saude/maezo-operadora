# Dossie de ratificacao dos criterios de AUTH — INSUMO DE SESSAO.
# Origem: OWNER-DECISIONS-REGISTER R-163 (gap AUTH-CRITERIA-RATIFICACAO-MANIFESTO).
# Gemeo legivel: AUTH-CRITERIA-RATIFICATION-DOSSIER.md. Conferido por
# tests/unit/docs/test_sme_dispatch_dossiers.py, que RE-DERIVA cada sha256 dos bytes em disco.
#
# NENHUM AGENTE PREENCHE `ratificado`, `revisor` OU `ratificado_em` EM
# spec/processes/dmn/auth-criteria-ratification.yaml (CODEOWNED). Enquanto `ratificado: false`,
# os criterios tecnico/regulatorio/contratual avaliam FALSE via `auth.py::_gate_on_ratification`
# — HOJE ESSE E O UNICO CADEADO, e nao dois: `spec/policies/autonomy/tenants-amh.yaml` fixa
# `authorization_approval.max_value_brl = 500` (D-07 FECHADA em 25/08/2026), e
# `auth.py::_criterio_financeiro` ja devolve `ok=True` para pedido precificado ate esse teto.
# Ratificar as fontes consultadas por um criterio libera, sozinho e sem mudanca de codigo, a
# aprovacao automatica desse criterio ate o teto de R$500 (gate conjuntivo:
# `all(sources.is_ratified(k) for k in consulted)`); enquanto qualquer fonte consultada
# permanecer nao ratificada, NADA auto-aprova. Ver `bloqueio_atual` abaixo.
#
# PHI: este dossie nao contem dado de paciente. O conteudo citado e texto de politica.
