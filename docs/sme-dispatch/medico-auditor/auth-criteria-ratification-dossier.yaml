    binding_sha256: "0af3f7ba785b5e197e47222ba21652782a1a1934f7c71df1cf5fa2b257a1a551"
    conteudo_atual: "hitPolicy FIRST, 25 regras (`r01`..`r24` + catch-all `r99`). Entradas `codigo_procedimento_tuss` (string) e `categoria_procedimento` (string); saidas `no_rol` (boolean), `requer_dut` (boolean) e `dut_ref` (string). Todos os codigos TUSS das 24 regras sao declarados **SINTETICOS e representativos** pelo proprio cabecalho da tabela; cada `<description>` de regra comeca com a palavra `SINTETICO`. Invariante L0: a tabela NAO tem saida de negativa — fora do ROL ou com DUT obrigatoria roteia a analise humana."
    fonte_a_conferir: "Citado pelo repositorio (cabecalho da DMN, secao \"Fontes regulatorias (DRAFT/verify)\"): **ROL vigente RN 465/2021 + RN 473/2021 + RN 643/2025**; **DUTs** publicadas no portal ANS; **tabela TUSS** publicada pela ANS (`tabela_tuss_4_01`). O manifesto repete a mesma lista. **Nao ha, no repositorio, copia ou extrato dessas tabelas** — `docs/compliance/` contem `rn-currency-review.md`, `rn-639-primary-source.md`, `lgpd-topic-reconciliation.md`, `ripd-kickoff.md` e `ADR-0020-amendment-draft.md`, nenhum deles com o ROL ou a TUSS. A conferencia codigo-a-codigo dos 24 TUSS e **externa ao repositorio**."
    o_que_muda_ao_ratificar: "`sources.is_ratified(\"dut_rol_coverage\")` passa a `True`. O criterio **TECNICO** deixa de sair `false` com `TECNICO_FONTE_NAO_RATIFICADA` e passa a **usar o veredito real** da tabela: `no_rol=true` -> `TECNICO_FORA_DO_ROL`; `requer_dut=false` -> criterio tecnico PASSA; `requer_dut=true` -> consulta a `dut_criteria_*` mapeada. **Porem o TECNICO so passa quando TODAS as tabelas consultadas estao ratificadas** (`_gate_on_ratification`, `consulted=[dut_rol_coverage] (+ a dut_criteria_* mapeada)`): ratificar esta sozinha libera apenas o caminho `requer_dut=false`. O token de sombra `TECNICO_SOMBRA_*` deixa de ser emitido para os caminhos ja cobertos."
    papel_indicado_no_manifesto: "medico auditor + juridico/regulatorio"
    ratificacao:
      ratificado:
      revisor:
      ratificado_em:
