    binding_sha256: "266f22c00aae35c67493b7c394b0d9d4e36870c359c2d887e2c6359530094113"
    conteudo_atual: "hitPolicy FIRST, **1 unica regra**: o catch-all `r99`, que devolve `criterio_contratual_ok=false` e `motivo=\"SEM_REGRA_RATIFICADA\"`. Entradas `tenant_id` e `categoria_procedimento` (ambas ja existentes no contrato de SP-OP-AUTH-001 — nenhuma variavel foi inventada). **Nenhuma regra contratual, milestone ou KPI foi inventada:** a tabela e o lugar versionado onde essas regras vao aterrissar."
    fonte_a_conferir: "**Sem fonte no repositorio, por construcao.** Nao existe variavel de plano, produto ou termos contratuais em SP-OP-AUTH-001, e os KPIs declarados em `spec/agents/rafael/agent.yaml` (`auto_approval_rate`, `human_routing_precision`, `false_denial_rate`) sao prosa aspiracional sem codigo que os compute. A fonte tem de ser trazida de fora pelo SME contratual (juridico/contratos + financas). Pergunta aberta registrada em `docs/review-queue.md`: os criterios de KPI sao a nivel de prestador, de plano, ou ambos?"
    o_que_muda_ao_ratificar: "**Nada — a ratificacao esta SUPRIMIDA por dados.** A secao `criterios_nao_cobertos` do manifesto declara `rede_credenciada` com `bloqueia_ratificacao_de: auth_criteria_contratual`, e o loader `maezo.tools.workers.auth_criteria` **le essa declaracao e suprime a ratificacao da fonte nomeada**: `is_ratified` devolve `false` por mais completos que estejam os tres campos, o criterio sai `false` com `CONTRATUAL_FONTE_NAO_RATIFICADA` e a supressao e logada em `auth_criteria_ratification_suppressed`. Preencher os tres campos aqui produziria uma ratificacao **inerte e enganosa**. Levantar o bloqueio exige uma fonte de credenciamento de rede legivel por maquina — que nao existe no repositorio — e a remocao da entrada, no mesmo commit CODEOWNED. Esta e exatamente a opcao **B** que a decisao aprovada manteve."
    papel_indicado_no_manifesto: "juridico/contratos + financas + medico auditor (criterios de KPI assistencial)"
    ratificacao:
      ratificado:
      revisor:
      ratificado_em:
