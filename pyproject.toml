[project]
name = "maezo-operadora"
version = "0.2.0"
description = "MAEZO Operadora — plataforma agents-first para operadoras de saude"
requires-python = ">=3.12"
license = { text = "Proprietary" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- Agent runtime (cidadaos de primeira classe desde o commit 1) ---
    "langgraph>=0.4,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "a2a-sdk>=1.0,<2.0",            # Agent2Agent v1.0 (Linux Foundation)
    "mcp>=1.9,<2.0",                # Model Context Protocol (tools)
    # --- HTTP / async ---
    "httpx>=0.27,<1.0",
    "tenacity>=8.2,<10.0",
    # --- Dados / validacao ---
    "pyyaml>=6.0,<7.0",            # parsing de artefatos (policies, agent.yaml, topic_registry, PEP)
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "lxml>=5.0,<7.0",               # T2.6-2: real XSD validation (tools/workers/tiss_schema.py)
    "sqlalchemy>=2.0,<3.0",
    "greenlet>=3.5.3",              # required by sqlalchemy's async engine (platform/migrations/env.py);
                                     # without it `alembic upgrade head` fails immediately for every
                                     # tenant/environment (T1.10 — discovered while verifying migrations
                                     # actually run against a real Postgres for the audit-chain kill-test)
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    # --- Eventos ---
    "aiokafka>=0.11,<1.0",
    # --- API (gateway, webhooks) ---
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    # --- Observabilidade ---
    "structlog>=24.1,<27.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2.0",
    "prometheus-client>=0.20,<1.0",
    # --- Seguranca / LGPD ---
    "cryptography>=48.0.1,<50",
    "greenlet>=3.5.3",
    # --- Inferencia LLM (ADR-0009; single import point: maezo.runtime.inference) ---
    "anthropic>=0.40,<1.0",         # T1.7: real provider behind InferenceProvider
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",        # T4: pytest 9 stack bump (was 8.4.2); paired with pytest-asyncio>=1.4
                                  # below to fix the pytest-asyncio 0.x `Package.obj` AttributeError
                                  # INTERNALERROR at collection (dependabot PR #161 could not land pytest alone)
    "pytest-asyncio>=1.4.0,<2.0", # pytest-asyncio 1.x is the pytest-9-compatible line (declares
                                  # pytest<10,>=8.4); 0.x is incompatible with pytest 9 collection hooks
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
    "types-PyYAML>=6.0,<7.0",     # stubs p/ mypy --strict (pyyaml nao tem tipos inline)
    "testcontainers>=4.0,<5.0",
    "lxml-stubs>=0.5,<1.0",
]

[project.scripts]
# T1.1 runtime spine: local-ergonomics alias for the Helm `command` (which keeps using
# `python -m maezo.runtime.worker_runtime` — deployment-worker-daemon.yaml:50). Both invocations
# must start the identical daemon; `__main__.py` has no import-time side effect, so importing
# `main` here never runs the daemon on its own.
maezo-worker = "maezo.runtime.worker_runtime.__main__:main"
# T1.6 entrypoints (defect B1): same local-ergonomics alias pattern, one per Helm `command` that
# previously pointed at an absent module — `deployment-agent-runtime.yaml:71`
# (`python -m maezo.runtime.agent_runtime`), `deployment-gateway.yaml:34`
# (`python -m maezo.gateway`), `deployment-webhook-receiver.yaml:34`
# (`python -m maezo.platform.webhooks`). Every `__main__.py` here is side-effect-free on import.
maezo-agent = "maezo.runtime.agent_runtime.__main__:main"
maezo-gateway = "maezo.gateway.__main__:main"
maezo-webhook-receiver = "maezo.platform.webhooks.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maezo"]

# ADR-0025 D2 (Rev 1, load-bearing): the autonomy matrix lives in spec/ (single
# source of truth, constraint 5), but the wheel otherwise ships ONLY src/maezo,
# so a packaged deployment would have no matrix file at runtime and the fail-closed
# PEP factory (build_pep) would refuse to start — bricking the deployment. Ship the
# policy YAMLs inside the wheel so the file is present; discovery at runtime is via
# the T0.3 MAEZO_SPEC_DIR mechanism (resolve_spec_dir), which a wheel deployment
# points at the shipped maezo/spec/ tree.
[tool.hatch.build.targets.wheel.force-include]
"spec/policies/autonomy" = "maezo/spec/policies/autonomy"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: exige stack docker-compose (engine real — sem mock de engine, ADR-0011)",
    "eval: avaliacao de qualidade de agente contra golden dataset (gate de CI)",
    "llm_live: real Anthropic API call (T1.7); skipped loudly without MAEZO_ANTHROPIC_API_KEY/ANTHROPIC_API_KEY",
    "chaos: T3.3 seam-level fault-injection / cross-process resilience suite (tests/integration/chaos/); PG-only (no cibseven), runs in the dedicated `chaos` CI job — see docs/design/T3.3-chaos-resilience.md",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
# bpmn.py exhibits a cross-platform / non-deterministic `ruff format` divergence under the
# pinned ruff 0.15.17: the CI runner (manylinux x86_64) intermittently wants to reformat a
# module-level collection literal that macOS arm64 (and other CI runs) consider already
# formatted — same bytes, same ruff version, different verdict. Excluded from the FORMAT
# check only; `ruff check` (lint rules E/F/I/N/W/UP/B/SIM/ASYNC) still fully covers it.
# Revisit when ruff resolves the divergence. See docs/decisions-log.md DL-0011.
exclude = ["src/maezo/platform/validation/bpmn.py"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["maezo"]
mypy_path = "src"
