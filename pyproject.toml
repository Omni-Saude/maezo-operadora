[project]
name = "maezo-operadora"
version = "0.2.0"
description = "MAEZO Operadora — plataforma agents-first para operadoras de saude"
requires-python = ">=3.12"
license = { text = "Proprietary" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # --- Agent runtime (cidadaos de primeira classe desde o commit 1) ---
    "langgraph>=0.4,<2.0",
    "langgraph-checkpoint-postgres>=3.1.1,<4.0",
    "a2a-sdk>=1.0,<2.0",            # Agent2Agent v1.0 (Linux Foundation)
    "mcp>=1.9,<3.0",                # Model Context Protocol (tools)
    # --- HTTP / async ---
    "httpx>=0.27,<1.0",
    "tenacity>=8.2,<10.0",
    # --- Dados / validacao ---
    "pyyaml>=6.0,<7.0",            # parsing de artefatos (policies, agent.yaml, topic_registry, PEP)
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "lxml>=5.0,<7.0",               # T2.6-2: real XSD validation (tools/workers/tiss_schema.py)
    "sqlalchemy>=2.0,<3.0",
    "greenlet>=3.5.3",              # required by sqlalchemy's async engine (platform/migrations/env.py);
                                     # without it `alembic upgrade head` fails immediately for every
                                     # tenant/environment (T1.10 — discovered while verifying migrations
                                     # actually run against a real Postgres for the audit-chain kill-test)
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    # --- Eventos ---
    "aiokafka>=0.11,<1.0",
    # --- API (gateway, webhooks) ---
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    # --- Observabilidade ---
    "structlog>=24.1,<27.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2.0",
    "prometheus-client>=0.20,<1.0",
    # --- Seguranca / LGPD ---
    "cryptography>=50.0.0,<51",
    "greenlet>=3.5.3",
    # --- Inferencia LLM (ADR-0009; single import point: maezo.runtime.inference) ---
    # `[bedrock]` extra (boto3/botocore) powers the SigV4-signed AWS Bedrock provider added in
    # W-BEDROCK (`BedrockInferenceProvider`) — GENERAL ZONE ONLY. The base package still serves
    # `AnthropicInferenceProvider`; the extra only adds the AWS signing stack, no new import point.
    "anthropic[bedrock]>=0.40,<1.0",  # T1.7: real provider behind InferenceProvider
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",        # T4: pytest 9 stack bump (was 8.4.2); paired with pytest-asyncio>=1.4
                                  # below to fix the pytest-asyncio 0.x `Package.obj` AttributeError
                                  # INTERNALERROR at collection (dependabot PR #161 could not land pytest alone)
    "pytest-asyncio>=1.4.0,<2.0", # pytest-asyncio 1.x is the pytest-9-compatible line (declares
                                  # pytest<10,>=8.4); 0.x is incompatible with pytest 9 collection hooks
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
    "types-PyYAML>=6.0,<7.0",     # stubs p/ mypy --strict (pyyaml nao tem tipos inline)
    "testcontainers>=4.0,<5.0",
    "lxml-stubs>=0.5,<1.0",
]

[project.scripts]
# T1.1 runtime spine: local-ergonomics alias for the Helm `command` (which keeps using
# `python -m maezo.runtime.worker_runtime` — deployment-worker-daemon.yaml:50). Both invocations
# must start the identical daemon; `__main__.py` has no import-time side effect, so importing
# `main` here never runs the daemon on its own.
maezo-worker = "maezo.runtime.worker_runtime.__main__:main"
# T1.6 entrypoints (defect B1): same local-ergonomics alias pattern, one per Helm `command` that
# previously pointed at an absent module — `deployment-agent-runtime.yaml:71`
# (`python -m maezo.runtime.agent_runtime`), `deployment-gateway.yaml:34`
# (`python -m maezo.gateway`), `deployment-webhook-receiver.yaml:34`
# (`python -m maezo.platform.webhooks`). Every `__main__.py` here is side-effect-free on import.
maezo-agent = "maezo.runtime.agent_runtime.__main__:main"
maezo-gateway = "maezo.gateway.__main__:main"
maezo-webhook-receiver = "maezo.platform.webhooks.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maezo"]

# ADR-0025 D2 (Rev 1, load-bearing): the autonomy matrix lives in spec/ (single
# source of truth, constraint 5), but the wheel otherwise ships ONLY src/maezo,
# so a packaged deployment would have no matrix file at runtime and the fail-closed
# PEP factory (build_pep) would refuse to start — bricking the deployment. Ship the
# policy YAMLs inside the wheel so the file is present; discovery at runtime is via
# the T0.3 MAEZO_SPEC_DIR mechanism (resolve_spec_dir), which a wheel deployment
# points at the shipped maezo/spec/ tree.
[tool.hatch.build.targets.wheel.force-include]
"spec/policies/autonomy" = "maezo/spec/policies/autonomy"
# ADR-0037 XRD-04 / MZO-050a (same load-bearing shape as the line above): the AMH contract pin is
# the ONE contract artifact this repo may hold, it lives in config/ (outside src/maezo), and
# maezo.adapters.amh.contract reads it at composition time to decide fail-closed whether the
# boundary may run at all. Without this force-include the pin would not reach a container and every
# packaged deployment of the adapter would refuse to start with "pin file not found" — the same
# bricking failure mode the autonomy matrix had. Runtime discovery is
# `resolve_contract_pin_path()`, which checks the repo checkout, then this package-adjacent copy,
# with $MAEZO_AMH_CONTRACT_PIN overriding both.
"config/integrations/amh" = "maezo/config/integrations/amh"
# MZO-060 (ADR-0037 XRD-10), same load-bearing shape as the two lines above: the AMH inbox's DBA
# ratification artifact lives in spec/ and `maezo.platform.integrations.amh_inbox` resolves it at
# construction time to decide fail-closed whether the durable inbox may run at all. Without this
# force-include the artifact would never reach a container, so a packaged deployment could never be
# activated even AFTER a DBA ratifies — the same bricking failure mode the autonomy matrix and the
# contract pin each had. Runtime discovery is `resolve_ratification_path()`, which checks the repo
# checkout, then this package-adjacent copy, with $MAEZO_AMH_INBOX_RATIFICATION overriding both.
"spec/policies/amh" = "maezo/spec/policies/amh"
# TERCEIRA ocorrencia da mesma classe das duas linhas acima, encontrada subindo a
# helena de verdade na AWS em 13/08/2026 (agent-helena, ECS):
#   FileNotFoundError: spec/agents/ directory not found at
#   /app/.venv/lib/python3.12/site-packages/maezo/spec/agents
# `gateway.tool_registry.build_agent_seam_context` chama
# `AgentLoader().load_by_id()` -> `resolve_spec_agents_dir()`, que procura a arvore
# spec/ ADJACENTE AO PACOTE — nao um diretorio arbitrario. Sem esta linha o agente
# sobe, carrega a definicao apontada por AGENT_DEFINITION_PATH e depois falha em
# `effect_seam_capabilities_unavailable`: ele existe, mas sem ferramenta nenhuma.
#
# Colocar as definicoes em outro caminho da imagem NAO resolve (foi minha primeira
# tentativa): quem resolve e' o proprio pacote. E MAEZO_SPEC_DIR nao e' saida —
# produção o RECUSA (Wave-1 Q-6), corretamente.
#
# `spec/processes` entra junto porque e' a MESMA arvore: com ela aqui, o CLI de
# deploy (`maezo.platform.deploy`) resolve os 16 BPMN + 62 DMN sem flag nenhuma, e
# passa a existir UMA fonte de verdade para o plano de politica dentro do wheel —
# que e' exatamente o que o comentario no topo deste bloco descreve.
# O interruptor de zona da narrativa do dossie (DPO + medico auditor). Mesma
# classe das linhas acima: sem force-include o artefato nunca chega ao container e
# a ratificacao seria impossivel de ativar num deploy empacotado.
"spec/policies/phi" = "maezo/spec/policies/phi"
"spec/agents" = "maezo/spec/agents"
"spec/processes" = "maezo/spec/processes"

[tool.uv]
# W9 (Onda 2, supply-chain aging): dependency-age quarantine. `exclude-newer` makes resolution
# refuse any distribution published after this instant, so a freshly-published (or freshly
# compromised) release cannot enter the graph on the day it appears — it must first age past the
# cutoff, during which yanks/advisories/registry takedowns have time to surface. The date is
# advanced deliberately by a human bumping this line, never implicitly by the clock.
exclude-newer = "2026-08-05T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: exige stack docker-compose (engine real — sem mock de engine, ADR-0011)",
    "eval: avaliacao de qualidade de agente contra golden dataset (gate de CI)",
    "llm_live: real Anthropic API call (T1.7); skipped loudly without MAEZO_ANTHROPIC_API_KEY/ANTHROPIC_API_KEY",
    "chaos: T3.3 seam-level fault-injection / cross-process resilience suite (tests/integration/chaos/); PG-only (no cibseven), runs in the dedicated `chaos` CI job — see docs/design/T3.3-chaos-resilience.md",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# O Canal de Teste carrega a pagina inteira (HTML + CSS + JS) numa string r""" — e' um
# servidor de UM arquivo, sem dependencia fora da stdlib, exatamente para poder rodar
# em qualquer container sem instalar nada. As 24 violacoes de E501 sao TODAS linhas do
# template, nao de logica Python.
#
# Quebrar CSS e JS em 110 colunas para agradar o linter deixaria o template pior de ler
# e mais facil de quebrar numa edicao futura. A regra de comprimento e' suprimida SO'
# neste arquivo; todas as outras (F/I/N/W/UP/B/SIM/ASYNC) continuam valendo, e o codigo
# Python dele respeita o limite.
"src/maezo/platform/testchannel/server.py" = ["E501"]

[tool.ruff.format]
# bpmn.py exhibits a cross-platform / non-deterministic `ruff format` divergence under the
# pinned ruff 0.15.17: the CI runner (manylinux x86_64) intermittently wants to reformat a
# module-level collection literal that macOS arm64 (and other CI runs) consider already
# formatted — same bytes, same ruff version, different verdict. Excluded from the FORMAT
# check only; `ruff check` (lint rules E/F/I/N/W/UP/B/SIM/ASYNC) still fully covers it.
# Revisit when ruff resolves the divergence. See docs/decisions-log.md DL-0011.
exclude = ["src/maezo/platform/validation/bpmn.py"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["maezo"]
mypy_path = "src"
