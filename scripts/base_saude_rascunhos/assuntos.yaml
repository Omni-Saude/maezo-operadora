# Fase 5 da Helena (aprovada pelo dono em 18/10/2026, so' dev): os assuntos NOVOS da base de saude, para
# rascunho pelo Claude Sonnet 5.5 (perfil global do Bedrock) a partir de prompt SINTETICO (zero dado de
# beneficiario). De onde saiu a lista: as 100 perguntas do experimento de redacao (#819,
# `scripts/experimentos/redacao_saude/perguntas.yaml`), as 270 conversas sinteticas do repo arquivado
# Maezo-Healthcare-Plan e as categorias comuns na operadora (saude da mulher, cronicas, infeccoes comuns,
# saude mental sem risco, exames, procedimentos, cirurgias, vacinas). Nenhum `sintoma`: sinal de alarme so'
# vem das tabelas `triage_redflag_*` (licao do #818).
#
# Campos: id (nome do arquivo), titulo, grupo (para o relatorio), fonte (a pagina OFICIAL da lista fechada
# que o rascunho resume — conferida que responde; `null` = nenhuma pagina leiga da lista fechada trata do
# assunto: vira REFERENCIA SEM LINK, credito "Texto da operadora."), termos (para recortar o trecho de uma
# pagina geral, ex.: Saude da Mulher), saude_mental (o texto termina com o CVV 188 e a equipe).
#
# Fontes de exame/procedimento/cirurgia: o Rol da ANS (o mesmo apoio dos rascunhos de 17/10/2026); a
# categoria decide (ver `gerar.py`).
az: &az https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z
inca: &inca https://www.gov.br/inca/pt-br/assuntos/cancer/tipos
