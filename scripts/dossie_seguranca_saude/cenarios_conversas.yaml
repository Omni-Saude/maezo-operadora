# Dossie de seguranca da saude da Helena — as conversas SINTETICAS do repo arquivado
# `Omni-Saude/Maezo-Healthcare-Plan` (`tests/evals/golden/helena/conversations.jsonl`, 270 conversas, so'
# leitura), ADAPTADAS a regra atual "informar sem orientar" (ADR-0064/0065): pergunta clinica SEM alarme deve
# ser RESPONDIDA (sem conduta), nao escalada; alarme, crianca/gestante com sinal grave, risco psicossocial,
# pedido de pessoa e manipulacao continuam como antes. Ficaram de fora as 105 que nao sao de saude
# (cobertura, rede, agendamento): elas nao passam pelo redator nem pelos portoes clinicos.
# Os nomes/CPFs sinteticos do arquivo original NAO foram copiados; so' a mensagem e a expectativa.
# Campos: id (cNNN = conv-test-NNN), texto, categoria, esperado (codigos em `dossie.py`), crianca, origem
# (a categoria original).
