  - id: q071
    texto: "o que é uma prótese de quadril"
    categoria: material
    esperado: informar_sem_conduta
    detalhe: "Peca que substitui a articulacao do quadril (artroplastia); indicacao do ortopedista; sem prometer cobertura."

