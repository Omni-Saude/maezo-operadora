  # --- Especialidades --------------------------------------------------------------------------------
  - id: q059
    texto: "o que faz um endocrinologista?"
    categoria: especialidade
    esperado: orientar_caminho
    detalhe: "Hormonios: diabetes, tireoide, obesidade; como marcar pelo plano."
  - id: q060
    texto: "qual medico cuida de varizis?"
    categoria: especialidade
    esperado: orientar_caminho
    detalhe: "Angiologista/cirurgiao vascular; como marcar pelo plano."
    tags: [digitacao]
  - id: q061
    texto: "preciso de qual especialista pra dor no joelho?"
    categoria: especialidade
    esperado: orientar_caminho
    detalhe: "Ortopedista (ou clinico geral primeiro); sinais de alarme (inchaco com febre, trauma forte); como marcar."
  - id: q062
    texto: "o que é um fisiatra"
    categoria: especialidade
