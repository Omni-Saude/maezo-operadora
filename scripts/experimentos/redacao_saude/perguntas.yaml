  # --- Procedimentos, cirurgias, materiais -----------------------------------------------------------
  - id: q065
    texto: "o que é cateterismo"
    categoria: procedimento_cirurgia
    esperado: informar_sem_conduta
    detalhe: "Exame/procedimento com cateter pelas arterias para ver/tratar o coracao."
