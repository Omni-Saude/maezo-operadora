# Agent Template — canonical contract for every Maezo agent
# This file defines the REQUIRED fields for any agent.yaml.
# Concrete agents (helena, rafael, etc.) extend this template.

id: _template
name: "Agent Template"
role: "Template role — base contract for all agents"
phase: 0
autonomy_level: L3
# PLACEHOLDER — substituir na definicao do agente; a chave TEM de existir em
# docs/processes/contracts/<chave>.md E em
# src/maezo/tools/process_allowlist.py::KNOWN_PROCESS_KEYS. Sem as DUAS condicoes,
# `make validate-artifacts` falha (cerca HEL-12 em platform/validation/agent_def.py)
# e o EffectPolicy do gateway nega o start em runtime (fail-closed).
process_keys:
  - SP-OP-<AGENT>-001
tools:
  - mcp-dmn.evaluate
  - mcp-memory.read_write

# Extended fields (optional but recommended for production agents)
reports_to: "gestor.responsavel@amh"
security_zone: general
graph: graph.py:build
prompt_versions:
  system: system-v1
  classify: classify-v1
model:
  task_default: { tier: fast }
  reasoning:    { tier: frontier }
autonomy_policy: ../../policies/autonomy
autonomy_actions:
  - query_decision_engine
  - read_write_memory
kpis:
  - { name: resolution_rate, target: "track" }
escalation:
  # PLACEHOLDER — mesma regra do `process_keys` acima (contrato + KNOWN_PROCESS_KEYS).
  process: SP-OP-<AGENT>-001
  triggers:
    - signal: ambiguity
memory:
  episodic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
  semantic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
a2a:
  capabilities: []
  skills: []
  accepted_task_types: []
  queue_ref: agents.tasks.template
  # DEFAULT do template (CC-02, WP A2A-YAML-DISCLOSURE): nenhum agente novo nasce com
  # delegation.py. Troque para `registrado`/`pronto_sem_registro` (com `handler_symbol:
  # maezo.agents.<id>.delegation::make_<id>_handler`) SO quando o handler inbound existir de
  # verdade — `validate_dir` pula `_template/` por desenho, entao este valor nunca e checado
  # aqui; o agente DERIVADO e' que fica sujeito a `agent_def.py::_validate_a2a_handler_disclosure`.
  handler_status: ausente
