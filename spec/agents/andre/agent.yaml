# Andre Nakamura — Analista de Populacao/Atuarial e Lago de Dados (Phase 3, Wave W-B)
id: andre
name: "Andre Nakamura"
role: "Analista de Populacao/Atuarial e Lago de Dados — enriquece o dossie de aprovacao de SP-OP-PAGTO-001 e instrui analytics populacional/atuarial sobre AGREGADOS (instrui, nao decide)"
reports_to: "atuarial-financas@amh"      # gestor humano = nucleo atuarial/financeiro (decide preco/pagamento)
security_zone: phi                        # Zona PHI (ADR-0006): Andre e o CHOKEPOINT de egresso — le PHI, so emite agregados
graph: graph.py:build
prompt_versions:                          # versionados (ADR-0009) — gate de eval no golden
  system: system-v1
  dossier: dossier-v1                      # dossie atuarial/populacional (instrucao, nao decisao)
model:
  task_default: { tier: fast }            # montagem/roteamento do dossie de risco
  reasoning:    { tier: frontier }        # coortes ambiguas / risco atuarial complexo
tools:                                     # ids EXATOS de MCP servers JA registrados (validate-artifacts exige o dir mcp_<server>)
  - mcp-dmn.evaluate                       # pagto_alcada (classifica faixa) / pagto_sla (DMN decide; ADR-0012)
  - mcp-cibseven.start_process             # somente SP-OP-PAGTO-001 (start idempotente)
  - mcp-memory.read_write                  # memoria episodica do dossie/coorte (ADR-0002)
  - mcp-fhir.read_patient                  # leitura PHI pseudonimizada SO no caminho do dossie de pagamento (enriquece, best-effort)
  # AND-S3 (anotacao, 2026-09-04 — CC-03/AND-03): `mcp-fhir.read_patient` acima NAO e um id de tool
  # registrado num MCP server. `tools/mcp_fhir/server.py::FhirServer` registra DOIS tools apenas
  # (`read_resource`, `search_resources`); o id granular aqui e (a) o nome da CAPACIDADE que o PEP
  # decide (`gateway/effect_classes.py` mapeia a operacao `fhir.read_patient` -> classe
  # `leitura_phi_clinica`, C2) e (b) a chave que `gateway/tool_registry.py::_FHIR_ADAPTER_BY_AGENT`
  # traduz no ADAPTADOR injetado no composition root (`rafael/adapters.py::FhirServerReader`,
  # embrulhado pelo `GatedFhirReader`). Andre NAO fala com o FHIR pelo Tool Gateway por este id: ele
  # recebe o leitor JA CONSTRUIDO e JA GATEADO por INJECAO
  # (`runtime/worker_runtime/service.py` STEP B -> `a2a_composition.build_dossier_delegation_
  # dispatcher(fhir={"andre": ...})` -> `make_andre_handler(..., fhir=...)` -> `graph.build(config)`),
  # exatamente como o `PopulationFeatureClient` da nota de allowlist abaixo. Ate 2026-09-04 essa
  # injecao NAO existia na raiz do dossie e 100% dos dossies caiam no ramo degradado do grafo
  # ("leitor FHIR nao configurado"); a linha declarativa acima ja estava certa, o wiring e que faltava.
  # NENHUMA chave declarada muda com esta anotacao.
  # allowlist TIGHT (ADR-0011 / ownership §7): o mcp-datalake (cliente de populacao/lago) e PORT-PENDING
  # (port WB.4 — ainda nao no repo; validate-artifacts hard-falha em MCP server inexistente). Andre NAO
  # fala com o lago via Tool Gateway: ele reasona sobre AGREGADOS k-anon entregues por um cliente INJETADO
  # (Protocol PopulationFeatureClient em contracts.py — espelha o padrao de Protocol da gateway/custody),
  # nunca por um id mcp aqui. Quando o mcp-datalake cair (WB.4) e um no o exercer, o id + a constante entram.
  # mcp-cibseven.get_process_status / correlate_process_message NAO entram ate um no os usar (allowlist tight).
autonomy_policy: ../../policies/autonomy
autonomy_actions:                          # acoes REAIS da matriz L0-core exercidas por este fluxo
  - query_decision_engine                  # DMN pagto_alcada/pagto_sla (mcp-dmn.evaluate) — L3
  - start_compliance_process               # SP-OP-PAGTO-001 (mcp-cibseven.start_process) — L2
  - read_write_memory                      # memoria episodica (mcp-memory.read_write) — L3
  - read_phi_data                          # leitura FHIR pseudonimizada SO no caminho do dossie (mcp-fhir.read_patient) — L3
  # NOTA L0 HARD (intencional): Andre NAO exerce `high_value_payment` (L1 — a liberacao de pagamento de
  # alto valor NASCE SO na User Task humana `UT_AprovacaoAlcada`/`UT_AprovacaoComite` com tier-match;
  # SP-OP-PAGTO-001 §invariante L1 no-adverse, ADR-0018). Andre NAO decide preco/precificacao
  # (`false_pricing_decision_rate==0`), NAO toma `clinical_decision`, NAO acusa fraude, NAO faz
  # `authorization_denial`. Ele instrui o dossie de risco atuarial/populacional; o aprovador humano de
  # tier adequado decide na User Task. Nenhuma DMN/branch deste fluxo libera/autoriza/paga.
  #
  # NOTA EGRESS (ADR-0006/0019 — Andre e o CHOKEPOINT de egresso PHI): o cliente de populacao/lago e
  # INJETADO (Protocol) e retorna SO agregados k-anon + `dataset_ref` (ponteiros), NUNCA um
  # `fhir_patient_id` resolvivel. O gate de egresso e ESTRUTURAL no TIPO (o retorno do cliente nao
  # tem campo de id de paciente) — mas o tipo nao cobre o CONTEUDO, e por isso `_scrub_aggregate`
  # tambem varre, chave a chave, os NOMES DE CELULA de `metrics`/`suppressed` (rede de forma PHI de
  # `tools/workers/phi_vars.looks_like_phi_text`) e exige valor numerico finito em cada celula.
  # Qualquer falha bloqueia o agregado INTEIRO (fail-closed) -> `phi_egress_risk` -> humano.
  # KPI: `phi_egress_violations==0`.
  #
  # PISO DE K-ANONIMATO (AND-02): parametro OPCIONAL de build `config["min_k_anonymity"]`, lido por
  # `graph.py:build` e validado (int >= 1) em tempo de build. DEFAULT = 1, que preserva EXATAMENTE o
  # comportamento anterior (uma coorte de UM individuo passa) — nao e' endosso. ADR-0019 exige "um
  # piso de k-anonimato (k minimo por celula)" sem fixar o valor; escolher o valor de producao
  # (k=5) e a allowlist FECHADA de features e' decisao do DONO em ADR-P-003 (`docs/adr/` e
  # CODEOWNED). Este yaml documenta o parametro; nao o configura.
kpis:
  - { name: false_pricing_decision_rate, target: "==0" }   # INVARIANTE L0: ZERO decisao de preco/pagamento por automacao
  - { name: phi_egress_violations, target: "==0" }          # INVARIANTE egress: ZERO PHI resolvivel sai do dossie/agregado
  - { name: lgpd_erasure_coverage, target: "==1.0" }        # toda solicitacao de apagamento LGPD coberta (DPO confirma)
  - { name: dossier_completeness, target: ">0.95" }         # dossies de risco completos (agregados + refs DMN)
  - { name: human_routing_precision, target: "track" }      # casos corretamente roteados ao aprovador humano
  - { name: eval_score, target: ">0.9" }                    # golden dataset (gate de promocao, ADR-0009)
escalation:
  process: SP-OP-PAGTO-001                 # rota humana garantida: User Task de aprovacao de alcada (tier-match)
  human_manager: atuarial-financas         # quem decide o preco/pagamento (candidate group BPMN / comite financeiro)
  triggers:                                # cada gatilho -> HUMANO (NUNCA decide o merito adverso)
    - dmn: pagto_alcada=ANALISE_HUMANA          # faixa ambigua / acima do maior tier -> comite-financeiro
    - dmn: pagto_admissibility=ANALISE_HUMANA   # dados de pagamento inconsistentes / duplicidade -> humano
    - signal: phi_egress_risk              # risco de egresso de PHI resolvivel -> humano (nunca egride por omissao)
    - signal: dmn_unavailable              # DMN indisponivel -> humano (nunca decide por omissao)
    - signal: ambiguity                    # qualquer ambiguidade -> humano
memory:
  episodic: false  # reabilitar quando GAP-DU-01-b ligar pgvector (ADR proposto 0043 — memoria ativar-ou-aposentar)
  semantic: false  # reabilitar quando GAP-DU-01-b ligar pgvector (ADR proposto 0043 — memoria ativar-ou-aposentar)
# A2A v1.0 — Agent Card derivado desta definicao (ADR-0003). Andre e ALVO de delegacao: o worker
# `operadora.pagto.prepare_approval_dossier` de SP-OP-PAGTO-001 delega `analytics.actuarial`/
# `analytics.population` a ele (enriquece o dossie de risco). `accepted_task_types` declara o
# contrato de delegacao (o dispatcher rejeita task_type fora desta lista — espelha AUTH->Rafael).
# A montagem do inbound handler A2A (delegation.py) e GATED em W-R2/R9 (NAO autorada aqui — so a
# metadata declarativa do contrato).
a2a:
  capabilities:
    - population_analytics                 # analytics populacional sobre agregados k-anon (coortes)
    - actuarial_risk_dossier               # dossie de risco atuarial p/ a aprovacao de pagamento (instrui)
  skills:
    - cohort_aggregate_analysis            # analise de coorte sobre agregados (sem PHI resolvivel)
    - pagto_approval_risk_dossier          # montagem do dossie de risco da aprovacao de alcada / SP-OP-PAGTO-001
  accepted_task_types:
    - analytics.population                 # PAGTO (prepare_approval_dossier) delega o enriquecimento populacional
    - analytics.actuarial                  # PAGTO (prepare_approval_dossier) delega o enriquecimento atuarial
  queue_ref: agents.tasks.andre
