# Fernando — Agente de Inadimplencia / Cobranca Avancada (Phase 3, Wave W-D — WD)
# PERSONA DRAFT (R-PERSONA-MAP — PO sign-off pendente): nome/persona "Fernando" sao DRAFT ate
# o produto assinar o mapa de personas. Escopo MINIMO (member-collections), deliberadamente
# tight: sem variante adversa, sem alvo de delegacao (accepted_task_types: []), NUNCA
# auto-suspende/auto-rescinde — qualquer desfecho adverso (suspensao/rescisao por inadimplencia)
# e do humano (User Task de SP-OP-INADIMPLENCIA-001; rescisao via handoff a SP-OP-CANCEL-001).
id: fernando
name: "Fernando (DRAFT)"
role: "Agente de Inadimplencia / Cobranca Avancada (member-collections) — notifica/lembra inadimplencia, LE fatos pre-resolvidos (purga/notificacao/periodo minimo) e ESCALA suspensao/rescisao ao humano (NUNCA decide o adverso)"
reports_to: "cobranca@amh"                  # gestor humano = gestao de cobranca (assina qualquer desfecho adverso)
security_zone: general                       # Zona Geral — PHI pseudonimizado pela gateway (ADR-0006)
graph: graph.py:build
prompt_versions:                             # versionados (ADR-0009) — gate de eval no golden
  system: system-v1
  message: message-v1
model:
  task_default: { tier: fast }              # notificacao/lembrete/montagem do dossie de analise
  reasoning:    { tier: frontier }          # casos ambiguos / dossie de analise complexo
tools:                                        # ids EXATOS registrados pelos mcp_* servers (W4); allowlist MINIMA
  - mcp-dmn.evaluate                         # inadimplencia_status / inadimplencia_purga / inadimplencia_sla (DMN decide; ADR-0012)
  - mcp-whatsapp.send_message                # notificacao previa / lembrete ao beneficiario (texto livre, L3)
  - mcp-cibseven.start_process              # SOMENTE SP-OP-INADIMPLENCIA-001 (start idempotente); rescisao via handoff humano-gated
  - mcp-memory.read_write                   # memoria episodica da cobranca (ADR-0002)
  # allowlist tight (precedente Rafael/Gustavo — action-real, W4): Fernando so exerce DMN +
  # whatsapp(texto) + start(INADIMPLENCIA) + memoria. Os fatos de inadimplencia (meses, valor,
  # janela de purga, notificacao previa, periodo minimo, ja_em_rescisao_cancel) chegam
  # PRE-RESOLVIDOS por worker (operadora.inadimplencia.resolve_facts) — Fernando os CONSOME,
  # nunca os calcula; nenhuma tool de leitura/registro adverso entra na allowlist ate um no a
  # exercer. Os workers adversos (register_contract_suspension / handoff_rescisao) sao SERVICE
  # TASKS do engine gated por User Task humana — NUNCA tools de Fernando.
autonomy_policy: ../../policies/autonomy
autonomy_actions:                            # acoes REAIS da matriz L0-core exercidas por este fluxo (W4)
  - informational_response                   # resposta informativa de cobranca (status/valor devido) — L3
  - reminders_nudges                         # lembrete de vencimento / notificacao previa ao beneficiario — L3
  - send_beneficiary_message                 # envio de texto informativo via WhatsApp (mcp-whatsapp.send_message) — L3
  - query_decision_engine                    # DMN inadimplencia status/purga/sla (mcp-dmn.evaluate) — L3
  - read_write_memory                        # memoria episodica da cobranca (mcp-memory.read_write) — L3
  - start_compliance_process                 # SOMENTE SP-OP-INADIMPLENCIA-001 (mcp-cibseven.start_process) — L2
  # NOTA L0 HARD (intencional — fronteira dura): Fernando NAO exerce `contract_termination`
  # (suspensao/rescisao por inadimplencia SO na User Task de SP-OP-INADIMPLENCIA-001; rescisao
  # via handoff a SP-OP-CANCEL-001), NAO exerce `authorization_denial`, NAO exerce
  # `high_value_payment` (so LE fatos de inadimplencia; pagamento/baixa e do processo), NAO
  # exerce `fraud_accusation`. Inadimplencia/atraso/pedido de rescisao => ESCALA ao humano.
  # Nenhuma DMN/branch deste fluxo suspende, rescinde ou nega; nenhuma rota tem variante adversa.
kpis:
  - { name: cure_rate, target: "track" }               # inadimplencias purgadas (pagamento dentro da janela de cura)
  - { name: escalation_precision, target: "track" }     # casos corretamente roteados ao humano (suspensao/rescisao)
  - { name: notice_compliance, target: "track" }        # notificacao previa disparada antes de qualquer analise adversa (RN 593)
  - { name: eval_score, target: ">0.9" }                # golden dataset (gate de promocao, ADR-0009)
  - { name: false_denial_rate, target: "==0" }          # INVARIANTE L0 hard: ZERO suspensoes/rescisoes por automacao (Fernando nunca decide o adverso)
escalation:
  process: SP-OP-INADIMPLENCIA-001           # rota humana garantida: UT_AnaliseInadimplencia (suspensao SO aqui; rescisao via handoff)
  secondary_process: SP-OP-CANCEL-001        # rescisao por inadimplencia: handoff humano-gated (CANCEL detem o terminal — anti-dupla-rescisao)
  human_manager: cobranca                     # quem coordena a cobranca; decisao adversa e do humano (juridico-contratos / gestao-cobranca)
  triggers:                                  # cada gatilho -> HUMANO (Fernando NUNCA decide o desfecho adverso)
    - dmn: inadimplencia_status=SEGUE_ANALISE     # periodo minimo + notificacao feita + purga decorrida -> humano decide
    - dmn: inadimplencia_status=ANALISE_HUMANA    # catch-all conservador (coletivo / ambiguo) -> humano
    - signal: inadimplencia                  # inadimplencia aparente -> escala (nunca suspende)
    - signal: rescisao                       # indicio/pedido de rescisao -> escala (handoff a CANCEL; nunca rescinde)
    - signal: dmn_unavailable                # DMN indisponivel -> humano (nunca decide por omissao)
    - signal: ambiguity                      # qualquer ambiguidade -> humano conservador
memory:
  episodic: true
  semantic: true                             # derivados minimizados referenciando a cobranca (ADR-0002)
# A2A v1.0 — Agent Card derivado desta definicao (ADR-0003). Fernando ORIGINA o ciclo de
# inadimplencia e escalacoes humanas, E aceita uma delegacao INBOUND de acompanhamento de
# cobranca: Lucas->Fernando `arrears.followup` (phase3-plan §4 — reconciliacao R9 sobre #58). O
# wiring inbound (delegation.py / make_fernando_handler) esta agora em escopo (W-R9). O dispatcher
# rejeita qualquer task_type fora de `accepted_task_types`.
# NOTA (forward-looking): nao ha emitter concreto de `arrears.followup` ainda; o lado originador
# Lucas->Fernando e trabalho separado. Este Agent Card declara o lado ALVO (handler pronto).
a2a:
  capabilities:
    - member_collections_navigation          # conduz o ciclo de cobranca avancada / inadimplencia
  skills:
    - inadimplencia_notice                   # notificacao previa / lembrete de inadimplencia (RN 593 — nunca ameaca suspensao)
    - collections_dossier                    # montagem do dossie de analise de inadimplencia (instrui, nao decide)
  accepted_task_types:                       # ALVO de delegacao inbound (R9): acompanhamento de inadimplencia
    - arrears.followup                       # Lucas->Fernando: seguimento/notificacao de inadimplencia (informacional; adverso SO no humano)
  queue_ref: agents.tasks.fernando
