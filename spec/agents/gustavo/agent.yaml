# Gustavo Andrade — Operador de Calendario Regulatorio ANS (Phase 2)
id: gustavo
name: "Gustavo Andrade"
role: "Operador de Calendario Regulatorio ANS — conduz SP-OP-ANS-SUBMIT-001 e instrui SP-OP-NIP-001"
phase: 2
autonomy_level: L2
process_keys:
  - SP-OP-NIP-001
  - SP-OP-ANS-SUBMIT-001
reports_to: "regulatorio@amh"
security_zone: general
graph: graph.py:build
prompt_versions:
  system: system-v1
  dossier: dossier-v2
model:
  task_default: { tier: fast }
  reasoning:    { tier: frontier }
tools:
  - mcp-dmn.evaluate
  - mcp-cibseven.start_process
  - mcp-memory.read_write               # excecao disclosed do fence §8.5 item 2 (sem no vivo
                                         # hoje — GAP-DU-01-b/ADR-0047 DRAFT)
  - mcp-fhir.read_patient
  # mcp-cibseven.get_process_status / correlate_process_message: nenhum no deste grafo os
  # exerce hoje (CC-05/GUS-02) — mas NAO remover sem substituir: sao os UNICOS agent.yaml do
  # fleet que ainda declaram esses dois ids (helena/rafael tambem os desdeclararam nesta WP), e
  # `tests/unit/gateway/test_effect_enforcement.py::
  # test_every_catalogued_tool_id_is_declared_by_some_agent` exige `declared >=
  # effect_classes.CATALOGUED_TOOL_IDS` — que cataloga os dois (transport.py:278/420,
  # OWNER-GATED: catalogo em src/, fora do escopo desta WP). Removidos daqui quebraria essa
  # fence real. Mantidos como excecao disclosed OWNER-GATED (nao "acao real, nao declarativa"
  # como andre/carolina/valentina) ate um no os exercer OU o catalogo ser revisado por um owner.
  - mcp-cibseven.get_process_status
  - mcp-cibseven.correlate_process_message
autonomy_policy: ../../policies/autonomy
autonomy_actions:
  - query_decision_engine
  - start_compliance_process
  - read_write_memory                   # excecao disclosed (fence §8.5 item 2), sem no vivo hoje
  - read_phi_data
  - ans_official_submission
  - nip_response
  # query_process_status / correlate_process_message: pareiam os dois tools OWNER-GATED acima
  # (nenhum no os exerce) — mantidos por simetria com o tools[]; ver comentario la.
  - query_process_status
  - correlate_process_message
kpis:
  - { name: submission_on_time_rate, target: "==1.0" }
  - { name: nip_deadline_compliance, target: "==1.0" }
  - { name: dossier_completeness, target: ">0.95" }
  - { name: human_routing_precision, target: "track" }
  - { name: eval_score, target: ">0.9" }
  - { name: false_denial_rate, target: "==0" }
escalation:
  process: SP-OP-NIP-001
  human_manager: juridico-regulatorio
  triggers:
    - dmn: nip_routing=REVISAO_JURIDICA
    - dmn: ans_submission_admissibility=REVISAO_HUMANA
    - signal: dmn_unavailable
    - signal: ambiguity
memory:
  episodic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
  semantic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
# A2A v1.0 — Agent Card derivado desta definicao (ADR-0003). Gustavo e ALVO de delegacao
# (`nip.instruct`); o handler inbound `agents/gustavo/delegation.py::make_gustavo_handler` EXISTE
# mas NAO esta registrado em nenhum dispatcher do composition root — decisao do dono, ver
# `_UNREGISTERED_HANDLERS` em `tests/unit/a2a/test_agent_card_handlers_parity.py`.
a2a:
  capabilities:
    - regulatory_calendar_operation
    - nip_response_instruction
  skills:
    - ans_periodic_submission
    - nip_dossier
  accepted_task_types:
    - nip.instruct
  queue_ref: agents.tasks.gustavo
  handler_status: pronto_sem_registro   # handler existe, registro NAO feito (decisao do dono)
  handler_symbol: maezo.agents.gustavo.delegation::make_gustavo_handler
