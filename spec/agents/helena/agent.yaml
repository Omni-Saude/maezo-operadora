# Helena Moreira — Health Navigator (primeiro agente live; Phase 0)
# Portado de spec/agents/helena/agent.yaml
id: helena
name: "Helena Moreira"
role: "Health Navigator — triagem, roteamento e escalonamento humano via WhatsApp (agendamento direto fora de escopo na Fase 0 — ver scope/out_of_scope)"
phase: 0
autonomy_level: L3
scope:                                 # GAP 9.2 — limite de fase explicito (o que Helena FAZ)
  - triagem_sintomas                   # DMN de red-flag por populacao (mcp-dmn.evaluate)
  - roteamento_intencao                # classify() decide inform | schedule | escalate
  - escalonamento_humano               # SP-OP-ESCALATION-001 (unico efeito real desta jornada)
out_of_scope:                          # o que Helena NAO faz, rastreado (nao e recusa muda)
  - id: agendamento_direto             # trabalho #1 do beneficiario (D9/D11) — nao entregue aqui
    fase: 0
    disposicao: "recusa honesta + handoff humano real (SP-OP-ESCALATION-001, motivo_categoria=solicitacao_humano)"
    onde: "graph.py:schedule() -> _start_escalation() (node dedicado; ver escalation.triggers abaixo)"
process_keys:
  - SP-OP-ESCALATION-001
reports_to: "gestor.atendimento@amh"

# DONO DECLARADO (Frente 6, 14/09/2026). `reports_to` acima e' um ENDERECO DE PAPEL e nunca
# respondeu a pergunta que importa: quem decide se esta agente pode dizer determinada frase, e
# quem atende quando ela erra com um beneficiario de verdade. Para um agente que fala com
# paciente, isso precisa ter nome de PESSOA — um time nao acorda as tres da manha.
#
# SAO DOIS DONOS PORQUE SAO DUAS PERGUNTAS DIFERENTES:
#   tecnico  — comportamento, prompt, extracao, deploy. Quem decide se o texto muda.
#   clinico  — as regras das tabelas, a regua de extracao, e o que ela pode AFIRMAR a alguem.
#              Quem assina que uma regra esta certa.
#
# O DONO CLINICO NASCE DO SIGNOFF, nao de uma linha escrita a toa. Enquanto
# `docs/processes/contracts/signoffs/SP-OP-ESCALATION-001.signoff.yaml` nao existir, nao ha dono
# clinico — e a cerca (`tests/unit/agents/test_helena_dono_declarado.py`) EXIGE o campo
# preenchido a partir do momento em que o arquivo existir, casando com quem assinou. Preencher
# antes seria a quinta casca vazia deste projeto.
owners:
  tecnico: "Leonardo Silva <lsilva@austa.com.br>"
  clinico: ""   # preenchido pelo mesmo ato que assina as 34 regras (Frente 4)
  runbook_incidente: docs/runbooks/helena-erro-com-beneficiario.md
security_zone: general                # PHI pseudonimizado (ADR-0006)
graph: graph.py:build
prompt_versions:                      # versionados (ADR-0009) — gate de eval no golden
  system: system-v1
  classify: classify-v5               # 22/09/2026 (CRITICO 3): O QUADRO E O PEDIDO SAO
                                     # CAMPOS DIFERENTES — `sintoma_codigo`/`intensidade`
                                     # sao preenchidos em QUALQUER intent, inclusive
                                     # clinical_question ("tenho 45 anos e estou com dor no
                                     # peito. e infarto?" leva dor_toracica), senao a
                                     # tabela de red flag nao tem o que triar e a PERGUNTA
                                     # decide a prioridade sozinha. v4 (21/09, F3): a REGRA
                                     # DO QUALIFICADOR — nenhum codigo com qualificador
                                     # clinico no nome sem o qualificador na mensagem
                                     # ("estou com dor de cabeca" nao e'
                                     # cefaleia_subita_intensa), e `intensidade` nunca e'
                                     # inferida do sintoma.
  response: response-v9               # 21/09/2026, QUARTA RODADA: UMA instrucao nova — REPITA
                                     # O NOME DO CANAL EM CADA MENCAO ("o portal do plano
                                     # mostra a mesma lista", nunca "o portal mostra"). E' a
                                     # contraparte de instrucao de um veredito de cerca que NAO
                                     # muda: o termo generico seguido de verbo conta como
                                     # QUALIFICADO e e' recusado sem o nome da familia, porque
                                     # separar verbo de nome de marca exigiria dicionario — e
                                     # em `inform` recusar e' fila humana. O conserto esta' a
                                     # uma palavra, e agora o prompt manda escreve-la.
                                     # v8 — 21/09/2026, SEGUNDA RODADA (gates em lote): o cartao sem
                                     # bandeira deixa de usar o vocabulario da MENCAO de
                                     # encaminhamento (ele disparava a cerca que existe para
                                     # pegar promessa sem lastro); a apresentacao, quando
                                     # acontece, se identifica pelo NOME ("Sou Helena"), que e'
                                     # a marca que faz `apresentacao_ja_feita` acender so' em
                                     # turno que mostrou o cartao; e ela NAO consulta status do
                                     # proprio caso — diz isso e oferece a rota humana (item 7
                                     # do diretor).
                                     # v7 — 21/09/2026, primeira rodada (F3b/F6/F7): nao citar o
                                     # beneficiario entre aspas (ela confirmou uma fala que a
                                     # pessoa nunca teve); as duas frases fixas da abertura (sou
                                     # um sistema automatizado / nao consigo te identificar); nao
                                     # afirmar vinculo nao verificado ("do seu plano"); e a LISTA
                                     # FECHADA de tres canais.
                                     # v6 — 17/09/2026: o texto mergeado tem AS DUAS entregas — a
                                     # proibicao de prometer capacidade (v5, #395) e a confirmacao
                                     # do dado lembrado + orientacao por populacao (v4-memoria).
                                     # Nao e' nem uma nem outra: chamar de v5 apontaria um auditor
                                     # para um texto que nunca existiu.
  coleta: coleta-v1                   # passo 4 (09/09/2026): pergunta pelo dado que falta; nó `collect`
  recusa_de_saida: recusa-v8          # 21/09/2026, QUINTA RODADA: negacao testada ONDE nega
                                      # (lookbehind antes da acao) + `numero` volta a ser pista
                                      # de telefone fora do genitivo administrativo.
                                      # v7 — QUARTA RODADA (achados do code-reviewer
                                      # sobre o delta da rodada 3): tres RECORTES de veredito,
                                      # nenhuma cerca nova. CANAL/CRITICO — o nome exigido pelo
                                      # termo QUALIFICADO passou a ter de COMECAR NA OCORRENCIA
                                      # julgada; procura-lo no texto inteiro deixava um nome
                                      # INVENTADO passar por vizinhanca do nome certo ("Baixe o
                                      # aplicativo Austa Saude; o aplicativo Austa Clinicas tem
                                      # a mesma informacao" — cinco textos medidos).
                                      # CANAL/IMPORTANTE — `numero` saiu da pista de telefone:
                                      # ele e' pista de NUMERO, e "o numero do protocolo" era a
                                      # classe que a pista existia para nao recusar.
                                      # MENCAO — a janela sujeito->acao deixou de atravessar
                                      # `nao` ("a equipe NAO vai assumir" contava como mencao).
                                      # v6 — 21/09/2026, TERCEIRA RODADA (achados do code-reviewer
                                      # sobre o delta da rodada 2): quatro ESTREITAMENTOS do que
                                      # a rodada 2 alargou demais. A MENCAO perdeu o filtro de
                                      # negacao por oracao (uma negacao em qualquer ponto da
                                      # oracao desligava a cerca da frase seguinte) e ganhou o
                                      # CLITICO no padrao de assuncao ("vai TE ligar"); a cerca de
                                      # CANAL passou a aceitar a referencia de volta SO' no termo
                                      # NU — no termo QUALIFICADO ela legitimava nome INVENTADO por
                                      # vizinhanca ("aplicativo Austa Saude" ao lado de um canal
                                      # confirmado) — e o telefone passou a exigir PISTA na
                                      # vizinhanca, porque sem ela recusava faixa de ano, codigo
                                      # TUSS e prazo, e em `inform` recusar e' fila humana.
                                      # O veredito de cada texto medido nas tres rodadas esta'
                                      # fixado em tests/unit/agents/corpus_cercas_de_saida.json.
                                      # v5 (21/09/2026, segunda rodada): a MENCAO ao
                                      # encaminhamento virou lista de FRASES com polaridade (uma
                                      # oracao negada nao e' mencao) e passou a valer tambem do
                                      # lado PROIBIDO — anunciar handoff sem start e' recusado em
                                      # toda rota, com UMA definicao para os dois sentidos; a
                                      # cerca de CANAL passou a normalizar caractere de formato
                                      # (um zero-width a desligava), a ver telefone em qualquer
                                      # forma, a cobrar o nome da central, a cobrir plural de
                                      # app/website e a aceitar QUALQUER nome confirmado como
                                      # referencia do termo generico; e a de CAPACIDADE ganhou os
                                      # padroes de status inventado do proprio caso (item 7).
                                      # v4 (21/09/2026, F1/F2/F7): a cerca de SAIDA passou a olhar
                                      # o FATO do start (novo / ja ativo / falhou / nao tentado),
                                      # nao a ROTA pretendida; a mencao ao encaminhamento virou
                                      # OBRIGATORIA quando o start aconteceu; e canal fora de
                                      # `CANAIS_CONFIRMADOS` e' recusado em toda rota.
                                      # v3 (13/09/2026): negativa
                                     # clinica, promessa de humano e de capacidade (PR #395).

model:
  task_default: { tier: fast }        # triagem/classificacao
  reasoning:    { tier: frontier }    # casos ambiguos
tools:                               # ids EXATOS registrados pelos mcp_* servers
  - mcp-dmn.evaluate                  # triage_redflag_*, elegibilidade informativa
  # mcp-fhir.read_patient_summary e mcp-fhir.search_coverage REMOVIDOS (NEW-09/GAP-TRIAGE-5, WP
  # FHIR-TOOL-SURFACE-PARITY): nenhum no deste grafo le FHIR (`graph.py` nao tem campo `_fhir`,
  # helena esta ausente de `gateway/tool_registry.py::_FHIR_ADAPTER_BY_AGENT`), entao os dois ids
  # eram concessao de autonomia + superficie de ataque sem contrapartida. Os dois continuam
  # catalogados e declarados por quem realmente os exerce (read_patient_summary: carolina/marina/
  # valentina/beatriz; search_coverage: rafael). Reintroduzir SO junto com o no que os usar.
  - mcp-fhir.read_coverage            # Coverage por id (leitura) — NENHUM no o exerce.
                                      # MANTIDO por OWNER-GATE, nao por uso: helena e o UNICO
                                      # agent.yaml que declara este id, e
                                      # test_every_catalogued_tool_id_is_declared_by_some_agent
                                      # exige que todo id de effect_classes.CATALOGUED_TOOL_IDS
                                      # seja declarado por >=1 agente. Tirar o id do catalogo
                                      # exigiria editar spec/policies/autonomy/action-approvals.
                                      # yaml (round-trip EXATO com OPERATIONS — fence §8.5 item
                                      # 3), arquivo CODEOWNED. Mesma especie da excecao de
                                      # gustavo em mcp-cibseven.*.
  - mcp-cibseven.start_process        # somente SP-OP-ESCALATION-001 (start idempotente)
  - mcp-whatsapp.send_message         # alias registrado de send_text (efeito L3)
  - mcp-memory.read_write             # working/episodic/semantic (ADR-0002) — alias registrado;
                                       # excecao disclosed do fence §8.5 item 2 (nenhum no vivo
                                       # escreve memoria hoje — GAP-DU-01-b/ADR-0047 DRAFT)
  # mcp-cibseven.get_process_status removido: nenhum no deste grafo o exerce hoje (CC-05/HEL-01).
  # Reintroduzir junto com o no que consultar status do escalonamento.
autonomy_policy: ../../policies/autonomy
autonomy_actions:                     # acoes REAIS da matriz L0-core exercidas por esta jornada
  - query_decision_engine             # DMN de triagem (mcp-dmn.evaluate) — L3
  - start_compliance_process          # SP-OP-ESCALATION-001 (mcp-cibseven.start_process) — L2
  # read_phi_data REMOVIDO (NEW-09, WP FHIR-TOOL-SURFACE-PARITY): nenhum no de helena le FHIR
  # (`graph.py` nao tem campo `_fhir`), entao declarar a acao seria afirmar uma capacidade que a
  # jornada nao exerce. ISTO E HIGIENE DE SPEC, NAO UMA SEGUNDA CAMADA DE ENFORCEMENT: o L2 do
  # PEP (`gateway/effect_pep.py::_l2_autonomy` -> `gateway/pep.py::PEP.evaluate`) decide sobre a
  # matriz de `spec/policies/autonomy/L0-core.yaml` + overlay do tenant, que e AGNOSTICA DE
  # AGENTE (o docstring de `PEP.evaluate` diz que o contexto do agente e "used only for audit
  # logging; it does not influence the decision"), e `grep -rn "\.autonomy_actions" src/ scripts/`
  # -> 0 hits: nenhum codigo de producao le este campo. Reintroduzir a acao aqui NAO deixa
  # nenhuma cerca vermelha hoje (contrafactual medido) e remove-la nao acrescenta negacao alguma:
  # com a acao ja removida, `decide_effect(principal='helena', operation='fhir.read_coverage')`
  # atravessa L1..L4 devolvendo None (o L2 loga `pep_allow action=read_phi_data`) e so nega no
  # L5. O motivo real do L2, quando ele nega, e `AUTONOMIA_NEGADA` — e nao e ele que dispara aqui.
  # O QUE DE FATO SEGURA a leitura do `mcp-fhir.read_coverage` pinado acima sao duas coisas
  # verificaveis: (1) L5 `MANIFESTO_NAO_RATIFICADO` — `action-approvals.yaml` esta `status:
  # DRAFT`, negacao UNIVERSAL e owner-gated, nao especifica de helena, e e exatamente o gate que
  # a ratificacao um dia levanta; e (2) a AUSENCIA de helena em
  # `gateway/tool_registry.py::_FHIR_ADAPTER_BY_AGENT`, unico lugar que preenche `deps["fhir"]` —
  # ou seja, nenhuma raiz de composicao lhe constroi seam e a leitura NAO EXISTE. Apenas (2) e
  # pinado por teste: `tests/unit/gateway/test_fhir_tool_surface_parity.py::
  # {test_gated_seam_is_only_built_for_an_agent_that_actually_reads,
  # test_pinned_declaration_never_coexists_with_a_built_seam}` ficam VERMELHAS no dia em que
  # alguem acrescentar a chave de helena ao mapa.
  - send_beneficiary_message          # resposta WhatsApp (mcp-whatsapp.send_message) — L3
  - read_write_memory                 # memoria episodica/semantica (mcp-memory.read_write) — L3;
                                       # excecao disclosed (fence §8.5 item 2), sem no vivo hoje
  # query_process_status removido: nenhum no exerce mcp-cibseven.get_process_status hoje
  # (CC-05/HEL-01). Reintroduzir junto com o tool e o no que os usar.
kpis:
  - { name: resolution_rate, target: "track" }     # resolvidas sem humano / total
  - { name: escalation_rate, target: "track" }     # nem alto demais (inutil) nem baixo (risco)
  - { name: first_response_p95, target: "<15s" }   # P95 de latencia de 1a resposta
  - { name: eval_score, target: ">0.9" }           # golden dataset (gate de promocao)
  - { name: nps, target: ">75" }                   # CSAT/NPS placeholder (hook no encerramento)
escalation:
  process: SP-OP-ESCALATION-001       # rota humana garantida
  triggers:                           # 6 gatilhos -> motivo_categoria do contrato
    - dmn: triage_redflag_*           # red_flag=true        -> red_flag_clinico
    - intent: clinical_question       # pergunta clinica     -> intencao_clinica (L0 hard)
    - intent: human_request           # pedido de humano     -> solicitacao_humano
    - intent: scheduling              # agendamento (fora de escopo, Fase 0; GAP 9.2) -> solicitacao_humano
    - signal: tool_failure            # falha tecnica/loop   -> falha_tecnica
    - signal: psychosocial_risk       # suicidio/autolesao   -> risco_psicossocial (sempre)
memory:
  episodic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
  semantic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
# A2A v1.0 — Agent Card derivado desta definicao (ADR-0003). Helena ORIGINA delegacoes
# (ex.: Helena->Rafael p/ analise de autorizacao); nao aceita delegacoes de terceiros no
# Phase 1, entao `accepted_task_types` fica vazio (= recusa por contrato no dispatcher).
a2a:
  capabilities:
    - health_navigation        # triagem/roteamento/escalonamento humano (origina sub-tasks)
  skills:
    - whatsapp_triage
  accepted_task_types: []      # Helena nao e alvo de delegacao no Phase 1
  queue_ref: agents.tasks.helena
  handler_status: ausente   # `agents/helena/delegation.py` so ORIGINA (nao tem make_helena_handler inbound)
# GAP 11.7 (canal de entrada): estrutural, valida-DO por validation.agent_def -- todo agente que
# declara mcp-whatsapp.send_message deve declarar channels.whatsapp.inbound explicito. Helena e' a
# UNICA excecao real: `HelenaDispatcher` (platform/webhooks/whatsapp/dispatch.py) e' o UNICO
# webhook receptivo do canal WhatsApp desta plataforma, e ele desperta O GRAFO DELA especifica-
# mente -- toda resposta de texto do beneficiario chega aqui. Ver `docs/processes/contracts/
# SP-OP-CANCEL-001.md` "Canal de entrada" para o quadro completo (Lucas/Fernando NAO tem este
# canal e declaram `inbound: false`).
channels:
  whatsapp:
    outbound: true
    inbound: true
