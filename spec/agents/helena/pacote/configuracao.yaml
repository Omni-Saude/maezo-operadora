# Pacote de comportamento da Helena (ADR-0067 fase 3) — configuracao.
#
# Este diretorio vira um pacote IMUTAVEL (sha256) publicado fora da imagem; o ponteiro de cada ambiente diz
# qual versao vale. Mudar aqui + merge = pacote novo no dev, SEM build e SEM deploy do Maezo. O receptor le' o
# pacote ativo a cada 60 s (`maezo.runtime.pacote_do_agente`); o que estiver aqui VENCE as variaveis
# `MAEZO_HELENA_*` da task (que ficam como valor de partida enquanto o pacote nao carrega).
#
# Validacao estrita em `agents/helena/pacote.py`: chave desconhecida, tipo errado ou valor fora do dominio
# recusam o pacote inteiro (o receptor fica com o ultimo pacote bom).
formato: helena-configuracao-v1

# Chaves de comportamento (os mesmos significados das antigas MAEZO_HELENA_*).
memoria_clinica: true       # Frente 2.1
historico: true             # DL-0080 (liga junto o modo coleta)
triagem_v2: false           # DL-0104
v4: true                    # DL-0115
carteirinha_completa: true  # dono, 17/10/2026
dependentes_nome: true      # DL-0127
base_saude: true            # DL-0118 / ADR-0064
cobertura_modo: simples     # DL-0140: simples | consulta
identidade_nome_operadora: "Austa Clínicas"  # DL-0078

# Roteador de habilidades (ADR-0066).
roteador:
  modo: ativo               # desligado | sombra | ativo
  modelo: mistral.magistral-small-2509  # 23/10: GLM-5 fora do ar em sa-east-1 desde 20/10 (CloudWatch); Magistral 30/30 no teste de risco
  prazo_s: 3.0
  max_tokens: 256
  concorrencia: 4
  conversas:                # F2: as conversas (ids keyed) em que o roteador ativo decide
