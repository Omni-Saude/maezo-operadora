      - "diagnóstico de tumor confirmado -> cirurgia oncológica / coloproctologia"
    sinais_de_emergencia_citados_na_fonte: []
    sinais_de_alarme_sem_emergencia:
      - "dor na barriga ou no ânus sem outra causa"
      - "mudança do intestino que persiste"
      - "perda de peso sem querer"
      - "anemia sem causa"
      - "caroço na barriga"
    nota: "Sangramento grande agora, tontura ou desmaio vão para o alerta universal."
    fonte: "TelessaúdeRS Proctologia Adulto (49), protocolo 6 – Suspeita de neoplasia do trato gastrointestinal inferior; TelessaúdeRS Gastroenterologia (14), protocolo 12"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-coloproctologia, esp-gastroenterologia]
    lacuna: false

  - id: esp-queixa-hemorroida
    grupo: estomago_intestino
    queixa: "hemorroida, fissura ou dor no ânus"
    como_a_pessoa_fala: ["tenho hemorroida", "bolinha no ânus", "dor pra evacuar", "fissura anal", "coceira no ânus", "caroço perto do ânus", "fístula", "cisto pilonidal"]
