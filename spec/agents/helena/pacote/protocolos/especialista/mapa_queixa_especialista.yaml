# ============================== ESTÔMAGO E INTESTINO ==============================
  - id: esp-queixa-azia-refluxo
    grupo: estomago_intestino
    queixa: "azia, refluxo, gastrite ou má digestão"
    como_a_pessoa_fala: ["muita azia", "refluxo", "queimação no estômago", "gastrite", "comida volta", "estômago estufado", "má digestão", "dor no estômago depois de comer", "úlcera"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Gastroenterologia", esp_id: esp-gastroenterologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "sintomas que não melhoram com cerca de 2 meses de tratamento -> endoscopia ou Gastroenterologia"
      - "má digestão que começou depois dos 50 anos -> endoscopia ou Gastroenterologia"
      - "úlcera que persiste após tratamento -> Gastroenterologia"
    sinais_de_emergencia_citados_na_fonte: []
    sinais_de_alarme_sem_emergencia:
      - "dificuldade ou dor para engolir"
