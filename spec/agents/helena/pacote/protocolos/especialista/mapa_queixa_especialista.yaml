# Protocolo QUAL ESPECIALISTA da Helena — mapa QUEIXA -> ESPECIALISTA (rascunho dev, 25/10/2026)
#
# Status: rascunho escrito por IA para dev. REVISÃO MÉDICA PENDENTE antes de qualquer uso real.
# Regras (C:\vc\protocolos\MODELO.md): não diagnosticar; não dar dose nem conduta; nada de link;
# fonte só pelo nome; sem prazo da ANS; linguagem leiga; nunca "você tem X".
#
# Como ler cada entrada:
#   especialista_primeiro       quem a pessoa pode procurar primeiro (quase sempre clínico geral / médico de família).
#   especialista_depois         especialidade(s) com o nome da Resolução CFM 2.380/2024 (ou profissão, quando não é médica).
#   quando_vai_direto_ao_especialista
#                               SÓ as situações em que o protocolo do TelessaúdeRS manda ao especialista sem exigir
#                               antes tratamento/investigação na atenção primária. Lista vazia = a fonte pede o
#                               primeiro cuidado com o clínico. USO INTERNO (a Helena não lê isto para a pessoa).
#   fonte_indica_especialista_quando
#                               resumo leigo das condições de encaminhamento da fonte. USO INTERNO.
#   sinais_de_emergencia_citados_na_fonte
#                               SÓ REFERÊNCIA para alimentar a triagem (protocolos tri-*). O destino_sugerido segue a
#                               tradução do MODELO.md ("urgência/emergência" -> PRONTO_SOCORRO_AGORA; LIGAR_192_AGORA só
#                               com risco de vida). A Helena NÃO usa esta lista sozinha: a triagem é que pergunta.
#   sinais_de_alarme_sem_emergencia
#                               sinais que a fonte cita como "investigar logo", mas não emergência -> CONSULTA_EM_BREVE.
#   esp_id_na_base              ids dos arquivos spec/conhecimento/saude/especialidade/esp-*.yaml (origin/main) que
#                               existem; null quando a especialidade não está na base.
#   lacuna                      true quando o TelessaúdeRS (53 protocolos RegulaSUS) não tem protocolo para a queixa e o
#                               mapa usa só a lista do CFM + "clínico geral primeiro". "parcial" quando a fonte cobre só
#                               parte da queixa.
#
# Fontes usadas (todas pelo nome, sem link):
#   - TelessaúdeRS-UFRGS / SES-RS — Protocolos de Regulação Ambulatorial (RegulaSUS), 53 protocolos, baixados pela API
#     do site em 25/10/2026. Citados como "TelessaúdeRS <protocolo> (nº do documento), protocolo N – <tema>".
#   - Resolução CFM nº 2.380/2024 (Portaria CME nº 01/2024) — nomes oficiais das 55 especialidades e 62 áreas de atuação.
# Atenção licença/fonte: o TelessaúdeRS NÃO está na lista fechada de fontes da base de saúde (spec/conhecimento/saude/
# FONTES.md). Aqui ele serve de REFERÊNCIA TÉCNICA para o mapa (não é texto citado para a pessoa). Para creditá-lo em
# resposta é preciso PR em FONTES.md + ADR-0064 + classificar_fonte e parecer jurídico sobre a licença do TelessaúdeRS.
#
# Nomes de documento do TelessaúdeRS (nº = id na API):
#   4 Andrologia | 5 Cardiologia Adulto | 6 Cirurgia e Traumatologia Bucomaxilofacial | 7 Cirurgia Geral |
#   11 Cirurgia Vascular | 12 Dermatologia | 13 Estomatologia Adulto | 14 Gastroenterologia | 16 Endocrinologia Pediátrica |
#   18 Endocrinologia Adulto | 19 Planejamento Reprodutivo | 21 Ginecologia Adulto | 22 Infertilidade | 23 Hematologia Adulto |
#   25 Hematologia Pediátrica | 26 Genética | 27 Infectologia (em revisão) | 29 Mastologia | 30 Imunologia |
#   32 Neurocirurgia Adulto | 33 Neurologia Pediátrica | 35 Neurologia Adulto | 37 Nefrologia Adulto |
#   38 Obstetrícia (Pré-Natal de Alto Risco) | 40 Oftalmologia Adulto | 41 Oftalmologia Pediátrica | 42 Ortopedia Adulto |
#   45 Pneumologia Adulto | 47 Otorrinolaringologia Adulto | 49 Proctologia Adulto | 53 Reabilitação Auditiva Pediátrico |
#   55 Saúde Mental Infantil | 56 Psiquiatria Adulto | 57 Tratamento da Dor (em revisão) | 59 Reumatologia |
#   63 Urologia Pediátrica | 64 Urologia Adulto | 73 Doenças relacionadas ao trabalho

versao: "0.1-rascunho-dev"
data: "2026-10-25"
tema: especialista
revisao_medica: pendente
licenca_atencao: "TelessaúdeRS: termos de uso não verificados e fora da lista fechada FONTES.md — uso só como referência técnica interna até parecer jurídico. CFM: ato normativo público."

# ---------------------------------------------------------------------------------------------------------------
# Portas de entrada (quem procurar primeiro), por público
# ---------------------------------------------------------------------------------------------------------------
portas_de_entrada:
  adulto: &porta_adulto
    nome_leigo: "Clínico geral ou médico de família"
    cfm: ["Clínica médica", "Medicina de família e comunidade"]
    esp_id: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade]
  crianca: &porta_crianca
    nome_leigo: "Pediatra"
    cfm: ["Pediatria"]
    esp_id: [esp-pediatria]
  idoso: &porta_idoso
    nome_leigo: "Clínico geral, médico de família ou geriatra"
    cfm: ["Clínica médica", "Medicina de família e comunidade", "Geriatria"]
    esp_id: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-geriatria]
  gestante: &porta_gestante
    nome_leigo: "Obstetra que acompanha o pré-natal"
    cfm: ["Ginecologia e obstetrícia"]
    esp_id: [esp-ginecologia-e-obstetricia]
  dentista: &porta_dentista
    nome_leigo: "Dentista"
    cfm: []      # Odontologia não é especialidade médica (é do CFO); fica fora da Resolução CFM 2.380/2024.
    esp_id: [esp-odontologia]

# ---------------------------------------------------------------------------------------------------------------
# Regras por público (valem ANTES do mapa por parte do corpo)
# ---------------------------------------------------------------------------------------------------------------
regras_por_publico:
  - id: esp-regra-crianca
    publico: [crianca_0_2m, crianca_2m_5a, crianca_5_12a, adolescente]
    regra: "Para criança e adolescente, a porta de entrada é sempre o pediatra, qualquer que seja a queixa. O pediatra decide se precisa de especialista (as especialidades pediátricas são áreas de atuação no CFM: neurologia pediátrica, endocrinologia pediátrica etc.)."
    especialista_primeiro: *porta_crianca
    especialista_depois:
      - {cfm: "Cirurgia pediátrica", esp_id: esp-cirurgia-pediatrica}
      - {cfm: "Pediatria (áreas de atuação: Neurologia pediátrica, Endocrinologia pediátrica, Hematologia e hemoterapia pediátrica, Psiquiatria da infância e adolescência, Medicina do adolescente)", esp_id: esp-pediatria}
    excecoes:
      - "Dentes e gengiva: dentista (odontopediatria), mesmo em criança."
      - "Gravidez na adolescência: obstetra do pré-natal (regra da gestante vale junto)."
    fonte: "Resolução CFM 2.380/2024 (Pediatria e áreas de atuação pediátricas); TelessaúdeRS Neurologia Pediátrica (33), Endocrinologia Pediátrica (16), Hematologia Pediátrica (25), Oftalmologia Pediátrica (41), Urologia Pediátrica (63), Saúde Mental Infantil (55), Reabilitação Auditiva Pediátrico (53) — todos partem da atenção primária"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "criança com risco agudo de suicídio ou de se machucar", destino_sugerido: CVV_188_E_192, fonte: "TelessaúdeRS Saúde Mental Infantil (55), protocolo 6"}
      - {sinal: "dor de cabeça com sinais de alerta (por exemplo, vômitos, confusão, convulsão, fraqueza de um lado)", destino_sugerido: PRONTO_SOCORRO_AGORA, fonte: "TelessaúdeRS Neurologia Pediátrica (33), protocolo 1, quadro 1"}
    nota: "A triagem infantil (AIDPI, protocolos tri-crianca-*) vem antes deste mapa."
    esp_id_na_base: [esp-pediatria, esp-cirurgia-pediatrica]
    lacuna: parcial    # o TelessaúdeRS não tem protocolo de pediatria geral; a regra "pediatra como porta" vem do CFM/base.

  - id: esp-regra-idoso
    publico: [adulto]
    criterio: "pessoa com 60 anos ou mais (Estatuto da Pessoa Idosa), ou quem diz 'minha mãe idosa', 'meu avô'"
    regra: "Para a pessoa idosa, o clínico geral, o médico de família ou o geriatra podem cuidar da saúde como um todo e organizar os encaminhamentos. Para queixas específicas, vale o mesmo especialista do adulto."
    especialista_primeiro: *porta_idoso
    especialista_depois:
      - {cfm: "Geriatria", esp_id: esp-geriatria}
    quando_vai_direto_ao_especialista: []
    fonte: "Resolução CFM 2.380/2024 (Geriatria)"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-geriatria]
    lacuna: true       # o TelessaúdeRS não tem protocolo de geriatria.

  - id: esp-regra-gestante
    publico: [gestante, puerpera]
    regra: "Na gravidez, qualquer queixa deve ser contada ao obstetra que acompanha o pré-natal. Ele decide se precisa de outro especialista ou de pré-natal de alto risco."
    especialista_primeiro: *porta_gestante
    especialista_depois:
      - {cfm: "Ginecologia e obstetrícia (pré-natal de alto risco; área de atuação Medicina fetal)", esp_id: esp-ginecologia-e-obstetricia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "a fonte lista condições para o pré-natal de alto risco (pressão alta, diabetes, problemas de tireoide, perdas de gravidez anteriores, alterações no ultrassom, entre outras), sempre a partir do pré-natal habitual"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "pré-eclâmpsia (a fonte manda avaliar primeiro na emergência obstétrica)", destino_sugerido: PRONTO_SOCORRO_AGORA, fonte: "TelessaúdeRS Obstetrícia (38), protocolo 1"}
    nota: "Sinais de alerta da gestação vêm dos protocolos gest-* (Caderno/Obstetrícia), não deste mapa."
    fonte: "TelessaúdeRS Obstetrícia — Pré-Natal de Alto Risco (38); Resolução CFM 2.380/2024"
    esp_id_na_base: [esp-ginecologia-e-obstetricia]
    lacuna: false

# ---------------------------------------------------------------------------------------------------------------
# Mapa do ADULTO, por parte do corpo / sistema
# ---------------------------------------------------------------------------------------------------------------
mapa:

# ============================== CABEÇA ==============================
  - id: esp-queixa-dor-de-cabeca
    grupo: cabeca
    queixa: "dor de cabeça que volta ou não passa"
    como_a_pessoa_fala: ["tenho muita dor de cabeça", "minha cabeça dói quase todo dia", "dor de cabeça que não passa", "vivo com dor de cabeça", "cefaleia", "dor na nuca e na cabeça", "pressão na cabeça", "acordo com dor de cabeça", "remédio pra dor de cabeça não resolve mais"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Neurologia", esp_id: esp-neurologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "enxaqueca ou dor de cabeça tensional que não melhora com o tratamento preventivo feito com o clínico"
      - "dor de cabeça de outro tipo, que não é enxaqueca nem tensional"
      - "Neurocirurgia só quando um exame de imagem mostra alteração com possível indicação de cirurgia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "dor de cabeça que começou de repente e muito forte ('a pior da vida')", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "dor de cabeça com fraqueza, formigamento, fala enrolada ou visão alterada de um lado", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "dor de cabeça com febre, nuca dura, manchinhas roxas na pele ou confusão", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "dor de cabeça depois de batida forte na cabeça", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "dor de cabeça com pressão muito alta e confusão", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "dor de cabeça com olho vermelho e dolorido", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "padrão novo de dor de cabeça em quem tem câncer, HIV ou usa anticoagulante", destino_sugerido: PRONTO_SOCORRO_AGORA}
    sinais_de_alarme_sem_emergencia:
      - "dor de cabeça diferente do padrão de sempre, ou que mudou há pouco tempo"
      - "dor de cabeça que começou depois dos 50 anos"
      - "dor que acorda a pessoa durante o sono"
      - "dor que aparece com esforço, tosse ou relação sexual"
    fonte: "TelessaúdeRS Neurologia Adulto (35), protocolo 1 – Cefaleia, quadro 1; TelessaúdeRS Neurocirurgia Adulto (32), protocolo 7 – Cefaleia"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-neurologia, esp-neurocirurgia]
    lacuna: false

  - id: esp-queixa-enxaqueca
    grupo: cabeca
    queixa: "enxaqueca"
    como_a_pessoa_fala: ["tenho enxaqueca", "minha enxaqueca piorou", "crise de enxaqueca toda semana", "dor de cabeça latejando de um lado", "dor de cabeça com enjoo e luz incomodando", "enxaqueca com aura", "vejo luzinhas antes da dor de cabeça"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Neurologia", esp_id: esp-neurologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "enxaqueca que não melhora com o tratamento preventivo feito com o clínico (a fonte cita pelo menos duas tentativas por 3 meses)"
    sinais_de_emergencia_citados_na_fonte: "mesmos de esp-queixa-dor-de-cabeca (quadro 1)"
    fonte: "TelessaúdeRS Neurologia Adulto (35), protocolo 1 – Cefaleia"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-neurologia]
    lacuna: false

  - id: esp-queixa-tontura-vertigem
    grupo: cabeca
    queixa: "tontura ou vertigem"
    como_a_pessoa_fala: ["tô com tontura", "tudo gira", "labirintite", "sinto o chão rodando", "tontura quando deito ou viro na cama", "zonzeira", "vertigem", "perco o equilíbrio", "crise de labirinto"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Otorrinolaringologia", esp_id: esp-otorrinolaringologia}
      - {cfm: "Neurologia", esp_id: esp-neurologia, quando: "tontura de origem central, depois de avaliada na emergência"}
    quando_vai_direto_ao_especialista:
      - "suspeita de doença de Ménière (crises de tontura com zumbido, ouvido tampado e perda de audição) -> Otorrinolaringologia"
    fonte_indica_especialista_quando:
      - "tontura posicional que volta mais de 3 vezes mesmo após as manobras feitas pelo clínico -> Otorrinolaringologia"
      - "labirintite que não melhora em cerca de 15 dias de tratamento -> Otorrinolaringologia"
      - "tontura sem causa clara depois da investigação com o clínico -> Otorrinolaringologia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "tontura com fraqueza, formigamento, fala enrolada, visão dupla ou falta de coordenação", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "tontura com dor de cabeça nova, principalmente na nuca", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "tontura com perda súbita da audição de um lado", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "labirintite sem nenhuma melhora após 7 dias, ou que impede a pessoa de fazer as coisas", destino_sugerido: ATENDIMENTO_HOJE}
    fonte: "TelessaúdeRS Neurologia Adulto (35), protocolo 9 – Vertigem; TelessaúdeRS Otorrinolaringologia Adulto (47), protocolo 1 – Vertigem"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-otorrinolaringologia, esp-neurologia]
    lacuna: false

  - id: esp-queixa-desmaio
    grupo: cabeca
    queixa: "desmaio ou quase desmaio"
    como_a_pessoa_fala: ["desmaiei", "apaguei do nada", "tive um desmaio", "quase desmaiei", "a vista escureceu e caí", "perdi os sentidos", "tive um apagão", "desmaio quando fico muito tempo em pé"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Cardiologia", esp_id: esp-cardiologia, quando: "desmaio com sinais de origem no coração"}
      - {cfm: "Neurologia", esp_id: esp-neurologia, quando: "episódio que parece crise convulsiva"}
      - {cfm: "Clínica médica", esp_id: esp-clinica-medica, quando: "desmaio de causa não esclarecida (a fonte diz Medicina Interna)"}
    quando_vai_direto_ao_especialista:
      - "desmaio em quem já tem doença do coração -> Cardiologia"
      - "desmaio com falta de ar, dor no peito, sopro ou durante exercício -> Cardiologia"
      - "desmaio em quem tem pais ou irmãos com morte súbita antes dos 40 anos -> Cardiologia"
      - "episódio que lembra convulsão -> Neurologia"
    fonte_indica_especialista_quando:
      - "o desmaio comum (por ficar muito tempo em pé, por dor, medo ou ver sangue, com suor e vista escura antes) normalmente não precisa de especialista"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "desmaio com dor no peito ou suspeita de infarto", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "desmaio com falta de ar ou coração muito acelerado ou irregular que começou agora", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "desmaio durante exercício", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Cardiologia Adulto (5), protocolo 4 – Síncope; TelessaúdeRS Neurologia Adulto (35), protocolo 4 – Síncope"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-cardiologia, esp-neurologia]
    lacuna: false

# ============================== OLHOS ==============================
  - id: esp-queixa-visao-embacada
    grupo: olhos
    queixa: "visão embaçada ou piorando aos poucos"
    como_a_pessoa_fala: ["minha vista tá embaçada", "tô enxergando mal", "preciso de óculos", "não enxergo de perto", "vista cansada", "grau aumentou", "catarata", "visão turva", "não consigo ler letra pequena"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Oftalmologia", esp_id: esp-oftalmologia}
    quando_vai_direto_ao_especialista:
      - "queixa de visão diminuindo aos poucos, sem causa aguda -> Oftalmologia (a fonte aceita avaliação oftalmológica direta)"
      - "suspeita de catarata -> Oftalmologia"
      - "usuário de lente de contato sem acompanhamento com oftalmologista -> Oftalmologia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "perda de visão de repente", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "sombra ou 'cortina' cobrindo parte da visão", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "flashes de luz ou muitas 'moscas' novas na visão", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "imagens tortas ou deformadas de repente", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Oftalmologia Adulto (40), protocolo 1 – Distúrbios de refração, protocolo 2 – Catarata"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-oftalmologia]
    lacuna: false

  - id: esp-queixa-olho-vermelho
    grupo: olhos
    queixa: "olho vermelho, irritado ou com secreção"
    como_a_pessoa_fala: ["meu olho tá vermelho", "conjuntivite", "olho irritado", "olho remelando", "olho seco", "areia no olho", "olho coçando", "carne crescida no olho", "terçol que não sai"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Oftalmologia", esp_id: esp-oftalmologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "olho seco ou carne crescida (pterígio) que não alivia com o tratamento inicial"
      - "terçol ou calázio que volta ou não melhora com o tratamento"
      - "pálpebra caída, virada ou com lesão suspeita"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "produto químico caiu no olho", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "olho vermelho de repente com dor ou visão pior", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "conjuntivite com muito pus que começou em menos de um dia", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "qualquer dor, secreção ou queda de visão em quem usa lente de contato", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "batida forte no olho ou corte na pálpebra; algo espetado no olho", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "olho 'saltado' de repente ou inchaço vermelho e dolorido no canto do olho", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Oftalmologia Adulto (40), protocolo 5 – Pálpebras, vias lacrimais e órbita; protocolo 7 – Córnea e superfície ocular"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-oftalmologia]
    lacuna: false

  - id: esp-queixa-dor-no-olho
    grupo: olhos
    queixa: "dor no olho"
    como_a_pessoa_fala: ["meu olho tá doendo", "dor no olho", "dor atrás do olho", "olho dói com a luz", "dor no olho e enjoo", "pressão no olho", "glaucoma"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Oftalmologia", esp_id: esp-oftalmologia}
    quando_vai_direto_ao_especialista:
      - "suspeita de glaucoma (pressão do olho alta em exame) -> Oftalmologia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "dor forte no olho que começou de repente, com olho vermelho, enjoo ou vômito", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "dor no olho com olho vermelho em volta da parte colorida e incômodo forte com a luz", destino_sugerido: PRONTO_SOCORRO_AGORA}
