    quando_vai_direto_ao_especialista:
      - "pedra na vesícula que dá sintoma -> Cirurgia geral"
    fonte_indica_especialista_quando:
      - "dor de origem na barriga com investigação inconclusiva com o clínico -> Gastroenterologia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "dor forte na barriga com febre, pele ou olhos amarelos (suspeita de inflamação da vesícula ou pâncreas)", destino_sugerido: PRONTO_SOCORRO_AGORA, fonte: "TelessaúdeRS Cirurgia Geral (7), protocolo 1"}
    fonte: "TelessaúdeRS Ginecologia Adulto (21), protocolo 7 e Urologia Adulto (64), protocolo 11 (dor de origem abdominal -> Gastroenterologia); TelessaúdeRS Cirurgia Geral (7), protocolo 1 – Colelitíase"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-gastroenterologia, esp-cirurgia-geral]
