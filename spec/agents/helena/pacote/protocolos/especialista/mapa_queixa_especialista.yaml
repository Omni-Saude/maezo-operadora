      - "caroço na parte de cima da barriga"
      - "parente de primeiro grau com câncer de estômago ou esôfago"
    nota: "Vômito com sangue ou fezes pretas agora vai para o alerta universal."
    fonte: "TelessaúdeRS Gastroenterologia (14), protocolo 9 – Dispepsia e protocolo 10 – Doença do refluxo"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-gastroenterologia]
    lacuna: false

  - id: esp-queixa-dor-de-barriga-cronica
