    fonte: "TelessaúdeRS Proctologia Adulto (49), protocolos 1 – Hemorroidas, 2 – Fissura, 3 – Fístula, 4 – Doença pilonidal"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-coloproctologia]
    lacuna: false

  - id: esp-queixa-hernia
