  - id: esp-queixa-prisao-de-ventre
    grupo: estomago_intestino
    queixa: "prisão de ventre ou mudança no intestino"
    como_a_pessoa_fala: ["intestino preso", "fico dias sem evacuar", "prisão de ventre", "não consigo fazer cocô", "intestino mudou", "diarreia há semanas", "intestino desregulado", "alterno diarreia e intestino preso"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Gastroenterologia", esp_id: esp-gastroenterologia}
      - {cfm: "Coloproctologia", esp_id: esp-coloproctologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "prisão de ventre que não melhora com 12 semanas de tratamento -> Gastroenterologia"
      - "diarreia por mais de 4 semanas sem diagnóstico, ou suspeita de doença inflamatória do intestino -> Gastroenterologia"
      - "mudança do hábito do intestino com suspeita de tumor, quando a colonoscopia não é feita com o clínico -> Gastroenterologia ou Coloproctologia"
    sinais_de_emergencia_citados_na_fonte: []
    sinais_de_alarme_sem_emergencia:
      - "mudança do intestino que persiste, com perda de peso, sangue nas fezes ou anemia"
    fonte: "TelessaúdeRS Gastroenterologia (14), protocolo 13 – Diarreia e protocolo 14 – Constipação; TelessaúdeRS Proctologia Adulto (49), protocolos 8 e 9"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-gastroenterologia, esp-coloproctologia]
    lacuna: false

  - id: esp-queixa-sangue-nas-fezes
    grupo: estomago_intestino
    queixa: "sangue nas fezes"
    como_a_pessoa_fala: ["saiu sangue no cocô", "sangue no papel higiênico", "fezes com sangue", "sangramento pelo ânus", "cocô escuro", "sangue vivo quando evacuo", "sangue nas fezes há semanas"]
