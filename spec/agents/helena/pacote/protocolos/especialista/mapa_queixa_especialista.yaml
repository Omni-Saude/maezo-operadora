    queixa: "problema de saúde causado pelo trabalho"
    como_a_pessoa_fala: ["LER", "doença do trabalho", "acidente de trabalho", "meu trabalho me deixou doente", "burnout", "perdi audição por barulho na fábrica", "alergia de pele por produto do trabalho", "problema de voz por dar aula"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Medicina do trabalho", esp_id: esp-medicina-do-trabalho}
    quando_vai_direto_ao_especialista:
      - "necessidade de avaliar se a doença tem relação com o trabalho (nexo) -> Medicina do trabalho / saúde do trabalhador"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "acidente de trabalho com risco de vida (intoxicação, tentativa de suicídio), corte grave ou amputação", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "acidente de trabalho com risco de perder um membro", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Doenças relacionadas ao trabalho (73), protocolos 1 a 7; Saúde de A a Z — Síndrome de burnout"
