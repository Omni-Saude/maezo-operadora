  - id: esp-queixa-alergia
    grupo: alergia
    queixa: "alergia (a alimento, remédio, picada) ou reação alérgica forte no passado"
    como_a_pessoa_fala: ["tenho alergia a camarão", "alergia a remédio", "alergia a dipirona", "já tive choque anafilático", "inchei todo depois de comer", "alergia a picada de abelha", "teste de alergia", "alergia a leite"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Alergia e imunologia", esp_id: esp-alergia-e-imunologia}
    quando_vai_direto_ao_especialista:
      - "quem já teve reação grave (anafilaxia) -> Alergia e imunologia"
      - "sintomas alérgicos no corpo todo ligados a alimento, ou alergias alimentares múltiplas -> Alergia e imunologia"
    fonte_indica_especialista_quando:
      - "alergia a remédio: a fonte cita critérios (reações que começaram após 48 horas de uso, sem sintomas graves, não precisam de especialista)"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "reação alérgica com falta de ar, chiado, inchaço na boca ou garganta, tontura ou desmaio", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "reação a remédio com bolhas, pele descolando, feridas na boca e olhos, ou febre", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Imunologia (30), protocolos 4 – Anafilaxia, 5 – Alergia alimentar, 6 – Alergia medicamentosa"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-alergia-e-imunologia]
    lacuna: false

  - id: esp-queixa-infeccoes-de-repeticao
    grupo: alergia
    queixa: "infecções que se repetem muito (imunidade baixa)"
    como_a_pessoa_fala: ["vivo doente", "pego infecção toda hora", "imunidade baixa", "pneumonia de repetição", "minha imunidade é fraca", "infecções graves várias vezes"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Alergia e imunologia", esp_id: esp-alergia-e-imunologia}
      - {cfm: "Infectologia", esp_id: esp-infectologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "suspeita de imunidade fraca de nascença (erro inato da imunidade) quando há 2 ou mais sinais de alerta da fonte, afastadas outras causas — por exemplo: várias pneumonias ou sinusites graves no ano, abscessos que voltam, precisar de antibiótico na veia, infecções graves no sangue, história na família -> Imunologia"
    sinais_de_emergencia_citados_na_fonte: []
    nota: "A lista de sinais do adulto no protocolo 8 deve ser conferida na revisão médica."
    fonte: "TelessaúdeRS Imunologia (30), protocolo 8 – Erros inatos da imunidade"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-alergia-e-imunologia, esp-infectologia]
    lacuna: parcial

# ============================== INFECÇÃO ==============================
  - id: esp-queixa-ist-hiv
    grupo: infeccao
    queixa: "HIV, sífilis ou outras infecções sexualmente transmissíveis"
    como_a_pessoa_fala: ["acho que peguei uma IST", "HIV positivo", "sífilis", "teste de HIV", "doença venérea", "ferida no pênis", "PrEP", "transei sem camisinha"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Infectologia", esp_id: esp-infectologia}
    quando_vai_direto_ao_especialista:
      - "pessoa vivendo com HIV com imunidade muito baixa -> serviço especializado em HIV ou Infectologia"
      - "suspeita de neurossífilis -> Infectologia (após emergência, se precisar)"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "pessoa com HIV com fraqueza de um lado, perda de visão de repente, nuca dura, falta de ar forte ou febre que não passa", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "sífilis com sintomas neurológicos ou nos olhos que começaram há pouco", destino_sugerido: PRONTO_SOCORRO_AGORA}
    nota: "Exposição de risco recente (PEP) é tema de triagem/tempo, não deste mapa."
    fonte: "TelessaúdeRS Infectologia (27), protocolos 4 – Sífilis e 5 – HIV; Saúde de A a Z — Aids/HIV, IST, Sífilis"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-infectologia]
    lacuna: false

  - id: esp-queixa-tuberculose
    grupo: infeccao
    queixa: "tuberculose (suspeita ou tratamento)"
    como_a_pessoa_fala: ["tosse há 3 semanas", "tuberculose", "contato com quem tem tuberculose", "suor à noite e emagrecendo", "teste de tuberculose", "tratamento de tuberculose"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Infectologia", esp_id: esp-infectologia}
      - {cfm: "Pneumologia", esp_id: esp-pneumologia}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "o diagnóstico e o tratamento comum são feitos na atenção primária; vai ao especialista em situações da fonte (resistência, efeitos colaterais, tuberculose fora do pulmão)"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "tosse com muito sangue", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "falta de ar forte", destino_sugerido: LIGAR_192_AGORA}
      - {sinal: "dor de cabeça, nuca dura ou confusão em quem tem tuberculose", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Infectologia (27), protocolo 1 – Tuberculose; Saúde de A a Z — Tuberculose"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-infectologia, esp-pneumologia]
    lacuna: false

  - id: esp-queixa-febre-ou-infeccao-sem-causa
    grupo: infeccao
    queixa: "febre que vai e volta ou infecção sem explicação"
    como_a_pessoa_fala: ["febre há semanas", "febre baixa todo dia", "infecção que não cura", "voltei de viagem com febre", "doença de Chagas", "toxoplasmose", "micose profunda"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Infectologia", esp_id: esp-infectologia}
    quando_vai_direto_ao_especialista: []
    sinais_de_emergencia_citados_na_fonte: []
    nota: "O TelessaúdeRS não tem protocolo de 'febre sem causa'; há protocolos específicos (Chagas, toxoplasmose, micoses). Febre aguda vai para a triagem."
    fonte: "TelessaúdeRS Infectologia (27), protocolos 2, 8 e 9 (temas específicos); Resolução CFM 2.380/2024 (Infectologia; área de atuação Medicina tropical)"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-infectologia]
    lacuna: true

# ============================== DOR CRÔNICA ==============================
  - id: esp-queixa-dor-cronica
    grupo: dor_cronica
    queixa: "dor crônica que não melhora"
    como_a_pessoa_fala: ["dor crônica", "convivo com dor há anos", "nenhum remédio tira minha dor", "dor no rosto em choque", "neuralgia do trigêmeo", "dor depois do herpes-zóster", "dor do membro amputado", "clínica de dor"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Área de atuação Dor (CFM; exige Acupuntura, Anestesiologia, Clínica médica, Medicina física e reabilitação, Neurocirurgia, Neurologia, Ortopedia, Pediatria ou Reumatologia)", esp_id: null}
      - {cfm: "Neurologia", esp_id: esp-neurologia, quando: "neuralgia do trigêmeo, dor de nervo"}
      - {cfm: "Medicina física e reabilitação", esp_id: esp-medicina-fisica-e-reabilitacao}
      - {cfm: "Acupuntura", esp_id: esp-acupuntura}
      - {cfm: "Anestesiologia", esp_id: esp-anestesiologia, quando: "equipes de dor costumam ser lideradas por anestesiologistas"}
    quando_vai_direto_ao_especialista:
      - "suspeita de neuralgia do trigêmeo -> Neurologia ou Tratamento da dor"
      - "dor do membro fantasma, síndrome dolorosa complexa regional, dor depois de AVC ou lesão da medula -> Tratamento da dor"
    fonte_indica_especialista_quando:
      - "dores crônicas específicas (fibromialgia, lombar, artrose, túnel do carpo operado) que não melhoram com tratamento por 3 a 6 meses -> equipe de dor"
    sinais_de_emergencia_citados_na_fonte: []
    nota: "A base da Helena não tem esp-*.yaml para a área de atuação Dor (lacuna da base, não da fonte)."
    fonte: "TelessaúdeRS Tratamento da Dor (57), protocolos 1 a 11 (em revisão)"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-neurologia, esp-medicina-fisica-e-reabilitacao, esp-acupuntura, esp-anestesiologia]
    lacuna: false

# ============================== OUTROS ==============================
  - id: esp-queixa-doenca-do-trabalho
