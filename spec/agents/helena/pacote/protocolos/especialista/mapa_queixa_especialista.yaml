# ============================== URINÁRIO E PRÓSTATA ==============================
  - id: esp-queixa-dificuldade-para-urinar
    grupo: urinario
    queixa: "dificuldade para urinar, jato fraco ou urinar muitas vezes"
    como_a_pessoa_fala: ["jato de urina fraco", "levanto várias vezes à noite pra urinar", "demoro pra começar a urinar", "sensação de que não esvaziou", "urina pingando no final", "vontade toda hora de urinar", "próstata aumentada"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Urologia", esp_id: esp-urologia}
    quando_vai_direto_ao_especialista:
      - "sintomas urinários com pedra na bexiga, doença neurológica ou cirurgia/radioterapia na pelve -> Urologia"
      - "retenção crônica de urina -> Urologia"
    fonte_indica_especialista_quando:
      - "sintomas que não melhoram com o tratamento clínico da próstata"
      - "infecção urinária que se repete"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "não consegue urinar nada, com a bexiga cheia e dolorida", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Urologia Adulto (64), protocolo 1 – Sintomas do trato urinário inferior"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-urologia]
    lacuna: false

  - id: esp-queixa-dor-ou-ardencia-ao-urinar
    grupo: urinario
    queixa: "ardência ou dor ao urinar, infecção urinária de repetição"
    como_a_pessoa_fala: ["arde pra fazer xixi", "infecção urinária", "cistite", "infecção urinária toda hora", "dor no pé da barriga ao urinar", "urina com cheiro forte", "bexiga dolorida"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Urologia", esp_id: esp-urologia, quando: "alteração anatômica ou neurológica que causa infecções"}
      - {cfm: "Nefrologia", esp_id: esp-nefrologia, quando: "infecções que continuam mesmo com prevenção adequada"}
      - {cfm: "Ginecologia e obstetrícia", esp_id: esp-ginecologia-e-obstetricia, quando: "alteração ginecológica que causa infecções"}
    quando_vai_direto_ao_especialista: []
    fonte_indica_especialista_quando:
      - "infecção de repetição = 2 ou mais em 6 meses, ou 3 ou mais em um ano"
      - "bexiga dolorida crônica sem infecção que não melhora em 3 meses -> Urologia"
    sinais_de_emergencia_citados_na_fonte: []
    nota: "Infecção urinária isolada é cuidada pelo clínico; o TelessaúdeRS não tem protocolo da cistite simples. Febre com dor nas costas vai para a triagem."
    fonte: "TelessaúdeRS Urologia Adulto (64), protocolo 9 – ITU recorrente e protocolo 11; TelessaúdeRS Nefrologia Adulto (37), protocolo 3"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-urologia, esp-nefrologia, esp-ginecologia-e-obstetricia]
    lacuna: parcial

  - id: esp-queixa-sangue-na-urina
    grupo: urinario
    queixa: "sangue na urina"
    como_a_pessoa_fala: ["urina com sangue", "xixi vermelho", "urina cor de coca-cola", "deu sangue no exame de urina", "hematúria", "coágulo na urina"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Urologia", esp_id: esp-urologia}
      - {cfm: "Nefrologia", esp_id: esp-nefrologia, quando: "sangue de origem no rim (glomérulo)"}
    quando_vai_direto_ao_especialista:
      - "sangue visível na urina com coágulos, sem infecção -> Urologia"
    fonte_indica_especialista_quando:
      - "sangue visível confirmado em exame, sem sinais de doença do rim -> Urologia"
      - "sangue só no exame, confirmado duas vezes, conforme risco -> Urologia ou Nefrologia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "sangue na urina e não consegue urinar", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "sangue na urina com febre alta, tontura ou dor muito forte", destino_sugerido: PRONTO_SOCORRO_AGORA}
    nota: "A fonte pede descartar antes causas comuns (infecção, menstruação, trauma)."
    fonte: "TelessaúdeRS Urologia Adulto (64), protocolo 8 – Hematúria; TelessaúdeRS Nefrologia Adulto (37), protocolo 7 – Hematúria"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-urologia, esp-nefrologia]
    lacuna: false

  - id: esp-queixa-incontinencia
    grupo: urinario
    queixa: "perda de urina"
    como_a_pessoa_fala: ["escapa xixi quando tusso", "perco urina", "não seguro o xixi", "uso fralda por causa da urina", "bexiga caída", "incontinência urinária", "molho a calcinha quando espirro"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Ginecologia e obstetrícia", esp_id: esp-ginecologia-e-obstetricia}
      - {cfm: "Urologia", esp_id: esp-urologia}
      - {profissao: "Fisioterapia (pélvica)", esp_id: esp-fisioterapia}
    quando_vai_direto_ao_especialista:
      - "perda de urina com 'bola na vagina' (prolapso) e desejo de cirurgia -> Ginecologia"
    fonte_indica_especialista_quando:
      - "perda de urina que não melhora com cerca de 3 meses de tratamento -> Ginecologia ou Urologia"
      - "perda de urina com infecções de repetição, dor pélvica, doença neurológica ou cirurgia/radioterapia na pelve -> Ginecologia ou Urologia"
    sinais_de_emergencia_citados_na_fonte: []
    nota: "O TelessaúdeRS tem material ao paciente sobre exercícios do assoalho pélvico (Kegel) e treinamento vesical (referência)."
    fonte: "TelessaúdeRS Ginecologia Adulto (21), protocolo 6 – Incontinência urinária e protocolo 5 – Estática pélvica"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-ginecologia-e-obstetricia, esp-urologia, esp-fisioterapia]
    lacuna: false

  - id: esp-queixa-calculo-renal
    grupo: urinario
    queixa: "pedra no rim"
    como_a_pessoa_fala: ["tenho pedra no rim", "cálculo renal", "já tive crise de cólica renal", "pedra no rim de novo", "ultrassom mostrou pedra", "dor nas costas que vai para a virilha"]
    especialista_primeiro: *porta_adulto
    especialista_depois:
      - {cfm: "Urologia", esp_id: esp-urologia}
      - {cfm: "Nefrologia", esp_id: esp-nefrologia, quando: "pedras que se repetem por causa metabólica"}
    quando_vai_direto_ao_especialista:
      - "pedra no ureter maior que 10 mm, pedra no rim maior que 10 mm, pedra grande ramificada ou pedra na bexiga -> Urologia"
      - "pedra no rim que dá crises repetidas de dor -> Urologia"
    fonte_indica_especialista_quando:
      - "pedra pequena no ureter que não saiu em 4 semanas -> Urologia"
    sinais_de_emergencia_citados_na_fonte:
      - {sinal: "dor de pedra no rim que não alivia com o tratamento", destino_sugerido: PRONTO_SOCORRO_AGORA}
      - {sinal: "pedra no rim com febre ou calafrios", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Urologia Adulto (64), protocolo 5 – Litíase renal; TelessaúdeRS Nefrologia Adulto (37), protocolo 4"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-urologia, esp-nefrologia]
