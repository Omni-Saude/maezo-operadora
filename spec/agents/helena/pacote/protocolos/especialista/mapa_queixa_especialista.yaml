      - {sinal: "pele vermelha no corpo todo com bolhas, pus ou febre, ou feridas na boca e nos olhos depois de remédio", destino_sugerido: PRONTO_SOCORRO_AGORA}
    fonte: "TelessaúdeRS Dermatologia (12), protocolos 4, 5, 7 – Psoríase, 9 – Urticária, 10 – Prurido; TelessaúdeRS Imunologia (30), protocolos 1 e 6"
    esp_id_na_base: [esp-clinica-medica, esp-medicina-de-familia-e-comunidade, esp-dermatologia, esp-alergia-e-imunologia]
    lacuna: false

