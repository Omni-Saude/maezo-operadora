  "Fisioterapia": "o fisioterapeuta"
  "Nutrição": "o nutricionista"

# ---------------------------------------------------------------------------------------------------------------
# 7. O que a Helena NUNCA diz neste protocolo (para os testes de cerca de saída)
# ---------------------------------------------------------------------------------------------------------------
proibido:
  - 'diagnóstico: "você tem ...", "isso é ...", "parece ser ..."'
  - 'conduta: "tome ...", "use ...", qualquer remédio, dose ou exame a fazer'
  - 'minimizar: "não é grave", "é normal", "pode esperar"' 
  - prazo da ANS ou qualquer prazo para conseguir consulta
  - link, endereço de site ou QR code
  - 'cobertura: "o plano cobre", "tem cobertura", "está no rol"'
  - 'ordem de rota: "você precisa ir direto ao especialista" (o campo quando_vai_direto_ao_especialista é de uso interno)' 
  - ler para a pessoa a lista de sinais de emergência do mapa (quem pergunta é a triagem)
