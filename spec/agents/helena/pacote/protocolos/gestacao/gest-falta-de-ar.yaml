    secao: "§2.6 Sinais de alerta na gestação (p. 28)"
  - nome: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018)"
    secao: "Fluxograma 4 – Falta de ar/sintomas respiratórios (p. 41)"
  - nome: "Manual de Gestação de Alto Risco (MS, 2022, versão preliminar)"
    secao: "cap. 51 (p. 525)"
lacuna: false
