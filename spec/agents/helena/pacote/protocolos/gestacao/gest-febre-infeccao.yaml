# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: gest-febre-infeccao
tema: gestacao
titulo: "Febre ou sinais de infecção na gestação"
publico: gestante
como_a_pessoa_fala:
  - "estou grávida e com febre"
  - "deu 38 graus, estou gestante"
  - "febre e calafrios na gravidez"
  - "estou com dengue e grávida"
  - "manchas vermelhas no corpo, estou grávida"
  - "febre e dor no corpo, gestante"
  - "corrimento com mau cheiro e febre na gravidez"
  - "olhos vermelhos e febre na gestação"
perguntas_de_alerta:
  - pergunta: "Teve convulsão, desmaiou, ou está com muita falta de ar ou confusa?"
    sinal: sinais_de_gravidade
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 5 (p. 42) – vermelho: convulsão em atividade, sinais de choque; laranja: padrão respiratório ineficaz; Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28) – convulsões, desmaio, falta de ar"
  - pergunta: "Está com febre (37,8 °C ou mais)?"
    sinal: febre
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28) – febre ≥ 37,8 °C (buscar atendimento imediatamente); Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 5 (p. 42) – amarelo: febre 38,0-39,9 °C"
  - pergunta: "Apareceram manchas vermelhas na pele ou vermelhidão nos olhos?"
    sinal: exantema_ou_conjuntivite
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28) – manchas vermelhas na pele ou vermelhidão nos olhos; Dengue: diagnóstico e manejo clínico – adulto e criança, 6ª ed. (MS, 2024), §2.5 (p. 19: gestante com dengue precisa de vigilância)"
  - pergunta: "Está com dor de cabeça forte ou diferente do habitual, visão embaçada, pontos luminosos ou escurecimento da vista, ou dor forte no estômago, logo abaixo das costelas?"
    sinal: sinais_de_pre_eclampsia
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28); Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §4.4.1 (p. 41-42); Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), fluxogramas 2-8 (laranja: PA ≥ 140/90 com dor de cabeça, de estômago ou alterações visuais)"
destino_se_nenhum_sinal: ATENDIMENTO_HOJE
especialista:
  primeiro: "Ginecologia e obstetrícia (equipe do pré-natal)"
  depois: "Ginecologia e obstetrícia (pré-natal de alto risco, se indicado)"
  fonte: "Caderneta da Gestante 2026, §4.1.4 e §4.1.5 (pré-natal e alto risco); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Beba bastante líquido e não tome remédio por conta própria. Na gestação, febre sempre precisa de avaliação. Na gestação, 'pronto-socorro agora' quer dizer ir agora à sua maternidade de referência. Se piorar ou aparecer algum sinal de alerta, vá à sua maternidade de referência ou ligue 192."
fontes:
  - nome: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026)"
    secao: "§2.6 Sinais de alerta na gestação (p. 28)"
  - nome: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018)"
    secao: "Fluxograma 5 – Febre/sinais de infecção (p. 42)"
  - nome: "Dengue: diagnóstico e manejo clínico – adulto e criança, 6ª ed. (MS, 2024)"
    secao: "§2.5 (p. 19)"
lacuna: false
revisao_medica: pendente
licenca_atencao: "Caderneta da Gestante 2026 e Manual de Obstetrícia 2018: CC BY-NC-SA 4.0 — pendente jurídico; Dengue 2024: CC BY-NC-SA 4.0"
