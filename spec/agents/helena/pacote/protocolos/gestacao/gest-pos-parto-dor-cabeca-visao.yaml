id: gest-pos-parto-dor-cabeca-visao
tema: gestacao
titulo: "Dor de cabeça forte, visão turva ou inchaço no pós-parto"
publico: puerpera
como_a_pessoa_fala:
  - "dor de cabeça forte depois do parto"
  - "minha vista está embaçada no resguardo"
  - "pressão alta depois do parto"
  - "inchaço no rosto depois de ter o bebê"
  - "vendo pontos brilhantes no pós-parto"
  - "dor de cabeça que não passa depois da cesárea"
  - "tive pré-eclâmpsia e agora estou com dor de cabeça"
  - "rosto e mãos inchados no pós-parto"
perguntas_de_alerta:
  - pergunta: "Você teve convulsão ou desmaio, está confusa, ou com falta de ar forte ou dor no peito?"
    sinal: emergencia_pos_parto
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – convulsões, desmaio, dor no peito, falta de ar; SAMU 192 – Quando chamar (MS, página gov.br) – crises convulsivas, dores no peito de aparecimento súbito"
  - pergunta: "A dor de cabeça é forte ou diferente do habitual, ou você está com visão embaçada, pontos luminosos ou escurecimento?"
    sinal: cefaleia_ou_alteracao_visual
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – dor de cabeça forte ou diferente do habitual; alterações na visão; Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §4.4.1 (p. 41: medir pressão também no pós-parto)"
  - pergunta: "Teve inchaço de repente no rosto, nas mãos ou nas pernas?"
    sinal: edema_subito
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – inchaço repentino no rosto, mãos ou pernas"
