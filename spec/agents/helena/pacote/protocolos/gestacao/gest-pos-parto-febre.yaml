# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: gest-pos-parto-febre
tema: gestacao
titulo: "Febre no pós-parto"
publico: puerpera
como_a_pessoa_fala:
  - "tive bebê há 5 dias e estou com febre"
  - "febre depois da cesárea"
  - "estou com calafrios no pós-parto"
  - "febre no resguardo"
  - "38 graus depois do parto"
  - "dor na barriga e febre depois do parto"
  - "estou de resguardo e com febre"
  - "febre e mama doendo"
perguntas_de_alerta:
  - pergunta: "Você teve convulsão ou desmaio, está confusa, ou com falta de ar forte ou dor no peito?"
    sinal: emergencia_pos_parto
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – convulsões, desmaio, dor no peito, falta de ar; SAMU 192 – Quando chamar (MS, página gov.br) – crises convulsivas, dores no peito de aparecimento súbito"
  - pergunta: "Está com febre (37,8 °C ou mais)?"
    sinal: febre_pos_parto
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – febre ≥ 37,8 °C (procurar serviço imediatamente); Manual de Gestação de Alto Risco (MS, 2022, versão preliminar), cap. 38 Sepse na gestação (p. 397: puerpério e cesárea como risco)"
  - pergunta: "O sangramento está com mau cheiro, ou você tem dor forte e contínua na barriga ou na pelve?"
    sinal: infeccao_uterina
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – sangramento com mau cheiro; dor forte e persistente no abdome ou na pelve"
  - pergunta: "Os pontos ou a cicatriz da cesárea estão vermelhos, inchados, com secreção ou mau cheiro?"
    sinal: infeccao_ferida
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §6.2 Seu corpo fala: fique atenta aos sinais (p. 69) – sinais de infecção na ferida operatória ou no períneo; Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 5 (p. 42) – amarelo: infecção de sítio cirúrgico com febre"
destino_se_nenhum_sinal: ATENDIMENTO_HOJE
especialista:
  primeiro: "Ginecologia e obstetrícia (equipe do pré-natal / consulta pós-parto)"
  depois: "Ginecologia e obstetrícia"
  fonte: "Caderneta da Gestante 2026, Parte VI (puerpério) e §6.5 (plano de pós-parto); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "No pós-parto, febre precisa ser avaliada logo. Continue amamentando, beba líquidos e leve sua caderneta. Não tome remédio por conta própria. Na gestação, 'pronto-socorro agora' quer dizer ir agora à sua maternidade de referência. Se piorar ou aparecer algum sinal de alerta, vá à sua maternidade de referência ou ligue 192."
fontes:
  - nome: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026)"
    secao: "§6.1 (p. 67-68); §6.2 Seu corpo fala (p. 69)"
  - nome: "Manual de Gestação de Alto Risco (MS, 2022, versão preliminar)"
    secao: "cap. 38 Sepse na gestação (p. 397)"
  - nome: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018)"
    secao: "Fluxograma 5 (p. 42)"
lacuna: false
revisao_medica: pendente
