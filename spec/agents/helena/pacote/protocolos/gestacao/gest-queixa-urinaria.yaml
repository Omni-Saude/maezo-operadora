# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: gest-queixa-urinaria
tema: gestacao
titulo: "Dor ou ardência para urinar na gestação"
publico: gestante
como_a_pessoa_fala:
  - "estou grávida com ardência para fazer xixi"
  - "dor para urinar na gravidez"
  - "infecção urinária na gestação"
  - "vontade de fazer xixi toda hora e arde"
  - "xixi com sangue, estou grávida"
  - "dor nas costas e febre, gestante"
  - "urina com cheiro forte na gravidez"
  - "não consigo fazer xixi"
perguntas_de_alerta:
  - pergunta: "Está com febre (37,8 °C ou mais), calafrios, ou dor nas costas, na altura dos rins?"
    sinal: febre_ou_dor_lombar
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28) – febre ≥ 37,8 °C; Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §4.4.3 (p. 42-43: febre, dor nas costas, risco de infecção nos rins); Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 9 (p. 46) – amarelo: febre 38,0-39,9 °C"
  - pergunta: "A dor está muito forte (nota 7 a 10 de 10)?"
    sinal: dor_intensa
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 9 (p. 46) – laranja: dor intensa 7-10/10"
  - pergunta: "Está com dor de cabeça forte ou diferente do habitual, visão embaçada, pontos luminosos ou escurecimento da vista, ou dor forte no estômago, logo abaixo das costelas?"
    sinal: sinais_de_pre_eclampsia
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28); Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §4.4.1 (p. 41-42); Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), fluxogramas 2-8 (laranja: PA ≥ 140/90 com dor de cabeça, de estômago ou alterações visuais)"
  - pergunta: "Você não consegue urinar, ou sai muito pouco mesmo com vontade?"
    sinal: retencao_urinaria
    destino_se_sim: ATENDIMENTO_HOJE
    fonte: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 9 (p. 46) – amarelo: retenção urinária"
destino_se_nenhum_sinal: ATENDIMENTO_HOJE
especialista:
  primeiro: "Ginecologia e obstetrícia (equipe do pré-natal)"
  depois: "Ginecologia e obstetrícia (pré-natal de alto risco, se indicado)"
  fonte: "Caderneta da Gestante 2026, §4.1.4 e §4.1.5 (pré-natal e alto risco); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Infecção urinária é comum na gestação e precisa de avaliação rápida, porque pode levar a parto prematuro. Beba bastante água e não segure o xixi. Se piorar ou aparecer algum sinal de alerta, vá à sua maternidade de referência ou ligue 192."
fontes:
  - nome: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026)"
    secao: "§2.6 Sinais de alerta na gestação (p. 28)"
  - nome: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026)"
    secao: "§4.4.3 Infecção urinária (p. 42-43)"
  - nome: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018)"
    secao: "Fluxograma 9 – Queixas urinárias (p. 46)"
lacuna: false
revisao_medica: pendente
