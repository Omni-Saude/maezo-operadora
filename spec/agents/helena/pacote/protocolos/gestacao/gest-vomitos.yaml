# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: gest-vomitos
tema: gestacao
titulo: "Vômitos intensos na gestação"
publico: gestante
como_a_pessoa_fala:
  - "estou grávida e vomitando muito"
  - "não paro nada no estômago, grávida"
  - "enjoo forte na gravidez"
  - "vomito o dia todo, estou gestante"
  - "não consigo nem beber água na gravidez"
  - "hiperêmese"
  - "vômito e tontura na gestação"
  - "enjoo que não passa com 10 semanas"
perguntas_de_alerta:
  - pergunta: "Você desmaiou, ou está muito tonta, pálida, suando frio ou confusa?"
    sinal: sinais_de_choque
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 8 (p. 45) – vermelho: sinais de choque, não responsiva; Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), descritor c (p. 50: palidez, sudorese fria, alteração de consciência); Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28) – desmaio"
  - pergunta: "Fica muito tonta ou quase desmaia quando levanta?"
    sinal: desidratacao_com_repercussao
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 6 (p. 43) – laranja: sinais de desidratação com repercussão hemodinâmica; Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), descritor e (p. 50)"
  - pergunta: "Está com dor de cabeça forte ou diferente do habitual, visão embaçada, pontos luminosos ou escurecimento da vista, ou dor forte no estômago, logo abaixo das costelas?"
    sinal: sinais_de_pre_eclampsia
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §2.6 Sinais de alerta na gestação (p. 28); Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026), §4.4.1 (p. 41-42); Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), fluxogramas 2-8 (laranja: PA ≥ 140/90 com dor de cabeça, de estômago ou alterações visuais)"
  - pergunta: "Não consegue manter nada no estômago, nem água, está com a boca muito seca ou urinando muito pouco?"
    sinal: desidratacao
    destino_se_sim: ATENDIMENTO_HOJE
    fonte: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018), Fluxograma 6 (p. 43) – amarelo: vômitos com sinais de desidratação sem repercussão hemodinâmica"
destino_se_nenhum_sinal: CONSULTA_EM_BREVE
especialista:
  primeiro: "Ginecologia e obstetrícia (equipe do pré-natal)"
  depois: "Ginecologia e obstetrícia (pré-natal de alto risco, se indicado)"
  fonte: "Caderneta da Gestante 2026, §4.1.4 e §4.1.5 (pré-natal e alto risco); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Pequenas refeições ao longo do dia e líquidos em pequenos goles costumam ajudar. Se o enjoo for intenso ou persistente, procure a equipe do pré-natal. Se piorar ou aparecer algum sinal de alerta, vá à sua maternidade de referência ou ligue 192."
fontes:
  - nome: "Manual de Acolhimento e Classificação de Risco em Obstetrícia (MS, 2018)"
    secao: "Fluxograma 6 – Náuseas e vômitos (p. 43)"
  - nome: "Caderneta Brasileira da Gestante, 1ª ed. (MS, 2026)"
    secao: "§2.3 (p. 25: enjoo intenso ou persistente → procurar a equipe)"
lacuna: false
revisao_medica: pendente
