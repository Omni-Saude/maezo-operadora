# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: tri-crianca-0-2m-diarreia-vomito
tema: triagem_criancas
titulo: "Diarreia ou vômito no bebê com menos de 2 meses"
publico: crianca_0_2m
como_a_pessoa_fala:
  - "meu bebê está com diarreia"
  - "o neném está vomitando"
  - "recém-nascido com cocô muito mole"
  - "bebê vomitando todas as mamadas"
  - "tem sangue no cocô do meu bebê"
  - "o bebê está fazendo pouco xixi"
  - "neném de 1 mês com fezes líquidas"
  - "meu bebê está golfando muito"
perguntas_de_alerta:
  - pergunta: "O bebê teve convulsão (tremores ou 'ataque'), ficou roxo, parou de respirar por alguns segundos, ou está tão molinho que não acorda?"
    sinal: convulsao_apneia_cianose_ou_nao_acorda
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses); Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), cap. 7.2, Exemplo 9 (p. 126: quadro DOENÇA GRAVE) – convulsões, apneia, cianose central, letargia/inconsciência"
  - pergunta: "Ele vomita tudo o que mama ou não consegue mamar?"
    sinal: nao_mama_ou_vomita_tudo
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses) – não consegue mamar; Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), cap. 7.2, Exemplo 9 (p. 126: quadro DOENÇA GRAVE) – vomita tudo"
  - pergunta: "Ele está com sinais de desidratação: olhos fundos, chora sem lágrimas, faz pouco xixi ou xixi escuro, ou a pele da barriga, puxada de leve, demora para voltar?"
    sinal: desidratacao
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses) – pele com pouca elasticidade, urina escura; Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 21 (sinais de desidratação)"
  - pergunta: "Tem sangue no cocô?"
    sinal: sangue_nas_fezes
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses) – fezes com sangue; Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), §12.6.2 (p. 215-216: quando retornar de imediato)"
destino_se_nenhum_sinal: ATENDIMENTO_HOJE
especialista:
  primeiro: "Pediatria"
  depois: "Pediatria (encaminha a outra especialidade se precisar)"
  fonte: "Lacuna: sem protocolo oficial de encaminhamento pediátrico verificado; regra fixa do levantamento (Protocolos_Helena_Fontes.xlsx, 'Quadro por tema': pediatra como porta de entrada); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Bebês que mamam só no peito podem ter cocô mole, várias vezes ao dia, e isso pode ser normal se o bebê estiver bem. Se for diarreia ou vômito de verdade, ele deve ser examinado no mesmo dia. Continue oferecendo o peito. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
