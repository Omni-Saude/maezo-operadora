# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: tri-crianca-0-2m-respiracao
tema: triagem_criancas
titulo: "Tosse, chiado ou falta de ar no bebê com menos de 2 meses"
publico: crianca_0_2m
como_a_pessoa_fala:
  - "meu bebê está com tosse"
  - "o neném está com o peito chiando"
  - "recém-nascido respirando rápido"
  - "bebê com falta de ar"
  - "o bebê está gemendo para respirar"
  - "neném de 1 mês com nariz entupido e cansado"
  - "a barriguinha do bebê afunda quando respira"
  - "meu bebê está cansadinho para respirar"
perguntas_de_alerta:
  - pergunta: "O bebê teve convulsão (tremores ou 'ataque'), ficou roxo, parou de respirar por alguns segundos, ou está tão molinho que não acorda?"
    sinal: convulsao_apneia_cianose_ou_nao_acorda
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses); Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), cap. 7.2, Exemplo 9 (p. 126: quadro DOENÇA GRAVE) – convulsões, apneia, cianose central, letargia/inconsciência"
  - pergunta: "Ele está respirando muito rápido ou com esforço (gemendo, abrindo e fechando as narinas, a pele embaixo das costelas afunda) ou faz chiado ou barulho ao respirar?"
    sinal: dificuldade_para_respirar_ou_chiado
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses) – cansaço, dificuldade ou respiração muito rápida; Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), cap. 7.2, Exemplo 9 (p. 126: quadro DOENÇA GRAVE) – tiragem subcostal grave, batimento de asas do nariz, gemido, estridor ou sibilância, FR ≥ 60"
  - pergunta: "O bebê não consegue mamar ou vomita tudo o que mama?"
    sinal: nao_mama_ou_vomita_tudo
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses) – não consegue mamar; Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), cap. 7.2, Exemplo 9 (p. 126: quadro DOENÇA GRAVE) – não consegue mamar, vomita tudo"
  - pergunta: "Você mediu a temperatura e deu 37,5 °C ou mais, ou o bebê está frio (35,5 °C ou menos)?"
    sinal: febre_ou_hipotermia
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – menores de 2 meses) – febre ≥ 37,5 °C e temperatura ≤ 35,5 °C; Manual AIDPI Neonatal, 5ª ed. (MS/OPAS, 2014), cap. 7.2, Exemplo 9 (p. 126: quadro DOENÇA GRAVE) – temperatura axilar < 36 °C ou ≥ 37,5 °C"
destino_se_nenhum_sinal: ATENDIMENTO_HOJE
especialista:
  primeiro: "Pediatria"
  depois: "Pediatria (encaminha a outra especialidade se precisar)"
  fonte: "Lacuna: sem protocolo oficial de encaminhamento pediátrico verificado; regra fixa do levantamento (Protocolos_Helena_Fontes.xlsx, 'Quadro por tema': pediatra como porta de entrada); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Em bebês com menos de 2 meses, tosse ou dificuldade para respirar pede avaliação no mesmo dia. Mantenha a amamentação e observe a respiração com o bebê calmo. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
