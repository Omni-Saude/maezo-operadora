  fonte: "Lacuna: sem protocolo oficial de encaminhamento pediátrico verificado; regra fixa do levantamento (Protocolos_Helena_Fontes.xlsx, 'Quadro por tema': pediatra como porta de entrada); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "O coto do umbigo costuma cair até o fim da segunda semana. Mantenha o local limpo e seco e não coloque faixas, moedas ou outras coisas sobre ele. Mostre o umbigo na próxima consulta do bebê. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
