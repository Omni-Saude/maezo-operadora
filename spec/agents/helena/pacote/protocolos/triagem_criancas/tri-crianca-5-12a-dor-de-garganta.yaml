# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: tri-crianca-5-12a-dor-de-garganta
tema: triagem_criancas
titulo: "Dor de garganta (5 a 12 anos)"
publico: crianca_5_12a
como_a_pessoa_fala:
  - "meu filho de 8 anos está com dor de garganta"
  - "garganta com pus"
  - "amigdalite"
  - "a criança não consegue engolir"
  - "garganta inflamada com febre"
  - "ínguas no pescoço"
  - "voz abafada e dor forte na garganta"
  - "garganta vermelha"
perguntas_de_alerta:
  - pergunta: "Ela está com muita dificuldade para respirar?"
    sinal: obstrucao_respiratoria
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderno de Atenção Básica nº 28 vol. II – Queixas mais comuns (MS, 2013), §2.11 (p. 114: obstrução alta aguda, potencialmente fatal)"
  - pergunta: "A dor está muito forte e ela não consegue abrir a boca direito, ou a voz ficou abafada ('voz de batata quente')?"
    sinal: abscesso
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderno de Atenção Básica nº 28 vol. II – Queixas mais comuns (MS, 2013), §2.11 (p. 114: dor muito intensa, trismo, voz de batata quente → abscesso, tratamento hospitalar)"
  - pergunta: "Ela está muito sonolenta ou confusa, não consegue beber nada, ou vomita tudo o que come e bebe?"
    sinal: sinal_geral_de_perigo
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses; a Caderneta acompanha até 9 anos, 10-12 anos por extensão)"
destino_se_nenhum_sinal: CONSULTA_EM_BREVE
especialista:
  primeiro: "Pediatria"
  depois: "Otorrinolaringologia"
  fonte: "Caderno 28 vol. II, §2.11 (p. 114: abscesso de amígdala → otorrinolaringologista); Pediatria como porta de entrada (regra fixa do levantamento); nomes conforme Resolução CFM 2.380/2024"
orientacao_final: "Ofereça líquidos e alimentos frios ou pastosos. Dor de garganta com resfriado costuma melhorar sozinha; com febre alta, pus ou ínguas, a criança deve ser examinada. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
fontes:
  - nome: "Caderno de Atenção Básica nº 28 vol. II – Queixas mais comuns (MS, 2013)"
    secao: "§2.11 Dor de garganta (p. 110-115)"
  - nome: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023)"
    secao: "p. 23 (Sinais de perigo – maiores de 2 meses)"
lacuna: false
