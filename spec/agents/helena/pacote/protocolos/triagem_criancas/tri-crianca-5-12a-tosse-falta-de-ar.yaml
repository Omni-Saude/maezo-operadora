# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: tri-crianca-5-12a-tosse-falta-de-ar
tema: triagem_criancas
titulo: "Tosse, chiado ou falta de ar (5 a 12 anos)"
publico: crianca_5_12a
como_a_pessoa_fala:
  - "meu filho de 8 anos está com falta de ar"
  - "crise de asma na criança"
  - "minha filha está com chiado no peito"
  - "tosse que não passa"
  - "a bombinha não está resolvendo"
  - "criança cansada para respirar"
  - "tosse com febre há dias"
  - "meu filho está respirando rápido"
perguntas_de_alerta:
  - pergunta: "A criança teve convulsão, está desmaiada ou não acorda, ou está com muita dificuldade para respirar (lábios roxos, sem conseguir falar)?"
    sinal: convulsao_inconsciente_ou_respiracao_grave
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses; a Caderneta acompanha até 9 anos, 10-12 anos por extensão); SAMU 192 – Quando chamar (MS, página gov.br) – crises convulsivas, problemas cardiorrespiratórios"
  - pergunta: "Está respirando rápido ou com esforço (a pele entre ou embaixo das costelas afunda), ou só consegue falar frases curtas?"
    sinal: dificuldade_para_respirar
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses; a Caderneta acompanha até 9 anos, 10-12 anos por extensão) – dificuldade para respirar ou respiração rápida; AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 8-9 (fala entrecortada, tiragem – por analogia)"
  - pergunta: "Ela está muito sonolenta ou confusa, não consegue beber nada, ou vomita tudo o que come e bebe?"
    sinal: sinal_geral_de_perigo
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses; a Caderneta acompanha até 9 anos, 10-12 anos por extensão)"
  - pergunta: "Tem chiado no peito?"
    sinal: sibilancia
    destino_se_sim: ATENDIMENTO_HOJE
    fonte: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 8-9 (sibilância moderada ou leve → avaliar na unidade – por analogia, quadro até 5 anos)"
destino_se_nenhum_sinal: CONSULTA_EM_BREVE
especialista:
  primeiro: "Pediatria"
  depois: "Pediatria (encaminha a outra especialidade se precisar)"
  fonte: "Lacuna: sem protocolo oficial de encaminhamento pediátrico verificado; regra fixa do levantamento (Protocolos_Helena_Fontes.xlsx, 'Quadro por tema': pediatra como porta de entrada); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Ofereça líquidos e deixe a criança em repouso. Se ela já tem plano de tratamento para asma, siga o que o médico orientou. Tosse que dura mais de 2 semanas precisa ser investigada. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
