# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: tri-crianca-dor-de-ouvido
tema: triagem_criancas
titulo: "Dor de ouvido (2 meses a 5 anos)"
publico: crianca_2m_5a
como_a_pessoa_fala:
  - "meu filho está com dor de ouvido"
  - "a criança está puxando a orelha e chorando"
  - "está saindo pus do ouvido"
  - "minha filha reclama do ouvido"
  - "ouvido do bebê escorrendo"
  - "otite de novo"
  - "a orelha do meu filho está inchada"
  - "dor no ouvido com febre"
perguntas_de_alerta:
  - pergunta: "A criança teve convulsão (tremores ou 'ataque'), está desmaiada ou não acorda, ou está com muita dificuldade para respirar (ficando roxa, sem conseguir chorar ou falar)?"
    sinal: convulsao_inconsciente_ou_respiracao_grave
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses); AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 6 (sinais gerais de perigo) – convulsões, letárgica ou inconsciente; AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 9 (sibilância grave: choro curto ou não consegue chorar)"
  - pergunta: "Tem inchaço, vermelhidão ou dor ao tocar atrás da orelha (a orelha parece empurrada para frente)?"
    sinal: mastoidite
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 14-15 (tumefação dolorosa atrás da orelha → MASTOIDITE, referir urgentemente); Caderno de Atenção Básica nº 28 vol. II – Queixas mais comuns (MS, 2013), §2.10 (p. 108)"
  - pergunta: "Além da dor, ela está muito sonolenta, com o pescoço duro, vomitando muito, ou não consegue beber?"
    sinal: sinal_de_complicacao
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 6 (sinais gerais de perigo); Caderno de Atenção Básica nº 28 vol. II – Queixas mais comuns (MS, 2013), §2.10 (p. 103 e 108: vômitos, alteração do nível de consciência, sinais meníngeos)"
  - pergunta: "Está saindo pus ou secreção do ouvido?"
    sinal: secrecao_no_ouvido
    destino_se_sim: ATENDIMENTO_HOJE
    fonte: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 14-15 (secreção purulenta visível → INFECÇÃO AGUDA ou CRÔNICA DO OUVIDO)"
destino_se_nenhum_sinal: CONSULTA_EM_BREVE
especialista:
  primeiro: "Pediatria"
  depois: "Otorrinolaringologia"
  fonte: "Caderno 28 vol. II, §2.10 (p. 108-109: complicações e otite com efusão → otorrinolaringologista); Pediatria como porta de entrada (regra fixa do levantamento); nomes conforme Resolução CFM 2.380/2024"
orientacao_final: "Não coloque nada dentro do ouvido (cotonete, óleo, remédio caseiro). A dor de ouvido precisa ser avaliada para ver se é infecção. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
fontes:
  - nome: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023)"
    secao: "p. 23 (Sinais de perigo – maiores de 2 meses)"
  - nome: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017)"
    secao: "p. 6 (sinais gerais de perigo); p. 33 (quando retornar imediatamente)"
  - nome: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017)"
    secao: "p. 14-15 (problema de ouvido)"
  - nome: "Caderno de Atenção Básica nº 28 vol. II – Queixas mais comuns (MS, 2013)"
    secao: "§2.10 Dor de ouvido (p. 102-109)"
lacuna: false
revisao_medica: pendente
