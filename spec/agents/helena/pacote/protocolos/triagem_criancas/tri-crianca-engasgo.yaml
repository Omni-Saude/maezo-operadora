# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
# Lacuna: sem fonte oficial direta completa; aplicar antes o alerta universal pediátrico: uni-alerta-universal-crianca
id: tri-crianca-engasgo
tema: triagem_criancas
titulo: "Engasgo (2 meses a 5 anos)"
publico: crianca_2m_5a
como_a_pessoa_fala:
  - "meu filho engasgou"
  - "a criança engoliu uma moeda"
  - "minha filha se engasgou com comida"
  - "o bebê engasgou com leite"
  - "engoliu uma peça de brinquedo"
  - "a criança está engasgada e não respira"
  - "meu filho engoliu uma bala inteira"
  - "depois que engasgou ficou tossindo"
perguntas_de_alerta:
  - pergunta: "A criança não consegue respirar, tossir, chorar ou falar, está ficando roxa, ou desmaiou?"
    sinal: obstrucao_total
    destino_se_sim: LIGAR_192_AGORA
    fonte: "SAMU 192 – Quando chamar (MS, página gov.br) – problemas cardiorrespiratórios; situações com risco de morte; AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 8-9 (não consegue chorar / fala palavras isoladas = gravidade)"
  - pergunta: "Depois do engasgo, ela continua com tosse que não para, chiado, barulho ao puxar o ar, ou respirando rápido ou com esforço?"
    sinal: desconforto_respiratorio_apos_engasgo
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 7 (estridor em repouso, tiragem subcostal → referir urgentemente); Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses)"
  - pergunta: "Ela está babando muito, não consegue engolir, ou reclama de dor no peito ou na garganta depois de engolir algo?"
    sinal: objeto_preso
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses) – não consegue mamar ou tomar líquidos; AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 6 (não consegue beber)"
destino_se_nenhum_sinal: CONSULTA_EM_BREVE
especialista:
  primeiro: "Pediatria"
  depois: "Pediatria (encaminha a outra especialidade se precisar)"
  fonte: "Lacuna: sem protocolo oficial de encaminhamento pediátrico verificado; regra fixa do levantamento (Protocolos_Helena_Fontes.xlsx, 'Quadro por tema': pediatra como porta de entrada); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Se a criança voltou a respirar, falar e chorar normalmente, observe-a nas próximas horas. Mantenha peças pequenas, moedas, botões e balas fora do alcance de crianças pequenas. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
fontes:
  - nome: "SAMU 192 – Quando chamar (MS, página gov.br)"
    secao: "Quando chamar"
  - nome: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017)"
    secao: "p. 6-9"
  - nome: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023)"
    secao: "p. 23 (Sinais de perigo); p. 61 (prevenção: peças pequenas)"
lacuna: true
revisao_medica: pendente
licenca_atencao: "SAMU gov.br: CC BY-ND 3.0 (só referência); AIDPI e Caderneta: CC BY-NC-SA 4.0 — pendente jurídico"
