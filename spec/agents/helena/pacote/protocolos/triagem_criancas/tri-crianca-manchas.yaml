# Rascunho dev (25/10/2026) — revisão médica pendente. Formato: C:\vc\protocolos\MODELO.md
id: tri-crianca-manchas
tema: triagem_criancas
titulo: "Manchas no corpo, pontinhos roxos ou suspeita de dengue (2 meses a 5 anos)"
publico: crianca_2m_5a
como_a_pessoa_fala:
  - "apareceram manchas no corpo do meu filho"
  - "pontinhos vermelhos na pele da criança"
  - "manchas roxas sem bater"
  - "acho que minha filha está com dengue"
  - "criança com febre e manchas"
  - "pintinhas vermelhas que não somem"
  - "o corpo do bebê ficou todo vermelho"
  - "manchas na pele depois da febre"
perguntas_de_alerta:
  - pergunta: "A criança teve convulsão (tremores ou 'ataque'), está desmaiada ou não acorda, ou está com muita dificuldade para respirar (ficando roxa, sem conseguir chorar ou falar)?"
    sinal: convulsao_inconsciente_ou_respiracao_grave
    destino_se_sim: LIGAR_192_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses); AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 6 (sinais gerais de perigo) – convulsões, letárgica ou inconsciente; AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 9 (sibilância grave: choro curto ou não consegue chorar)"
  - pergunta: "Principalmente quando a febre começa a baixar: ela está com dor forte na barriga que não passa, vômitos que não param, sangramento pela gengiva ou nariz, ou muito sonolenta ou muito irritada?"
    sinal: sinais_de_alarme_dengue
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Dengue: diagnóstico e manejo clínico – adulto e criança, 6ª ed. (MS, 2024), §2.2.1 Quadro 1 (p. 12-13: sinais de alarme) e §2.4 (p. 18: na criança o agravamento é súbito)"
  - pergunta: "Apareceram manchas roxas ou pontinhos vermelho-arroxeados que não somem quando você aperta a pele?"
    sinal: petequias_ou_purpura
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses) – manchas avermelhadas ou arroxeadas; AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017), p. 12-13 (petéquias com febre → DOENÇA FEBRIL MUITO GRAVE)"
  - pergunta: "Apareceram manchas avermelhadas espalhadas pelo corpo junto com febre?"
    sinal: manchas_com_febre
    destino_se_sim: PRONTO_SOCORRO_AGORA
    fonte: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023), p. 23 (Sinais de perigo – maiores de 2 meses) – manchas avermelhadas ou arroxeadas na pele; Dengue: diagnóstico e manejo clínico – adulto e criança, 6ª ed. (MS, 2024), §4.1 (p. 23: lactentes < 24 meses são condição especial)"
destino_se_nenhum_sinal: CONSULTA_EM_BREVE
especialista:
  primeiro: "Pediatria"
  depois: "Pediatria (encaminha a outra especialidade se precisar)"
  fonte: "Lacuna: sem protocolo oficial de encaminhamento pediátrico verificado; regra fixa do levantamento (Protocolos_Helena_Fontes.xlsx, 'Quadro por tema': pediatra como porta de entrada); nome conforme Resolução CFM 2.380/2024"
orientacao_final: "Observe se as manchas mudam, se aparecem pontinhos roxos ou sangramentos e se a criança está bebendo bem. Em casos de suspeita de dengue, mantenha a criança bem hidratada e não dê remédio por conta própria. Se piorar ou aparecer algum sinal de alerta, procure um pronto-atendimento ou ligue 192."
fontes:
  - nome: "Caderneta da Criança – Menino, 6ª ed. (MS, 2023)"
    secao: "p. 23 (Sinais de perigo – maiores de 2 meses)"
  - nome: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017)"
    secao: "p. 6 (sinais gerais de perigo); p. 33 (quando retornar imediatamente)"
  - nome: "AIDPI Criança – Manual de Quadros de Procedimentos, 2 meses a 5 anos (MS/OPAS/UNICEF, 2017)"
    secao: "p. 12-13 (febre: petéquias)"
  - nome: "Dengue: diagnóstico e manejo clínico – adulto e criança, 6ª ed. (MS, 2024)"
    secao: "§2.2.1 Quadro 1 (p. 12-13); §2.4 (p. 18); §4.1 (p. 23)"
lacuna: false
revisao_medica: pendente
licenca_atencao: "Caderneta da Criança: CC BY-NC-SA 4.0; AIDPI Quadros: CC BY-NC-SA 4.0; Dengue 2024: CC BY-NC-SA 4.0 (versão preliminar) — pendente jurídico"
