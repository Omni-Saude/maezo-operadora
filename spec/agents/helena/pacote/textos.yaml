# Pacote de comportamento da Helena (ADR-0067 §4) — TEXTOS fixos.
#
# Cada chave e' um texto que a Helena manda. Mudar aqui + merge = pacote novo no dev (sem build, sem deploy):
# o agente le' o pacote ativo a cada 60 s. Sem este arquivo (ou sem uma chave) vale o texto padrao do codigo
# (`src/maezo/agents/helena/textos.py::PADRAO`), que e' o mesmo aprovado.
#
# Validacao estrita (`agents/helena/pacote.py::textos`): chave desconhecida, texto vazio, link (http, www.,
# dominio) ou marcador {..} novo recusam o pacote inteiro — o agente fica com o ultimo pacote bom.
formato: helena-textos-v1

textos:
  # Decisao do dono de 23/10/2026 (DL-0154): a cobertura saiu da Helena; toda pergunta de cobertura recebe so'
  # este aviso, sem explicacao de Rol/carencia e sem oferta da equipe.
  cobertura_fora: >-
    Por aqui eu não trato de cobertura. Você consegue essa informação pelo aplicativo Austa Clínicas,
    pelo portal do plano ou pela central de atendimento do plano.

  # --- Sintoma (DL-0154). Regra da ambiguidade: aval do medico responsavel recomendado antes de producao.
  # A resposta sem clareza a pergunta de alerta: de novo, UMA vez, com outras palavras ({sinais} = o resumo).
  sintoma_repergunta: >-
    Só para eu ter certeza: neste momento, existe algum destes sinais: {sinais}? Pode responder só sim ou não.
  # Continuou sem clareza: a oferta da equipe de saude, sem 192 e sem caso (o caso so' com "sim").
  sintoma_oferta_equipe: >-
    Não consegui entender bem a sua resposta. Para não arriscar, posso passar o seu caso para a nossa equipe
    de saúde avaliar com você. Quer? Responda sim ou não.
  sintoma_oferta_recusada: >-
    Tudo bem. Se o sintoma mudar ou piorar, é só me chamar.
  # Seguimento sobre o mesmo sintoma depois de fechar (texto do dono).
  sintoma_avaliar_causa: >-
    Quem pode avaliar a causa é o médico. Quer que eu te mostre onde marcar a consulta ou prefere falar com
    a equipe de saúde?
  # Alarme ja' tratado (192/CVV ja' saiu) e sem sinal novo: nunca o "ligue 192" de novo (texto do dono).
  caso_mantido_para_a_equipe: >-
    Entendi. Mantive o seu caso para a equipe de saúde confirmar com você.

  # --- Saude na OPCAO C (DL-0154): a duvida geral respondida uma vez, e o medico/equipe na insistencia.
  saude_fecho_da_duvida: >-
    Esta informação é geral e não substitui avaliação médica. Posso ajudar em mais alguma coisa?
  saude_oferta_medico: >-
    Para ir além disso, quem pode te orientar é o médico. Quer que eu te mostre onde marcar a consulta ou
    prefere falar com a equipe de saúde?

  # --- Conversa (teste do dono, 25/10/2026): onde baixar o aplicativo, SEM link (a fonte vai so' pelo nome).
  app_onde_baixar: >-
    Procure por 'Austa Clínicas' na loja de aplicativos do seu celular (Google Play ou App Store).

  # --- Agendamento (teste do dono, 25/10/2026, caso d): a Helena nao agenda. A orientacao dos canais, sem
  # consultar o plano; com queixa na mensagem, segue a oferta de dizer o especialista.
  agendar_orientacao: >-
    Por aqui eu não agendo. Você marca pelo aplicativo Austa Clínicas, pelo portal do plano ou pela
    central de atendimento do plano.
  agendar_oferta_especialista: >-
    Se me disser o que está sentindo, eu digo qual especialista procurar.

  # --- Reembolso (avaliacao r5b, 25/10/2026): fora do escopo (pausado). Nunca confirmar que e' possivel;
  # so' os canais oficiais. A trava de saida `sem_confirmar_reembolso` troca qualquer confirmacao por este texto.
  reembolso_fora: >-
    Por aqui eu não trato de reembolso. Você consegue essa informação pelo aplicativo Austa Clínicas,
    pelo portal do plano ou pela central de atendimento do plano.
