# Rodada 4: condições de base que o extrator anota (lista 'condicoes'); 'nenhuma' se a pessoa disse que não tem.
condicoes:
  diabetes: "diabetes (açúcar no sangue), usa insulina ou remédio para diabetes"
  anticoagulante: "usa remédio que afina o sangue (varfarina/Marevan, rivaroxabana/Xarelto, apixabana, clopidogrel, AAS diário)"
  dengue: "está com dengue (confirmada ou suspeita) nesta doença atual"
  coracao: "doença do coração (insuficiência cardíaca, infarto anterior, arritmia, marcapasso)"
  imunidade_baixa: "quimioterapia, transplante, corticoide em dose alta, HIV sem tratamento"
  rim: "doença renal crônica, hemodiálise"
  pulmao: "asma, DPOC, enfisema"
  pressao_alta: "hipertensão em tratamento"
  outra: "outra doença crônica ou remédio contínuo"
  nenhuma: "disse que não tem doença nem usa remédio contínuo"
