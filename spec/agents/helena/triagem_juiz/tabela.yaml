        - {sinal: sangramento_forte, saida: "192", fonte: "Lista 192 item 10"}
        - {sinal: ferimento_profundo_ou_sujo, saida: HOJE, fonte: "CAB28v2 §2.17 p. 160 e §2.16 p. 155 (limpeza do ferimento e verificação da vacina antitetânica)", provisoria_lado_seguro: true}
    engoliu_objeto:
      sem_sinal: {saida: EQUIPE, fonte: "Plano seção 3: fora da lista; agudo -> caso para a equipe", provisoria_lado_seguro: true}
      sinais:
        - {sinal: falta_ar_forte, saida: "192", fonte: "Lista 192 item 5"}
        - {sinal: ingeriu_remedio_ou_produto, saida: "192", fonte: "Lista 192 item 7"}
        - {sinal: baba_ou_nao_engole, saida: PS, fonte: "CAB28v2 §2.11, p. 113 (não engole a saliva: urgência)", provisoria_lado_seguro: true}
        - {sinal: objeto_perigoso, saida: PS, fonte: "Sem fonte direta no pacote (pilha/ímã)", provisoria_lado_seguro: true}
        - {sinal: falta_de_ar, saida: PS, fonte: "CAB28v1 p. 35 (dificuldade respiratória)", provisoria_lado_seguro: true}
    inchaco_pernas:
      sem_sinal: {saida: EQUIPE, fonte: "Plano seção 3: fora da lista; agudo -> caso para a equipe", provisoria_lado_seguro: true}
      sinais:
