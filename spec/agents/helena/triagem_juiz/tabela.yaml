        - {sinal: perna_inchada_um_lado, saida: PS, fonte: "Sem fonte direta no pacote (trombose)", provisoria_lado_seguro: true}

  idoso:   # herda o adulto + estas (Guia 2023 / Caderneta 2026)
    _todas:
      sinais:
        - {sinal: idoso_desmaio_ou_engasgo, saida: "192", fonte: "Lista 192 item 12; Guia da Pessoa Idosa 2023, §3.6, pp. 113–114"}
        - {sinal: queda, saida: PS, fonte: "Guia da Pessoa Idosa 2023, §3.6, p. 117"}
        - {sinal: confusao_subita, saida: PS, fonte: "Guia da Pessoa Idosa 2023, p. 102 (delirium: pronto atendimento)"}
    dor_abdominal:
      sem_sinal: {saida: HOJE, fonte: "CAB28v2 §2.9, Quadro 32, p. 96 (idade > 60 = alto risco)", provisoria_lado_seguro: true}
    tontura:
      sinais:
        - {sinal: idoso_desmaio_ou_engasgo, saida: "192", fonte: "Lista 192 item 12"}
    queda:
      sem_sinal: {saida: PS, fonte: "Guia da Pessoa Idosa 2023, §3.6, p. 117"}
      sinais:
        - {sinal: nao_respira_ou_nao_acorda, saida: "192", fonte: "Lista 192 item 1; Guia 2023 p. 117 (inconsciente: socorro imediato)"}
        - {sinal: idoso_desmaio_ou_engasgo, saida: "192", fonte: "Lista 192 item 12"}
    confusao:
      sem_sinal: {saida: PS, fonte: "Guia da Pessoa Idosa 2023, p. 102 (delirium); exemplo 5.2"}
      sinais:
        - {sinal: sinais_avc, saida: "192", fonte: "Lista 192 item 3"}
        - {sinal: idoso_desmaio_ou_engasgo, saida: "192", fonte: "Lista 192 item 12"}
    mal_estar:
      sinais:
        - {sinal: sinais_avc, saida: "192", fonte: "Lista 192 item 3 (fraqueza súbita: Guia 2023 p. 116)"}

  gestante:   # gestante e pós-parto: herda o adulto + sinais de alerta (Caderneta / ACCR)
    _todas:
      sinais:
        - {sinal: gestante_convulsao_ou_sangramento_intenso, saida: "192", fonte: "Lista 192 item 11"}
        - {sinal: sangramento_vaginal, saida: PS, fonte: "Caderneta da Gestante 2022, p. 12; ACCR fluxograma 8", perguntar_em: [sangramento_genital, dor_abdominal, mal_estar, outra_aguda]}
        - {sinal: perda_liquido, saida: PS, fonte: "Caderneta da Gestante 2022, p. 12; ACCR fluxograma 7", perguntar_em: [dor_abdominal, sangramento_genital]}
        - {sinal: contracoes_fortes, saida: PS, fonte: "Caderneta da Gestante 2022, p. 12; ACCR fluxograma 2", perguntar_em: [dor_abdominal, dor_lombar]}
        - {sinal: bebe_parou_mexer, saida: PS, fonte: "ACCR Obstetrícia, fluxograma 10, p. 47", perguntar_em: [dor_abdominal, mal_estar, outra_aguda, trauma]}
        - {sinal: cefaleia_com_visao, saida: PS, fonte: "Caderneta da Gestante 2022, p. 12; exemplo 5.5", perguntar_em: [cefaleia, pressao_alta, inchaco_pernas]}
        - {sinal: pressao_alta_gestante, saida: PS, fonte: "Caderneta da Gestante 2022, p. 12; plano seção 4", perguntar_em: [cefaleia, inchaco_pernas]}
        - {sinal: inchaco_intenso, saida: HOJE, fonte: "Caderneta da Gestante 2022, p. 12", provisoria_lado_seguro: true}
        - {sinal: ardor_urinar, saida: HOJE, fonte: "Caderneta da Gestante 2022, p. 12"}
        - {sinal: febre_ou_manchas_gestante, saida: HOJE, fonte: "Caderneta da Gestante 2022, p. 12"}
        - {sinal: pos_parto_febre_ou_dor, saida: PS, fonte: "Exemplo 5.5 do plano", provisoria_lado_seguro: true, so_pos_parto: true, perguntar_em: [febre, dor_abdominal, mal_estar]}
    dor_abdominal:
      sem_sinal: {saida: HOJE, fonte: "CAB28v1 p. 35 (gestante com dor abdominal = prioritário)"}
    disuria:
      sem_sinal: {saida: HOJE, fonte: "Caderneta da Gestante 2022, p. 12; CAB28v2 §2.7, p. 77"}
    mama_amamentacao:
      sem_sinal: {saida: CONVERSA, fonte: "Caderneta da Gestante 2022 (amamentação: peito empedrado — esvaziar a mama, pega correta)"}
      sinais:
        - {sinal: mama_sinal_infeccao, saida: HOJE, fonte: "Caderneta da Gestante 2022 (mama vermelha e quente com febre: procurar a unidade — mastite)", provisoria_lado_seguro: true}

  crianca:   # 2 meses a menos de 5 anos (AIDPI). Os sinais gerais (sinais_gerais.crianca) entram em toda queixa.
    gripe_sinusite:   # tosse ou dificuldade para respirar
      sem_sinal: {saida: CONVERSA, fonte: "AIDPI Quadros 2017, p. 7 (não é pneumonia: medidas caseiras); exemplo 5.3"}
      sinais:
        - {sinal: crianca_tiragem_ou_estridor, saida: PS, fonte: "AIDPI Quadros 2017, p. 7 (tiragem, estridor: referir urgentemente)"}
        - {sinal: tosse_crise_roxo, saida: PS, fonte: "Caderneta da Criança, p. 23 (lábios roxos); CAB28v2 §2.18 (coqueluche no lactente: crises com cianose/apneia)", provisoria_lado_seguro: true}
        - {sinal: crianca_respiracao_rapida, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 7 (pneumonia: retorno em 2 dias); exemplo 5.3"}
    falta_de_ar:
      sem_sinal: {saida: HOJE, fonte: "AIDPI Quadros 2017, p. 7 (dificuldade para respirar)", provisoria_lado_seguro: true}
      sinais:
        - {sinal: falta_ar_forte, saida: "192", fonte: "Lista 192 item 5"}
        - {sinal: crianca_tiragem_ou_estridor, saida: PS, fonte: "AIDPI Quadros 2017, p. 7"}
    diarreia_vomito:
      sem_sinal: {saida: CONVERSA, fonte: "AIDPI Quadros 2017, p. 11 (sem desidratação: plano A em casa)"}
      sinais:
        - {sinal: vomito_verde, saida: PS, fonte: "Sem fonte direta no pacote (vômito bilioso: obstrução)", provisoria_lado_seguro: true}
        - {sinal: crianca_olhos_fundos_sede, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 11 (desidratação: SRO na unidade, plano B)"}
        - {sinal: sangue_fezes_crianca, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 11 (disenteria: retorno em 2 dias)"}
        - {sinal: diarreia_14_dias, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 11 (diarreia persistente)"}
    febre:
      sem_sinal: {saida: CONVERSA, fonte: "AIDPI Quadros 2017, p. 13 (doença febril sem sinal: antitérmico, retorno se persistir); exemplo 5.3"}
      sinais:
        - {sinal: rigidez_nuca, saida: PS, fonte: "AIDPI Quadros 2017, p. 13 (doença febril muito grave)"}
        - {sinal: febre_mais_5_dias, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 13 (febre todos os dias > 5 dias: investigação)"}
    dor_ouvido:
      sem_sinal: {saida: CONVERSA, fonte: "AIDPI Quadros 2017, p. 15 (possível infecção: analgésico, retorno em 2 dias); exemplo 5.6"}
      sinais:
        - {sinal: inchaco_atras_orelha, saida: PS, fonte: "AIDPI Quadros 2017, p. 15 (mastoidite)"}
        - {sinal: secrecao_ouvido, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 15 (infecção aguda do ouvido)"}
    dor_garganta:
      sem_sinal: {saida: CONVERSA, fonte: "AIDPI Quadros 2017, p. 17 (não há infecção / leve)"}
      sinais:
        - {sinal: nao_abre_boca_ou_engole_saliva, saida: PS, fonte: "AIDPI Quadros 2017, p. 17 (abaulamento de palato: infecção grave)"}
        - {sinal: placas_pus_garganta_ou_ingua, saida: HOJE, fonte: "AIDPI Quadros 2017, p. 17 (infecção moderada)"}
  # Queixas da criança tiradas do Caderno 28 (o vol. II também trata de criança nessas seções); valem para 2 meses a 12 anos.
  crianca_usa_adulto: [dor_testiculo, intoxicacao, queimadura, mordida_animal, convulsao, alergia, violencia, trauma, ferimento, engoliu_objeto]
  # 5 a 12 anos: plano 5.6 = só as seções do Caderno 28 que tratam de criança; o resto passa pelos sinais gerais e vira FORA.
  crianca_5_12:
    adulto: [dor_testiculo, dor_ouvido, dor_garganta, intoxicacao, queimadura, mordida_animal, trauma, ferimento, engoliu_objeto, convulsao, alergia, violencia]
    crianca: [febre, gripe_sinusite, diarreia_vomito, falta_de_ar]   # AIDPI aplicado acima de 5 anos (provisório, lado seguro); Caderno 28 §2.5/§2.6 trata adulto

  bebe:   # menos de 2 meses. Os sinais gerais (sinais_gerais.bebe) entram em toda queixa. Sem bloco próprio -> EQUIPE.
    ictericia:
      sem_sinal: {saida: EQUIPE, fonte: "AIDPI Neonatal 2014 (icterícia: reavaliar em 2 dias); exemplo 5.4"}
      sinais:
        - {sinal: bebe_ictericia_extensa, saida: PS, fonte: "AIDPI Neonatal 2014 (abaixo do umbigo, palmas e plantas); exemplo 5.4"}
    diarreia_vomito:
      sem_sinal: {saida: EQUIPE, fonte: "AIDPI Neonatal 2014 (diarreia no menor de 2 meses: reavaliação)", provisoria_lado_seguro: true}
      sinais:   # desidratação/sangue/urina escura/mamada: sinais gerais do bebê (Caderneta p. 23)
        - {sinal: vomito_verde, saida: PS, fonte: "AIDPI Neonatal 2014 (vômito bilioso/distensão abdominal: doença grave)", provisoria_lado_seguro: true}
    problema_mamar:
      sem_sinal: {saida: EQUIPE, fonte: "AIDPI Neonatal 2014 (problema de alimentação: orientar e reavaliar)"}
    olho_vermelho:
      sem_sinal: {saida: EQUIPE, fonte: "CAB28v2 §2.22, p. 214"}
      sinais:
        - {sinal: bebe_pus_olho, saida: PS, fonte: "CAB28v2 §2.22, p. 214 (oftalmia neonatal: tratar imediatamente)"}
    gripe_sinusite:
      sem_sinal: {saida: EQUIPE, fonte: "Decisão 31/10 (padrão): bebê < 2 meses com queixa leve sem sinal -> equipe"}
      sinais:
        - {sinal: tosse_crise_roxo, saida: PS, fonte: "Caderneta da Criança, p. 23 (lábios roxos, cansaço); CAB28v2 §2.18 (coqueluche no lactente)", provisoria_lado_seguro: true}
  bebe_usa_adulto: [intoxicacao, queimadura, engoliu_objeto, trauma, violencia]

