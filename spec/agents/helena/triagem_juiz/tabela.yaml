      - {sinal: sinais_choque, saida: PS, fonte: "CAB28v2 §2.9, Quadro 32, p. 96 (sinais de choque); SAMU (trauma)", provisoria_lado_seguro: true}

# ---------------------------------------------------------------------------------------------
# Regras por público -> queixa. Cada linha: sinal (ou todos:[...]), saída, fonte, provisoria_lado_seguro.
regras:
  adulto:   # adulto e adolescente (CAB28 vol. II); idoso e gestante herdam
    cefaleia:
      sem_sinal: {saida: CONVERSA, fonte: "CAB28v2 §2.2, Fig. 4, p. 39 (sem sinal de alerta: manejo na UBS)"}
      sinais:
        - {sinal: sinais_avc, saida: "192", fonte: "Lista 192 item 3"}
        - {sinal: dor_subita_fortissima, saida: PS, fonte: "CAB28v2 §2.2, Quadro 1, p. 32 (início abrupto de forte intensidade)"}
        - {sinal: rigidez_nuca, saida: PS, fonte: "CAB28v2 §2.2, Quadro 1 e texto, p. 32 (meningite: urgência imediatamente)"}
        - {sinal: cefaleia_mudou_padrao, saida: HOJE, fonte: "CAB28v2 §2.2, Quadro 1, p. 32 (mudança de padrão)"}
        - {sinal: cefaleia_nova_apos_50, saida: HOJE, fonte: "CAB28v2 §2.2, Quadro 1, p. 32"}
    convulsao:
      sem_sinal: {saida: HOJE, fonte: "CAB28v2 §2.3, pp. 47–49 (crise que passou: avaliação; neurologista se persistir)", provisoria_lado_seguro: true}
      sinais:
        - {sinal: convulsao_agora, saida: "192", fonte: "Lista 192 item 2"}
        - {sinal: nao_voltou_ao_normal, saida: PS, fonte: "CAB28v2 §2.3, p. 48 (não retorna à função normal: pronto-socorro)"}
        - {sinal: febre, saida: PS, fonte: "CAB28v2 §2.3, p. 48 (crise com febre: meningite até prova em contrário)"}
        - {sinal: mais_de_uma_crise_hoje, saida: PS, fonte: "CAB28v2 §2.3, pp. 48–49 (mais de uma crise no dia)"}
        - {sinal: primeira_crise, saida: PS, fonte: "CAB28v2 §2.3, p. 48 (sem epilepsia; Quadro 13)", provisoria_lado_seguro: true}
    glicose:
      sem_sinal: {saida: CONVERSA, fonte: "CAB28v2 §2.4, pp. 52–53 (regras de prevenção e quando procurar a unidade)"}
      sinais:
        - {todos: [glicose_baixa, sintoma_hipoglicemia], saida: PS, fonte: "CAB28v2 §2.4, p. 51 (hipoglicemia moderada/grave: serviço de urgência); decisão do dono 31/10: hipoglicemia com sintomas = PS"}
        - {sinal: glicose_baixa, saida: HOJE, fonte: "CAB28v2 §2.4, p. 51 (hipoglicemia leve: corrigir e reavaliar o manejo)", provisoria_lado_seguro: true}
        - {todos: [glicose_alta, hiperglicemia_grave], saida: PS, fonte: "CAB28v2 §2.4, p. 53 (procurar unidade de emergência: vômitos, dor abdominal, respiração difícil, alteração mental)"}
        - {sinal: glicose_alta_persistente, saida: HOJE, fonte: "CAB28v2 §2.4, p. 53 (procurar a unidade: > 400 por 12 h, não consegue ingerir líquidos)"}
    diarreia_vomito:
      sem_sinal: {saida: CONVERSA, fonte: "CAB28v2 §2.5, Fig. 8, p. 62 (sem sinais: reidratação oral e orientações gerais)"}
      sinais:
        - {sinal: sinais_choque, saida: PS, fonte: "CAB28v2 §2.5, Fig. 8, p. 62 (sinais de choque: imediato)"}
        - {sinal: sangue_fezes_ou_vomito, saida: PS, fonte: "CAB28v2 §2.5, Fig. 8, p. 62 (hematêmese, melena: imediato)"}
        - {sinal: desidratacao, saida: HOJE, fonte: "CAB28v2 §2.5, Fig. 8, p. 62 (sinais de desidratação)"}
        - {sinal: vomitos_persistentes, saida: HOJE, fonte: "CAB28v2 §2.5, Fig. 8, p. 62 (vômitos persistentes)"}
        - {sinal: diarreia_intensa, saida: HOJE, fonte: "CAB28v2 §2.5, Fig. 8, p. 62 (diarreia intensa)"}
    falta_de_ar:
      sem_sinal: {saida: HOJE, fonte: "CAB28v1 p. 35 (crise asmática leve/moderada = prioritário); CAB28v2 §2.6"}
      sinais:
        - {sinal: falta_ar_forte, saida: "192", fonte: "Lista 192 item 5"}
        - {sinal: inchaco_boca_com_falta_ar, saida: "192", fonte: "Lista 192 item 6"}
        - {sinal: falta_ar_ao_deitar, saida: PS, fonte: "CAB28v2 §2.6, p. 73 (suspeita de edema agudo de pulmão: remoção ao hospital)"}
    disuria:
      sem_sinal: {saida: CONVERSA, fonte: "CAB28v1 p. 35 (disúria = atendimento no dia; decisão do dono: sem sinal = CONVERSA); CAB28v2 §2.7, pp. 75–76"}
      sinais:
        - {sinal: retencao_urinaria, saida: PS, fonte: "CAB28v2 §2.7, p. 75 (retenção urinária); Guia da Pessoa Idosa 2023 (homem idoso: próstata)", provisoria_lado_seguro: true}
        - {sinal: urina_sangue_intenso, saida: PS, fonte: "CAB28v2 §2.7, p. 75 (hematúria; retenção)", provisoria_lado_seguro: true}
        - {sinal: dor_lombar_com_febre, saida: HOJE, fonte: "CAB28v2 §2.7, p. 79 (pielonefrite: exige investigação)"}
        - {sinal: disuria_grupo_risco, saida: HOJE, fonte: "CAB28v2 §2.7, p. 77 (homens, idosos, diabéticos, gestantes: exames complementares)"}
        - {sinal: febre, saida: HOJE, fonte: "CAB28v2 §2.7, p. 76 (febre é rara na cistite; sugere infecção alta)"}
    pele:
      sem_sinal: {saida: CONVERSA, fonte: "CAB28v2 §2.8, pp. 80–91"}
