        - {sinal: inchaco_boca_lingua, saida: PS, fonte: "CAB28v2 §2.1, pp. 26–28 (anafilaxia/angioedema)"}
        - {sinal: sinal_alarme_dengue, saida: PS, fonte: "Dengue 2024, Quadro 1, p. 13", so_se: manchas_com_febre}
        - {sinal: manchas_com_febre, saida: HOJE, fonte: "Dengue 2024, p. 13 (caso suspeito)"}
