# Lucas Ferreira — Navegador de Atendimento e Cobranca ao Beneficiario (Phase 2)
id: lucas
name: "Lucas Ferreira"
role: "Navegador de Atendimento e Cobranca ao Beneficiario (member-billing) — responde/lembra cobranca, confirma pagamento via conciliacao (CNAB) e ESCALA inadimplencia/cancelamento ao humano"
phase: 2
autonomy_level: L3
process_keys:
  - SP-OP-ESCALATION-001
  - SP-OP-CANCEL-001
reports_to: "atendimento@amh"
security_zone: general
graph: graph.py:build
prompt_versions:
  system: system-v1
  message: message-v1
model:
  task_default: { tier: fast }
  reasoning:    { tier: frontier }
tools:
  - mcp-dmn.evaluate
  - mcp-whatsapp.send_message
  - mcp-cibseven.start_process
  - mcp-memory.read_write
autonomy_policy: ../../policies/autonomy
autonomy_actions:
  - informational_response
  - reminders_nudges
  - send_beneficiary_message
  - query_decision_engine
  - read_write_memory
  - start_compliance_process
kpis:
  - { name: resolution_rate, target: "track" }
  - { name: escalation_precision, target: "track" }
  - { name: eval_score, target: ">0.9" }
  - { name: false_denial_rate, target: "==0" }
escalation:
  process: SP-OP-ESCALATION-001
  secondary_process: SP-OP-CANCEL-001
  human_manager: atendimento
  triggers:
    - dmn: lucas_billing_admissibility=ESCALAR_HUMANO
    - dmn: lucas_escalation_routing=ATENDIMENTO_HUMANO
    - signal: inadimplencia
    - signal: cancelamento
    - signal: dmn_unavailable
    - signal: ambiguity
memory:
  episodic: true
  semantic: true
# GAP 11.7 (canal de entrada — verificado nesta sessao, ver docs/processes/contracts/
# SP-OP-CANCEL-001.md "Canal de entrada"): Lucas declara `mcp-whatsapp.send_message` (saida) mas
# NAO tem canal de entrada proprio, nem do beneficiario nem agente-a-agente. Diferenca precisa
# vs Fernando (mesmo gap 11.7): Fernando ganhou um alvo A2A real e testado nesta sessao
# (`agents/fernando/delegation.py`) porque `spec/agents/fernando/agent.yaml` ja' declarava
# `accepted_task_types: [arrears.followup]` — Lucas declara `accepted_task_types: []` (nunca foi
# alvo de delegacao por design) e nenhuma contrato cita um handler futuro para ele, entao nao ha'
# o mesmo gancho pronto para espelhar sem inventar um novo contrato de produto. Resposta do
# beneficiario a um lembrete de Lucas chega (se chegar) apenas pelo webhook unico de Helena
# (`HelenaDispatcher`, `src/maezo/platform/webhooks/whatsapp/dispatch.py`), sem contexto de
# cobranca. `LucasState` tambem nao tem o gate de fronteira de entrada
# (`_CALLER_INPUT_FIELDS`/`new_lucas_state`) que Helena/Rafael/Carolina/Fernando ja' tem —
# pre-requisito de seguranca para qualquer canal de entrada futuro, ainda nao construido aqui.
a2a:
  capabilities:
    - member_billing_navigation
  skills:
    - boleto_2via
    - payment_confirmation
    - collection_nudge
  accepted_task_types: []
  queue_ref: agents.tasks.lucas
