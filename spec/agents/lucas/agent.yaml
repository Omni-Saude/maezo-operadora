# Lucas Ferreira — Navegador de Atendimento e Cobranca ao Beneficiario (Phase 2)
id: lucas
name: "Lucas Ferreira"
role: "Navegador de Atendimento e Cobranca ao Beneficiario (member-billing) — responde/lembra cobranca, confirma pagamento via conciliacao (CNAB) e ESCALA inadimplencia/cancelamento ao humano"
phase: 2
autonomy_level: L3
process_keys:
  - SP-OP-ESCALATION-001
  - SP-OP-CANCEL-001
reports_to: "atendimento@amh"
security_zone: general
graph: graph.py:build
prompt_versions:
  system: system-v1
  message: message-v1
model:
  task_default: { tier: fast }
  reasoning:    { tier: frontier }
tools:
  - mcp-dmn.evaluate
  - mcp-whatsapp.send_message
  - mcp-cibseven.start_process
  - mcp-memory.read_write    # declarada como excecao disclosed §8.5 item 2; sem no vivo hoje
                              # (CC-05/LUC-01 — ver docstring graph.py:97-99; GAP-DU-01-b/ADR-0047
                              # DRAFT: a camada semantica foi REMOVIDA, nao adiada)
autonomy_policy: ../../policies/autonomy
autonomy_actions:
  - informational_response
  - reminders_nudges
  - send_beneficiary_message
  - query_decision_engine
  - read_write_memory         # excecao disclosed (fence §8.5 item 2), sem no vivo hoje (CC-05/LUC-01)
  - start_compliance_process
kpis:
  - { name: resolution_rate, target: "track" }
  - { name: escalation_precision, target: "track" }
  - { name: eval_score, target: ">0.9" }
  - { name: false_denial_rate, target: "==0" }
escalation:
  process: SP-OP-ESCALATION-001
  secondary_process: SP-OP-CANCEL-001
  human_manager: atendimento
  triggers:
    - dmn: lucas_billing_admissibility=ESCALAR_HUMANO
    - dmn: lucas_escalation_routing=ATENDIMENTO_HUMANO
    - signal: inadimplencia
    - signal: cancelamento
    - signal: dmn_unavailable
    - signal: ambiguity
memory:
  episodic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
  semantic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
# GAP 11.7 (canal de entrada — verificado nesta sessao, ver docs/processes/contracts/
# SP-OP-CANCEL-001.md "Canal de entrada"): Lucas declara `mcp-whatsapp.send_message` (saida) mas
# NAO tem canal de entrada proprio, nem do beneficiario nem agente-a-agente. Diferenca precisa
# vs Fernando (mesmo gap 11.7): Fernando ganhou um alvo A2A real e testado nesta sessao
# (`agents/fernando/delegation.py`) porque `spec/agents/fernando/agent.yaml` ja' declarava
# `accepted_task_types: [arrears.followup]` — Lucas declara `accepted_task_types: []` (nunca foi
# alvo de delegacao por design) e nenhuma contrato cita um handler futuro para ele, entao nao ha'
# o mesmo gancho pronto para espelhar sem inventar um novo contrato de produto. Resposta do
# beneficiario a um lembrete de Lucas chega (se chegar) apenas pelo webhook unico de Helena
# (`HelenaDispatcher`, `src/maezo/platform/webhooks/whatsapp/dispatch.py`), sem contexto de
# cobranca. ATUALIZACAO (CC-14/LUC-09a, 2026-09-04): o gate de fronteira de entrada de
# `LucasState` AGORA EXISTE — `graph.py::_CALLER_INPUT_FIELDS` (particao INPUT-ONLY x
# OUTPUT-ONLY com guarda de completude em IMPORT TIME), `graph.py::new_lucas_state` (estrito:
# chave desconhecida -> ValueError nomeando as chaves) e `graph.py::gate_inbound_state`
# (permissivo: descarta e loga so os NOMES das chaves), no mesmo formato de Helena/Rafael.
# O QUE ISSO NAO RESOLVE: o gap 11.7 CONTINUA ABERTO. Lucas segue sem canal de entrada proprio
# (`accepted_task_types: []` abaixo permanece vazio, nenhum contrato cita handler para ele) e a
# resposta do beneficiario continua chegando, se chegar, so pelo webhook unico de Helena sem
# contexto de cobranca. O gate era o PRE-REQUISITO de seguranca ORDENADO desse canal: foi
# construido antes para que o canal ja' nasca gateado (CC-02), nao para declara-lo pronto.
# IDEMPOTENCIA DE SAIDA (LUC-08, gap `IDEMPOTENCY-KEY-MISSING`, 2026-09-06): o envio de
# `mcp-whatsapp.send_message` acima agora exige `idempotency_key` (`graph.py::WhatsAppSender`) —
# uma redelivery do MESMO turno do engine reclama a MESMA chave no store duravel
# `driver_idempotency` (ADR-0024) em vez de reenviar a mensagem/ACK ao beneficiario. Sem tabela
# nova; mesmo store que `platform/webhooks/whatsapp/dispatch.py` ja usa para a saida de Helena.
# CORRECAO (§Delta W4-HYGIENE, 2026-09-06) — a frase anterior descrevia a chave como
# `f"{business_key}:{node}"` e afirmava o dedupe sem ressalva; as duas coisas eram imprecisas:
#   (1) ESCOPO DA CHAVE: `business_key` (`ESC-{tenant}-{conversation_id}`) e' por CONVERSA, entao
#       `business_key:node` colapsaria DUAS mensagens diferentes do mesmo beneficiario dentro do
#       TTL de 24h numa chave so'. A chave agora e' `f"{business_key}:{node}:{fingerprint}"`,
#       onde o fingerprint e' um sha256 truncado da ENTRADA DO CHAMADOR do turno
#       (`graph.py::_turn_fingerprint`). Lucas nao carrega um `wamid` por turno hoje — gap 11.7
#       acima e' exatamente isso — e o fingerprint e' o identificador por turno mais estavel que
#       o estado carrega. RESIDUAL: dois turnos com entrada byte-identica sao indistinguiveis e
#       o segundo e' suprimido (mesmo pedido repetido); a supressao NAO e' mais reportada como
#       envio (desfecho proprio `envio_suprimido_duplicata`, `mensagem_enviada=False`).
#   (2) ONDE O DEDUPE ACONTECE DE FATO: o `DedupRegistry` e' ligado pelo root de composicao
#       `gateway/tool_registry.py::build_agent_seams`, a partir do MESMO `settings.database_url`
#       que ja constroi o `PostgresAuditSink`. Um root SEM DSN nao liga registry, e nesse caso
#       `WhatsAppServer.send_message` RECUSA o envio com `WhatsAppIdempotencyUnsupportedError`
#       (fail-closed) — a chave nunca e' aceita-e-ignorada. Lucas continua sem caminho de
#       invocacao vivo (gap 11.7), entao nada disso tem efeito em producao hoje.
a2a:
  capabilities:
    - member_billing_navigation
  skills:
    - boleto_2via  # LUC-14: informacional -- so explica como obter a 2a via a partir dos fatos
                   # ja fornecidos; sem worker/tool de emissao de boleto/link no allowlist.
    - payment_confirmation
    - collection_nudge  # LUC-13: reativo -- unico ponto de entrada (receive), sem no/timer que
                        # inicie contato; o LEMBRETE da DMN so dispara DENTRO de um turno ja
                        # recebido (J2, confirmacao_pagamento).
  accepted_task_types: []
  queue_ref: agents.tasks.lucas
  handler_status: ausente   # nenhum agents/lucas/delegation.py existe (gap 11.7, prosa acima)
