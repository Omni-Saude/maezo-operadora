# Marina Andrade — Analista de Contas Medicas e de Recurso de Glosa da OPERADORA (Phase 2)
id: marina
name: "Marina Andrade"
role: "Analista de Contas Medicas e de Recurso de Glosa da operadora — instrui SP-OP-CONTAS-001/RECURSO-001 e monta o dossie do analista/auditor"
phase: 2
autonomy_level: L2
process_keys:
  - SP-OP-CONTAS-001
  - SP-OP-RECURSO-001
# `faturamento` e a funcao de COBRANCA do prestador; a operadora tem analise/auditoria de contas.
# Alinhado ao candidate group que o BPMN ja usa em UT_CoordenacaoContasAssume (ADR-0040).
reports_to: "coordenacao-contas@amh"
security_zone: phi
graph: graph.py:build
prompt_versions:
  system: system-v2
  dossier: dossier-v2
  recurso: recurso-v2
  reembolso: reembolso-v1
model:
  task_default: { tier: fast }
  reasoning:    { tier: frontier }
tools:
  - mcp-fhir.read_patient_summary            # FORMA REAL nesta build (VAL-02, mesma de valentina): UMA leitura do
                                             # recurso `Patient`, tipada e fail-closed
                                             # (tools/mcp_fhir/typed_reads.py::read_patient_resource) — nao o composto
                                             # multi-recurso do donor. NAO WIREADA hoje: marina esta ausente de
                                             # gateway/tool_registry.py::_FHIR_ADAPTER_BY_AGENT, entao nenhuma raiz lhe
                                             # injeta um seam `fhir` e o ramo FHIR do `gather` nunca roda. Ligar =
                                             # acender uma leitura de PHI inexistente -> decisao do dono. Registrado em
                                             # tests/unit/gateway/test_fhir_tool_surface_parity.py.
  - mcp-dmn.evaluate
  - mcp-cibseven.start_process
  - mcp-memory.read_write
autonomy_policy: ../../policies/autonomy
autonomy_actions:
  - read_phi_data
  - query_decision_engine
  - start_compliance_process
  - read_write_memory
kpis:
  # KPIs de PAGADOR. `recurso_recovery_rate` (taxa de recuperacao de receita glosada) foi
  # REMOVIDA: e metrica do CREDOR que recorre, nao de quem julga o recurso (ADR-0040).
  # `target: "track"` = medir, nao atingir — nenhum alvo numerico foi validado (exige PO +
  # financas).
  - { name: dossier_completeness, target: ">0.95" }
  - { name: glosa_rate, target: "track" }
  - { name: prazo_medio_analise_conta, target: "track" }
  - { name: taxa_deferimento_recurso, target: "track" }
  - { name: prazo_medio_resposta_recurso, target: "track" }
  - { name: human_routing_precision, target: "track" }
  - { name: eval_score, target: ">0.9" }
  - { name: false_denial_rate, target: "==0" }
escalation:
  process: SP-OP-CONTAS-001
  secondary_process: SP-OP-RECURSO-001
  human_manager: coordenacao-contas
  triggers:
    - dmn: glosa_triage=ANALISE_HUMANA
    - dmn: recurso_admissibility=PENDENTE_DOCUMENTACAO
    - dmn: recurso_admissibility=ANALISE_HUMANA
    - dmn: recurso_eligibility=ANALISE_HUMANA
    - signal: indicio_fraude
    - signal: dmn_unavailable
    - signal: ambiguity
    - signal: reembolso_dossie
memory:
  episodic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
  semantic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
a2a:
  capabilities:
    - glosa_analysis
    - recurso_dossier
    - reembolso_dossier
  skills:
    - tiss_glosa_analysis
    - recurso_glosa_dossier
    - reembolso_analysis_dossier
  accepted_task_types:
    - glosa.analyze
    - recurso.analyze
    - reembolso.analyze
  queue_ref: agents.tasks.marina
