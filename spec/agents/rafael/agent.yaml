# Rafael Nogueira — Analista de Autorizacao Previa (Phase 1 centerpiece)
# Portado de spec/agents/rafael/agent.yaml
id: rafael
name: "Rafael Nogueira"
role: "Analista de Autorizacao Previa — instrui SP-OP-AUTH-001 e monta o dossie medico-auditor"
phase: 1
autonomy_level: L2
process_keys:
  - SP-OP-AUTH-001
reports_to: "medico-auditor@amh"        # gestor humano = medico-auditor (decide a cobertura)
security_zone: phi                       # PHI integral on-prem/endpoint BR (ADR-0006: Rafael e Zona PHI)
graph: graph.py:build
prompt_versions:                         # versionados (ADR-0009) — gate de eval no golden
  system: system-v1
  dossier: dossier-v1
model:
  task_default: { tier: fast }           # gather/assess/montagem do dossie
  reasoning:    { tier: frontier }       # casos ambiguos / dossie complexo
tools:                                    # ids EXATOS registrados pelos mcp_* servers
  - mcp-fhir.read_patient                 # beneficiario (leitura, enriquece dossie)
  - mcp-fhir.search_coverage              # cobertura do beneficiario (leitura)
  - mcp-dmn.evaluate                      # auth_admissibility / auth_auto_approval / auth_sla
  - mcp-cibseven.start_process            # somente SP-OP-AUTH-001 (start idempotente)
  - mcp-memory.read_write                 # memoria episodica do caso (ADR-0002); excecao
                                           # disclosed do fence §8.5 item 2 (sem no vivo hoje —
                                           # GAP-DU-01-b/ADR-0047 DRAFT)
  # mcp-cibseven.get_process_status removido: nenhum no deste grafo o exerce hoje (CC-05/RAF-03a).
  # Reintroduzir junto com o no que consultar status da instancia.
autonomy_policy: ../../policies/autonomy
autonomy_actions:                         # acoes REAIS da matriz L0-core exercidas por este fluxo
  - read_phi_data                         # leitura FHIR Patient/Coverage (mcp-fhir.*) — L3
  - query_decision_engine                 # DMN de autorizacao (mcp-dmn.evaluate) — L3
  - start_compliance_process              # SP-OP-AUTH-001 (mcp-cibseven.start_process) — L2
  - read_write_memory                     # memoria episodica (mcp-memory.read_write) — L3;
                                           # excecao disclosed (fence §8.5 item 2), sem no vivo hoje
  # query_process_status removido: nenhum no exerce mcp-cibseven.get_process_status hoje
  # (CC-05/RAF-03a). Reintroduzir junto com o tool e o no que os usar.
  # NOTA L0 HARD (intencional): Rafael NAO exerce `authorization_denial` nem `clinical_decision`.
  # Negativa e decisao de cobertura sao SO do medico-auditor (User Task). A aprovacao automatica
  # L2 e expressa via `authorization_approval` no processo — o caminho automatico de
  # SP-OP-AUTH-001 emite a guia; Rafael apenas inicia o processo com DMN favoravel (ADR-0008).
kpis:
  - { name: dossier_completeness, target: ">0.95" }   # dossies completos / total (fatos + refs DMN)
  # ESTRUTURALMENTE 0 NO AGENTE NESTA FASE (RAF-01) — nao e' meta, e' divulgacao do que o
  # desenho produz. A rota `auto_approve` do grafo e' inalcancavel a partir de todo seam
  # tipado: os cinco booleanos exigidos pela r1 de `auth_auto_approval` v0.2.0
  # (auto_criteria_verificado + os quatro criterio_*_ok) NAO estao em RAFAEL_INPUT_FIELDS,
  # entao `new_rafael_state` os recusa e `gate_inbound_state` os descarta; e
  # `ST_PrepararDossie` (o unico ponto do BPMN que convoca Rafael) so' e' alcancado por
  # `Flow_GW_AnaliseHumana` — quando o motor chama Rafael, `GW_AutoAprovacao` ja' decidiu
  # analise humana. A decisao L2 do SISTEMA vive no engine, e este KPI medido NO AGENTE le'
  # zero por construcao. Ver `RafaelGraph.assess` e o contrato SP-OP-AUTH-001 v0.2.0.
  - { name: auto_approval_rate, target: "track", note: "estruturalmente 0 no agente nesta fase (RAF-01): a decisao L2 e do engine (GW_AutoAprovacao), nao deste grafo" }
  - { name: human_routing_precision, target: "track" } # casos corretamente roteados ao auditor
  - { name: sla_analise_p95, target: "<RN259/395" }    # tempo ate dossie pronto (dentro do SLA da DMN)
  - { name: eval_score, target: ">0.9" }               # golden dataset (gate de promocao, ADR-0009)
  - { name: false_denial_rate, target: "==0" }         # INVARIANTE L0 hard: ZERO negativas por automacao
escalation:
  process: SP-OP-AUTH-001                 # rota humana garantida = User Task do medico-auditor
  human_manager: medico-auditor           # quem decide negativa/cobertura (candidate group BPMN)
  triggers:                               # cada gatilho -> ANALISE HUMANA (NUNCA negativa)
    - dmn: auth_auto_approval=ANALISE_HUMANA   # DUT/teto/rede/catch-all -> medico-auditor
    - dmn: auth_admissibility=PENDENTE_DOCUMENTACAO  # documentacao incompleta -> humano
    - signal: dmn_unavailable             # DMN indisponivel -> humano (nunca auto-aprova por omissao)
    - signal: ambiguity                   # qualquer ambiguidade -> medico-auditor
# CANAL DE INGRESSO HTTP (NEW-02) — declaracao SPEC-FIRST, e o Rafael e o unico que a tem.
# `RafaelState.canal` ja declarava `a2a | portal_tiss`; este bloco diz qual dos dois tem porta
# HTTP propria no daemon deste agente, e e o lado do spec do invariante: sem ele, a entrada
# correspondente em `src/maezo/runtime/agent_runtime/ingress.py::INGRESS_BY_AGENT` fica ILEGAL
# (a cerca de paridade de `tests/unit/runtime/test_agent_ingress_agent_scoped.py` exige os dois
# lados). Sem os dois, `build_ingress_router` RECUSA — o corpo do POST e validado por
# `new_rafael_state`, entao montar essa rota no daemon de outro agente entregaria um estado com
# forma de Rafael ao grafo dele. Ate 05/09/2026 o unico freio era a convencao de IaC em
# `deploy/aws-ecs/envs/dev-sa-east-1/service-agents.tf` (`each.key == "rafael" ? "1" : "0"`).
# A flag `MAEZO_AGENT_INGRESS_ENABLED` continua sendo o opt-in de operacao; esta declaracao
# apenas ESTREITA quem ela pode alcancar.
ingress:
  canal: portal_tiss                      # o segundo dos dois canais de `RafaelState.canal`
  rota: "POST /v1/autorizacoes"           # espelhada por `ingress.py::ROTA_DECLARADA`
memory:
  episodic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
  semantic: false  # reabilitar exige consumidor + ato do dono: GAP-DU-01-b REMOVEU a camada semantica (0009_drop_pgvector); ADR-0002 §3 SUSPENSO (ADR-0047, DRAFT)
# A2A v1.0 — Agent Card derivado desta definicao (ADR-0003). Rafael e ALVO de delegacao: a Helena
# delega "authorization.analyze" a ele via DelegationDispatcher. `accepted_task_types` declara o
# contrato de delegacao (o dispatcher rejeita task_type fora desta lista).
a2a:
  capabilities:
    - prior_authorization_analysis        # instrui o caso de autorizacao e monta o dossie
  skills:
    - tiss_auth_analysis                  # analise de guia TISS / SP-OP-AUTH-001
    - medico_auditor_dossier              # montagem do dossie medico-auditor
  accepted_task_types:
    - authorization.analyze               # tipo de task que a Helena delega ao Rafael
  queue_ref: agents.tasks.rafael
