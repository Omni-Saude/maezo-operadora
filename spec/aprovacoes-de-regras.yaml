# REGISTRO DE APROVACOES DAS REGRAS PUBLICAVEIS (DL-0148; pendencia 27 da planilha do diretor).
#
# O QUE E'. A resposta escrita a "quem aprovou esta regra, e em que versao dos bytes?" para TODO
# artefato que o deploy publica no motor (`python -m maezo.platform.deploy` envia todo
# spec/processes/bpmn/*.bpmn e spec/processes/dmn/*.dmn — `engine_deploy.collect_artifacts`).
# A cerca `make check-aprovacao-de-regras` (scripts/ci/check_aprovacao_de_regras.py) exige que cada
# um esteja em EXATAMENTE uma das listas abaixo.
#
# aprovados — so' com aprovacao humana REAL, registrada em PR revisado. Campos:
#   artefato:      spec/processes/dmn/<arquivo>.dmn
#   sha256:        sha256 dos bytes aprovados com CRLF->LF
#                  (python scripts/ci/check_aprovacao_de_regras.py imprime o hash atual quando ele diverge)
#   aprovado_por:  nome de quem aprovou
#   papel:         medico-auditor | juridico | dpo | regulatorio | financas | po | dono
#   aprovado_em:   AAAA-MM-DD
#   evidencia:     onde a decisao esta' escrita (DL, ata, PR, sign-off)
# Editou o arquivo aprovado? O hash muda e a cerca reprova: nova aprovacao, ou a entrada volta a
# `pendentes`. Nunca atualize so' o hash.
#
# pendentes — publicados HOJE sem aprovacao registrada. Nao bloqueiam o deploy do dev; aparecem em
# toda execucao da cerca. `responsavel: a definir` = ninguem foi nomeado ainda (decisao do dono).
# `marca_no_arquivo` e' a linha de status COPIADA do proprio artefato em 19/10/2026 (nao e' opiniao).
#
# Nenhuma aprovacao foi inventada: em 19/10/2026 nenhum artefato publicavel tinha aprovacao
# registrada amarrada aos bytes, entao `aprovados` comeca vazio.
