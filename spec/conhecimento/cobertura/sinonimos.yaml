# Sinonimos POPULARES GENERICOS -> nome OFICIAL de procedimento (rodada do dono de 19/10/2026, DL-0128).
#
# Para que serve: o catalogo de procedimentos da cobertura (contrato AMH `tina-procedimentos`) fala a lingua da
# terminologia oficial (TUSS da ANS, tabela 22; SIGTAP do SUS). A pessoa fala a lingua do dia a dia. Cada
# entrada abaixo e' vocabulario PUBLICO e generico (o nome popular de uso corrente e a forma como o
# procedimento aparece na terminologia oficial), escrita ANTES de qualquer resultado de teste. Nao ha' entrada
# feita para um caso de teste: termo que nao estiver aqui fica com a busca por significado.
#
# Regra: `fonte` obrigatoria (TUSS = Terminologia Unificada da Saude Suplementar, ANS; SIGTAP = tabela de
# procedimentos do SUS; ambas so' de VOCABULARIO, conforme spec/conhecimento/saude/FONTES.md). Nada de marca,
# nada de prestador. A expansao so' acrescenta o nome oficial ao termo para a busca; nunca decide cobertura.
versao: 1
sinonimos:
  - populares: [ultrassom, ultrassonografia, ultrasom, ultra som, ecografia]
    oficial: ultrassonografia
    fonte: TUSS (grupo de diagnostico por ultrassonografia)
