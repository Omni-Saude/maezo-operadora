id: cir-amigdalectomia
categoria: cirurgia
titulo: Amigdalectomia (retirada das amígdalas)
sinonimos:
- amigdalectomia
- tirar as amigdalas
- tirar as amígdalas
- cirurgia de amigdala
- cirurgia de amígdala
- adenoide
- adenoidectomia
- adenoamigdalectomia
texto: A amigdalectomia é a cirurgia que retira as amígdalas. Às vezes é feita junto com a retirada da adenoide. É indicada, por exemplo, em infecções de garganta muito frequentes ou ronco com pausas na respiração.
