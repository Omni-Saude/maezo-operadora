id: cir-cirurgia-refrativa
categoria: cirurgia
titulo: Cirurgia refrativa (miopia e outros graus)
sinonimos:
- cirurgia de miopia
- cirurgia a laser nos olhos
- lasik
- cirurgia para tirar óculos
- cirurgia de grau
- laser para miopia
- cirurgia de astigmatismo
- cirurgia refrativa
- cirurgia refrativa (miopia e outros graus)
texto: Cirurgia refrativa é um procedimento nos olhos que busca corrigir problemas de grau, como miopia, astigmatismo e hipermetropia. Costuma ser considerada quando a pessoa quer reduzir a dependência de óculos ou lentes de contato. Em geral, usa-se laser para remodelar a córnea, com anestesia em colírio. A indicação depende de exames e da avaliação do oftalmologista, e o resultado varia de pessoa para pessoa.
