id: cir-hemorroidectomia
categoria: cirurgia
titulo: Cirurgia de hemorroida
sinonimos:
- hemorroidectomia
- cirurgia de hemorroidas
- operar hemorroida
- cirurgia de hemorroida
- retirada de hemorroida
- cirurgia das almorreimas
texto: A cirurgia de hemorroida, chamada de hemorroidectomia, retira ou trata as veias dilatadas na região do ânus e do reto. Costuma ser indicada em casos mais avançados ou quando outros tratamentos não resolveram. Em geral, é feita em centro cirúrgico, com anestesia, e existem técnicas diferentes. A indicação e a escolha da técnica são do médico, em geral o coloproctologista. Cada pessoa tem uma recuperação própria.
