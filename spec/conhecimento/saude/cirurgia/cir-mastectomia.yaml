id: cir-mastectomia
categoria: cirurgia
titulo: Mastectomia
sinonimos:
- mastectomia
- retirada da mama
- cirurgia de retirada da mama
- mastectomia radical
- mastectomia total
- mastectomia parcial
- mastectomia simples
texto: Mastectomia é a cirurgia que retira a mama. Costuma ser indicada em casos de câncer de mama ou, às vezes, para reduzir o risco da doença. É feita em centro cirúrgico, com anestesia, e a técnica varia conforme cada caso. A indicação e o tipo de cirurgia são definidos pelo médico, em geral da mastologia ou da cirurgia oncológica. Em alguns casos, a mama pode ser reconstruída, conforme a avaliação médica.
