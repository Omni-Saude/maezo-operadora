id: cir-miomectomia
categoria: cirurgia
titulo: Miomectomia
sinonimos:
- miomectomia
- retirada de mioma
- cirurgia de mioma
- cirurgia para tirar mioma
- miomectomia videolaparoscópica
- miomectomia histeroscópica
- miomectomia laparoscopica
texto: Miomectomia é a cirurgia que retira os miomas do útero, preservando o órgão. Costuma ser considerada quando os miomas causam sintomas, como sangramento aumentado, ou dificultam a gravidez. Pode ser feita por cirurgia aberta, por vídeo (laparoscopia) ou por dentro do útero (histeroscopia), conforme o caso. A indicação e a escolha da técnica são do médico, em geral o ginecologista. Os resultados variam de pessoa para pessoa.
