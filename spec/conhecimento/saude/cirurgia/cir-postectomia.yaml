id: cir-postectomia
categoria: cirurgia
titulo: Postectomia (cirurgia de fimose)
sinonimos:
- postectomia
- cirurgia de fimose
- cirurgia da fimose
- circuncisão
- circuncisao
- postoplastia
- tirar a fimose
- postectomia (cirurgia de fimose)
texto: A postectomia é a cirurgia que retira o excesso de pele que cobre a cabeça do pênis. Essa pele se chama prepúcio. Costuma ser indicada na fimose, quando a glande não pode ser exposta e outros tratamentos não resolveram. Em geral, é um procedimento simples, feito com anestesia. O médico remove a pele ou faz pequenos cortes nela. A indicação é do médico, caso a caso, e o urologista costuma cuidar disso.
