id: cir-prostatectomia
categoria: cirurgia
titulo: Prostatectomia
sinonimos:
- prostatectomia radical
- retirada da próstata
- cirurgia da próstata
- prostatectomia robótica
- remoção da próstata
- prostectomia
- prostatectomia
texto: Prostatectomia é a cirurgia que retira a próstata, glândula que existe nos homens e fica abaixo da bexiga. Costuma ser indicada em casos de câncer de próstata e, às vezes, quando a próstata aumentada causa problemas urinários. Pode ser feita por corte aberto, por vídeo ou com auxílio de robô. A indicação e o tipo de técnica são definidos pelo médico, em geral o urologista, conforme cada situação.
