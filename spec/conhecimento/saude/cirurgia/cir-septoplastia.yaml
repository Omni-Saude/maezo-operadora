id: cir-septoplastia
categoria: cirurgia
titulo: Septoplastia (desvio de septo)
sinonimos:
- septoplastia
- desvio de septo
- desvio do septo nasal
- cirurgia de desvio de septo
- correção do septo
- septoplastia nasal
- cirurgia do septo
- septoplastia (desvio de septo)
texto: Septoplastia é uma cirurgia que corrige o desvio do septo, a parede de cartilagem e osso que divide o nariz. Costuma ser indicada quando o desvio atrapalha a passagem do ar. Em geral é feita por dentro das narinas, com anestesia. O médico ajusta ou retira partes do septo. A indicação é do médico, e o otorrinolaringologista costuma cuidar do caso.
