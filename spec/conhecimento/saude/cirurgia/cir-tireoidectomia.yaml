id: cir-tireoidectomia
categoria: cirurgia
titulo: Tireoidectomia
sinonimos:
- tireoidectomia
- tireoidectomia total
- tireoidectomia parcial
- cirurgia da tireoide
- retirada da tireoide
- tireoidectomía
texto: A tireoidectomia é a cirurgia que retira toda a tireoide ou uma parte dela. A tireoide é uma glândula no pescoço que ajuda a controlar o funcionamento do corpo. Costuma ser indicada em casos como nódulos suspeitos, câncer, aumento da glândula ou excesso de hormônio. É feita em centro cirúrgico, com anestesia, por um corte na região do pescoço. A indicação é do médico, geralmente cirurgião de cabeça e pescoço ou endocrinologista.
