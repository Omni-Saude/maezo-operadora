texto: A doença de Alzheimer afeta o cérebro e piora aos poucos. É a forma mais comum de demência em pessoas idosas. Costuma começar com perda da memória recente. Com o tempo, pode atingir a linguagem, o raciocínio, o humor e as tarefas do dia a dia. O tratamento é definido pelo médico e pode envolver remédios e estímulo mental. Geriatria, neurologia e psiquiatria costumam cuidar dessa condição.
