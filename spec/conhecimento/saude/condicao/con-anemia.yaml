texto: Anemia é a condição em que o sangue tem menos hemoglobina ou menos glóbulos vermelhos do que o esperado. Esses componentes levam oxigênio para o corpo. Entre os sinais mais comuns estão cansaço, fraqueza, palidez e tontura. O tratamento é definido pelo médico, conforme a causa, e pode envolver mudança na alimentação, remédios ou outros procedimentos. O clínico geral costuma cuidar do assunto, e o hematologista também pode atuar.
