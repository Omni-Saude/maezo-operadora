texto: A ansiedade é uma reação do corpo e da mente diante de situações de tensão. Quando é intensa, frequente ou atrapalha a rotina, pode ser um transtorno de ansiedade. Os transtornos de ansiedade têm tratamento, com psicólogo e psiquiatra. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
