texto: A apneia do sono é um distúrbio em que a respiração para ou fica fraca várias vezes durante o sono. Costuma causar ronco alto, sono pouco reparador, cansaço e sonolência durante o dia. O tratamento é definido pelo médico. Pode envolver mudança de hábitos, aparelhos usados ao dormir ou cirurgia. Costuma ser cuidada por médicos do sono, otorrinolaringologistas ou pneumologistas.
