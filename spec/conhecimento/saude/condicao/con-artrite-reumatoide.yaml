texto: A artrite reumatoide é uma doença autoimune, em que o sistema de defesa do corpo ataca as articulações. É mais comum em mulheres. Costuma causar dor, inchaço e rigidez nas juntas, em geral dos dois lados do corpo, principalmente de manhã. O tratamento é definido pelo médico e pode envolver mudança de hábitos, fisioterapia, remédios ou, em alguns casos, cirurgia. A especialidade que costuma cuidar é a reumatologia.
