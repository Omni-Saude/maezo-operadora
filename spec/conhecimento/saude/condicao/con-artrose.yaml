texto: Artrose é o desgaste da cartilagem, o tecido que protege as pontas dos ossos dentro das articulações. É comum nos joelhos, quadris, mãos e coluna. Costuma causar dor ao movimentar, rigidez e dificuldade para fazer alguns movimentos. O tratamento é definido pelo médico e pode envolver mudança de hábitos, fisioterapia, remédios ou cirurgia. Em geral, ortopedistas e reumatologistas cuidam desse problema.
