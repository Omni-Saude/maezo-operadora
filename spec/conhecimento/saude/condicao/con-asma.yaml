texto: Asma é uma das doenças respiratórias crônicas mais comuns, juntamente com a rinite alérgica e a doença pulmonar obstrutiva crônica. As principais características dessa doença pulmonar são dificuldade de respirar, chiado e aperto no peito, respiração curta e rápida. A doença pode ser controlada e o Sistema Único de Saúde (SUS) oferta o tratamento.
