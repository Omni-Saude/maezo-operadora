id: con-autismo
categoria: condicao
titulo: Transtorno do espectro autista (TEA)
sinonimos:
- tea
- autismo
- espectro autista
- transtorno autista
- autismo infantil
- sindrome de asperger
- autista
- transtorno do espectro autista (tea)
texto: O transtorno do espectro autista (TEA) é uma condição do desenvolvimento do cérebro. Ele afeta a comunicação, a interação social e os comportamentos. Chama-se espectro porque aparece de formas diferentes em cada pessoa, de quadros leves a outros que pedem mais apoio. Entre as características comuns estão comportamentos repetitivos e sensibilidade a sons ou luzes. O cuidado é definido pelo médico e costuma envolver equipe multiprofissional, com psiquiatria, neurologia ou pediatria.
