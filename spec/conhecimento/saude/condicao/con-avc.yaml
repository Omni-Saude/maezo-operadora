id: con-avc
categoria: condicao
titulo: AVC (derrame)
sinonimos:
- avc
- derrame
- derrame cerebral
- acidente vascular cerebral
- avc isquemico
- avc isquêmico
- avc hemorragico
- avc hemorrágico
texto: 'AVC hemorrágico: Ocorre quando há rompimento de um vaso cerebral, provocando hemorragia. AVC isquêmico: Ocorre quando há obstrução de uma artéria, impedindo a passagem de oxigênio para células cerebrais, que acabam morrendo. Quanto mais rápido for o atendimento, maiores serão as chances de sobrevivência e recuperação total.'
