id: con-bronquiolite
categoria: condicao
titulo: Bronquiolite
sinonimos:
- bronquiolite viral aguda
- bva
- bronquiolite em bebê
- bronquiolite infantil
- vsr
- vírus sincicial respiratório
- bronquiolite aguda
- bronquiolite
texto: A bronquiolite é uma doença respiratória que atinge bebês e crianças pequenas, em geral menores de dois anos. Ela causa inflamação nos bronquíolos, pequenas vias de ar dos pulmões, quase sempre por vírus. Os sinais mais comuns são coriza, tosse, febre, nariz entupido e chiado no peito. O tratamento é definido pelo médico e costuma ser de suporte, como lavagem nasal, hidratação e, em alguns casos, internação. Pediatras costumam cuidar dessa condição.
