- nefrolitíase
- cálculo renal (pedra nos rins)
texto: Cálculo renal, conhecido como pedra nos rins, é um conjunto de cristais de minerais e sais. Ele se forma dentro do rim ou das vias urinárias. Pode não causar sintomas ou provocar dor nas costas, sangue na urina e vontade frequente de urinar. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou cirurgia. A urologia costuma cuidar do assunto.
