texto: O câncer do colo do útero é um tumor que se forma na parte de baixo do útero. Quase sempre está ligado à infecção persistente pelo vírus HPV. No início, pode não causar sintomas. Em fases mais avançadas, podem surgir sangramento vaginal e corrimento. O tratamento é definido pelo médico e pode envolver cirurgia, radioterapia ou quimioterapia. A ginecologia e a oncologia costumam cuidar dessa condição.
