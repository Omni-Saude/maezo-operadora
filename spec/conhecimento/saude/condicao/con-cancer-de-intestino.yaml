- cancer colorretal
- câncer de intestino
texto: O câncer de intestino é um tumor que começa nas células do intestino grosso, formado pelo cólon e pelo reto. Também é chamado de câncer colorretal. Pode causar mudanças no hábito intestinal, sangue nas fezes, cansaço e perda de peso. Nem sempre há sinais no início. O tratamento é definido pelo médico e pode envolver cirurgia, remédios e outras terapias. Em geral, cuidam desse tema o gastroenterologista, o coloproctologista ou o oncologista.
