id: con-cancer-de-mama
categoria: condicao
titulo: Câncer de mama
sinonimos:
- cancer de mama
- câncer de mama
- tumor de mama
- nodulo na mama
- nódulo na mama
- caroco no seio
- caroço no seio
texto: O câncer de mama não tem somente uma causa. A maior parte dos cânceres de mama é descoberta pelas próprias mulheres. Um nódulo ou outro sintoma suspeito nas mamas deve ser investigado para confirmar se é ou não câncer de mama. São vários subtipos de câncer de mama e cada um requer tratamento específico e individualizado.
