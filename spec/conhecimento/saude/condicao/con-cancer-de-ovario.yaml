titulo: Câncer de ovário
sinonimos:
- cancer de ovario
- câncer no ovário
- tumor de ovário
- neoplasia de ovário
- carcinoma de ovário
- ca de ovário
- câncer de ovário
texto: O câncer de ovário é um tumor maligno que começa nos ovários, órgãos do sistema reprodutor feminino. Nas fases iniciais, muitas vezes não causa sintomas claros, e os sinais podem ser parecidos com os de outros problemas. Fatores como idade, histórico familiar e alterações genéticas podem influenciar o risco. O tratamento é definido pelo médico e pode envolver cirurgia, medicamentos ou outras terapias. Quem costuma cuidar é o ginecologista ou o oncologista.
