- carcinoma de pele
- cancer da pele
texto: O câncer de pele é o crescimento anormal de células da pele. Está ligado principalmente à exposição ao sol ao longo da vida. Pode aparecer como manchas que coçam, descamam ou sangram, ou como feridas que demoram a cicatrizar. Costuma surgir em áreas mais expostas, como rosto, pescoço e orelhas. O tratamento é definido pelo médico e pode envolver cirurgia, entre outras opções. O dermatologista costuma cuidar desse tipo de caso.
