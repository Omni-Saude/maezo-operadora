texto: Candidíase vaginal é uma infecção causada por um fungo chamado Candida, que já vive naturalmente no corpo. Ela acontece quando esse fungo cresce mais do que o habitual. Os sintomas mais comuns são coceira, ardência, vermelhidão e corrimento esbranquiçado. O tratamento é definido pelo médico e pode envolver remédios de uso local ou por via oral. Em geral, quem cuida do assunto é o ginecologista.
