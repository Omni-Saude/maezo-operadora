titulo: Catapora (varicela)
sinonimos:
- catapora
- varicela
- variceula
- catapura
- vírus varicela-zoster
- bolinhas na pele catapora
- catapora (varicela)
texto: A catapora, ou varicela, é uma doença infecciosa causada pelo vírus Varicela-Zoster. Ela passa com facilidade de uma pessoa para outra e é mais comum em crianças. Costuma causar manchas vermelhas que viram bolhas e depois crostas, com coceira. Também pode haver cansaço, mal-estar e febre. O tratamento é definido pelo médico, e pediatras, clínicos gerais e infectologistas costumam cuidar do caso.
