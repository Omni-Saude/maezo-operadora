texto: Chikungunya é uma arbovirose cujo agente etiológico é transmitido pela picada de fêmeas infectadas do gênero Aedes. No Brasil, até o momento, o vetor envolvido na transmissão do vírus chikungunya (CHIKV) é o Aedes aegypti. As principais características clínicas da infecção por chikungunya são edema e dor articular incapacitante.
