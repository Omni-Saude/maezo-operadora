id: con-climaterio-e-menopausa
categoria: condicao
titulo: Climatério e menopausa
sinonimos:
- menopausa
- climaterio
- climatério
- fogacho
- ondas de calor
- menopauza
- pós-menopausa
- climatério e menopausa
texto: Climatério é a fase de transição entre o período reprodutivo e o não reprodutivo da mulher. A menopausa é a última menstruação, confirmada depois de um tempo sem menstruar. Ondas de calor, suor à noite, alterações do sono e do humor e ressecamento vaginal são queixas comuns. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou outras medidas de cuidado. Ginecologia costuma cuidar dessa fase.
