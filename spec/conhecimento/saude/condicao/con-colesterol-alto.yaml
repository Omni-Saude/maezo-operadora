texto: Colesterol alto, ou dislipidemia, é o aumento de gorduras no sangue, como o colesterol e os triglicerídeos. Em geral, não causa sintomas e costuma ser descoberto em exames de sangue. Com o tempo, pode contribuir para problemas no coração e nos vasos sanguíneos. O tratamento é definido pelo médico e pode envolver mudança de hábitos, como alimentação e atividade física, ou remédios. Clínico geral, cardiologista e endocrinologista costumam cuidar desse assunto.
