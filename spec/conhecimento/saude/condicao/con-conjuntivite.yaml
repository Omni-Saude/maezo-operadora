texto: Conjuntivite é a inflamação da conjuntiva, a membrana fina que cobre a parte branca do olho. Ela também reveste a parte de dentro das pálpebras. Costuma causar olho vermelho, coceira, lacrimejamento, sensação de areia e secreção. Pode ter causa viral, bacteriana ou alérgica, e alguns tipos passam de pessoa para pessoa. O tratamento é definido pelo médico e pode envolver cuidados de higiene ou colírios. Em geral, o oftalmologista cuida desse quadro.
