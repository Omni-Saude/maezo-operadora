id: con-coqueluche
categoria: condicao
titulo: Coqueluche
sinonimos:
- coqueluche
- tosse comprida
- pertussis
- coqueluxe
- bordetella pertussis
texto: A coqueluche é uma infecção respiratória causada por uma bactéria. Ela passa de pessoa para pessoa por gotículas da tosse, do espirro ou da fala. Sua marca são as crises de tosse seca, que podem causar vômitos e dificuldade para respirar. Começa parecida com um resfriado e depois a tosse fica mais intensa. O tratamento é definido pelo médico, e clínico geral, pediatra ou infectologista costumam cuidar dela.
