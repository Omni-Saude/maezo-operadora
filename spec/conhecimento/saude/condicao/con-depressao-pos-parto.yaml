id: con-depressao-pos-parto
categoria: condicao
titulo: Depressão pós-parto
sinonimos:
- depressão pós-parto
- depressao pos parto
- depressão após o parto
- depressão puerperal
- dpp
- depressão pós-natal
- depressão pós parto paterna
texto: A depressão pós-parto é uma condição de tristeza profunda, desânimo e falta de esperança que surge logo após o parto. Pode vir com cansaço intenso, alterações de sono e apetite, ansiedade e perda de interesse pelas atividades. Atinge principalmente mulheres, mas homens também podem desenvolvê-la. Não é falha de caráter nem fraqueza. O tratamento é definido pelo médico e pode envolver acompanhamento psicológico, remédios e apoio da família. Psiquiatria e psicologia costumam cuidar do tema. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
