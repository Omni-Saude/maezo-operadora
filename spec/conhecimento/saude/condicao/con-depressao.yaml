texto: A depressão é uma doença mental que afeta o humor, o sono, o apetite e a energia. Pode trazer tristeza constante e perda do prazer nas coisas. Ela tem tratamento, com acompanhamento de profissionais de saúde. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
