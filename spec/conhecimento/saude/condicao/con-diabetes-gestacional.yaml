id: con-diabetes-gestacional
categoria: condicao
titulo: Diabetes gestacional
sinonimos:
- diabetes na gravidez
- diabetes gestacional
- diabete gestacional
- diabetes da gestação
- glicose alta na gravidez
- diabetes gestante
texto: Diabetes gestacional é o aumento do açúcar no sangue que aparece durante a gravidez, em geral de forma temporária. Muitas vezes não causa sintomas e costuma ser identificada por exames. O tratamento é definido pelo médico e pode envolver mudança de hábitos, acompanhamento da glicose e, em alguns casos, remédios. Obstetrícia e endocrinologia costumam cuidar dessa condição.
