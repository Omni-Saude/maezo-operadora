texto: O diabetes mellitus pode se apresentar de diversas formas e possui diversos tipos diferentes. O diabetes tipo 2 ocorre quando o corpo não aproveita adequadamente a insulina produzida. Cerca de 90% dos pacientes diabéticos no Brasil têm esse tipo. Toda gestante deve fazer o exame de diabetes, regularmente, durante o pré-natal.
