texto: A doença de Crohn é uma inflamação crônica do aparelho digestivo, que pode atingir qualquer parte, do intestino à boca. Entre as características mais comuns estão diarreia persistente, dor na barriga, cansaço e perda de peso. Os sintomas podem aparecer e desaparecer ao longo do tempo. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou cirurgia. Costuma ser acompanhada pelo gastroenterologista.
