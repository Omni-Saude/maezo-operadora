id: con-doenca-renal-cronica
categoria: condicao
titulo: Doença renal crônica
sinonimos:
- doença renal crônica
- drc
- insuficiência renal crônica
- insuficiencia renal
- rins doentes
- falência dos rins
- doenca renal cronica
texto: A doença renal crônica é a perda gradual da capacidade dos rins de filtrar o sangue. Com isso, resíduos e excesso de água se acumulam no corpo. Muitas vezes ela evolui sem sintomas no início. Diabetes, pressão alta e casos na família são fatores de risco. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou diálise. O nefrologista costuma cuidar dessa condição.
