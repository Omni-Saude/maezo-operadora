texto: A DPOC, sigla de doença pulmonar obstrutiva crônica, afeta os pulmões e dificulta a passagem do ar. Costuma estar ligada a anos de exposição à fumaça de cigarro e a outros poluentes. Os sintomas mais comuns são tosse persistente, catarro e cansaço ao fazer esforços. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios, reabilitação respiratória ou cirurgia. Em geral, quem cuida é o pneumologista.
