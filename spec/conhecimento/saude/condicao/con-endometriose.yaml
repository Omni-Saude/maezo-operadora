id: con-endometriose
categoria: condicao
titulo: Endometriose
sinonimos:
- endometriose
- endometrioma
- endometriose profunda
- endometriose ovariana
- endometrioze
- endometriose pélvica
texto: Endometriose é uma doença em que um tecido parecido com o que reveste o útero por dentro cresce fora dele. Isso pode causar inflamação crônica e atinge muitas mulheres em idade reprodutiva. Entre os sintomas mais comuns estão cólica menstrual intensa, dor pélvica crônica, dor na relação sexual e dificuldade para engravidar. O tratamento é definido pelo médico e pode envolver remédios, cirurgia ou os dois, conforme cada caso. Em geral, quem cuida é o ginecologista.
