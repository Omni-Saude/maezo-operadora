texto: A esclerose múltipla é uma doença crônica do sistema nervoso. O sistema de defesa do corpo ataca a mielina, que protege os nervos do cérebro e da medula. Os sintomas variam e podem incluir fraqueza, formigamento, alterações da visão, desequilíbrio e cansaço. Muitas vezes surgem em crises, com melhora depois. O tratamento é definido pelo médico e pode envolver remédios e reabilitação. A neurologia costuma cuidar do tema.
