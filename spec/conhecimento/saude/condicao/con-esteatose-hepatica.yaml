- esteatose hepatica
- esteatose hepática (gordura no fígado)
texto: Esteatose hepática, conhecida como gordura no fígado, é o acúmulo de gordura dentro das células do fígado. Muitas vezes não causa sintomas e pode aparecer em exames de imagem, como a ultrassonografia do abdômen. Pode estar ligada ao excesso de peso, ao diabetes, ao colesterol alto e ao consumo de álcool. O tratamento é definido pelo médico e pode envolver mudança de hábitos de vida, controle de outras condições ou remédios. Costuma ser acompanhada por gastroenterologista ou hepatologista.
