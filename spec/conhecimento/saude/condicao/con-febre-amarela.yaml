id: con-febre-amarela
categoria: condicao
titulo: Febre amarela
sinonimos:
- febre amarela
- febre amarela silvestre
- vírus da febre amarela
- doença da febre amarela
- yellow fever
texto: A febre amarela é uma doença infecciosa causada por um vírus, transmitido pela picada de mosquitos. Não passa de pessoa para pessoa. Os sintomas iniciais mais comuns são febre de início súbito, calafrios, dor de cabeça, dores no corpo, náuseas e fraqueza. Em parte dos casos a doença evolui para formas mais graves. O cuidado é definido pelo médico, com acompanhamento dos sintomas, e costuma envolver clínica médica ou infectologia.
