texto: A fibromialgia é uma condição crônica que causa dor espalhada pelo corpo, sem sinais de inflamação ou lesão nos exames. Os sintomas mais comuns são cansaço, sono que não descansa, rigidez e dificuldade de concentração. Atinge mais mulheres. O tratamento é definido pelo médico e pode envolver mudança de hábitos, atividade física, acompanhamento psicológico ou remédios. Reumatologia costuma cuidar dela, e outras especialidades também podem participar.
