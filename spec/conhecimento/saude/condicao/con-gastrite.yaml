texto: Gastrite é a inflamação da camada que reveste o estômago. Entre os sinais mais comuns estão queimação na parte de cima da barriga, náusea, azia e sensação de estômago cheio. Algumas pessoas não têm sintoma nenhum. O tratamento é definido pelo médico e pode envolver mudança de hábitos ou remédios, conforme a causa. A especialidade que costuma cuidar do assunto é a gastroenterologia.
