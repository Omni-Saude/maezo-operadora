id: con-glaucoma
categoria: condicao
titulo: Glaucoma
sinonimos:
- glaucoma
- pressão alta no olho
- pressão intraocular
- glaucoma de ângulo aberto
- glaucoma crônico
- glaucomas
- glaucona
texto: Glaucoma é uma doença dos olhos que danifica o nervo óptico, responsável por levar a imagem ao cérebro. Muitas vezes avança devagar e pode não causar sintomas no início. Com o tempo, pode reduzir a visão e, em casos graves, levar à cegueira. O tratamento é definido pelo médico e pode envolver colírios, laser ou cirurgia. O oftalmologista costuma cuidar dessa condição.
