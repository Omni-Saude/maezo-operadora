texto: As hepatites virais são infecções que atingem o fígado, causando alterações leves, moderadas ou graves. Na maioria das vezes são infecções silenciosas, ou seja, não apresentam sintomas. No Brasil, as hepatites virais mais comuns são causadas pelos vírus A, B e C. As infecções causadas pelos vírus das hepatites B, C e D frequentemente se tornam crônicas.
