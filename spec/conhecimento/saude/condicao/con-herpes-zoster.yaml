texto: Herpes-zóster, conhecido como cobreiro, é causado pelo mesmo vírus da catapora. Esse vírus fica adormecido no corpo e pode voltar a agir depois. Isso acontece mais em adultos e em pessoas com defesas baixas. Costuma causar dor nos nervos e, depois, lesões de pele com bolhas. O tratamento é definido pelo médico; pode envolver alívio dos sintomas ou remédios contra o vírus. Clínico geral, dermatologista ou infectologista costumam cuidar.
