texto: Herpes é uma infecção causada por vírus que permanece no corpo depois do primeiro contato. Costuma causar pequenas bolhas dolorosas na pele ou nas mucosas, como na boca e na região genital. As lesões podem voltar em alguns períodos e, às vezes, causam coceira, ardência ou formigamento. O tratamento é definido pelo médico e, em geral, envolve remédios e cuidados com a pele. Clínico geral, dermatologista, ginecologista e urologista costumam cuidar do assunto.
