texto: A hiperplasia benigna da próstata é o aumento não canceroso da próstata, glândula que fica abaixo da bexiga nos homens. É comum com o avanço da idade. Pode causar jato de urina fraco, vontade frequente de urinar e sensação de que a bexiga não esvaziou. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou cirurgia. Em geral, quem cuida do assunto é o urologista.
