texto: A hipertensão arterial ou pressão alta é uma doença crônica caracterizada pelos níveis elevados da pressão sanguínea nas artérias. A pressão alta não tem cura, mas tem tratamento e pode ser controlada. Somente o médico poderá determinar o melhor método para cada paciente.
