id: con-hipertireoidismo
categoria: condicao
titulo: Hipertireoidismo
sinonimos:
- hipertireoidismo
- tireoide hiperativa
- tireoide acelerada
- hipertiroidismo
- excesso de hormônio da tireoide
- doença de graves
texto: Hipertireoidismo é quando a glândula tireoide, no pescoço, produz hormônios em excesso e acelera o funcionamento do corpo. Entre os sinais mais comuns estão coração acelerado, suor excessivo, perda de peso, nervosismo e tremores nas mãos. Pode atingir homens e mulheres. O tratamento é definido pelo médico e pode envolver remédios, outros métodos que reduzem a atividade da glândula ou cirurgia. A especialidade que costuma cuidar do assunto é a endocrinologia.
