titulo: Hipotireoidismo
sinonimos:
- hipotireoidismo
- hipotiroidismo
- tireoide preguiçosa
- tireoide lenta
- tireoide baixa
- hipotireoide
texto: Hipotireoidismo é quando a tireoide, glândula localizada no pescoço, produz menos hormônio do que o corpo precisa. Entre as características mais comuns estão cansaço, sensibilidade ao frio, pele seca, ganho de peso e intestino preso. Pode atingir mulheres e homens, e é mais frequente em mulheres. O tratamento é definido pelo médico e geralmente envolve reposição do hormônio com remédio, além de acompanhamento. Quem costuma cuidar é o endocrinologista.
