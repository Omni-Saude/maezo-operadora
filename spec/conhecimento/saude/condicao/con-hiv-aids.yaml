texto: 'O HIV ataca as células que organizam a defesa do corpo (linfócitos TCD4+). Uma pessoa pode viver com HIV, mas não necessariamente apresentar sintomas ou desenvolver aids. Aids: É a condição de saúde causada pelo HIV em estágio avançado, quando o sistema imunológico está gravemente comprometido. O HIV é transmitido principalmente através de fluidos corporais específicos.'
