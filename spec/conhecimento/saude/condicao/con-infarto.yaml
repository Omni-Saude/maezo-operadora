texto: O Infarto Agudo do Miocárdio é a maior causa de mortes no país. Dor ou desconforto na região peitoral, podendo irradiar para as costas, rosto, braço esquerdo e, raramente, braço direito. Em idosos, o principal sintoma do infarto agudo do miocárdio pode ser a falta de ar. Nos diabéticos e idosos, o infarto também pode ocorrer sem sinais específicos. Identificar os sintomas pode ser decisivo para salvar a vida de uma pessoa.
