texto: Infecção urinária é causada por microrganismos, geralmente bactérias, em partes do sistema urinário, como bexiga, uretra ou rins. É mais frequente em mulheres. Os sintomas mais comuns são ardência ao urinar, vontade frequente de urinar e urina turva ou com cheiro forte. O tratamento é definido pelo médico e pode envolver remédios e mudança de hábitos. Clínico geral, urologista e ginecologista costumam cuidar desse quadro.
