titulo: Insônia
sinonimos:
- insonia
- dificuldade para dormir
- problema de sono
- distúrbio do sono
- transtorno do sono
- sono ruim
- insônia
texto: Insônia é a dificuldade para pegar no sono, manter o sono durante a noite ou dormir o quanto se precisa. Costuma causar cansaço, sonolência durante o dia, irritação e dificuldade de concentração. Pode ter relação com estresse, hábitos e outras condições de saúde. O tratamento é definido pelo médico e pode envolver mudança de hábitos, acompanhamento psicológico ou remédios. Clínico geral, psiquiatra ou médico do sono costumam cuidar do assunto.
