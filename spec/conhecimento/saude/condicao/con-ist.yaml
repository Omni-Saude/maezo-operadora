titulo: Infecções sexualmente transmissíveis (IST)
sinonimos:
- ist
- dst
- doenças sexualmente transmissíveis
- infecção sexualmente transmissivel
- doença venérea
- doenca venerea
- infecções sexuais
- infecções sexualmente transmissíveis (ist)
texto: As infecções sexualmente transmissíveis (IST) são causadas por vírus, bactérias ou outros microrganismos. Passam principalmente pelo contato sexual sem preservativo e, em alguns casos, da gestante para o bebê. Podem causar corrimentos, feridas, verrugas e ardência ao urinar, mas algumas não dão sintoma nenhum. O tratamento é definido pelo médico e depende do tipo de infecção. Clínico geral, ginecologista, urologista e infectologista costumam cuidar do assunto.
