titulo: Lúpus
sinonimos:
- lúpus
- lupus
- les
- lúpus eritematoso sistêmico
- lupus eritematoso sistemico
- lúpus discoide
- doença autoimune lúpus
texto: Lúpus é uma doença autoimune, em que o sistema de defesa do corpo ataca, por engano, tecidos saudáveis. Pode afetar pele, articulações, rins e outros órgãos. Os sintomas variam e podem aparecer e desaparecer com o tempo. O tratamento é definido pelo médico e pode envolver mudança de hábitos e uso de remédios. A especialidade que costuma cuidar do lúpus é a reumatologia.
