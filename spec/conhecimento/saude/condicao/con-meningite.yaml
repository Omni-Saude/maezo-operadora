id: con-meningite
categoria: condicao
titulo: Meningite
sinonimos:
- meningite
- meningite bacteriana
- meningite viral
texto: A meningite é uma inflamação das meninges, membranas que envolvem e protegem o cérebro e a medula espinhal. Sintomas mais frequentes incluem febre, dor de cabeça intensa, rigidez no pescoço, náuseas, vômitos e sensibilidade à luz. Sinais de gravidade incluem confusão mental, convulsões, dificuldade para acordar e manchas vermelhas ou arroxeadas na pele. Na presença desses sinais, o atendimento médico deve ser imediato.
