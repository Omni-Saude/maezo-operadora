texto: Mioma uterino é um tumor benigno, ou seja, não é câncer, que se forma na parede do útero. Muitas vezes não causa sintoma algum. Quando causa, pode aparecer menstruação intensa ou prolongada, aumento do volume da barriga e pressão na região da pelve. O tratamento é definido pelo médico e pode envolver acompanhamento, remédios ou cirurgia. A especialidade que costuma cuidar do assunto é a ginecologia.
