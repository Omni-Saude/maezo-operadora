texto: Obesidade é uma doença crônica em que há acúmulo excessivo de gordura no corpo, o que pode afetar a saúde. Costuma estar ligada a fatores como alimentação, pouca atividade física, genética e hormônios. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou cirurgia. O acompanhamento costuma ser feito por endocrinologista, clínico geral ou cirurgião do aparelho digestivo, muitas vezes com nutricionista e psicólogo.
