titulo: Osteoporose
sinonimos:
- osteoporose
- osteoporoze
- ossos fracos
- perda de massa óssea
- fragilidade óssea
- descalcificação dos ossos
texto: Osteoporose é uma doença em que os ossos perdem massa e ficam mais frágeis, com maior chance de fraturas. Em geral, não causa sintomas no início e pode ser notada após uma fratura. Atinge mais mulheres depois da menopausa e pessoas idosas. O tratamento é definido pelo médico e pode envolver mudança de hábitos e remédios. Reumatologia, ortopedia e endocrinologia costumam cuidar do assunto.
