id: con-otite
categoria: condicao
titulo: Otite (infecção de ouvido)
sinonimos:
- otite
- infecção de ouvido
- infeccao no ouvido
- otite média
- otite media
- otite externa
- inflamação no ouvido
- otite (infecção de ouvido)
texto: Otite é a inflamação ou infecção de uma parte do ouvido, mais comum na parte atrás do tímpano. Costuma causar dor de ouvido, sensação de ouvido tampado, diminuição da audição e, às vezes, febre ou secreção. Afeta muito as crianças, mas pode ocorrer em qualquer idade. O tratamento é definido pelo médico e pode envolver remédios ou, em casos selecionados, procedimento cirúrgico. A especialidade que costuma cuidar é a otorrinolaringologia, e o pediatra também acompanha casos em crianças.
