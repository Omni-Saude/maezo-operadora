texto: A doença de Parkinson é uma condição do sistema nervoso que afeta principalmente os movimentos. Costuma causar tremores, lentidão para se mover, rigidez nos músculos e alterações no equilíbrio. Ela evolui aos poucos e varia bastante de pessoa para pessoa. O tratamento é definido pelo médico e pode envolver remédios, fisioterapia e, em alguns casos, cirurgia. A especialidade que costuma cuidar é a neurologia.
