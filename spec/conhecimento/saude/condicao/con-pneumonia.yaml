texto: Pneumonia é uma infecção que atinge os pulmões, causada por vírus, bactérias ou fungos. Costuma causar tosse, febre, cansaço e desconforto ao respirar, e os sintomas variam de pessoa para pessoa. O tratamento é definido pelo médico e pode envolver repouso, hidratação, remédios ou, em alguns casos, internação. Clínico geral, pneumologista e pediatra costumam cuidar dessa condição.
