texto: Pré-eclâmpsia é uma complicação da gestação, que costuma surgir depois da 20ª semana ou após o parto. Ela envolve pressão arterial alta e, às vezes, alterações nos rins vistas em exames. Pode haver inchaço, dor de cabeça e alterações na visão, mas também pode não haver sintoma. O tratamento é definido pelo médico e pode envolver controle da pressão, remédios ou antecipação do parto. O cuidado costuma ser da obstetrícia.
