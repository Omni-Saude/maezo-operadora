texto: A psoríase é uma doença crônica da pele, que não é contagiosa. Costuma causar placas vermelhas com descamação esbranquiçada e, às vezes, coceira. Pode atingir também unhas e articulações, e os sintomas vão e voltam ao longo do tempo. O tratamento é definido pelo médico e pode envolver cuidados com a pele, remédios ou fototerapia. O dermatologista costuma cuidar dessa condição.
