texto: Rinite alérgica é uma inflamação dentro do nariz. Ela surge quando o organismo reage a coisas como pó, mofo, pelos de animais e pólen. Os sinais mais comuns são coceira no nariz, espirros, coriza e nariz entupido. O tratamento é definido pelo médico e pode envolver cuidados com o ambiente, remédios ou imunoterapia. Costuma ser acompanhada por alergista ou otorrinolaringologista.
