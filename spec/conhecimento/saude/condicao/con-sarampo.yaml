id: con-sarampo
categoria: condicao
titulo: Sarampo
sinonimos:
- sarampo
- sarampu
- manchas vermelhas e febre
- vacina do sarampo
- tríplice viral
- triplice viral
texto: O sarampo é uma doença infecciosa muito contagiosa, causada por um vírus que passa de pessoa a pessoa pelo ar. Costuma causar manchas vermelhas pelo corpo, febre alta, tosse seca, coriza e olhos irritados. Não há remédio específico contra o vírus; o médico define o cuidado, que em geral busca aliviar os sintomas. A vacina é a forma de prevenção, e o Calendário Nacional de Vacinação define quem pode recebê-la. Clínico geral, pediatra e infectologista costumam cuidar do caso.
