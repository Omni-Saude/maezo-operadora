id: con-sindrome-de-burnout
categoria: condicao
titulo: Síndrome de burnout
sinonimos:
- burnout
- síndrome de burnout
- esgotamento profissional
- síndrome do esgotamento profissional
- esgotamento no trabalho
- burn out
- sindrome de burnout
texto: A síndrome de burnout, ou síndrome do esgotamento profissional, é um distúrbio emocional ligado a situações de trabalho muito desgastantes. Costuma envolver cansaço extremo, estresse, dificuldade de concentração, insônia e sensação de incapacidade. O tratamento é definido pelo profissional de saúde. Pode envolver psicoterapia, remédios e mudanças nas condições de trabalho e nos hábitos de vida. Psiquiatras e psicólogos costumam cuidar desse quadro. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
