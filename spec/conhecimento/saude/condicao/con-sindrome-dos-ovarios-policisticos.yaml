texto: A síndrome dos ovários policísticos (SOP) é uma condição hormonal que atinge mulheres em idade reprodutiva. Costuma envolver ciclos menstruais irregulares, excesso de pelos, acne e dificuldade para engravidar. Em alguns casos, aparecem também alterações no peso e no metabolismo. O tratamento é definido pelo médico e pode envolver mudança de hábitos ou remédios. Em geral, quem cuida é o ginecologista ou o endocrinologista.
