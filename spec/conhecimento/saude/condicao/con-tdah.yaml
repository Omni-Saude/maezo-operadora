- tdah (transtorno de déficit de atenção e hiperatividade)
texto: O TDAH é um transtorno do neurodesenvolvimento que costuma aparecer na infância e pode continuar na vida adulta. Em geral, envolve dificuldade de manter a atenção, agitação e ações feitas sem pensar muito. Os sinais variam de pessoa para pessoa. O tratamento é definido pelo médico e pode envolver acompanhamento psicológico, orientações na rotina e escola, ou remédios. Psiquiatra, neurologista e pediatra costumam cuidar do assunto.
