texto: A tensão pré-menstrual, conhecida como TPM, é um conjunto de sintomas físicos e emocionais. Eles aparecem dias antes da menstruação e costumam melhorar quando ela começa. Os mais comuns são irritabilidade, humor instável, inchaço, sensibilidade nas mamas, cansaço e dor de cabeça. O tratamento é definido pelo médico e pode envolver mudança de hábitos, remédios ou acompanhamento psicológico. A ginecologia costuma cuidar do assunto.
