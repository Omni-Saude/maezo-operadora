texto: O transtorno obsessivo-compulsivo, o TOC, é uma condição de saúde mental. Ele costuma envolver pensamentos repetidos e incômodos, chamados obsessões, e comportamentos ou rituais repetitivos, chamados compulsões. Esses rituais geralmente buscam aliviar a angústia, mas podem ocupar muito espaço na rotina. O tratamento é definido pelo médico e pode envolver psicoterapia, remédios ou a combinação dos dois. Psiquiatria e psicologia costumam cuidar desse quadro. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
