texto: O transtorno bipolar é uma condição de saúde mental em que o humor muda de forma marcante entre fases. Há fases de euforia ou muita energia e fases de tristeza profunda e desânimo. Essas oscilações afetam o sono, a disposição e a rotina. O tratamento é definido pelo médico e pode envolver remédios, acompanhamento psicológico e mudança de hábitos. A especialidade que costuma cuidar é a psiquiatria. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
