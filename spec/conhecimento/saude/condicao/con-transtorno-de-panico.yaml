texto: O transtorno de pânico é uma condição de saúde mental com crises repentinas de medo intenso, chamadas ataques de pânico. Elas costumam vir com coração acelerado, falta de ar, tremores, suor e sensação de perder o controle. Muitas pessoas passam a temer novas crises. O tratamento é definido pelo médico e pode envolver psicoterapia, remédios e mudança de hábitos. A psiquiatria costuma cuidar desse quadro, às vezes junto com a psicologia. Se você estiver em sofrimento, pode ligar 188 (CVV), a qualquer hora. Também posso chamar alguém da nossa equipe para conversar com você.
