id: con-tuberculose
categoria: condicao
titulo: Tuberculose
sinonimos:
- tuberculose
- bacilo de koch
- tuberculose pulmonar
texto: A tuberculose é uma doença infecciosa e transmissível, causada pela bactéria Mycobacterium tuberculosis, também conhecida como bacilo de Koch. A doença afeta principalmente os pulmões (forma pulmonar), mas pode atingir outros órgãos e/ou sistemas (forma extrapulmonar). A tuberculose não é transmitida por objetos compartilhados. O principal sintoma da tuberculose pulmonar é a tosse.
