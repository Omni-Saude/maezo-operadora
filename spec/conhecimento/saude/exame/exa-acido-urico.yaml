id: exa-acido-urico
categoria: exame
titulo: Ácido úrico
sinonimos:
- acido urico
- uricemia
- dosagem de ácido úrico
- exame de ácido úrico
- ácido úrico no sangue
- acido urico sangue
- ácido úrico
texto: O ácido úrico é um exame de sangue que mede a quantidade dessa substância no organismo. Ela se forma quando o corpo processa certos alimentos e as próprias células. O exame costuma ser pedido para investigar problemas ligados às articulações e aos rins, e para acompanhar alguns tratamentos. A coleta de sangue costuma ser feita em um laboratório, às vezes com jejum, conforme a orientação do laboratório. O resultado é avaliado pelo médico, junto com outras informações de saúde.
