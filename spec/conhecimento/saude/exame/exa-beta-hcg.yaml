id: exa-beta-hcg
categoria: exame
titulo: Beta hCG (exame de gravidez)
sinonimos:
- beta hcg
- bhcg
- beta-hcg
- exame de gravidez
- teste de gravidez no sangue
- hcg quantitativo
- gonadotrofina coriônica
- beta hcg (exame de gravidez)
texto: O beta hCG é um exame que detecta e mede o hormônio hCG, produzido durante a gravidez. Costuma ser pedido para confirmar a gestação e acompanhar sua evolução inicial. Também pode ser usado em outras situações, a critério médico. Em geral, é feito com coleta de sangue, e há também o teste de urina. O resultado é avaliado pelo médico, que explica o seu significado.
