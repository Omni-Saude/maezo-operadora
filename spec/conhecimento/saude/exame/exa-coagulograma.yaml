id: exa-coagulograma
categoria: exame
titulo: Coagulograma
sinonimos:
- coagulograma
- teste de coagulação
- exame de coagulação
- tempo de coagulação
- tap e ttpa
- tempo de protrombina
- coagulagrama
texto: O coagulograma é um conjunto de exames de sangue que avalia como o sangue coagula. Costuma ser pedido para investigar sangramentos ou coágulos, ou antes de cirurgias e alguns procedimentos. Também pode ajudar a acompanhar o efeito de certos tratamentos. Em geral, é feito com uma pequena amostra de sangue colhida de uma veia do braço. O resultado é avaliado pelo médico, que considera o contexto de cada pessoa.
