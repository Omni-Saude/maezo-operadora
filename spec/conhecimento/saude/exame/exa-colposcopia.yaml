titulo: Colposcopia
sinonimos:
- colposcopia
- colposcopía
- colposcopio
- exame de colposcopia
- colpo
- colposcopia com biópsia
texto: A colposcopia é um exame que permite ver de perto o colo do útero, a vagina e a vulva. Para isso, usa-se um aparelho que aumenta a imagem. Costuma ser pedida quando outro exame, como o preventivo, mostra alterações a investigar. É feita em consultório, em posição de exame ginecológico, e o médico pode colher um pequeno fragmento para análise. O resultado é avaliado pelo médico, em geral um ginecologista.
