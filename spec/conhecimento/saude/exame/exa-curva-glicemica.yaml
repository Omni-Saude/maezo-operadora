texto: A curva glicêmica, ou teste de tolerância à glicose, mostra como o corpo lida com o açúcar no sangue. Costuma ser pedida para investigar diabetes, pré-diabetes e diabetes na gravidez. Em geral, colhe-se sangue em jejum, a pessoa usa uma bebida adocicada e novas coletas são feitas. O resultado é avaliado pelo médico, junto com outros dados de saúde.
