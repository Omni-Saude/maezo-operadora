id: exa-eletroencefalograma
categoria: exame
titulo: Eletroencefalograma
sinonimos:
- eletroencefalograma
- eeg
- eletro encefalograma
- exame das ondas cerebrais
- eletroencefalografia
- eletroencefalograma de rotina
texto: O eletroencefalograma, ou EEG, registra a atividade elétrica do cérebro. Costuma ser pedido para investigar crises convulsivas, desmaios sem causa clara e alterações do sono ou da consciência. Pequenos discos metálicos são colocados no couro cabeludo e ligados a um aparelho que grava as ondas cerebrais. O exame não causa dor. O resultado é avaliado pelo médico, junto com o restante da história clínica.
