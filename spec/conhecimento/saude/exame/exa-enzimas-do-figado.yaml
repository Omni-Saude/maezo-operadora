id: exa-enzimas-do-figado
categoria: exame
titulo: TGO e TGP (enzimas do fígado)
sinonimos:
- tgo
- tgp
- tgo e tgp
- transaminases
- enzimas do fígado
- ast e alt
- alt e ast
- transaminase oxalacética
- tgo e tgp (enzimas do fígado)
texto: TGO e TGP são exames de sangue que medem enzimas presentes principalmente no fígado. Quando as células do fígado sofrem algum tipo de agressão, essas enzimas podem aparecer em maior quantidade no sangue. O exame costuma ser pedido para investigar ou acompanhar problemas no fígado, ou o efeito de certos remédios. Em geral, é feito com uma pequena amostra de sangue coletada do braço. O médico avalia o resultado junto com outros dados da saúde de cada pessoa.
