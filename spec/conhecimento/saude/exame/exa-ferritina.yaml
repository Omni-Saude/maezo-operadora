id: exa-ferritina
categoria: exame
titulo: Ferritina
sinonimos:
- ferritina
- exame de ferritina
- ferritina sérica
- ferritina serica
- dosagem de ferritina
- feritina
texto: A ferritina é um exame de sangue que mostra quanto ferro está guardado no organismo. Costuma ser pedido para investigar anemia, cansaço persistente ou queda de cabelo. Também ajuda a acompanhar doenças que afetam o ferro. A coleta é feita com uma pequena amostra de sangue do braço. O resultado é avaliado pelo médico, junto com outros exames e a história clínica.
