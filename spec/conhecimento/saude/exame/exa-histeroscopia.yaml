id: exa-histeroscopia
categoria: exame
titulo: Histeroscopia
sinonimos:
- histeroscopia diagnóstica
- histeroscopia cirúrgica
- histeroscopio
- histeroscopia ginecológica
- histeroscopia de consultório
- histeroscopía
- histeroscopia
texto: A histeroscopia é um exame que mostra o interior do útero. Usa-se um tubo fino com uma câmera, introduzido pela vagina. Costuma ser pedida para investigar sangramentos fora do comum, dificuldade para engravidar ou alterações vistas em outros exames. Às vezes permite retirar pequenas amostras de tecido. O resultado é avaliado pelo médico, em geral da área de ginecologia.
