id: exa-mamografia
categoria: exame
titulo: Mamografia
sinonimos:
- mamografia
- mamografia de rastreamento
- mamografia bilateral
- exame da mama
- exame das mamas
texto: A mamografia é um raio-x das mamas. Pode mostrar alterações antes de surgirem sintomas. O Ministério da Saúde recomenda a mamografia de rastreamento para mulheres de 50 a 74 anos, a cada dois anos. O exame tem benefícios e limites, que podem ser conversados com o médico.
