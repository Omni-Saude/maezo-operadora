id: exa-polissonografia
categoria: exame
titulo: Polissonografia
sinonimos:
- polissonografia
- exame do sono
- polisonografia
- polissono
- estudo do sono
- polissonografia noturna
texto: A polissonografia é um exame que registra o corpo durante o sono. Ela mostra a respiração, o oxigênio no sangue, os batimentos do coração e os movimentos. Costuma ser pedida para investigar problemas do sono, como apneia e roncos. Sensores são colocados na pele, e o registro é feito durante a noite, em laboratório ou, às vezes, em casa. O resultado é avaliado pelo médico.
