texto: A vacinação e a realização do exame preventivo (Papanicolau) se complementam como ações de prevenção desse tipo de câncer. É um exame simples e rápido, podendo, no máximo, causar um pequeno desconforto. Mulheres grávidas também podem se submeter ao exame, sem prejuízo para sua saúde ou a do bebê.
