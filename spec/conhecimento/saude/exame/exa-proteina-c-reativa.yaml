id: exa-proteina-c-reativa
categoria: exame
titulo: Proteína C reativa (PCR)
sinonimos:
- pcr
- proteina c reativa
- proteína c-reativa
- pcr ultrassensível
- pcr us
- proteina c reativa ultrassensivel
- exame de pcr
- proteína c reativa (pcr)
texto: A proteína C reativa, ou PCR, é um exame de sangue que mede uma substância produzida pelo fígado. Ela aumenta no sangue quando há inflamação ou infecção no corpo. Costuma ser pedida para ajudar a investigar e acompanhar doenças inflamatórias e infecciosas. A coleta é feita com uma pequena amostra de sangue, geralmente tirada do braço. O resultado é avaliado pelo médico, junto com outros exames e com a história clínica.
