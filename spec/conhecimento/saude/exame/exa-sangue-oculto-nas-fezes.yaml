texto: A pesquisa de sangue oculto nas fezes procura pequenas quantidades de sangue que não se enxergam a olho nu. Costuma ser pedida para investigar sangramentos no sistema digestivo e no rastreamento de alterações do intestino grosso. Em geral, a pessoa coleta uma amostra de fezes em um recipiente próprio, seguindo as orientações do laboratório. A amostra é analisada em laboratório. O resultado é avaliado pelo médico, que explica o que ele significa.
