texto: O exame de vitamina B12 mede a quantidade dessa vitamina no sangue. Ela participa da formação das células do sangue e do funcionamento dos nervos. Costuma ser pedido para investigar anemias, alterações neurológicas ou problemas de absorção de nutrientes. A coleta é feita com uma amostra de sangue, em geral retirada de uma veia do braço. O resultado é avaliado pelo médico, junto com outros dados de saúde.
