texto: O exame de vitamina D mede a quantidade dessa substância no sangue. Costuma ser pedido para avaliar a saúde dos ossos e investigar alterações no metabolismo do cálcio. Em geral, é feito com a coleta de uma pequena amostra de sangue, retirada de uma veia do braço. O resultado é avaliado pelo médico, junto com a história de saúde de cada pessoa.
