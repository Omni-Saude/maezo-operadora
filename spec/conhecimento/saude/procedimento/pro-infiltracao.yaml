id: pro-infiltracao
categoria: procedimento
titulo: Infiltração articular
sinonimos:
- infiltração no joelho
- infiltracao articular
- infiltração na articulação
- infiltração de corticoide
- injeção na articulação
- infiltração no ombro
- infiltracao
- infiltração articular
texto: Infiltração articular é um procedimento em que o médico aplica um medicamento dentro ou ao redor de uma articulação. Costuma ser indicada em situações de inflamação ou dor articular, como em artrose, tendinites e bursites. Em geral, é feita em consultório ou ambulatório, com limpeza da pele e agulha fina, às vezes guiada por ultrassom. A indicação, o tipo de substância e a decisão de fazer o procedimento são do médico, geralmente ortopedista ou reumatologista. Os efeitos variam de pessoa para pessoa.
