id: pro-insercao-de-diu
categoria: procedimento
titulo: Inserção de DIU
sinonimos:
- diu
- colocar diu
- colocação de diu
- dispositivo intrauterino
- diu de cobre
- diu hormonal
- diu mirena
- inserção de diu
texto: A inserção de DIU é um procedimento em que o médico coloca um pequeno dispositivo dentro do útero. Costuma ser indicada para quem busca um método contraceptivo de longa duração. Alguns tipos também são usados em outras situações ginecológicas. Em geral, é feita no consultório, com exame ginecológico e passagem do dispositivo pelo colo do útero. A indicação e a escolha do tipo são do médico, da área de ginecologia.
