id: pro-litotripsia
categoria: procedimento
titulo: Litotripsia
sinonimos:
- litotripsia extracorporea
- quebra de pedra no rim
- litotripsia renal
- litotricia
- litotripsia por ondas de choque
- ondas de choque pedra no rim
- litotripsia
texto: Litotripsia é um procedimento usado para quebrar pedras que se formam nos rins ou nas vias urinárias. Costuma ser indicada quando a pedra não sai por conta própria. Em geral, ondas de choque feitas por um aparelho fragmentam a pedra, e os pedaços saem na urina. Também existem técnicas feitas por dentro das vias urinárias, com um tubo fino. A indicação e a técnica são definidas pelo médico, em geral o urologista.
