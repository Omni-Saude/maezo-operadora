id: pro-transfusao-de-sangue
categoria: procedimento
titulo: Transfusão de sangue
sinonimos:
- transfusão de sangue
- transfusao sanguinea
- transfusão sanguínea
- transfusao
- receber sangue
- hemotransfusão
texto: A transfusão de sangue é um procedimento em que se recebe sangue de um doador. Também pode ser de apenas uma parte do sangue, como hemácias ou plaquetas. Costuma ser indicada em casos como perda de sangue, anemia intensa ou doenças do sangue. O material é aplicado na veia, com acompanhamento da equipe de saúde, após exames de compatibilidade. A indicação é sempre do médico.
