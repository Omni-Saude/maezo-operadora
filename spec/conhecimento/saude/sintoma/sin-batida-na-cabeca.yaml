perguntas_alerta:
- Depois da batida, teve vômito, desmaio ou apagou, convulsão, ou saiu sangue ou líquido pelo nariz ou pelo ouvido?
- Está muito sonolento, confuso ou com o comportamento diferente do normal, ou é um bebê com menos de 1 ano?
