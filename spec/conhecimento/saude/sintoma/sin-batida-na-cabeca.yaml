texto: Sem sinais de alarme, observe a pessoa nas próximas horas. Se tiver dúvida, marque consulta com clínico geral ou pediatra. Se aparecer algum sinal de alarme, procure um pronto-socorro na hora ou ligue 192 (SAMU).
