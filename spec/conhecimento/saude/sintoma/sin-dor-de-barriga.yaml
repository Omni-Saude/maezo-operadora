texto: Sem sinais de alarme, o caminho é marcar uma consulta com clínico geral ou médico de família. Se a dor piorar ou não passar, procure atendimento no mesmo dia. Se aparecer algum sinal de alarme, procure um pronto-socorro na hora ou ligue 192 (SAMU).
