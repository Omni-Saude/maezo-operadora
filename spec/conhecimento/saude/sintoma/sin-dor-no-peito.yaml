texto: Dor no peito sempre merece atenção. Se a dor já passou e não há sinal de alarme, marque logo uma consulta com clínico geral ou cardiologista. Se a dor voltar, mesmo fraca, procure um pronto-socorro na hora ou ligue 192 (SAMU).
