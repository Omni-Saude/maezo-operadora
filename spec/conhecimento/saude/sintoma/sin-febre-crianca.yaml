texto: Sem sinais de alarme, o caminho é marcar uma consulta com o pediatra. Se a febre continuar, leve a criança a um pronto atendimento infantil. Se aparecer algum sinal de alarme, procure um pronto-socorro na hora ou ligue 192 (SAMU).
