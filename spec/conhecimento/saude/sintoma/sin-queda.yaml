# Base de conhecimento de saúde da Helena — MODELO DE TESTE (dev).
# Criado em 25/10/2026 (teste do dono, item 7): a queda recebia as perguntas de alerta genéricas (peito/AVC).
# PENDENTE DO MÉDICO-AUDITOR (DL-0123): as perguntas e os sinais saem SÓ das fontes abaixo — quedas podem causar
# fraturas e traumatismo craniano (Ministério da Saúde, Saúde de A a Z); desmaio e confusão (tabela de sinais de
# alarme do adulto e o arquivo da batida na cabeça). NÃO entraram, para o médico-auditor decidir: não conseguir
# levantar/andar/apoiar sem ajuda (a Secretaria de Estado da Saúde de Goiás diz que pede avaliação, mas a fonte está
# fora da lista fechada do ADR-0064), dor intensa e deformidade (sem fonte oficial encontrada). A batida na cabeça
# citada junto tem precedência (sin-batida-na-cabeca).
# Revisão médica e revisão jurídica PENDENTES antes de qualquer uso em produção. Texto informativo: não
# diagnostica, não indica conduta nem dose e não promete cobertura do plano.
