texto: Sem sinais de alarme, o caminho é marcar uma consulta com clínico geral ou médico de família. Se a tontura se repetir, o otorrino ou o neurologista também podem avaliar. Se aparecer algum sinal de alarme, procure um pronto-socorro na hora ou ligue 192 (SAMU).
