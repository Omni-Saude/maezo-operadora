texto: Sem sinais de alarme, o caminho é marcar uma consulta com clínico geral, médico de família ou pediatra. Tosse por três semanas ou mais deve ser avaliada por um profissional de saúde. Se aparecer algum sinal de alarme, procure um pronto-socorro na hora ou ligue 192 (SAMU).
