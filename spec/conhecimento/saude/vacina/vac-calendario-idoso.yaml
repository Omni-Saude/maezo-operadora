texto: A vacinação promove uma vida saudável e contribui para a qualidade de vida e o bem-estar da pessoa idosa. Em todas as idades, as vacinas são essenciais para prevenir doenças graves. Os idosos devem manter o Cartão de Vacinas atualizado, seguindo o Calendário Nacional de Vacinação - Idoso.
