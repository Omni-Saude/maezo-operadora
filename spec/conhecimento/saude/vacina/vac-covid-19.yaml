texto: A vacina contra a covid-19 protege contra a doença causada pelo coronavírus SARS-CoV-2. Segundo o Ministério da Saúde, a vacinação é a principal forma de evitar casos graves, mortes e possíveis sequelas. Ela se soma a outras medidas, como lavar as mãos e ventilar os ambientes. O Calendário Nacional de Vacinação define quem pode receber. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
