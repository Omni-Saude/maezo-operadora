titulo: Vacina contra a dengue
sinonimos:
- vacina da dengue
- vacina dengue
- imunizante contra dengue
- vacinação contra dengue
- vacina contra aedes aegypti
- vacina denge
- vacina contra a dengue
texto: A vacina contra a dengue protege contra o vírus da dengue, transmitido pelo mosquito Aedes aegypti. Ela passou a fazer parte do Calendário Nacional de Vacinação, que define quem pode recebê-la. A vacina não substitui o controle do mosquito, que segue como principal forma de prevenção. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
