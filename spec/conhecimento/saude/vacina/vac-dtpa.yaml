id: vac-dtpa
categoria: vacina
titulo: Vacina dTpa (tríplice bacteriana acelular)
sinonimos:
- dtpa
- tríplice bacteriana acelular
- triplice bacteriana acelular
- vacina da coqueluche
- vacina dtpa gestante
- tríplice bacteriana adulto
- vacina difteria tétano coqueluche
- vacina dtpa (tríplice bacteriana acelular)
texto: A dTpa, também chamada de tríplice bacteriana acelular tipo adulto, protege contra difteria, tétano e coqueluche. Essas doenças são graves, mas podem ser evitadas por vacina. A coqueluche é especialmente perigosa para bebês pequenos. O Calendário Nacional de Vacinação define quem pode receber a dTpa, e há grupos como gestantes e profissionais de saúde. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
