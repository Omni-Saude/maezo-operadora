texto: A vacina contra a febre amarela protege contra uma doença causada por um vírus. Esse vírus é transmitido por mosquitos em áreas de risco. A vacina é a principal forma de prevenção dessa doença. O Calendário Nacional de Vacinação define quem pode recebê-la. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
