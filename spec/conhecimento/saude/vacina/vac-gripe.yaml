titulo: Vacina contra a gripe (influenza)
sinonimos:
- vacina da gripe
- vacina influenza
- vacina contra influenza
- vacina gripe
- vacinação contra a gripe
- campanha de vacinação da gripe
- vacina h1n1
- vacina contra a gripe (influenza)
texto: A vacina contra a gripe protege contra os vírus influenza, que causam a gripe e podem levar a complicações. Como esses vírus mudam com o tempo, a vacina é reformulada com frequência. O Calendário Nacional de Vacinação define quem pode receber a vacina. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
