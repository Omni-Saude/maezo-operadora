texto: A vacina contra a hepatite B protege contra o vírus da hepatite B, que ataca o fígado. A infecção pode ser aguda ou crônica. Esse é um dos tipos de hepatite viral mais frequentes no Brasil. O Calendário Nacional de Vacinação define quem pode receber essa vacina. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
