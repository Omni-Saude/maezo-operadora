id: vac-hpv
categoria: vacina
titulo: Vacina contra o HPV
sinonimos:
- vacina hpv
- vacina papilomavírus
- vacina papiloma virus
- vacina do hpv
- vacina contra verruga genital
- imunização hpv
- vacina contra o hpv
texto: A vacina contra o HPV protege contra o papilomavírus humano, vírus de transmissão sexual muito comum. Alguns tipos desse vírus podem causar verrugas na região genital e ligar-se a cânceres, como o de colo do útero. A vacina é oferecida gratuitamente pelo SUS. O Calendário Nacional de Vacinação define quem pode receber. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
