texto: A vacina meningocócica protege contra infecções causadas pela bactéria meningococo, que podem provocar meningite e outras formas graves de doença. Existem vacinas que protegem contra diferentes tipos da bactéria, chamados sorogrupos, como o C e o ACWY. O Calendário Nacional de Vacinação define quem pode receber cada uma delas. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
