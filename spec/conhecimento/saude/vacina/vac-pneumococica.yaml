texto: A vacina pneumocócica protege contra doenças causadas pela bactéria pneumococo, como as chamadas doenças pneumocócicas invasivas. Entre elas estão infecções graves, como pneumonia e meningite. O Calendário Nacional de Vacinação, do Ministério da Saúde, define quem pode receber a vacina. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
