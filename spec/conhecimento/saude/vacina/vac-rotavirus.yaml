titulo: Vacina contra o rotavírus
sinonimos:
- vacina rotavírus
- vacina rotavirus
- vacina do rotavírus
- rotavírus
- rotavirus
- vacina rota vírus
- vacina oral rotavírus
- vacina contra o rotavírus
texto: A vacina contra o rotavírus protege contra a infecção por esse vírus. O rotavírus é uma das principais causas de diarreia grave em crianças pequenas. A doença costuma causar vômitos, diarreia e febre, e pode levar à desidratação. A vacina é dada por via oral. O Calendário Nacional de Vacinação define quem pode recebê-la; para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
