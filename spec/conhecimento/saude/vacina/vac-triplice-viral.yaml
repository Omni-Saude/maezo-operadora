texto: 'A vacina tríplice viral protege contra três doenças que passam de pessoa para pessoa: sarampo, caxumba e rubéola. Ela é feita com vírus vivos enfraquecidos, que estimulam o corpo a produzir defesas sem causar a doença. O Calendário Nacional de Vacinação define quem pode receber. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.'
