id: vac-vsr
categoria: vacina
titulo: Vacina e anticorpo contra o vírus sincicial respiratório (VSR)
sinonimos:
- vacina vsr
- vacina do vírus sincicial
- vacina bronquiolite
- anticorpo vsr
- vacina vsr gestante
- vacina e anticorpo contra o vírus sincicial respiratório (vsr)
texto: O vírus sincicial respiratório (VSR) causa infecções respiratórias e pode provocar bronquiolite em bebês. A vacina para gestantes ajuda a proteger o bebê nos primeiros meses de vida, pois os anticorpos passam pela placenta. Existe também um anticorpo de proteção para bebês, indicado pelo médico em algumas situações. O Calendário Nacional de Vacinação define quem pode receber a vacina. Para saber se é o seu caso, procure uma unidade de saúde ou o seu médico.
