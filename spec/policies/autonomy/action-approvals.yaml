# ---------------------------------------------------------------------------------------------
# mapeamento_topicos — external-task topic -> action class.
#
# ROTEAMENTO (plumbing), NÃO REGRA — vive aqui, e não em Python, pelo mesmo motivo que o
# `mapeamento_dut_criteria` do manifesto GAP-AUTH-4: para que um humano possa completá-lo sem
# mudança de código, exatamente como a ratificação.
#
# DELIBERADAMENTE INCOMPLETO. Só estão mapeados os tópicos cujo efeito externo é inequívoco a
# partir do próprio worker (os `superficies[].choked: true` acima). Os ~80 tópicos restantes de
# `spec/processes/bpmn/**` — cálculo, triagem, leitura de fatos, notificações internas de SLA —
# NÃO estão mapeados, e classificá-los é decisão humana, não inferência de agente.
#
# CONSEQUÊNCIA SOB `modo: enforcing`: um tópico NÃO mapeado é DENY, com o motivo
# `ACAO_NAO_MAPEADA` (ADR-0037 XRD-09: "ação/política desconhecida ... negam"). Isto é
# intencional e é a razão pela qual completar este mapa faz parte do ato de ratificação — não
# de um follow-up. Sob `modo: shadow` (hoje), cada tópico não mapeado emite exatamente uma linha
# de telemetria `ACAO_NAO_MAPEADA`, e essa telemetria É a lista de trabalho para completar o
# mapa contra tráfego real.
# ---------------------------------------------------------------------------------------------
mapeamento_topicos:
  operadora.auth.issue_authorization: autorizacao_emissao

  operadora.auth.send_denial_notice: negativa_notificacao
  operadora.reembolso.send_reembolso_denial: negativa_notificacao
  operadora.recurso.registrar_indeferimento: negativa_notificacao
  operadora.recurso.comunicar_resposta: negativa_notificacao
  operadora.contas.registrar_glosa: negativa_notificacao
  operadora.contas.emitir_demonstrativo: negativa_notificacao

  regulatorio.anssubmit.submit: submissao_regulatoria_ans
  regulatorio.anssubmit.retransmit: submissao_regulatoria_ans
  operadora.nip.submit_response: submissao_regulatoria_ans

  operadora.pagto.release_low_value_payment: pagamento_emissao
  operadora.pagto.release_high_value_payment: pagamento_emissao
  operadora.reembolso.issue_payment: pagamento_emissao

  operadora.inadimplencia.register_contract_suspension: vinculo_contratual_mudanca
  operadora.cancel.effectuate_member_request: vinculo_contratual_mudanca
  operadora.cancel.send_cancellation_notice: vinculo_contratual_mudanca
  operadora.cred.register_descredenciamento: vinculo_contratual_mudanca

  operadora.fraude.register_fraud_accusation: acusacao_fraude_registro
  operadora.fraude.refer_to_legal: acusacao_fraude_registro

  operadora.programa.proactive_contact: comunicacao_beneficiario
  operadora.lgpd.send_response: comunicacao_beneficiario
  operadora.lgpd.request_additional_proof: comunicacao_beneficiario

  operadora.contas.handoff_pagamento: inicio_processo_regulatorio
  operadora.contas.start_fraude: inicio_processo_regulatorio
  operadora.recurso.handoff_pagamento: inicio_processo_regulatorio
  operadora.adequacao.start_credenciamento: inicio_processo_regulatorio
  operadora.fraude.start_credenciamento: inicio_processo_regulatorio
  operadora.fraude.start_contratual: inicio_processo_regulatorio
  operadora.inadimplencia.handoff_rescisao: inicio_processo_regulatorio
  operadora.nip.handoff_ans_submit: inicio_processo_regulatorio

# ---------------------------------------------------------------------------------------------
# mapeamento_acoes — agent-side action ref -> action class.  [ADITIVO — Onda 1, design §7.1]
#
# Irmão de `mapeamento_topicos`, que fica BYTE-A-BYTE INALTERADO acima e mantém o significado
# dele (tópico de external-task -> classe). Aqui vive o outro namespace: `agente.<operacao>`, uma
# entrada por operação do catálogo fechado `src/maezo/gateway/effect_classes.py`.
#
# O loader FUNDE os dois mapas em um só e RECUSA O MANIFESTO INTEIRO se uma mesma ref aparecer nos
# dois — mesma postura do `_RefusingDuplicatesLoader`: um registro de governança não pode ser
# silenciosamente sombreado. Uma ref, uma classe, uma linha revisada.
#
# Ambos os namespaces já satisfazem o formato de token pontilhado que a telemetria aceita, então
# nada nas linhas de log muda de forma.
#
# ESTE MAPA NÃO APROVA NADA. Ele declara ROTEAMENTO. Toda classe apontada aqui continua com os
# três blocos `PENDENTE` e `enforcement: shadow`.
# ---------------------------------------------------------------------------------------------
mapeamento_acoes:
  agente.fhir.read_patient: leitura_phi_clinica
  agente.fhir.read_patient_summary: leitura_phi_clinica
  agente.fhir.read_coverage: leitura_phi_clinica
  agente.fhir.search_coverage: leitura_phi_clinica

  agente.whatsapp.send_message: comunicacao_beneficiario

  agente.cibseven.start_process: inicio_processo_regulatorio

  agente.cibseven.correlate_message: correlacao_processo

  agente.cibseven.get_process_status: consulta_processo
  agente.cibseven.find_active_instance: consulta_processo
  agente.cibseven.find_any_instance: consulta_processo

  agente.dmn.evaluate: avaliacao_dmn

  agente.inference.generate: inferencia_llm
  agente.inference.generate_phi: inferencia_llm

  agente.population.actuarial_risk: leitura_populacional
  agente.population.population_metrics: leitura_populacional

  agente.a2a.delegate: delegacao_a2a

# ---------------------------------------------------------------------------------------------
# vocabulario_l0_canonico — os NOMES canônicos das 4 ações L0 que hoje NÃO têm nome.
# [ADITIVO — 2026-09-06. Execução da Q-4, que o dono já ratificou em PLANS.md §0.8 ("quatro ações
# canônicas, SEM aliases") sem fixar as strings; aqui as strings ficam fixadas.]
#
# O QUE ESTE BLOCO É. Uma DECLARAÇÃO DE NOME, e nada além disso. Escrever um nome aqui não cria
# ação de autonomia, não muda classe nenhuma, não aprova nada e não pode produzir ALLOW: o
# `status` deste arquivo segue `DRAFT` e o cabeçalho (linha 27) já declara que um arquivo DRAFT
# NUNCA produz ALLOW, em modo nenhum. Nomear é o pré-requisito barato do que vem depois — não é
# o que vem depois.
#
# O QUE ESTE BLOCO NÃO É — e a razão de cada NÃO:
#
#   * NÃO é a instalação do nome na matriz de autonomia. Enquanto o nome não estiver em
#     `spec/policies/autonomy/L0-core.yaml`, o catálogo fechado
#     (`src/maezo/gateway/effect_classes.py`) mantém `autonomy_action=None` para estas operações e
#     a camada L-2 do PEP de efeito NEGA com `VOCABULARIO_PENDENTE`
#     (`src/maezo/gateway/effect_pep.py`). Instalar é ato HUMANO ADR-0008/0025, COM o cross-check
#     de `_hard_frozen.yaml`, e NÃO foi feito aqui: `instalado_em_l0_core: false` em toda entrada
#     é o registro máquina-legível disso.
#
#   * NÃO é uma classe de ação. As classes vivem em `acoes:` acima e são espelho FECHADO do
#     catálogo: a cerca §8.5 de `scripts/ci/check_effect_chokepoint_fence.py` recusa divergência
#     nos DOIS sentidos, e `mapeamento_acoes` tem de bater exatamente com o catálogo. Nenhuma
#     classe foi criada, removida ou renomeada por este bloco; `acoes:`, `mapeamento_topicos:` e
#     `mapeamento_acoes:` seguem byte a byte.
#
#   * NÃO é uma aprovação. Nenhum campo `aprovado` aparece aqui, DE PROPÓSITO: neste arquivo
#     `aprovado` significa "o domínio X atestou a classe Y", e reusar o token para um ato de
#     VOCABULÁRIO daria dois significados à mesma palavra no mesmo arquivo. O par equivalente é
#     `ratificado: false` com todo campo de accountability em `PENDENTE` — a mesma disciplina da
#     linha 47 ("NO AGENT MAY FILL ANY BLOCK BELOW"), que vale aqui na mesma letra: NENHUM AGENTE
#     PODE MARCAR `ratificado: true` NEM PREENCHER `ratificador`/`data`/`evidencia_ref`.
#
#   * NÃO estreita nem alarga `dominios_exigidos` de ninguém. As três classes citadas seguem
#     exigindo `[medica, ans, seguranca]` em `acoes:`, inalterado — decidir quais domínios gateiam
#     uma ação é conteúdo de Security, não de nomenclatura.
#
#   * NÃO muda a ordem nem a autoridade dos flips. Cada virada de enforcement C0→C4 continua ato
#     humano de Security em PR revisado (Q-1); a sequência escrita está em PLANS.md §0.8.
#
# SEM ALIAS (Q-4; `src/maezo/gateway/pep.py`: "there is no PT↔EN alias layer — an alias map is a
# second vocabulary and a fail-open surface"). Cada nome é próprio e distinto. Em particular:
#   - a inferência é nomeada POR ZONA (ADR-0006: Zona Geral vs Zona PHI/Financeira) — DUAS strings
#     distintas, não uma string com dois usos. O sufixo `_phi` marca a zona do mesmo modo que o
#     token `phi` já marca `read_phi_data` e a própria operação `inference.generate_phi`;
#   - a leitura populacional NÃO reusa `read_phi_data`: agregado k-anônimo não é PHI (ADR-0042), e
#     apelidar seria exatamente o segundo vocabulário que a Q-4 proibiu.
#
# COBERTURA, DERIVADA DA ÁRVORE. As `operacoes` abaixo são exatamente as operações do catálogo
# fechado cujo `autonomy_action` é `None`. `tests/unit/sec/test_l0_canonical_action_naming.py`
# recomputa esse conjunto a partir de `effect_classes.OPERATIONS` e falha se as duas listas
# divergirem — uma operação que perca (ou ganhe) nome aparece como vermelho, nunca como silêncio.
# O mesmo teste prova o piso: mesmo com este arquivo forjado para `RATIFICADO` e todas as
# aprovações preenchidas, as cinco operações continuam NEGANDO com `VOCABULARIO_PENDENTE` —
# nomear aqui não abre caminho de ALLOW em lugar nenhum.
# ---------------------------------------------------------------------------------------------
vocabulario_l0_canonico:

  generate_model_inference:
    classe: inferencia_llm
    zona: geral
    operacoes: ["inference.generate"]
    descricao: >-
      Egresso para modelo de linguagem na Zona Geral (ADR-0006) — geração sem PHI no prompt.
      Nenhuma ação da matriz descreve egresso para modelo; este é nome próprio, não apelido.
    instalado_em_l0_core: false
    ratificacao:
      ratificado: false
      ratificador: PENDENTE
      data: PENDENTE
      evidencia_ref: PENDENTE

  generate_model_inference_phi:
    classe: inferencia_llm
    zona: phi
    operacoes: ["inference.generate_phi"]
    descricao: >-
      Egresso para modelo de linguagem na Zona PHI/Financeira (ADR-0006) — geração com PHI. Nome
      SEPARADO do irmão de Zona Geral porque a distinção de zona é o fato que a telemetria e o
      aprovador precisam ver sem carregar o prompt. O roteamento `phi=True` do provider
      (`PhiZoneRoutingError`) continua falhando fechado de forma INDEPENDENTE deste vocabulário e
      do gateway (invariante I-6): nomear não é o controle, e não substitui o controle.
    instalado_em_l0_core: false
    ratificacao:
      ratificado: false
      ratificador: PENDENTE
      data: PENDENTE
      evidencia_ref: PENDENTE

  delegate_agent_task:
    classe: delegacao_a2a
    operacoes: ["a2a.delegate"]
    descricao: >-
      Delegação agente-a-agente por envelope assinado — o contrato A2A é "instrui, não decide".
      Atravessa fronteira de agente e carrega contexto, e por isso é efeito de tool no sentido do
      XRD-09 mesmo não tocando o mundo externo.
    instalado_em_l0_core: false
    ratificacao:
      ratificado: false
      ratificador: PENDENTE
      data: PENDENTE
      evidencia_ref: PENDENTE

  read_population_aggregate:
    classe: leitura_populacional
    operacoes: ["population.actuarial_risk", "population.population_metrics"]
    descricao: >-
      Leitura de agregados populacionais/atuariais com supressão k-anônima. UM nome para as duas
      operações porque as duas são a mesma ação sobre a mesma superfície — isso é escopo de ação,
      não alias. Deliberadamente NÃO é `read_phi_data`: agregado k-anônimo não é PHI (ADR-0042), e
      o piso de k continua sendo decisão do dono (ADR-P-003), fora do alcance de uma nomeação.
    instalado_em_l0_core: false
    ratificacao:
      ratificado: false
      ratificador: PENDENTE
      data: PENDENTE
      evidencia_ref: PENDENTE
