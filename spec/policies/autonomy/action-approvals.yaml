# ---------------------------------------------------------------------------------------------
# mapeamento_topicos — external-task topic -> action class.
#
# ROTEAMENTO (plumbing), NÃO REGRA — vive aqui, e não em Python, pelo mesmo motivo que o
# `mapeamento_dut_criteria` do manifesto GAP-AUTH-4: para que um humano possa completá-lo sem
# mudança de código, exatamente como a ratificação.
#
# DELIBERADAMENTE INCOMPLETO. Só estão mapeados os tópicos cujo efeito externo é inequívoco a
# partir do próprio worker (os `superficies[].choked: true` acima). Os ~80 tópicos restantes de
# `spec/processes/bpmn/**` — cálculo, triagem, leitura de fatos, notificações internas de SLA —
# NÃO estão mapeados, e classificá-los é decisão humana, não inferência de agente.
#
# CONSEQUÊNCIA SOB `modo: enforcing`: um tópico NÃO mapeado é DENY, com o motivo
# `ACAO_NAO_MAPEADA` (ADR-0037 XRD-09: "ação/política desconhecida ... negam"). Isto é
# intencional e é a razão pela qual completar este mapa faz parte do ato de ratificação — não
# de um follow-up. Sob `modo: shadow` (hoje), cada tópico não mapeado emite exatamente uma linha
# de telemetria `ACAO_NAO_MAPEADA`, e essa telemetria É a lista de trabalho para completar o
# mapa contra tráfego real.
# ---------------------------------------------------------------------------------------------
mapeamento_topicos:
  operadora.auth.issue_authorization: autorizacao_emissao

  operadora.auth.send_denial_notice: negativa_notificacao
  operadora.reembolso.send_reembolso_denial: negativa_notificacao

  regulatorio.anssubmit.submit: submissao_regulatoria_ans
  regulatorio.anssubmit.retransmit: submissao_regulatoria_ans
  operadora.nip.submit_response: submissao_regulatoria_ans
  operadora.recurso.submit_appeal: submissao_regulatoria_ans

  operadora.pagto.release_low_value_payment: pagamento_emissao
  operadora.pagto.release_high_value_payment: pagamento_emissao
  operadora.reembolso.issue_payment: pagamento_emissao

  operadora.inadimplencia.register_contract_suspension: vinculo_contratual_mudanca
  operadora.cancel.effectuate_member_request: vinculo_contratual_mudanca
  operadora.cancel.send_cancellation_notice: vinculo_contratual_mudanca
  operadora.cred.register_descredenciamento: vinculo_contratual_mudanca

  operadora.fraude.register_fraud_accusation: acusacao_fraude_registro
  operadora.fraude.refer_to_legal: acusacao_fraude_registro

  operadora.programa.proactive_contact: comunicacao_beneficiario
  operadora.lgpd.send_response: comunicacao_beneficiario
  operadora.lgpd.request_additional_proof: comunicacao_beneficiario

  operadora.contas.start_recurso: inicio_processo_regulatorio
  operadora.contas.start_fraude: inicio_processo_regulatorio
  operadora.adequacao.start_credenciamento: inicio_processo_regulatorio
  operadora.fraude.start_credenciamento: inicio_processo_regulatorio
  operadora.fraude.start_contratual: inicio_processo_regulatorio
  operadora.inadimplencia.handoff_rescisao: inicio_processo_regulatorio
  operadora.nip.handoff_ans_submit: inicio_processo_regulatorio
