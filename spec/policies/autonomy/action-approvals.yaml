# Approval records for the `ActionExecutionGateway` (MZO-040 / ADR-0037 XRD-09).
#
# WHY THIS FILE EXISTS
# --------------------
# `PLANS.md` §0.6 records MZO-040 as BLOCKED on three human approvals — **Médica, ANS e
# Security** — none of which has been granted (DL-0042 unloaded the DPO/Legal gate for MZO-020
# and explicitly does NOT reach these three). ADR-0037 XRD-09 re-introduces the per-call
# chokepoint that ADR-0034 descoped, and says so with an explicit condition: the clause "só
# produz efeito com a aceitação deste ADR + evidência MZO-040 entregue".
#
# So MZO-040 cannot be "built when approved" — the approvers would be approving a project
# description. This file inverts that: the gateway is BUILT and WIRED IN SHADOW, every action
# class DENIES in enforcement terms, and the approvers ratify against the shadow evidence the
# running system produces. Ratifying is a DATA change in this file — no Python change, no
# redeploy of the gateway.
#
# THE RULE THIS FILE ENFORCES (mirrors two existing loaders in this repo:
# `src/maezo/platform/lifecycle/legal_bases_matrix.py`, the DPO retention matrix that REFUSES its
# own unratified template rather than "succeeding" on placeholder data; and
# `src/maezo/tools/workers/auth_criteria.py`, the GAP-AUTH-4 ratification gate):
#
#     An action class may be ALLOWED only if (a) this file's `status` is exactly `RATIFICADO`,
#     (b) the class is declared below, and (c) EVERY domain in its `dominios_exigidos` carries a
#     complete approval block. Anything else — DRAFT status, a missing class, an unmapped topic,
#     a blank/PENDENTE accountability field, a malformed file — is a DENY.
#
# A `status: DRAFT` file can NEVER produce an ALLOW, in ANY mode, even if every `aprovado` below
# reads `true`. That forgery shape is pinned by
# `tests/unit/sec/test_action_execution_fence.py::test_draft_file_can_never_allow_even_when_forged`.
#
# HOW TO RATIFY (the exact human act — see docs/reviews/mzo-040-approval-packet.md)
# --------------------------------------------------------------------------------
#  1. Each approver fills THEIR OWN domain block, for each action class they are attesting:
#         aprovado:      true                    # the boolean literal true — nothing else counts
#         aprovador:     "<name, role>"          # ADR-0007 accountability: WHO
#         data:          "YYYY-MM-DD"            # WHEN
#         evidencia_ref: "<what they reviewed>"  # AGAINST WHAT (a shadow-telemetry window, a
#                                                # report path, a meeting record — never blank)
#     The literal string `PENDENTE` is the machine-detectable placeholder: a field left as
#     `PENDENTE` (or blank, or null) means NOT approved, even alongside `aprovado: true`.
#     A partial fill reads as an unfinished edit and is refused — never a ratification.
#  2. Complete `mapeamento_topicos` for every topic that must be gated (see the note there).
#  3. Set `status: RATIFICADO`.
#  4. Set `modo: enforcing`.
# Steps 3 and 4 are the switch. Until BOTH happen, execution is byte-for-byte unchanged.
#
# NO AGENT MAY FILL ANY BLOCK BELOW. A forged approval is a compliance event, not a bug.
# Every `aprovado` here is `false` and every accountability field is `PENDENTE` — that is not a
# placeholder awaiting cleanup, it is the honest recorded state of the three open gates.
#
# CODEOWNERS: covered by `/spec/policies/autonomy/` AND by an explicit last-match line for this
# file in `.github/CODEOWNERS` (@rodrigotaquino @Omni-Saude/security).
#
# The `unratified: true` root key (absent below, deliberately) is the retention-matrix template
# guard, mirrored: a copy of this file marked `unratified: true` is REFUSED WHOLESALE, so
# pointing the loader at a placeholder by mistake also fails closed.

version: 1

# ---------------------------------------------------------------------------------------------
# status — DRAFT | RATIFICADO. Anything other than the exact literal `RATIFICADO` means NOTHING
# below can be approved, regardless of what the per-domain blocks say. This is the outer fence.
# ---------------------------------------------------------------------------------------------
status: DRAFT

# ---------------------------------------------------------------------------------------------
# modo — shadow | enforcing.
#
#   shadow     the gateway EVALUATES every choked call and emits structured, non-PHI telemetry
#              (`action_execution_gateway_shadow`: action_class, would_allow/would_deny, reason,
#              mode, tenant, topic) and NEVER alters execution. This is today's value.
#   enforcing  a DENY blocks the call: the external task is refused fail-closed (audited refusal
#              + engine incident, retries=0 — the same shape as every other guard in this repo,
#              per ADR-0008/ADR-0030 §4), so it lands in front of a human and never silently
#              proceeds nor silently disappears.
#
# Flipping this field is a human act with NO code change. Flipping it while `status` is DRAFT
# denies EVERY class — that direction is safe, and deliberately so.
#
# BEFORE FLIPPING, read `mapeamento_topicos` below: an unmapped topic DENIES under enforcement.
# ---------------------------------------------------------------------------------------------
modo: shadow

# ---------------------------------------------------------------------------------------------
# acoes — the action classes.
#
# Derived from ADR-0037 XRD-09 ("todo read/tool/efeito externo") and from the LIVE runtime
# surfaces in this repo. Every class below carries at least one real `superficies` referent with
# a `file:line` in the tree; no class was invented to round out a taxonomy.
#
# `dominios_exigidos` is `[medica, ans, seguranca]` for EVERY class, because `PLANS.md` §0.6
# states the MZO-040 gate as Médica + ANS + Security without per-class differentiation, and
# DL-0042 states the exclusion the same way. NARROWING a class's required set (e.g. deciding
# that payment issuance needs no medical attestation) is itself a governance decision and a
# CODEOWNERS-gated edit to this file BY A HUMAN — an agent must never make it. The loader
# rejects an empty `dominios_exigidos` and any domain outside the code-frozen set
# {medica, ans, seguranca} (`src/maezo/gateway/action_execution.py`), so "approve by emptying
# the requirement list" is not a reachable forgery.
#
# `superficies[].choked` records whether the surface flows through the chokepoint the gateway is
# wired at TODAY (`WorkerHarness._handle`, src/maezo/tools/workers/harness.py). It is
# DOCUMENTATION, not policy — the loader never reads it. It exists so an approver knows, per
# class, whether shadow telemetry will actually give them evidence, or whether the surface is
# still unwired. `choked: false` classes are listed because XRD-09 names them and ADR-0037's
# ADR-0022 note requires `mcp_fhir` to route through this gateway; they will produce NO shadow
# evidence until that wiring lands, and the approval packet says so explicitly.
# ---------------------------------------------------------------------------------------------
