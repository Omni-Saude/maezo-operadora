# ---------------------------------------------------------------------------------------------
# evidencia — o que este arquivo muda de OBSERVAVEL hoje, dito sem exagero.
# ---------------------------------------------------------------------------------------------
evidencia:
  efeito_em_runtime: >-
    NENHUM. Nenhum daemon, worker ou agente le este arquivo. Ele e lido por
    `maezo.platform.validation.policy` (no gate `make validate-artifacts`) e por
    `maezo.platform.validation.phi_completeness.check_sweep` (a cerca de completude PHI) — os
    dois sao caminhos de BUILD. A redacao em runtime continua ancorada exclusivamente em
    `PHI_PROCESS_VARS` e `PHI_FIELDS`, byte-identica ao anterior a este manifesto.
  gate_ativo_hoje: >-
    O FECHO. `make validate-artifacts` valida o schema deste arquivo (estrutura, porta DRAFT,
    campos de accountability, rotulos, nomes sem duplicata) e a lane unitaria executa o fecho
    codigo<->manifesto pela cerca. As duas divergencias possiveis — nome no codigo sem linha
    aqui, linha aqui sem nome no codigo — sao ERRO que bloqueia.
  gate_que_a_assinatura_liga: >-
    `disposicao: LISTAR_EM_CONJUNTO_PHI` ratificado passa a EXIGIR o nome em `PHI_PROCESS_VARS`
    ou em `PHI_FIELDS`; enquanto a listagem nao acontecer, a cerca fica VERMELHA. E o efeito de
    gate que a decisao R-199 quis produzir "no mesmo ato" da assinatura.
  o_que_continua_gated_por_humano: >-
    As disposicoes em si (R-065 e R-136, gap PHI-DISPOSITIONS-DPO) e a listagem propriamente
    dita. Nada neste arquivo antecipa, sugere ou registra qualquer uma delas.
