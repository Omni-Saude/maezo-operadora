# === Politica de privacidade — remediacao de PHI em BUSINESS KEYS (DL-0043 leg (c)) ===
#
# O QUE ESTE ARQUIVO E
# --------------------
# Um FLAG de governanca, nao uma decisao ja tomada. Ele existe para que a decisao do DONO
# ("matricula_beneficiario pode continuar a ser cunhada crua dentro de business keys?") seja um
# ato de DADOS explicito, auditavel e revisado — nunca um efeito colateral de um commit.
#
# O FATO QUE O ORIGINOU (verificado no codigo, nao inferido)
# ---------------------------------------------------------
#   * `matricula_beneficiario` esta declarado em `PHI_PROCESS_VARS`
#     (src/maezo/tools/workers/phi_vars.py) — ou seja, a casa ja o classificou como Zona PHI.
#   * Ainda assim ele e cunhado CRU dentro de duas business keys:
#       - `CANCEL-{tenant}-{numero_contrato OR matricula_beneficiario}`
#         (src/maezo/tools/workers/inadimplencia.py::_cancel_business_key)
#       - `INAD-{tenant}-{numero_contrato OR matricula_beneficiario}`
#         (src/maezo/agents/fernando/graph.py::_business_key)
#     O fallback so ocorre em planos individuais/familiares (sem numero de contrato) — isto e,
#     exatamente a populacao de pessoa fisica.
#   * Essa key SAI do processo sem redacao: linhas de log structlog, variavel de processo do
#     engine, payload Kafka (`_business_key`), CHAVE DE MENSAGEM Kafka, allowlist do espelho de
#     notificacoes e a chave de dedup persistida em Postgres.
#   * Precedente da propria casa para a forma CORRETA: `PROG-...-{beneficiario_pseudo_id}`
#     (src/maezo/agents/valentina/graph.py) e `DSR-...-{titular_pseudo_id}`.
#
# ESTE ARQUIVO NAO CORRIGE NADA SOZINHO. Enquanto `modo` efetivo for `off` (o estado de hoje,
# e o default), o comportamento em runtime e BYTE-IDENTICO ao anterior a esta politica. O que o
# codigo faz enquanto isso e CONTAR (sem conteudo) quantas cunhagens de key TERIAM sido
# pseudonimizadas — a evidencia que o dono precisa para decidir (metrica
# `maezo_phi_business_key_mint_total{anchor="matricula"}`).
#
# COMO ATIVAR (uma mudanca de DADOS — sem mudanca de codigo, sem redeploy de Python)
# ---------------------------------------------------------------------------------
# Preencher, TODOS, os quatro campos abaixo:
#   status:                    RATIFICADO      # literal; qualquer outra coisa => modo efetivo off
#   ratificacao.ratificado:    true            # o literal booleano true — nada mais conta
#   ratificacao.revisor:       "<quem ratificou>"   # nao-vazio; prestacao de contas (ADR-0007)
#   ratificacao.ratificado_em: "YYYY-MM-DD"          # nao-vazio; quando
# ...e so entao `modo` passa a valer. Faltando/em branco/nao-true qualquer um dos quatro, o modo
# efetivo e `off` — INDEPENDENTE do que `modo` diga. Um arquivo em DRAFT declarando
# `modo: pseudo_keys` resolve para `off` (o carregador nunca promove um rascunho).
#
# Mesmo guard de template dos precedentes (`legal_bases_matrix.load_retention_matrix`,
# `auth_criteria.load_criteria_sources`): a chave raiz `unratified: true` (ausente abaixo,
# deliberadamente) faz o arquivo inteiro ser RECUSADO — apontar o caminho para um placeholder
# por engano tambem falha fechado.
#
# CODEOWNERS: este diretorio (`/spec/policies/privacy/`) e coberto em `.github/CODEOWNERS`
# (@rodrigotaquino + @Omni-Saude/security), pela mesma razao que `/spec/policies/autonomy/`:
# virar o flag e o UNICO ato que muda o formato de identidade persistida de um beneficiario —
# a mudanca de dado precisa do revisor que o caminho de codigo teria tido.

version: 1

# ---------------------------------------------------------------------------------------------
# status — DRAFT | RATIFICADO. Porta dura: em DRAFT, `modo` NAO vale (resolve para `off`).
# ESTADO DE HOJE: DRAFT. Nada foi decidido; nada esta ativo.
# ---------------------------------------------------------------------------------------------
status: DRAFT

# ---------------------------------------------------------------------------------------------
# modo — o que o codigo faz QUANDO ratificado. DECLARACAO, nao efeito.
#
#   off          (default) Comportamento de hoje, byte-identico. A key continua sendo cunhada
#                como hoje; nenhum scrubber e instalado; a chave Kafka e a de hoje. A UNICA
#                coisa que roda e a telemetria-sombra (contagem sem conteudo).
#
#   PRE-REQUISITO DE `scrub_only` (VERIFICADO, NAO ASSUMIDO): o scrubber e instalado em
#                `platform/observability.py::setup_observability`, e HOJE NENHUM composition root
#                CHAMA essa funcao (varredura do repo: so testes a chamam). Os daemons rodam com
#                a configuracao PADRAO do structlog, que renderiza todos os kwargs em stdout do
#                mesmo jeito. Portanto ratificar `scrub_only` SEM tambem chamar
#                `setup_observability` (ou instalar o processador) no bootstrap de cada daemon
#                fecha (b) e (c) e NAO fecha (a). Isso e um item de checklist do dono, nao um
#                detalhe: e a diferenca entre a politica funcionar e parecer funcionar.
#
#   scrub_only   Nao muda NENHUMA identidade persistida (nenhuma migracao). Fecha as saidas:
#                  (a) instala o `LogScrubber`/`BusinessKeyScrubber` em `structlog.configure`
#                      cobrindo os nomes de campo que carregam key (`business_key`,
#                      `cancel_business_key`, `_business_key`, ...) + `matricula_beneficiario`;
#                  (b) remove `_business_key` da allowlist do envelope espelhado em
#                      `operadora.notifications.internal`;
#                  (c) pseudonimiza a CHAVE DE MENSAGEM Kafka para as familias CANCEL/INAD.
#                ATENCAO — (c) MUDA O PARTICIONAMENTO Kafka dessas duas familias: a chave passa
#                de `CANCEL-{tenant}-{id}` para `CANCEL-hk1_{hmac}`, entao a particao muda. A
#                ordenacao POR CHAVE continua garantida (o HMAC e deterministico: a mesma key
#                logica cai sempre na mesma particao), mas mensagens em voo publicadas antes e
#                depois da virada podem ficar em particoes diferentes. Virar este flag exige
#                janela de drenagem dos topicos afetados. Nao ha mudanca de chave para nenhuma
#                outra familia (RECURSO/CRED/FRAUDE/PROG/ESC/DSR/ANS...).
#
#   pseudo_keys  scrub_only MAIS: novas cunhagens usam `beneficiario_pseudo_id` (o precedente
#                valentina) no lugar de `matricula_beneficiario`. Se o `beneficiario_pseudo_id`
#                estiver ausente/em branco, a cunhagem CAI DE VOLTA para o comportamento legado
#                (nunca cunha key vazia/degenerada).
#
#                O DUAL-READ HOJE E PARCIAL — LEIA `pre_requisitos_pseudo_keys` ABAIXO ANTES DE
#                RATIFICAR. Existe UM unico consumidor que faz dual-read (forma legada + forma
#                pseudo): o guard de anti-dupla-terminacao do CANCEL
#                (`inadimplencia._query_ja_em_rescisao_cancel`, via
#                `base.contract_business_key_forms`). Nenhum outro. Em especial, o lado de START
#                NAO faz dual-read. Uma versao anterior deste bloco dizia "TODOS os
#                guards/queries" — isso era FALSO, e ratificar com base nisso produziria
#                DUPLA-ABERTURA de processo. O detalhe verificado esta no bloco abaixo.
#
# ESTADO DE HOJE: `off`. Trocar este valor sozinho nao faz nada — ver `status`/`ratificacao`.
#
# ASPAS SAO INTENCIONAIS. Em YAML 1.1 um `off` SEM aspas resolve para o booleano `false` (idem
# `on`/`yes`/`no`). O carregador trata esse caso explicitamente, entao desaspar nao muda o
# significado — mas a forma com aspas e a que le como o token que e.
# ---------------------------------------------------------------------------------------------
modo: "off"

# ---------------------------------------------------------------------------------------------
# ratificacao — quem decidiu e quando (ADR-0007). Placeholders detectaveis por maquina:
# `ratificado: false` + `revisor`/`ratificado_em` nulos = "ninguem decidiu ainda", nao um
# preenchimento parcial esquecido.
# ---------------------------------------------------------------------------------------------
ratificacao:
  ratificado: false
  revisor: null
  ratificado_em: null
  observacao: >-
    DECISAO DO DONO, NAO DA ENGENHARIA. Sao tres perguntas distintas e uma delas nao e tecnica:
    (1) LGPD/DPO — `matricula_beneficiario` dentro de uma business key persistida (Postgres de
    dedup, tabelas do CIB Seven, retencao de logs, retencao de topico Kafka) e um identificador
    pessoal em repouso fora da Zona PHI; isso e aceitavel sob a base legal declarada?
    (2) OPERACAO/ANS — a key e visivel no Cockpit e e o que um analista usa para achar o caso;
    pseudonimizar quebra essa busca por matricula e exige um caminho de reconciliacao.
    (3) MIGRACAO — instancias JA VIVAS sob a forma legada nao mudam de key; por isso
    `pseudo_keys` e dual-read, e por isso a janela de migracao precisa de uma data-limite
    definida por quem opera, nao por quem programa.
    Enquanto isto estiver `false`, o unico efeito e a telemetria-sombra.

# ---------------------------------------------------------------------------------------------
# escopo — as familias de business key afetadas. Informativo/auditavel: o codigo trata
# CANCEL e INAD porque sao as UNICAS duas com fallback para `matricula_beneficiario`
# (verificado por varredura de todos os compositores de key em src/). Listado aqui para que uma
# terceira familia com o mesmo defeito seja uma adicao visivel, nunca silenciosa.
# ---------------------------------------------------------------------------------------------
escopo:
  familias:
    - CANCEL      # inadimplencia._cancel_business_key (fallback matricula)
    - INAD        # fernando.graph._business_key (fallback matricula)
  nao_afetadas:
    - RECURSO     # ancorada em numero_guia_tiss/glosa_id
    - CRED        # ancorada em prestador_id
    - FRAUDE      # ancorada em numero_caso/prestador_id
    - PROG        # JA usa beneficiario_pseudo_id (o precedente correto)
    - DSR         # JA usa titular_pseudo_id
    - ESC         # ancorada em pseudonimo keyed de telefone (hk1_)
    - ANS         # ancorada em report_type/competencia/numero_nip_ans

# ---------------------------------------------------------------------------------------------
# pre_requisitos_scrub_only — O QUE FALTA ANTES DE `scrub_only` SER RATIFICAVEL (R-009).
#
# `modo: scrub_only` NAO E RATIFICAVEL ENQUANTO ESTE BLOCO TIVER ITEM `atendido: false` — cercado
# por `scripts/ci/check_phi_scrub_prereqs.py` (`make check-phi-scrub-prereqs`, job
# `validate-artifacts` de `.github/workflows/ci.yml`): a cerca reprova qualquer PR que deixe
# `status: RATIFICADO` com `modo: scrub_only` OU `modo: pseudo_keys` (que HERDA os pre-requisitos
# de scrub_only, ver nota no bloco `modo` acima) sem os dois itens abaixo `atendido: true` E com
# a evidencia exigida preenchida. Enquanto `status: DRAFT` a cerca passa (nada esta em vigor). A
# cerca NAO substitui a assinatura: ela so LE este bloco, nunca escreve `status`/`ratificacao.*`.
#
# RE-VERIFICADO 2026-09-06 (R-009, drift do paragrafo do bloco `modo` acima). Aquele paragrafo diz
# "HOJE NENHUM composition root CHAMA `setup_observability`" — isso ficou DESATUALIZADO: AF-13
# (2026-09-03) fechou exatamente essa lacuna. Os tres composition roots
# (`src/maezo/runtime/agent_runtime/service.py`, `src/maezo/runtime/worker_runtime/service.py`,
# `src/maezo/gateway/service.py`) agora chamam `bootstrap_observability` -> `setup_observability`
# como o PRIMEIRO ato de `run()` (`src/maezo/platform/observability.py::bootstrap_observability`;
# `::_build_key_scrubber` documenta "GAP CLOSED (AF-13, 2026-09-03)"). O que falta HOJE nao e mais
# a chamada: e o PROVISIONAMENTO REAL do segredo — o item `phi_hmac_key_provisionado` abaixo.
# ---------------------------------------------------------------------------------------------
pre_requisitos_scrub_only:
  - id: phi_hmac_key_provisionado
    atendido: false
    onde: >-
      `PHI_HMAC_KEY` esta CABEADO (env var + referencia de segredo) em
      deploy/helm/maezo-tenant/templates/deployment-agent-runtime.yaml,
      deployment-worker-daemon.yaml e deployment-webhook-receiver.yaml, e em
      deploy/aws-ecs/envs/dev-sa-east-1/service-agents.tf e service-worker.tf — mas o VALOR REAL
      do segredo NAO esta provisionado: deploy/helm/maezo-tenant/templates/externalsecret.yaml:170
      registra "BLOCKED: populating the real key in the vault is a manual step (§6.2)". Consumido
      em runtime via src/maezo/gateway/pseudonymizer.py::Pseudonymizer.from_settings (ADR-0035,
      fail-closed na ausencia).
    evidencia_provisionamento: ""
    efeito_se_ratificado_sem_isto: >-
      NOT READY NO BOOT. src/maezo/platform/observability.py::_build_key_scrubber levanta
      `PseudonymizerKeyMissingError` quando o modo efetivo exige scrubber e `PHI_HMAC_KEY` esta
      ausente; os tres composition roots (AF-13, ja cabeados) capturam essa excecao via
      `bootstrap_observability` e deixam `observability_configured=False` — o daemon fica NOT
      READY em producao, nao apenas "sem scrubbing". Superficie independente:
      src/maezo/platform/privacy/key_scrubber.py::egress_message_key, chamado pelo handler
      `operadora.events.publish` (src/maezo/tools/workers/events.py) FORA do try de publicacao,
      levanta a mesma excecao no caminho Kafka.
  - id: janela_drenagem_cancel_inad
    atendido: false
    onde: >-
      `modo: scrub_only` pseudonimiza a CHAVE DE MENSAGEM Kafka das familias CANCEL/INAD (bloco
      `modo` acima) — MUDA o particionamento dessas duas familias. Nenhuma janela de drenagem foi
      agendada; `janela_drenagem.inicio`/`janela_drenagem.fim` abaixo estao vazios.
    janela_drenagem:
      inicio: null
      fim: null
    efeito_se_ratificado_sem_isto: >-
      MENSAGENS EM VOO EM PARTICOES DIFERENTES SEM JANELA CONTROLADA. A ordenacao POR CHAVE
      continua garantida (o HMAC e deterministico: a mesma key logica cai sempre na mesma
      particao), mas uma virada sem janela de drenagem combinada com operacao/ANS produz uma
      mistura de particoes CANCEL/INAD nao observada por ninguem ate um incidente a jusante
      apontar para ela.

# ---------------------------------------------------------------------------------------------
# pre_requisitos_pseudo_keys — O QUE AINDA NAO EXISTE NO CODIGO.
#
# `modo: pseudo_keys` NAO E RATIFICAVEL ENQUANTO ESTE BLOCO TIVER ITEM `atendido: false`.
# Isto nao e uma ressalva de estilo: cada item abaixo, se ratificado como esta, produz um efeito
# ADVERSO concreto e nomeado. Verificado no codigo (arquivo:simbolo), nao inferido.
#
# `scrub_only` NAO depende deste bloco (nenhuma identidade persistida muda de forma); o
# pre-requisito de `scrub_only` e o do bloco `modo` acima (composition root chamando o bootstrap
# do structlog) mais o provisionamento de `PHI_HMAC_KEY` — ver `evidencia.efeitos_observaveis`.
# ---------------------------------------------------------------------------------------------
pre_requisitos_pseudo_keys:
  - id: start_idempotency_dual_read
    atendido: false
    onde: >-
      src/maezo/tools/mcp_cibseven/transport.py::start_process_idempotent — recebe UM unico
      `business_key` e o usa em `find_active_instance`. Chamadores afetados:
      src/maezo/agents/fernando/graph.py::FernandoGraph.start_process (SP-OP-INADIMPLENCIA-001) e
      src/maezo/tools/workers/inadimplencia.py::handoff_rescisao (SP-OP-CANCEL-001).
    efeito_se_ratificado_sem_isto: >-
      DUPLA ABERTURA. Uma instancia ja viva sob a forma legada `INAD-{tenant}-{matricula}` fica
      INVISIVEL para um start keyed em `INAD-{tenant}-{pseudo_id}`; o engine abre uma SEGUNDA
      instancia do mesmo caso. O guard que faz dual-read (o de anti-dupla-TERMINACAO) nao cobre
      isto — ele roda depois, e para outra decisao.
  - id: start_dedup_key_dual_read
    atendido: false
    onde: >-
      src/maezo/tools/mcp_cibseven/transport.py::start_dedup_key —
      `f"{tenant}:start:{process_key}:{business_key}"`, derivado da MESMA key unica.
    efeito_se_ratificado_sem_isto: >-
      DUPLO REGISTRO DE AUDITORIA. A dedup key muda junto com a cunhagem, entao `emit_once` NAO
      retorna ALREADY_AUDITED para o mesmo caso logico: grava uma segunda linha de start na
      cadeia ADR-0007 como se fosse uma decisao nova.
  - id: beneficiario_pseudo_id_no_handoff
    atendido: false
    onde: >-
      src/maezo/tools/workers/inadimplencia.py::_HANDOFF_CARRY_KEYS — carrega
      `matricula_beneficiario`, NAO carrega `beneficiario_pseudo_id`.
    efeito_se_ratificado_sem_isto: >-
      DEGRADACAO SILENCIOSA. O payload do handoff INADIMPLENCIA->CANCEL nao leva a ancora nova,
      entao o CANCEL-001 iniciado por esse caminho volta a cunhar pela matricula (o fallback
      deliberado de `resolve_contract_identity`) — a remediacao parece ativa e nao cobre este
      fluxo. Sem efeito adverso de processo, mas invalida a metrica como prova de cobertura.
  - id: dual_read_escopo_atual
    atendido: true
    onde: >-
      src/maezo/tools/workers/inadimplencia.py::_query_ja_em_rescisao_cancel via
      src/maezo/tools/workers/base.py::contract_business_key_forms — UNICO consumidor com
      dual-read hoje (guard de anti-dupla-terminacao do CANCEL). Registrado aqui como `true`
      para que o escopo REAL do dual-read seja legivel ao lado do que falta.
    efeito_se_ratificado_sem_isto: nao se aplica (ja atendido)

# ---------------------------------------------------------------------------------------------
# evidencia — o que muda de OBSERVAVEL quando o codigo desta remediacao roda. Registrado aqui
# porque um ratificador que le so a metrica nao veria estes dois efeitos, e ambos ja ocorrem
# HOJE, sob `modo: off`.
# ---------------------------------------------------------------------------------------------
evidencia:
  metrica_principal: >-
    maezo_phi_business_key_mint_total{family, modo, anchor} — a serie `anchor="matricula"` e a
    contagem de keys que HOJE carregam matricula crua. Labels sao vocabulario fechado, sem
    conteudo. Cunhagem coberta pelos SEIS compositores CANCEL/INAD, todos roteados por
    `base.mint_contract_business_key` (inadimplencia, fernando.graph, fraude x2,
    notification_bridge x2) — antes desta correcao os quatro ultimos cunhavam pelo formatador
    cru e a serie `anchor="contrato"` subcontava.
  efeitos_observaveis:
    - campo_novo_em_warning: >-
        `cancel_business_key_form_count` — campo NOVO na linha WARNING
        `inadimplencia_cancel_correlation_unavailable` (reason=engine_seam_not_wired), em
        src/maezo/tools/workers/inadimplencia.py::_query_ja_em_rescisao_cancel. E a contagem de
        formas de key varridas pelo guard; conteudo-livre (um inteiro). Quem tiver alerta/parse
        fixo nessa linha vera um campo a mais.
    - log_info_novo_no_primeiro_mint: >-
        `metrics_collector_initialized` — linha INFO emitida por
        src/maezo/runtime/metrics.py::MetricsCollector.__init__ na PRIMEIRA cunhagem de key de um
        processo que ainda nao tenha tocado o coletor global (a telemetria-sombra e lazy, via
        `observability._get_metrics_collector`). Uma vez por processo, sem conteudo. Ja acontece
        sob `modo: off` — a telemetria-sombra e a unica coisa que roda nesse modo.
