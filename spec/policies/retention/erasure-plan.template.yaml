      DUAS PERGUNTAS SAO DO DBA/DPO, NAO DESTE REPOSITORIO (MZO-060):
      (a) RETENCAO. A migracao 0008 nao criou coluna de TTL nem rotina de expurgo,
      deliberadamente: linhas `delivered` crescem monotonicamente e a escolha entre
      particionamento por mes + DETACH, DELETE por janela, ou copia de arquivo tem
      consequencias de backup/PITR que sao do DBA. O indice de drenagem ja e PARCIAL
      (`WHERE status <> 'delivered'`), entao a pressao e de heap/backup, nao do
      caminho quente — isso compra tempo, nao responde a pergunta.
      (b) ACOPLAMENTO COM a2a_idempotency. ADR-0039 (Proposto) registra que a
      retencao de idempotencia DOMINA a validade de assinatura; um fato re-entregue
      depois que sua linha de idempotencia foi expurgada e um fato cuja semantica de
      replay mudou. A janela escolhida aqui nao pode ser decidida isoladamente da
      janela de a2a_idempotency (ordem 13, acima).
    decisao_dpo: PENDENTE
    base_legal: PENDENTE-BASE-LEGAL-DPO-JURIDICO
    retencao: PENDENTE-RETENCAO-DPO-JURIDICO
