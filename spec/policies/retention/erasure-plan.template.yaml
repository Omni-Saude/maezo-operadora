# =============================================================================
# DRAFT — UNRATIFIED — NENHUMA DECISAO DE ELIMINACAO FOI TOMADA NESTE ARQUIVO
# =============================================================================
#
# Este arquivo enumera, camada por camada, ONDE dados de um titular podem residir
# na persistencia do Maezo, e reserva um espaco VAZIO para a decisao do DPO sobre
# cada uma. A ESTRUTURA (tabela, migracao que a criou, como as linhas do titular
# sao identificadas, ordem de operacoes) e um FATO derivado do schema e esta
# preenchida. A DECISAO (`decisao_dpo`), a BASE LEGAL (`base_legal`) e o PRAZO
# (`retencao`) sao do DPO + juridico e estao TODOS como placeholders explicitos.
#
# NENHUM AGENTE, ORQUESTRADOR OU GATEKEEPER AUTOMATIZADO PODE PREENCHER ESSES
# CAMPOS. Fabricar uma decisao de DPO neste repositorio e um evento de compliance,
# nao um conflito de merge.
#
# -----------------------------------------------------------------------------
# O QUE ESTE ARQUIVO NAO E
# -----------------------------------------------------------------------------
#
# * NAO e a matriz de bases legais/retencao por CATEGORIA de dado. Essa e outra
#   coisa, tem outro schema e outro carregador:
#   `spec/policies/retention/UNRATIFIED-retention-matrix.template.yaml` +
#   `src/maezo/platform/lifecycle/legal_bases_matrix.py`. As duas se encontram na
#   ratificacao (uma categoria da matriz cobre uma ou mais linhas daqui), mas sao
#   artefatos independentes e nenhuma ratifica a outra.
# * NAO habilita eliminacao. `ErasureManager.erase()`/`verify()`
#   (`src/maezo/platform/erasure.py:152`/`:187`) levantam
#   `ErasureNotImplementedError` SEMPRE, hoje, e este arquivo nao muda isso. Ver
#   "As duas chaves" abaixo.
# * NAO contem SQL executavel. As sentencas de eliminacao/anonimizacao parametrizadas
#   vivem no PACOTE DE REVISAO (`docs/reviews/adr-0029-erasure-packet.md`), como
#   DOCUMENTO. O unico SQL que existe em codigo e `SELECT count(*)` — o dry-run.
#
# -----------------------------------------------------------------------------
# AS DUAS CHAVES (mesmo idioma de MZO-060 / spec/policies/amh/inbox-ratification.yaml)
# -----------------------------------------------------------------------------
#
#   Chave A — ESTE ARQUIVO ratificado (`ratificado: true` + `dpo_review: APPROVED`
#             + toda `decisao_dpo`/`base_legal`/`retencao` preenchida).
#             Vira `load_erasure_plan()` de recusa para sucesso, SEM MUDANCA DE
#             CODIGO e sem redeploy.
#   Chave B — o MECANISMO DE EXECUCAO existir. Nao existe: `ErasureManager` recusa,
#             e as duas pontes de identidade (`titular_pseudo_id`->`fhir_patient_id`,
#             `thread_id`->`fhir_patient_id`) nao existem em lugar nenhum da arvore
#             (`src/maezo/tools/workers/lgpd.py:293-294`,
#             `src/maezo/platform/erasure.py:196-206`).
#
# AS DUAS SAO INDEPENDENTES. Ratificar este arquivo NAO liga nada: o modo de
# execucao continua recusado, agora por um motivo diferente e mais honesto
# (`execution_mechanism_absent` em vez de `plan_unratified`). Isso e deliberado —
# a ratificacao do DPO e um ato de GOVERNANCA e nao pode ser, sozinha, o gatilho
# de um efeito destrutivo.
#
# -----------------------------------------------------------------------------
# SCHEMA (o carregador recusa em qualquer desvio — `erasure_plan.py`)
# -----------------------------------------------------------------------------
#
#   ratificado:  false | true      # DEVE ser o BOOLEANO true, nunca a string "true"
#   status:      DRAFT | RATIFICADO
#   dpo_review:  PENDENTE | APPROVED
#   dpo_reviewer / dpo_review_date / evidence_ref / notes:  <str> humanos
#   review_packet: <str> caminho do pacote revisado
#   camadas:                       # uma entrada por RELACAO persistente
#     - camada:   <str>            # familia (trabalho/episodica/semantica/auditoria/...)
#       tabela:   <str>            # nome da relacao
#       decisao_dpo:  <str>        # ELIMINAR | ANONIMIZAR | RETER_COM_BASE_LEGAL
#       base_legal:   <str>        # base legal quando a decisao e reter/anonimizar
#       retencao:     <str>        # prazo/regra de retencao
#
# O carregador exige as cinco chaves acima em TODA entrada, recusa qualquer valor
# que ainda pareca placeholder (PENDENTE/PENDING/PLACEHOLDER/TODO/TBD/XXX) e recusa
# quando o conjunto de `tabela` diverge do que o codigo enumera — um plano que nao
# cobre exatamente as relacoes conhecidas nao e um plano. Os demais campos de cada
# entrada abaixo (`migracao`, `identificacao`, `resolucao_identidade`, `ordem`,
# `tensao`, `notas`) sao DOCUMENTACAO para o revisor; o carregador os ignora, e o
# codigo carrega a sua propria copia dos fatos estruturais para que os dois nao
# possam divergir silenciosamente (teste de anti-drift em
# `tests/unit/platform/test_erasure_plan.py`).
#
# -----------------------------------------------------------------------------
# VOCABULARIO de `resolucao_identidade` (fato estrutural, nao decisao)
# -----------------------------------------------------------------------------
#
#   RESOLVIVEL              — ha coluna que identifica o titular e ela e alcancavel
#                             a partir da referencia que o processo DSR carrega.
#   PONTE_AUSENTE           — ha coluna de titular, mas a referencia do processo
#                             (`titular_pseudo_id`) nao chega ate ela: falta a ponte.
#   SEM_COLUNA_DE_TITULAR   — a relacao guarda dados do titular, mas nao em coluna
#                             identificavel (jsonb, chave derivada, digest).
#   SEM_REFERENCIA_TITULAR  — a relacao provadamente nao guarda referencia de titular.
#   NAO_PROVISIONADA        — a relacao nao e criada por este repositorio.
#   RETIRADA                — a relacao existiu e foi removida por uma migracao.
#
# =============================================================================

status: DRAFT
ratificado: false
dpo_review: PENDENTE

# --- Campos humanos. Todo valor e um placeholder explicito e detectavel. ---
dpo_reviewer: PENDENTE-IDENTIDADE-DO-DPO
