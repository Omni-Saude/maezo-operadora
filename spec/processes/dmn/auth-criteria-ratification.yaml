# Ratification manifest for the SP-OP-AUTH-001 auto-approval criteria gate (GAP-AUTH-4).
#
# WHY THIS FILE EXISTS
# --------------------
# `operadora.auth.validate_auto_criteria` (src/maezo/tools/workers/auth.py) computes four
# criteria — tecnico / financeiro / regulatorio / contratual — and feeds the COMPUTED booleans
# to `auth_auto_approval.dmn`. Three of the four are decided by DMN tables whose clinical /
# regulatory / contractual content is SYNTHETIC and DRAFT (docs/review-queue.md, "Phase 1 —
# DUT/ROL/Carencia DMN set"). Wiring them naively would let SYNTHETIC rules grant REAL
# authorizations — strictly worse than the unverified start-payload seeds they replace, because
# it would LOOK validated.
#
# THE RULE THIS FILE ENFORCES (mirrors the DPO retention-matrix loader,
# src/maezo/platform/lifecycle/legal_bases_matrix.py, which REFUSES its own unratified
# template rather than "succeeding" on placeholder data):
#
#     A criterion may contribute a PASS only if its rule source is RATIFIED here.
#     A DRAFT / unlisted / malformed source yields `false` with a `*_FONTE_NAO_RATIFICADA`
#     token, REGARDLESS of what the table computes.
#
# The validator still EVALUATES unratified tables and records what they WOULD have decided in
# the bounded, non-PHI `auto_criteria_shadow` variable (shadow mode) — so the medico-auditor /
# ANS reviewer ratifies against real outcome data instead of reviewing rules in the abstract.
# Shadow output NEVER influences the verdict.
#
# HOW TO RATIFY (a DATA change — no code change, no redeploy of Python)
# --------------------------------------------------------------------
# Set, for the decision id in question, ALL THREE of:
#   ratificado:    true                       # the boolean literal true — nothing else counts
#   revisor:       "<who ratified it>"        # non-empty; ADR-0007 accountability
#   ratificado_em: "YYYY-MM-DD"               # non-empty; when
# Any of the three missing/blank/non-true => NOT ratified (fail-closed). The loader
# (`maezo.tools.workers.auth_criteria`) never defaults a source to ratified, and swallows every
# load error into "nothing is ratified" — a manifest problem can only route to human review,
# never open an automatic approval.
#
# The FINANCIAL criterion is deliberately NOT listed here: its source is not a DMN table but the
# governance autonomy matrix (`spec/policies/autonomy/L0-core.yaml` +
# `tenants-amh.yaml`, `authorization_approval.max_value_brl`), resolved through `CeilingResolver`.
# NB (GK-criteria finding 1, corrigido 2026-08-06): a afirmacao anterior de que essa matriz ja era
# "CODEOWNERS-gated" era FALSA — `.github/CODEOWNERS` nao cobria `spec/policies/autonomy/` nem
# ESTE arquivo. Ambos foram adicionados ao CODEOWNERS no mesmo commit, entao a frase agora e
# verdadeira; nao a repita sem verificar o CODEOWNERS. Its current value is
# 0 (decision D-07 open) which, by `within_l2_ceiling`'s own fail-closed rule, authorises
# nothing. Listing it here would imply this file governs it; it does not.
#
# The `unratified: true` root key (absent below, deliberately) is the retention-matrix
# template guard, mirrored: a copy of this file marked `unratified: true` is REFUSED WHOLESALE
# by the loader (zero ratified sources), so pointing the manifest path at a placeholder by
# mistake also fails closed.

version: 1

# ---------------------------------------------------------------------------------------------
# fontes — per-decision-table ratification status.
# STATUS TODAY: nothing is ratified. Every table below is DRAFT with SYNTHETIC content and is
# registered as such in docs/review-queue.md. Consequence: the tecnico, regulatorio and
# contratual criteria all evaluate FALSE with `*_FONTE_NAO_RATIFICADA`, and (with the financial
# ceiling at 0) NOTHING auto-approves — every request routes to human review. That is the same
# safe outcome as before this gate existed, but now for four explicit, auditable, per-criterion
# reasons instead of an unverified seed.
# ---------------------------------------------------------------------------------------------
fontes:
  dut_rol_coverage:
    ratificado: false
    revisor: "medico auditor + juridico/regulatorio"
    ratificado_em: null
    observacao: >-
      Mapeamento TUSS->ROL/DUT com codigos TUSS SINTETICOS. Verificar contra a tabela TUSS
      vigente publicada pela ANS e contra RN 465/2021 + RN 473/2021 + RN 643/2025 antes de
      ratificar. Enquanto DRAFT: criterio TECNICO = false (TECNICO_FONTE_NAO_RATIFICADA).

  dut_criteria_bariatrica:
    ratificado: false
    revisor: "medico auditor + cirurgiao bariatrico + juridico/regulatorio"
    ratificado_em: null
    observacao: >-
      Limiares clinicos SINTETICOS (IMC 35/40, tentativas previas, avaliacao multidisciplinar).
      Verificar DUT ANS vigente + CFM 2.131/2015 e atualizacoes.

  dut_criteria_oncologia_pet_ct:
    ratificado: false
    revisor: "medico auditor + oncologista/nucleo-medicina + juridico/regulatorio"
    ratificado_em: null
    observacao: >-
      Finalidades e lista de neoplasias elegiveis SINTETICAS. Verificar DUT ANS PET-CT vigente.
      Indicacoes neurologicas/cardiologicas NAO cobertas (DUT separada, SME adicional).

  dut_criteria_terapias_especiais:
    ratificado: false
    revisor: "medico auditor + neuropediatra/psiquiatra infantil + juridico/regulatorio"
    ratificado_em: null
    observacao: >-
      Modalidades e limites de sessoes/mes SINTETICOS. Verificar DUT ANS + Lei 12.764/2012 +
      Lei 14.254/2021 + RN 465/2021.

  carencia_check:
    ratificado: false
    revisor: "juridico/regulatorio + medico auditor"
    ratificado_em: null
    observacao: >-
      TODOS os prazos sao SINTETICOS (urgencia 1d, parto 300d, eletivo 180d, CPT 730d).
      Verificar Lei 9.656/1998 art. 11/12/35-C + RN 195/2009 + RN 259/2011 + consolidacoes ANS.
      Portabilidade de carencia (RN 186/2009) NAO implementada. Enquanto DRAFT: criterio
      REGULATORIO = false (REGULATORIO_FONTE_NAO_RATIFICADA).

  auth_criteria_contratual:
    ratificado: false
    revisor: "juridico/contratos + financas + medico auditor (criterios de KPI assistencial)"
    ratificado_em: null
    observacao: >-
      COSTURA VAZIA E HONESTA: a tabela existe com UMA unica regra catch-all que devolve
      false / SEM_REGRA_RATIFICADA. NENHUMA regra contratual, milestone ou KPI foi inventada.
      Ratificar somente DEPOIS que um SME popular a tabela com regras reais de plano/produto/
      contrato/KPI. Enquanto vazia, ratificar este id NAO abre nada (a unica regra devolve
      false) — mas mantem-se `false` aqui por honestidade de estado.

# ---------------------------------------------------------------------------------------------
# mapeamento_dut_criteria — dut_ref (emitido por `dut_rol_coverage`) -> tabela dut_criteria_*.
#
# ROTEAMENTO (plumbing), NAO REGRA: `docs/review-queue.md` ja declara que "a selecao da
# `dut_criteria_*` por classe do procedimento e plumbing; a REGRA fica na DMN". Este mapeamento
# vive aqui — e nao em Python — para que um SME possa corrigi-lo/completa-lo sem mudanca de
# codigo, exatamente como a ratificacao.
#
# A chave e' o TOKEN do `dut_ref` (primeiro campo antes do espaco: `dut_rol_coverage` emite
# p.ex. "DUT-BARIATRICA-001 DRAFT/verify" -> chave "DUT-BARIATRICA-001").
#
# DELIBERADAMENTE INCOMPLETO. Somente as duas correspondencias que os NOMES das proprias tabelas
# tornam inequivocas estao declaradas. Um `dut_ref` com `requer_dut=true` e SEM entrada aqui
# resolve FECHADO: criterio TECNICO = false com `TECNICO_PROCEDIMENTO_NAO_MAPEADO` (analise
# humana). Adivinhar qual tabela de criterios clinicos se aplica a um DUT seria inventar um
# julgamento clinico — proibido (invariante "nunca inventar um valor clinico/regulatorio").
#
# PENDENTE DE SME (medico auditor): DUT-TERAPIA-OCUPACIONAL-001, DUT-FONOAUDIOLOGIA-001,
# DUT-PSICOTERAPIA-001 — `dut_criteria_terapias_especiais` cobre TEA/neurodesenvolvimento, e
# nao esta estabelecido que TODA terapia ocupacional/fono/psicoterapia caia sob aquela DUT.
# Tambem pendentes: DUT-ONCOLOGIA-QUIMIO-001, DUT-ONCOLOGIA-RT-001, DUT-CINTILOGRAFIA-OSSEA-001,
# DUT-OPME-*, DUT-ALTA-COMPLEXIDADE-ANALISE-HUMANA.
# ---------------------------------------------------------------------------------------------
mapeamento_dut_criteria:
  DUT-BARIATRICA-001: dut_criteria_bariatrica
  DUT-PET-CT-ONCOLOGIA-001: dut_criteria_oncologia_pet_ct

# ---------------------------------------------------------------------------
# CRITERIOS SEM COBERTURA (GK-criteria finding 2 / 5b)
# ---------------------------------------------------------------------------
# Fatos que a rota automatica NOMINALMENTE exigia e que HOJE nenhum criterio verifica. Declarados
# aqui — e nao so em prosa — porque este e o arquivo que o SME OBRIGATORIAMENTE toca para ratificar
# qualquer fonte: sem isto, ao ratificar `auth_criteria_contratual` com milestones/KPIs ele poderia
# abrir aprovacao automatica para um prestador FORA DA REDE sem que nenhum criterio tivesse dito
# nada — exatamente a patologia "ausencia de validacao lida como PASS implicito" que este portao
# fechou, apenas adiada.
#
# ESTA SECAO E EXECUTAVEL, NAO DOCUMENTAL (defeito M-3, corrigido 2026-08-09). Ate entao o loader
# so lia `unratified` / `fontes` / `mapeamento_dut_criteria`, e o unico "teste" afirmava o TEXTO
# deste arquivo: a declaracao abaixo era INERTE — flipar `auth_criteria_contratual` para
# `ratificado: true` abria a rota automatica assim mesmo. Hoje
# `maezo.tools.workers.auth_criteria` le `bloqueia_ratificacao_de` e SUPRIME a ratificacao da
# fonte nomeada: `is_ratified` devolve false por mais completos que estejam
# `ratificado`/`revisor`/`ratificado_em`, o criterio sai `false` com
# `CONTRATUAL_FONTE_NAO_RATIFICADA` + o token de sombra correspondente, e a supressao e' logada
# em `auth_criteria_ratification_suppressed` (sem PHI). Pinado em runtime por
# `tests/unit/sec/test_auto_approval_criteria_fence.py` e por
# `tests/unit/tools/workers/test_auth_auto_criteria.py`.
#
# COMO RESOLVER (continua sendo mudanca de DADOS, sem mudanca de codigo): quando existir uma fonte
# de credenciamento de rede legivel por maquina E ela estiver ligada a um criterio, REMOVA a
# entrada correspondente abaixo (ou a secao inteira, se nao sobrar nenhuma) no mesmo commit —
# CODEOWNERS-gated — e a ratificacao daquela fonte passa a valer. Enquanto a entrada existir, a
# ratificacao fica suprimida.
#
# CUIDADOS DE ESCRITA (o loader FALHA FECHADO, recusando o manifesto INTEIRO — nada ratificado —
# em vez de ignorar a entrada, porque uma declaracao ilegivel nao se distingue de uma apagada):
#   - cada entrada tem de ser um mapa e nomear em `bloqueia_ratificacao_de` uma (ou uma lista de)
#     fonte(s) que exista(m) em `fontes:` acima. Um id com typo NAO e' ignorado: recusa o arquivo.
#   - `bloqueia_ratificacao_de` ausente/vazio tambem recusa — um criterio sem cobertura que nao
#     nomeia o que bloqueia e' exatamente a declaracao inerte que este mecanismo existe para
#     impedir.
#
# O QUE E' GUARDADO HOJE UM NIVEL ACIMA, NO NOME/UNICIDADE DA PROPRIA CHAVE `criterios_nao_
# cobertos:` (GK-criteria minor-1, corrigido 2026-08-09 — a redacao acima cobria so o CONTEUDO da
# secao e superestimava o que estava protegido; esta secao existe para nao repetir o exagero):
#   - um TYPO no nome da secao (`criterios_nao_cobertoss:`) e' uma CHAVE DE TOPO DESCONHECIDA para
#     `maezo.tools.workers.auth_criteria._parse`, que so reconhece {version, fontes,
#     mapeamento_dut_criteria, criterios_nao_cobertos}. Qualquer outra chave de topo recusa o
#     manifesto INTEIRO — o mesmo caminho de uma `bloqueia_ratificacao_de` com alvo desconhecido —
#     em vez de a secao evaporar em silencio como se tivesse sido removida de proposito.
#   - uma chave `criterios_nao_cobertos:` DUPLICADA no YAML tambem recusa: o parser usa um
#     `SafeLoader` (`_DuplicateKeySafeLoader`, escopado so a este loader) que levanta erro em
#     chave de mapa duplicada — em vez do comportamento padrao do PyYAML, onde a ULTIMA ocorrencia
#     vence e as anteriores desaparecem sem aviso.
#   - O QUE CONTINUA SEM GUARDA, DE PROPOSITO: a REMOCAO legitima da secao inteira — ausencia
#     unica, sem typo nem duplicata — continua resolvendo para "nada bloqueado" e e' o caminho de
#     resolucao DOCUMENTADO acima ("COMO RESOLVER"). Nao ha, e nao deve haver, protecao contra
#     REMOVER `criterios_nao_cobertos` intencionalmente — so contra ela sumir POR ACIDENTE.
#     Pinado em runtime por `tests/unit/tools/workers/test_auth_auto_criteria.py`.
#
# NAO existe aqui um "criterio Python sempre-falso" de proposito: isso tornaria a aprovacao
# automatica impossivel sem mudanca de codigo (destruindo a propriedade "ratificar = mudanca de
# DADOS") e convidaria alguem a inverter uma constante sem fonte por tras. O bloqueio acima e' o
# oposto: mora nos DADOS, e some com os DADOS.
criterios_nao_cobertos:
  rede_credenciada:
    motivo: "Nenhuma fonte de credenciamento de rede legivel por maquina existe no repositorio."
    pertence_a: auth_criteria_contratual   # um credenciamento E um fato contratual
    revisor_necessario: "medico auditor + juridico/contratos"
    bloqueia_ratificacao_de: auth_criteria_contratual
