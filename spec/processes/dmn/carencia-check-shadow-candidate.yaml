# =================================================================================================
# THE DEFECT, STATED AS A REACHABILITY FACT ABOUT THE LIVE TABLE
# =================================================================================================
# Columns, in declaration order (:61-77): tipo_procedimento / dias_desde_adesao / cpt_declarada.
# Outputs (:79-81): carencia_cumprida / prazo_restante_dias / fonte. Live rules in order:
#
#   1  r01 (:89-97)  tipo `-`               dias < 730   cpt true   -> false / 730-dias / CPT
#   2  r02 (:100-108) tipo `-`              dias >= 730  cpt true   -> true  / 0        / CPT
#   3  r03 (:115-123) "urgencia_emergencia" dias < 1     cpt false  -> false / 1
#   4  r04 (:126-134) "urgencia_emergencia" dias >= 1    cpt false  -> true  / 0
#   5  r05 (:141-149) "parto"               dias < 300   cpt false  -> false / 300-dias
#   6  r06 (:152-160) "parto"               dias >= 300  cpt false  -> true  / 0
#   7  r07 (:167-175) "eletivo"             dias < 180   cpt false  -> false / 180-dias
#   8  r08 (:178-186) "eletivo"             dias >= 180  cpt false  -> true  / 0
#   9  r09 (:195-203) "alta_complexidade"   dias < 180   cpt false  -> false / 180-dias
#  10  r10 (:206-214) "alta_complexidade"   dias >= 180  cpt false  -> true  / 0
#  11  r11 (:219-227) "outros"              dias `-`     cpt false  -> false / -1
#  12  r99 (:234-242) all wildcards                                 -> false / -1
#
# TWO REACHABILITY FACTS FOLLOW DIRECTLY:
#   (A) rules 3..11 are ALL unreachable when `cpt_declarada = true` — rows 1/2 partition the whole
#       integer range of `dias_desde_adesao` (`< 730` OR `>= 730`) with a wildcard on the procedure
#       type, so nothing below them can ever be reached in that half-space;
#   (B) the L0-HARD catch-all `r99` (:234-242) is therefore ALSO unreachable for the entire
#       `cpt_declarada = true` half-space. Same masking class as the W3 finding. See ACHADO-3 —
#       the candidate does NOT close (B), because closing it requires a legal judgement.

# =================================================================================================
# FURTHER FINDINGS — recorded for the owner; nothing here is applied by engineering.
# =================================================================================================
achados_adicionais:

  - id: ACHADO-1-parto-tambem-mascarado-pelo-bloco-cpt
    regras_afetadas: r01/r02 (:89-108) vs r05/r06 (:141-160)
    classe: mesmo mascaramento, outro tipo_procedimento
    achado: >-
      Com `cpt_declarada=true`, o prazo de parto (300 dias, :144) tambem e substituido pelo prazo
      CPT (730 dias). Exemplo: tipo="parto", dias=250, cpt=true -> r01: false / prazo 480; pelas
      proprias regras de parto seria false / prazo 50. Os dois dizem `carencia_cumprida=false`,
      mas o prazo informado ao auditor difere em 430 dias.
    porque_nao_foi_alterado: >-
      Se o parto tambem escapa a CPT e leitura do escopo do art. 11 (que fala em procedimentos
      cirurgicos / leitos de alta tecnologia / procedimentos de alta complexidade LIGADOS a doenca
      preexistente). Este arquivo nao adjudica esse escopo. O candidato altera SOMENTE
      `urgencia_emergencia`, onde a base (art. 12, V + art. 35-C) e uma regra de prazo maximo e de
      cobertura obrigatoria, nao uma questao de escopo de procedimento. FINDING, NAO FIX.

  - id: ACHADO-2-eletivo-e-alta-complexidade-sob-cpt
    regras_afetadas: r01/r02 vs r07..r10 (:167-214)
    classe: nao e mascaramento — registrado por completude
    achado: >-
      Para "eletivo" e "alta_complexidade" a precedencia da CPT e coerente com a leitura do art. 11
      citada acima, e o input `cpt_declarada` ja e documentado como especifico da solicitacao
      ("Cobertura Parcial Temporaria declarada PARA A CONDICAO/PROCEDIMENTO solicitado", :38-40) —
      ou seja, a vinculacao a doenca preexistente e resolvida A MONTANTE, por um worker
      deterministico, nao por esta tabela. Nada a mudar aqui; registrado para que o SME confirme
      que essa resolucao a montante realmente existira quando os inputs existirem (hoje nao
      existem — auth.py:578-591).

  - id: ACHADO-3-catchall-l0-inalcancavel-sob-cpt
    regra_afetada: r99 (:234-242)
    classe: fail-safe declarado L0 HARD, inalcancavel em metade do espaco
    achado: >-
      O catch-all e declarado "OBRIGATORIO L0 HARD" (:230-232) para "combinacao nao mapeada ou dados
      ausentes ... portabilidade, migracao, tipo desconhecido". Como r01/r02 particionam todo
      `dias_desde_adesao` com wildcard no tipo, NENHUMA entrada com `cpt_declarada=true` chega la —
      inclusive um `tipo_procedimento` fora do dominio declarado (:30-33) ou a string vazia.
    porque_nao_foi_alterado: >-
      Fechar isso exigiria decidir a quais `tipo_procedimento` a CPT se aplica, isto e, adjudicar o
      escopo do art. 11 — e o mesmo julgamento juridico do ACHADO-1. O candidato reduz o buraco
      (urgencia deixa de cair no bloco CPT) mas NAO o elimina: com cpt=true e tipo fora do dominio,
      o candidato tambem devolve a regra CPT. DITO EXPLICITAMENTE PARA NAO SER CONFUNDIDO COM UM
      CONSERTO COMPLETO.

  - id: ACHADO-4-citacao-do-inciso-divergente
    regra_afetada: description (:18, :21)
    classe: discrepancia de citacao, nao de comportamento
    achado: >-
      A descricao da tabela cita "Lei 9.656/1998 art. 12 II" para a lista de prazos (e "art. 12 II
      'a'" para o parto), enquanto a base usada nesta revisao e o art. 12, V. Nenhum comportamento
      depende disso, mas a citacao e o que o SME vai conferir contra o texto vigente — e a propria
      tabela ja marca todas as suas citacoes como "DRAFT/verify" (:17-18, :26-27). Registrado para
      que a ratificacao reconcilie inciso/alinea; ESTE ARQUIVO NAO ESCOLHE QUAL ESTA CERTO.

  - id: ACHADO-5-portabilidade-continua-fora-da-tabela
    regra_afetada: description (:50-53)
    classe: lacuna que a propria tabela declara
    achado: >-
      A tabela declara que a portabilidade de carencia (RN 186/2009) NAO esta implementada e que
      esses casos "devem ser encaminhados ao medico auditor" — mas nao ha input de portabilidade,
      logo nao ha regra que os separe: um beneficiario com portabilidade e avaliado como se nao
      tivesse. O candidato nao muda isso (exigiria um input novo, o que este arquivo nao faz).
      Ja registrado em docs/review-queue.md:103,107.

