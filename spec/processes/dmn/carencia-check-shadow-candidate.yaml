# CANDIDATE (shadow) rule set for `carencia_check` — M-5: the CPT block masks the urgency ladder.
# =================================================================================================
# THIS FILE IS NOT A DEPLOYABLE ARTIFACT. It is DATA describing a PROPOSED correction to
# `spec/processes/dmn/carencia_check.dmn`. It carries the `.yaml` extension deliberately: every
# artifact-selection path in this repository globs `*.dmn` / `*.bpmn` ONLY, so nothing here can
# reach the engine.
#
#   - deploy  : `collect_artifacts` — `dmn_dir.glob("*.dmn")`
#               (src/maezo/platform/deploy/engine_deploy.py:140)
#   - validate: the same `*.dmn` glob (src/maezo/platform/validation/cli.py:103;
#               `make validate-artifacts`, Makefile:26-42)
#   Pinned twice, in two different modules:
#     - tests/unit/platform/test_engine_deploy.py::test_real_spec_tree_yields_16_bpmn_and_62_dmn;
#     - tests/unit/spec/test_carencia_check_shadow_candidate.py::
#       test_candidate_manifest_is_invisible_to_artifact_deployment.
#
# NO WORKER WIRING IN THIS WAVE. Nothing in `src/` reads this file — pinned by
# `test_no_src_consumer_of_the_candidate_manifests`. The candidate is evaluated ONLY by the
# divergence-evidence tests, through `tests/support/dmn_first_hit.py`.
#
# =================================================================================================
# WHY THIS FILE EXISTS
# -------------------
# `spec/processes/dmn/carencia_check.dmn` is `hitPolicy="FIRST"` (:59) and opens with the CPT block
# (:83-108). `r01` (:89-97) gates ONLY on `dias_desde_adesao < 730` (:92) and `cpt_declarada = true`
# (:93); its `tipo_procedimento` column is the WILDCARD `-` (:91). Every other rule of the table
# — including the urgency ladder `r03`/`r04` (:115-134) — requires `cpt_declarada = false`
# (:119, :130, :145, :156, :171, :182, :199, :210, :223).
#
# CONSEQUENCE: whenever a CPT is declared, `tipo_procedimento` is IRRELEVANT. The 24h/1-day urgency
# period the table declares for itself (description :19-20; rules `r03`/`r04`) is UNREACHABLE, and
# an urgency/emergency case reads the 24-month CPT period instead.
#
# THE REPRO (mission M-5, reproduced from the artifact in the test module):
#   tipo_procedimento="urgencia_emergencia", dias_desde_adesao=30, cpt_declarada=true
#     LIVE      -> r01: carencia_cumprida=false, prazo_restante_dias=700  (= 730 - 30, :95)
#     CANDIDATE -> c_urgencia_cumprida: carencia_cumprida=true, prazo_restante_dias=0
#   The candidate's numbers are the table's OWN: `>= 1` and `0` come verbatim from `r04` (:129,
#   :132). NO day-count is invented anywhere in this file.
#
# THE REGULATORY BASIS THE SME RATIFIES AGAINST — CITED, NOT APPLIED
# ------------------------------------------------------------------
# Two provisions, quoted here as the BASIS FOR THE OWNER'S REVIEW (this file does not adjudicate
# them, and engineering does not act on them):
#
#   - Lei 9.656/1998, art. 12, V — the maximum waiting periods a plan may fix, of which the
#     urgency/emergency maximum is TWENTY-FOUR HOURS;
#   - Lei 9.656/1998, art. 35-C — urgency and emergency care is of COMPULSORY coverage;
#   - Lei 9.656/1998, art. 11 — CPT (cobertura parcial temporaria) for a pre-existing condition
#     restricts, for up to 24 months, ELECTIVE HIGH-COMPLEXITY care (surgical procedures,
#     high-technology beds and high-complexity procedures related to the declared condition).
#
# THE TABLE ITSELF ALREADY CITES ALL THREE — in its own description: urgency "24 horas — DRAFT/verify
# (Lei 9.656/1998 art. 35-C; RN 259/2011 art. 7)" (:19-20) and CPT "24 meses — DRAFT/verify (Lei
# 9.656/1998 art. 11; RN 162/2007)" (:24-25). What the table does NOT do is ORDER them accordingly.
#
# CITATION DISCREPANCY, RECORDED NOT RESOLVED: the table's description cites "Lei 9.656/1998 art. 12
# II" for the waiting-period list (:18, :21) while the mission brief and this file cite art. 12, V.
# The table's own header already marks every one of these citations "DRAFT/verify ... texto vigente"
# (:17-18, :26-27). Reconciling the exact inciso/alinea against the text in force is PART OF THE
# SME'S RATIFICATION; this file does not pick a winner. See ACHADO-4.
#
# WHAT THE CANDIDATE CONTRADICTS — SAID PLAINLY
# ---------------------------------------------
# The live table declares, in a block comment above the CPT rules: "CPT tem precedencia sobre
# qualquer outro prazo de carencia ordinario." (:85). The candidate CONTRADICTS that premise for
# ONE `tipo_procedimento` — `urgencia_emergencia` — and for that one only. That contradiction is
# exactly what the SME ratifies (or refuses) against art. 12, V + art. 35-C. Engineering does not
# settle it; this file makes it a one-cell, reviewable proposal instead of an invisible behaviour.
#
# RUNTIME STATE TODAY (unchanged by this file) — the mitigation, stated without exaggeration
# --------------------------------------------------------------------------------------------
# `carencia_check` has exactly ONE consumer in the repository: `_criterio_regulatorio`
# (src/maezo/tools/workers/auth.py:573-632), the REGULATORIO criterion of
# `operadora.auth.validate_auto_criteria`. Today:
#
#   1. THE TABLE IS NEVER EVALUATED. None of its three inputs (`tipo_procedimento`,
#      `dias_desde_adesao`, `cpt_declarada`) exists in SP-OP-AUTH-001's start contract, so the
#      criterion fails closed with `REGULATORIO_ENTRADA_AUSENTE` BEFORE the DMN call
#      (auth.py:598-604). Already recorded as open residue (4) in docs/review-queue.md:23.
#   2. EVEN IF THE INPUTS EXISTED, the ratification gate `_gate_on_ratification`
#      (auth.py:833-869) forces `criterio_regulatorio_ok = false` with
#      `REGULATORIO_FONTE_NAO_RATIFICADA` while `carencia_check` is `ratificado: false` in
#      `spec/processes/dmn/auth-criteria-ratification.yaml:97-105` — REGARDLESS of what the table
#      computed. The would-be verdict survives only as a bounded SHADOW token.
#   3. WITH THAT CRITERION FALSE, NOTHING AUTO-APPROVES. `auth_auto_approval` v0.2.0 r1 requires all
#      four criteria plus `auto_criteria_verificado`; the request routes to human analysis
#      (docs/review-queue.md:23). In Rafael's graph the auto-approval table is only reached when
#      `auth_admissibility` resolves the NON-TERMINAL `SEGUE_ANALISE`
#      (src/maezo/agents/rafael/graph.py:386-391); `PENDENTE_DOCUMENTACAO` and any DMN error route
#      to `human_auditor` directly (graph.py:382-390, :411-414).
#   4. AND THE TABLE'S OWN L0 HARD INVARIANT STANDS: `carencia_cumprida=false` NEVER denies
#      automatically — it feeds the medical auditor (:13-15).
#
# THE TABLE IS STILL WRONG. The mitigation is that nothing consumes it yet, not that the ordering is
# acceptable. This file exists so that fixing it is a paste, not a project.
#
# WHO MAY ACT ON THIS
# -------------------
# ADR-0028 (docs/adr/0028-dmn-evaluation-engine-side.md:214-216) — "If the DMN itself is wrong, fix
# forward IN SPEC, never patch the Python back." Engineering NEVER corrects the table. The
# correction is the REGULATORY OWNER's act (juridico/regulatorio + medico auditor, per
# docs/review-queue.md:103), and it is a spec DATA change.
#
# =================================================================================================
# ACTIVATION PATH — the SINGLE human act (ADR-0028 §7)
# =================================================================================================
# 1. The REGULATORY OWNER reviews `regras_candidatas` below against the provisions in force (plus
#    `decisao_pendente_do_dono`) and RATIFIES by setting ALL THREE of:
#
#        ratificado:    true
#        revisor:       "<who ratified it>"       # non-empty, non-placeholder; ADR-0007
#        ratificado_em: "YYYY-MM-DD"
#
#    Any of the three missing / blank / left at its `PLACEHOLDER_*` value => NOT ratified.
#
# 2. The REGULATORY OWNER applies `regras_candidatas` to the LIVE TABLE
#    `spec/processes/dmn/carencia_check.dmn` (rule order + the `cpt_declarada` column of the two
#    urgency rules). PER ADR-0028 THE LIVE-TABLE EDIT IS THE OWNER'S ACT.
#
# 3. Only after step 2 does runtime behaviour change — and even then only once the three inputs
#    exist AND `carencia_check` is ratified in `auth-criteria-ratification.yaml` (see item 2 of the
#    runtime-state note above). Ratifying THIS file alone changes nothing anywhere.
#
# REVIEWER GATE: `.github/CODEOWNERS` covers BOTH this file and the live `carencia_check.dmn`.
#
# =================================================================================================

