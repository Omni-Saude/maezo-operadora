decisao_pendente_do_dono:
  - id: DECISAO-A-escopo-da-precedencia-da-cpt
    pergunta: >-
      A CPT deixa de preceder SOMENTE `urgencia_emergencia`, ou tambem `parto` e os tipos nao
      mapeados?
    porque_nao_foi_decidido_aqui: >-
      Responder exige adjudicar o escopo do art. 11 (quais procedimentos a CPT pode restringir),
      que e julgamento juridico. O candidato move apenas o caso em que a base e um prazo maximo
      explicito e uma cobertura obrigatoria explicita (art. 12, V + art. 35-C).
    opcoes_para_o_dono:
      - "(a) manter como proposto: so `urgencia_emergencia` precede o bloco CPT."
      - "(b) mover tambem `parto` (r05/r06) para antes do bloco CPT, com o mesmo alargamento de
         `cpt_declarada` para `-` — sem inventar prazo: os 300 dias sao os da propria r05 (:144)."
      - "(c) restringir o bloco CPT a um conjunto POSITIVO de `tipo_procedimento`
         (ex.: {\"eletivo\",\"alta_complexidade\"}), de modo que os tipos nao mapeados voltem a
         alcancar o catch-all L0 (fecha o ACHADO-3)."
    nao_e_uma_recomendacao: >-
      O candidato implementa (a) por ser a unica opcao cuja base este arquivo consegue citar sem
      adjudicar escopo. Se o dono escolher (b) e/ou (c), as edicoes sao localizadas e obvias.

