# EQUIVALENCE PROOF — what changes, and what provably does not
# =================================================================================================
equivalencia_provada:
  enunciado: >-
    Candidato e tabela viva divergem EXATAMENTE quando
    `tipo_procedimento = "urgencia_emergencia"` E `cpt_declarada = true`. Fora desse subespaco cada
    entrada casa a MESMA regra viva (via a coluna `origem` de cada regra candidata) e emite
    `carencia_cumprida` e `prazo_restante_dias` identicos.
  o_que_nao_e_comparado: >-
    `fonte` NAO entra em nenhuma comparacao: TODA regra candidata reescreve `fonte` com o prefixo
    `CANDIDATO —` (a mesma convencao que o precedente W3 usa em `motivo`), logo ela e texto de
    proveniencia, nunca sinal de divergencia. O sinal equivalente e QUAL regra viva o candidato
    alcanca — medido explicitamente no teste.
  tres_classes_de_divergencia:
    - "dias_desde_adesao >= 1 e < 730: viva false / 730-dias (r01) vs candidato true / 0 — INVERSAO DO BOOLEANO."
    - "dias_desde_adesao < 1 (isto e, 0): viva false / 730 (r01) vs candidato false / 1 — mesmo booleano, prazo diferente."
    - "dias_desde_adesao >= 730: viva true / 0 (r02) vs candidato true / 0 — MESMOS numeros, mas a regra
       alcancada passa de r02 (CPT) para r04 (urgencia): muda a fundamentacao registrada, nao o desfecho."
  verificacao: >-
    Provado por exaustao no modulo de teste (tests/unit/spec/test_carencia_check_shadow_candidate.py)
    sobre a grade completa de tipo_procedimento (os 5 declarados + a string vazia + um literal fora
    do dominio) x um conjunto de `dias_desde_adesao` que inclui todas as fronteiras da tabela
    (0, 1, 2, 179, 180, 181, 299, 300, 301, 729, 730, 731) x cpt_declarada, com AMBAS as tabelas
    lidas dos artefatos pelo mesmo leitor FIRST-hit. O mesmo modulo prova que o candidato e MONOTONO
    a favor do beneficiario: nunca transforma uma carencia cumprida em nao cumprida, e nunca alonga
    um prazo informado.

