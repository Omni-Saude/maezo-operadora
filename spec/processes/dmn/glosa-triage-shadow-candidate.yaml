# =================================================================================================
# EQUIVALENCE PROOF — what changes, and what provably does not
# =================================================================================================
equivalencia_provada:
  enunciado: >-
    Sobre TODO o espaco de entrada, candidato e tabela viva divergem EXATAMENTE quando
    `categoria_normalizada` esta FORA de {tecnica, clinica, documental, administrativa, valor} E
    item_conforme_tabela=true E divergencia_valor=false E documentacao_anexa=true. Nesse subespaco:
    viva -> SEM_GLOSA (terminal, sem humano); candidato -> ANALISE_HUMANA (c_catchall). Em todo o
    resto do espaco os dois emitem o MESMO `roteamento`.
  o_que_nao_e_comparado: >-
    `motivo` NAO entra na comparacao: toda regra candidata o reescreve com o prefixo `CANDIDATO —`
    (a mesma convencao do precedente W3), logo e texto de proveniencia, nunca sinal de divergencia.
  esboco: >-
    (i) A condicao de `c_sem_glosa` e um SUBCONJUNTO estrito da de `r_sem_glosa` (o conjunto
    positivo esta contido em not({tecnica,clinica})), logo nao casar `r_sem_glosa` implica nao
    casar `c_sem_glosa`; (ii) quando `c_sem_glosa` casa, nenhuma das tres regras especificas que
    passaram a precede-la casa (c_tecnica_humano exige cat in {tecnica,clinica}; c_documental_humano
    exige docs=false; c_valor_recorrer exige divergencia=true) — por isso a reordenacao e neutra;
    (iii) quando `r_sem_glosa` casa mas `c_sem_glosa` nao, sobra exatamente o subespaco do
    enunciado, que no candidato desce ate o catch-all.
  verificacao: >-
    Provado por exaustao no modulo de teste (tests/unit/spec/test_glosa_triage_shadow_candidate.py)
    sobre a grade completa de tipo_item x categoria x 3 booleanos, com AMBAS as tabelas lidas dos
    artefatos (XML vivo e este YAML) pelo mesmo leitor FIRST-hit.

