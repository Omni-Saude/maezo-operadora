# DMN decision ids under spec/processes/dmn/ that are not (yet) referenced by
# any BPMN businessRuleTask camunda:decisionRef.
#
# `make validate-artifacts` (src/maezo/platform/validation/crossref.py) FAILS
# CLOSED on any orphan decision id that is NOT listed here — this file is the
# only way to keep a legitimate, reviewed orphan out of the gate. It is not a
# way to silence a genuinely broken or dead DMN: adding an entry here is a
# deliberate, disclosed exception (see the T2.1 PR body for the full list),
# not a way to make a problem disappear quietly.
#
# Each entry needs a one-line justification. The three recurring legitimate
# reasons observed in this tree:
#   - "agent-consumed": the DMN is evaluated directly by an agent via the
#     engine-side DmnTransport.evaluate seam (ADR-0028; ADR-0012 for the
#     triage use), not wired into a BPMN businessRuleTask. PERSP-C5-ORPHANS-
#     MECHANISM: this used to say "mcp-dmn.evaluate", naming the deprecated
#     fail-open in-process evaluator (AF-08) instead of the real mechanism.
#   - "pending wiring": the decision table was drafted ahead of the BPMN
#     process/branch that will eventually call it.
#   - "worker-consumed": the DMN is evaluated directly by a Python worker via
#     the tools/workers/dmn_transport.py `dmn=` seam (ADR-0028), not through a
#     BPMN businessRuleTask decisionRef — a PERMANENT orphan by design (the
#     table is meant to be called from worker code, e.g. because it is one of
#     several STANDALONE tables a worker aggregates before a downstream
#     businessRuleTask runs), not a transient "not wired yet" state.
#
# format: mapping of decision id -> justification string.
version: 1
orphans:
  # --- SP-OP-AUTH-001 auto-approval criteria gate (GAP-AUTH-4 / GAP-AUTH-3) -------------
  # These 6 were RE-CLASSIFIED (not removed) when the criteria gate landed. They are no
  # longer UNWIRED: `operadora.auth.validate_auto_criteria` (ST_ValidateAutoApprovalCriteria,
  # between BRT_SlaAnalise and BRT_AutoApproval) evaluates every one of them engine-side via
  # the ADR-0028 `dmn=` worker seam. They stay listed here because `crossref.py` defines an
  # orphan purely as "no BPMN businessRuleTask decisionRef" — worker-consumed tables are
  # therefore PERMANENT orphans from its perspective, exactly like the 7 fraude_scoring
  # tables below. REMOVING them would make `make validate-artifacts` fail closed on an
  # unlisted orphan; the honest record is this justification, not deletion.
  #
  # This also closes GAP-AUTH-3: docs/review-queue.md used to claim the 5 DUT/carencia tables
  # were already wired "via Rafael's mcp-dmn". They were not — Rafael's graph
  # (`agents/rafael/graph.py:91-93`) references only auth_admissibility / auth_sla /
  # auth_auto_approval, and `grep -rn 'dut_rol_coverage|dut_criteria|carencia_check' src/`
  # returned ZERO hits before this change. Now they really are consumed.
  #
  # RATIFICATION: being wired does NOT make them load-bearing. Each contributes a PASS only
  # when ratified in `auth-criteria-ratification.yaml`; all six are DRAFT/synthetic today, so
  # each yields false with a `*_FONTE_NAO_RATIFICADA` token while the validator records what
  # it WOULD have decided in shadow mode.
  carencia_check: >-
    Worker-consumed via DmnTransport (ADR-0028 dmn= seam) by
    operadora.auth.validate_auto_criteria — the REGULATORIO criterion of the
    SP-OP-AUTH-001 auto-approval gate. PERMANENT orphan from crossref's
    BPMN-decisionRef-only perspective, not a pending-wiring gap. Content
    (carencia/CPT deadlines) is SYNTHETIC/DRAFT and NOT ratified in
    auth-criteria-ratification.yaml, so it can only produce shadow evidence
    today — never a PASS (docs/review-queue.md; juridico/regulatorio review).
  dut_criteria_bariatrica: >-
    Worker-consumed via DmnTransport (ADR-0028 dmn= seam) by
    operadora.auth.validate_auto_criteria — the procedure-specific half of the
    TECNICO criterion, selected from dut_rol_coverage's dut_ref through the
    SME-declared mapeamento_dut_criteria in auth-criteria-ratification.yaml.
    PERMANENT orphan from crossref's perspective. Clinical content SYNTHETIC/
    DRAFT and NOT ratified — shadow evidence only (docs/review-queue.md).
  dut_criteria_oncologia_pet_ct: >-
