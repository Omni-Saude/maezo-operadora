# DMN decision ids under spec/processes/dmn/ that are not (yet) referenced by
# any BPMN businessRuleTask camunda:decisionRef.
#
# `make validate-artifacts` (src/maezo/platform/validation/crossref.py) FAILS
# CLOSED on any orphan decision id that is NOT listed here — this file is the
# only way to keep a legitimate, reviewed orphan out of the gate. It is not a
# way to silence a genuinely broken or dead DMN: adding an entry here is a
# deliberate, disclosed exception (see the T2.1 PR body for the full list),
# not a way to make a problem disappear quietly.
#
# Each entry needs a one-line justification. The two recurring legitimate
# reasons observed in this tree:
#   - "agent-consumed": the DMN is evaluated directly by an agent via
#     mcp-dmn.evaluate (ADR-0012), not wired into a BPMN businessRuleTask.
#   - "pending wiring": the decision table was drafted ahead of the BPMN
#     process/branch that will eventually call it.
#
# format: mapping of decision id -> justification string.
version: 1
orphans:
