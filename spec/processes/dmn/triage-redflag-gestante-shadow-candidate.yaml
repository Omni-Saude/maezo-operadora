# =================================================================================================
# WHY NO REORDERING IS PROPOSED — a provable property, not a judgement call
# =================================================================================================
# Live rules in FIRST-hit order (hitPolicy :17), with their severity:
#
#   1 r1 (:31-40) "sangramento_vaginal"         -       IG -      -> P1 / ESCALATE_EMERGENCY
#   2 r2 (:41-50) "cefaleia_alteracao_visual"   -       IG >= 20  -> P1 / ESCALATE_EMERGENCY
#   3 r3 (:51-59) "movimentos_fetais_reduzidos" -       IG >= 26  -> P1 / ESCALATE_EMERGENCY
#   4 r4 (:60-68) "perda_liquido"               -       IG <  37  -> P1 / ESCALATE_EMERGENCY
#   5 r5 (:69-77) "contracoes_regulares"        -       IG <  37  -> P1 / ESCALATE_EMERGENCY
#   6 r6 (:78-86) "febre"        "grave","moderada"     IG -      -> P2 / ESCALATE_NURSE
#   7 r7 (:87-96) -              "grave"                IG -      -> P2 / ESCALATE_NURSE
#   8 r8 (:97-105) -             -                      IG -      -> false / CONTINUE
#
# The rules are already ordered by NON-INCREASING severity, under the severity order the family's
# own output domains declare (adult:18-19): ESCALATE_EMERGENCY/P1 > ESCALATE_NURSE/P2 >
# CONTINUE/"-". Under FIRST-hit that means: FOR EVERY INPUT, THE VERDICT THE TABLE EMITS IS THE
# MOST SEVERE VERDICT AMONG ALL RULES THAT MATCH THAT INPUT. No permutation of these eight rules
# can escalate any input further than the live order already does.
#
# That is why the M-7 mandate ("reorder existing rules / tighten bands using values already in the
# table") yields NOTHING here: there is no masking to undo. The defects are BAND HOLES, and every
# one of them is a missing obstetric statement, not a misplaced row.
# (Proven by exhaustion in tests/unit/spec/test_triage_redflag_shadow_candidates.py.)
#
# A NOTE ON "TIGHTENING BANDS": the three gestational bands this table declares (`>= 20`, `>= 26`,
# `< 37`) could be WIDENED with values already present — e.g. replacing `< 37` with the wildcard
# `-`. That is deliberately NOT proposed: each of those rules states its own clinical scope in its
# own `motivo` ("rotura prematura de membranas PRE-TERMO" :67; "trabalho de parto PRE-TERMO" :76;
# "3o trimestre" :58; "apos 20 semanas" :42). Widening the band would make the rule fire outside
# the condition its own text names, i.e. it would silently re-label a different clinical entity.
# The bands are recorded as ACHADOS instead.

# =================================================================================================
# ACHADOS — for the obstetrician. Each carries repro vectors derived from the live artifact.
# NONE of them is closed here. Closing any of them requires clinical content this table lacks.
# =================================================================================================
achados:

  - id: ACHADO-G1-termo-sem-regra-perda-de-liquido-e-contracoes
    regras_afetadas: r4 (:60-68), r5 (:69-77)
    achado: >-
      As duas regras que cobrem perda de liquido e contracoes regulares param em `IG < 37`
      (:63, :72) e as suas proprias motivos declaram o escopo "pre-termo" (:67, :76). De 37 semanas
      em diante NAO HA REGRA para nenhum dos dois sintomas: a avaliacao cai no fail-safe r7 (se a
      intensidade for exatamente "grave") ou no catch-all r8 -> `red_flag=false` / `CONTINUE`.
    vetores_repro:
      - entrada: {sintoma_codigo: perda_liquido, intensidade: moderada, idade_gestacional_semanas: 38}
        regra_viva: r8
        saida_viva: {red_flag: false, prioridade: "-", conduta: CONTINUE}
      - entrada: {sintoma_codigo: contracoes_regulares, intensidade: moderada, idade_gestacional_semanas: 40}
        regra_viva: r8
        saida_viva: {red_flag: false, prioridade: "-", conduta: CONTINUE}
      - entrada: {sintoma_codigo: perda_liquido, intensidade: moderada, idade_gestacional_semanas: 36}
        regra_viva: r4
        saida_viva: {red_flag: true, prioridade: P1, conduta: ESCALATE_EMERGENCY}
        leitura: "contraste: duas semanas antes o mesmo relato e emergencia"
    porque_nao_foi_fechado: >-
      Qual e a conduta a termo para perda de liquido e para contracoes regulares — e se e a mesma
      dos dois — e conteudo obstetrico. Nao existe nesta tabela. Alargar `< 37` para `-` faria a
      regra disparar fora do quadro que a sua propria motivo nomeia ("pre-termo"), o que seria
      inventar conteudo clinico por omissao.

  - id: ACHADO-G2-pre-eclampsia-abaixo-de-20-semanas
    regra_afetada: r2 (:41-50)
    achado: >-
      A suspeita de pre-eclampsia so e avaliada a partir de `IG >= 20` (:45), consistente com a
      descricao da propria regra ("Cefaleia + alteracao visual APOS 20 SEMANAS", :42). Abaixo de 20
      semanas o mesmo par de sintomas nao tem regra: r7 (se "grave") ou r8.
    vetores_repro:
      - entrada: {sintoma_codigo: cefaleia_alteracao_visual, intensidade: moderada, idade_gestacional_semanas: 19}
        regra_viva: r8
        saida_viva: {red_flag: false, prioridade: "-", conduta: CONTINUE}
      - entrada: {sintoma_codigo: cefaleia_alteracao_visual, intensidade: grave, idade_gestacional_semanas: 19}
        regra_viva: r7
        saida_viva: {red_flag: true, prioridade: P2, conduta: ESCALATE_NURSE}
        leitura: "escala, mas como sintoma generico grave (P2/enfermagem), nao como P1/emergencia"
    porque_nao_foi_fechado: >-
      Se cefaleia com alteracao visual antes de 20 semanas deve escalar — e para qual prioridade —
      e julgamento obstetrico. FINDING, NAO FIX.

  - id: ACHADO-G3-movimentos-fetais-abaixo-de-26-semanas
    regra_afetada: r3 (:51-59)
    achado: >-
      Reducao de movimentos fetais so e avaliada a partir de `IG >= 26` (:54), coerente com a
      motivo da regra ("3o trimestre", :58). Abaixo disso, sem regra.
    vetores_repro:
      - entrada: {sintoma_codigo: movimentos_fetais_reduzidos, intensidade: moderada, idade_gestacional_semanas: 25}
        regra_viva: r8
        saida_viva: {red_flag: false, prioridade: "-", conduta: CONTINUE}
      - entrada: {sintoma_codigo: movimentos_fetais_reduzidos, intensidade: moderada, idade_gestacional_semanas: 26}
        regra_viva: r3
        saida_viva: {red_flag: true, prioridade: P1, conduta: ESCALATE_EMERGENCY}
        leitura: "a fronteira e exata: 25 -> nenhum red flag, 26 -> emergencia"
    porque_nao_foi_fechado: >-
      Idem ACHADO-G2: a banda e a conduta abaixo de 26 semanas sao conteudo obstetrico.

  - id: ACHADO-G4-intensidade-desconhecida-nao-escala
    regras_afetadas: r6 (:78-86), r7 (:87-96), r8 (:97-105)
    achado: >-
      O dominio declarado de `intensidade` inclui QUATRO valores: [leve|moderada|grave|desconhecida]
      (triage_redflag_adult.dmn:17). O valor `desconhecida` — declaracao explicita de IGNORANCIA
      sobre a gravidade — nao aparece em regra nenhuma. Consequencia: febre com intensidade
      "desconhecida" desce ate o catch-all e le `red_flag=false`; o fail-safe r7 nao ajuda porque
      exige a string exata "grave" (:90).
    vetores_repro:
      - entrada: {sintoma_codigo: febre, intensidade: desconhecida, idade_gestacional_semanas: 30}
        regra_viva: r8
        saida_viva: {red_flag: false, prioridade: "-", conduta: CONTINUE}
      - entrada: {sintoma_codigo: febre, intensidade: moderada, idade_gestacional_semanas: 30}
        regra_viva: r6
        saida_viva: {red_flag: true, prioridade: P2, conduta: ESCALATE_NURSE}
    porque_nao_foi_fechado: >-
      A disposicao de uma intensidade desconhecida e decisao clinica/assistencial; nada nesta
      tabela nem no schema comum a declara. Vale identicamente para a tabela pediatrica
      (ACHADO-P2 do candidato irmao) — e portanto uma questao de FAMILIA, nao de uma tabela.

  - id: ACHADO-G5-sintoma-nao-mapeado-so-escala-em-grave
    regra_afetada: r7 (:87-96)
    achado: >-
      O fail-safe obstetrico cobre APENAS `intensidade = "grave"`, exatamente como o schema comum
      declara (triage_redflag_adult.dmn:20). Qualquer sintoma gestacional fora dos seis codigos
      mapeados, relatado como "moderada", termina em `red_flag=false`. Escopo declarado, registrado
      para confirmacao — nao defeito escondido.
    vetores_repro:
      - entrada: {sintoma_codigo: dor_abdominal, intensidade: moderada, idade_gestacional_semanas: 30}
        regra_viva: r8
        saida_viva: {red_flag: false, prioridade: "-", conduta: CONTINUE}
      - entrada: {sintoma_codigo: dor_abdominal, intensidade: grave, idade_gestacional_semanas: 30}
        regra_viva: r7
        saida_viva: {red_flag: true, prioridade: P2, conduta: ESCALATE_NURSE}
    nota: >-
      `dor_abdominal` E um codigo mapeado na tabela ADULTA (triage_redflag_adult.dmn:113-121,
      "grave" -> P2) mas NAO nesta. A lista de codigos por populacao e conteudo clinico; registrado
      para que o obstetra confirme a cobertura de codigos, nao para que alguem a complete aqui.

  - id: ACHADO-G6-prioridade-hifen-como-valor
    regra_afetada: r8 (:97-105), saida `prioridade` (:102)
    achado: >-
      O catch-all emite a STRING `"-"` como `prioridade` — valor declarado no dominio [P1|P2|-]
      (triage_redflag_adult.dmn:18), portanto correto, mas graficamente identico ao wildcard de
      inputEntry. Sem efeito comportamental; risco de leitura para revisores e consumidores.

