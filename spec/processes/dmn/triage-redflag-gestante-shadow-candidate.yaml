#     inputs  {sintoma_codigo: string, intensidade: string [leve|moderada|grave|desconhecida]}
#             + one population field
#     outputs {red_flag: boolean, prioridade: string [P1|P2|-],
#              conduta: string [ESCALATE_EMERGENCY|ESCALATE_NURSE|CONTINUE], motivo: string}
