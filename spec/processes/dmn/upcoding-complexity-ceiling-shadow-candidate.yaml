modo_operacao: sombra

# =================================================================================================
# THE DEFECT, STATED AS A REACHABILITY FACT ABOUT THE LIVE TABLE
# =================================================================================================
# Columns (:28-33): encounter_class / code_tier. Outputs (:34-36): indicador_score /
# indicador_label / motivo. hitPolicy FIRST (:27). Live rules in order:
#
#   1 r_ambulatorio_tier3    (:37-44) "ambulatorio"    tier > 2  -> 30 / upcoding_complexity_ceiling
#   2 r_ps_tier4             (:45-52) "pronto_socorro" tier > 3  -> 30 / upcoding_complexity_ceiling
#   3 r_ambulatorio_tier2    (:53-60) "ambulatorio"    tier = 2  -> 15 / ..._borderline
#   4 r_internacao_hightier  (:61-68) "internacao"     tier > 4  -> 15 / ..._borderline
#   5 r_catchall             (:69-76) wildcards                  ->  0 / "none"
#
# FACT: rule 5 is the ONLY rule reachable for any `encounter_class` outside
# {"ambulatorio", "pronto_socorro", "internacao"} — including the empty string — and it emits the
# SAME `0`/`"none"` it emits for a genuinely within-ceiling encounter. The two populations the
# catch-all's own description names ("dentro do teto" and "nao mapeado", :70) are therefore
# INDISTINGUISHABLE downstream.
#
# DOWNSTREAM EFFECT OF THE `"none"` LABEL: `_evaluate_scoring_chain` drops exactly the literal
# "none" from `indicadores_presentes` (fraude.py:344-346, `_NO_INDICATOR_LABEL` :218). So an
# unmapped encounter class leaves NO trace at all in the dossier's indicator list.
#
# THIS IS ALREADY LIVE-ENGINE-VERIFIED IN THIS REPOSITORY — the defect is not a projection.
# `tests/integration/dmn/test_fraude_scoring_chain.py::test_scenario_a_no_signal_falls_to_catchalls`
# (:110-132) evaluates the seven tables against the REAL engine with NO evidence signal attached
# and pins `score_indicadores == 75` (:113) with SIX labels (:114-127). `upcoding_complexity_ceiling`
# is the ONE MISSING LABEL of the seven, and its contribution to that 75 is ZERO — exactly this
# defect, on a live engine, already committed. (The 75 also embeds a SEPARATE, already-flagged
# anomaly: `phantom_suspicious_prefix`'s `starts with(...)` on an absent input hits its 25-point row
# instead of its catch-all — see the comment at :117-125 of that module. Not this table's defect and
# not touched here.)

# =================================================================================================
# FURTHER FINDINGS — recorded for the owner; nothing here is applied by engineering.
# =================================================================================================
achados_adicionais:

  - id: ACHADO-1-comentario-do-worker-e-falso-hoje
    local: src/maezo/tools/workers/fraude.py:216-218
    classe: comentario que descreve a convencao que a tabela alvo quebra
    achado: >-
      O worker documenta `_NO_INDICATOR_LABEL = "none"` como "Neutral label every table emits on its
      catch-all/no-indicator row". A metade "no-indicator row" e verdadeira nas sete tabelas; a
      metade "catch-all" e verdadeira em UMA SO — justamente `upcoding_complexity_ceiling`. Nas
      outras seis o catch-all emite `<decision_id>_indeterminado`, que NAO e filtrado e portanto
      aparece em `indicadores_presentes`. Aplicar este candidato torna o comentario correto para as
      sete. Registrado como ACHADO (nao alterado): mexer no worker seria wiring, fora do escopo
      desta onda.

  - id: ACHADO-2-efeito-no-score-agregado-e-no-roteamento
    local: fraude_indicadores.dmn:40-79
    classe: consequencia a jusante que o dono precisa aceitar conscientemente
    achado: >-
      `score_indicadores` e a SOMA dos sete `indicador_score` (fraude.py:332-347) e alimenta
      `fraude_indicadores`, cujas faixas sao `>= 50` -> PRIORITARIA (:43), `>= 20` -> APROFUNDADA
      (:51) e `< 20` -> LEVE (:67). Elevar o catch-all de 0 para 10 acrescenta +10 ao total de todo
      caso com `encounter_class` nao mapeado, o que pode cruzar a fronteira de 20 (LEVE ->
      APROFUNDADA) ou a de 50 (APROFUNDADA -> PRIORITARIA).
    direcao_do_efeito: >-
      SEMPRE na direcao de MAIS investigacao humana, NUNCA de menos. E `fraude_indicadores` nao
      emite veredito: seu invariante L0 declarado (:12-15) e que ela define INTENSIDADE DE
      INVESTIGACAO, nunca acusacao — a acusacao so nasce na User Task humana. Ainda assim, o dono
      deve aceitar o efeito explicitamente: e volume de investigacao.

  - id: ACHADO-3-input-ausente-cai-no-catchall-e-por-isso-o-catchall-importa
    local: fraude.py:230-307, :186-197, :241-242; tests/integration/dmn/test_fraude_scoring_chain.py:110-132
    classe: consequencia direta do defeito, com evidencia de motor real
    achado: >-
      `_collect_scoring_inputs` OMITE deliberadamente qualquer sinal ausente ou nao coercivel,
      apoiado no comentario "the table's own missing-input catch-all row handles the absence
      conservatively" (fraude.py:241-242). O cenario A do teste de integracao CONFIRMA no motor
      real que a ausencia de TODOS os sinais realmente cai nos catch-alls (:110-132) — e e
      exatamente por isso que o valor do catch-all desta tabela importa: enquanto as seis irmas
      devolvem 10/indeterminado, esta devolve 0/"none" e desaparece do dossie.
    limite_do_que_este_arquivo_afirma: >-
      O cenario A cobre a ausencia SIMULTANEA de todos os sinais. Este arquivo NAO generaliza dai
      uma semantica de nulo para toda combinacao (por exemplo `encounter_class` presente com
      `code_tier` ausente), e por isso o CORPUS DE DIVERGENCIA usa apenas valores PRESENTES, onde
      o comportamento e inequivoco. O que se pode afirmar sem risco: sob o candidato, um
      `code_tier` que nao satisfaz nenhuma faixa declarada cai no catch-all 10/indeterminado —
      isto e, o candidato e no minimo tao conservador quanto a tabela viva em qualquer leitura de
      semantica de nulo.

  - id: ACHADO-3B-o-que-quebra-quando-o-dono-aplicar
    local: tests/integration/dmn/test_fraude_scoring_chain.py:110-132
    classe: consequencia operacional da aplicacao — para quem executar o passo 2
    achado: >-
      Aplicar este candidato a tabela viva MUDA a expectativa do cenario A do teste de integracao:
      `score_indicadores` passa de 75 para 85 (+10, exatamente o catch-all desta tabela) e
      `indicadores_presentes` ganha `"upcoding_complexity_ceiling_indeterminado"` como SETIMO
      rotulo. Nenhum outro cenario muda: B e C usam `encounter_class="ambulatorio"`
      (:59, :73), uma classe declarada, e portanto sao provados equivalentes. O delta de +10 e
      derivado dos artefatos e pinado em
      tests/unit/spec/test_upcoding_ceiling_shadow_candidate.py, para nao virar surpresa.

  - id: ACHADO-4-tier-2-de-pronto-socorro-e-de-internacao
    regras_afetadas: r_ambulatorio_tier2 (:53-60) vs r_ps_tier4 (:45-52) / r_internacao_hightier (:61-68)
    classe: assimetria entre classes de encontro — registrada, NAO alterada
    achado: >-
      Existe uma faixa "borderline" (score 15) para `ambulatorio` (tier exatamente 2) e para
      `internacao` (tier > 4), mas NENHUMA para `pronto_socorro`: la o salto e direto de 0 (tier
      <= 3) para 30 (tier > 3). Se o pronto-socorro deveria ter uma faixa borderline — e em que
      tier — e conteudo de auditoria medica. O candidato NAO inventa uma. FINDING, NAO FIX.

  - id: ACHADO-5-tabela-ainda-listada-como-orfa
    local: spec/processes/dmn/orphans-allowlist.yaml:118
    classe: metadado desatualizado
    achado: >-
      A tabela continua na allowlist de orfaos com a justificativa "ate o wiring do worker
      operadora.fraude.score_indicators — T2.7 fase 2", mas esse wiring EXISTE
      (fraude.py:150-158, :1036). Sem efeito comportamental; registrado para higiene de metadado.
      Vale para as sete tabelas da familia, nao so para esta.

# =================================================================================================
# THE OPEN DECISION THE CANDIDATE DELIBERATELY DOES NOT MAKE
# =================================================================================================
decisao_pendente_do_dono:
  - id: DECISAO-A-o-valor-10-e-um-valor-da-familia-nao-desta-tabela
    pergunta: >-
      O score do "indeterminado" desta tabela deve ser 10, como nas outras seis, ou outro valor?
    porque_nao_foi_decidido_aqui: >-
      `10` e o unico valor citavel: e o que as seis irmas usam, sem excecao. Escolher qualquer
      outro seria inventar um score. Se o dono julgar que um upcoding indeterminado pesa
      diferente de um z-score indeterminado, essa e UMA celula a mudar (`indicador_score` da
      ordem 8) e o mascaramento continua fechado em qualquer caso.
  - id: DECISAO-B-manter-ou-nao-as-regras-dentro-do-teto
    pergunta: >-
      As tres regras "dentro do teto" (ordens 5-7) devem existir, ou o catch-all deveria continuar
      cobrindo os dois casos?
    porque_nao_foi_decidido_aqui: >-
      Elas sao a peca (ii) da convencao da familia — sem elas, elevar o catch-all para 10
      pontuaria +10 TODO encontro conforme, o que tornaria o indicador inutil. Sao, portanto,
      necessarias para que a correcao seja a da familia e nao uma mudanca de severidade geral.
      Registrado como decisao porque e a parte do diff que ACRESCENTA linhas.

# =================================================================================================
# `regras_candidatas` — hitPolicy FIRST, evaluated top to bottom.
# Inputs/outputs are EXACTLY the live table's own (:28-36). NO new input, NO new output, NO new
# tier number, NO new score.
#
# THE WHOLE DIFF THE OWNER APPLIES: keep rules 1-4 exactly as they are; INSERT three "dentro do
# teto" rows (ordens 5-7) carrying the live catch-all's own `0`/`"none"` outputs; and change the
# catch-all's three output cells to the family's `10` / `..._indeterminado` / "Indicador moderado".
# =================================================================================================
regras_candidatas:

  - ordem: 1
    id: c_ambulatorio_tier3
    candidato: true
    origem: "PRESERVADA verbatim (entradas e saidas; motivo com prefixo CANDIDATO) de r_ambulatorio_tier3 (upcoding_complexity_ceiling.dmn:37-44)"
    entradas:
      encounter_class: '"ambulatorio"'
      code_tier: "> 2"
    saidas:
      indicador_score: 30
      indicador_label: upcoding_complexity_ceiling
      motivo: "CANDIDATO — Indicador: complexidade de codigo acima do esperado para ambulatorio (tier 3+) — fato de montagem de dossie, NUNCA veredito"

  - ordem: 2
    id: c_ps_tier4
    candidato: true
