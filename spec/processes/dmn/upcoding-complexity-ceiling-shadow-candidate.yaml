# =================================================================================================
# EQUIVALENCE PROOF — what changes, and what provably does not
# =================================================================================================
equivalencia_provada:
  enunciado: >-
    Para `encounter_class` IN {"ambulatorio", "pronto_socorro", "internacao"} e qualquer `code_tier`
    inteiro, candidato e tabela viva emitem `indicador_score` e `indicador_label` IDENTICOS. A
    divergencia e EXATAMENTE o complemento: todo `encounter_class` fora desses tres literais
    (incluindo a string vazia) passa de 0/"none" para 10/"upcoding_complexity_ceiling_indeterminado".
  o_que_nao_e_comparado: >-
    `motivo` NAO entra na comparacao: toda regra candidata o reescreve com o prefixo `CANDIDATO —`
    (a mesma convencao do precedente W3), logo e texto de proveniencia, nunca sinal de divergencia.
  esboco: >-
    Para cada classe declarada, as regras de indicador (ordens 1-4) particionam a faixa "acima do
    teto" e a regra nova correspondente (ordens 5-7) e o complemento EXATO dessa faixa — logo a
    uniao cobre todo o inteiro e o catch-all e inalcancavel para as tres classes. Fora delas,
    nenhuma regra 1-7 casa e o catch-all e o unico alcancavel, nas duas tabelas.
  verificacao: >-
    Provado por exaustao no modulo de teste (tests/unit/spec/test_upcoding_ceiling_shadow_candidate.py)
    sobre a grade de encounter_class (os 3 declarados + literais fora do dominio + string vazia) x
    code_tier de -1 a 8, com AMBAS as tabelas lidas dos artefatos pelo mesmo leitor FIRST-hit.

# =================================================================================================
# EVIDENCE THE OWNER RATIFIES AGAINST
# =================================================================================================
# tests/unit/spec/test_upcoding_ceiling_shadow_candidate.py enumerates the divergence corpus, PINS
# THE FAMILY CONVENTION by reading the six sibling tables' catch-alls off their own artifacts (so
# the "10 / _indeterminado" claim is derived, not asserted), and pins that ratifying this file
# cannot enforce it.
