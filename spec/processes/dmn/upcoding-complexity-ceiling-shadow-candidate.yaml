# CANDIDATE (shadow) rule set for `upcoding_complexity_ceiling` — M-6: the catch-all breaks the
# family convention its own six siblings declare.
# =================================================================================================
# THIS FILE IS NOT A DEPLOYABLE ARTIFACT. It is DATA describing a PROPOSED correction to
# `spec/processes/dmn/upcoding_complexity_ceiling.dmn`. It carries the `.yaml` extension
# deliberately: every artifact-selection path in this repository globs `*.dmn` / `*.bpmn` ONLY.
#
#   - deploy  : `collect_artifacts` — `dmn_dir.glob("*.dmn")`
#               (src/maezo/platform/deploy/engine_deploy.py:140)
#   - validate: the same `*.dmn` glob (src/maezo/platform/validation/cli.py:103;
#               `make validate-artifacts`, Makefile:26-42)
#   Pinned twice:
#     - tests/unit/platform/test_engine_deploy.py::test_real_spec_tree_yields_16_bpmn_and_62_dmn;
#     - tests/unit/spec/test_upcoding_ceiling_shadow_candidate.py::
#       test_candidate_manifest_is_invisible_to_artifact_deployment.
#
# NO WORKER WIRING IN THIS WAVE. Nothing in `src/` reads this file — pinned by
# `test_no_src_consumer_of_the_candidate_manifests`.
#
# =================================================================================================
# WHY THIS FILE EXISTS
# -------------------
# `upcoding_complexity_ceiling` is one of the SEVEN `fraude_scoring/*` tables the worker
# `operadora.fraude.score_indicators` evaluates and aggregates
# (src/maezo/tools/workers/fraude.py:150-158). The other six share ONE structure, stated in each of
# their own rule descriptions:
#
#   (i)  indicator rules with positive scores;
#   (ii) an EXPLICIT "indicador ausente" rule with a POSITIVE condition -> score 0, label "none";
#   (iii) a terminal catch-all -> score 10, label "<decision_id>_indeterminado", motivo
#         "Indicador moderado: <input> desconhecido — requer avaliacao na montagem do dossie".
#
#   risk_thresholds.dmn                 (ii) r_risk_low        :56-62   (iii) r_catchall :63-69
#   frequency_zscore_threshold.dmn      (ii) r_zscore_normal   :56-63   (iii) r_catchall :64-71
#   phantom_no_diagnosis.dmn            (ii) r_both_present    :43-50
#                                            r_no_tuss         :51-58   (iii) r_catchall :59-66
#   phantom_suspicious_prefix.dmn       (ii) r_normal_prefix   :50-56   (iii) r_catchall :57-63
#   provider_peer_deviation.dmn         (ii) r_normal_deviation:49-56   (iii) r_catchall :57-64
#   unbundling_partial_bundles.dmn      (ii) r_complete_bundle :41-48
#                                            r_no_bundle       :49-56   (iii) r_catchall :57-64
#
# `upcoding_complexity_ceiling.dmn` IS THE ONLY ONE OF THE SEVEN WITH NO (ii) RULE. Its catch-all
# (:69-76) does double duty for BOTH populations at once — its own description says so: "dentro do
# teto de complexidade / NAO MAPEADO" (:70) — and it resolves that ambiguity in the permissive
# direction: score `0` (:73), label `"none"` (:74).
#
# CONSEQUENCE: an encounter whose `encounter_class` is outside the three literals the table declares
# ("ambulatorio" :39/:55, "pronto_socorro" :47, "internacao" :63) contributes `0` to
# `score_indicadores` and NOTHING to `indicadores_presentes` — i.e. it is indistinguishable, in the
# dossier, from an encounter that was affirmatively checked and found within its ceiling. In the
# other six tables the same situation contributes `10` and a `..._indeterminado` label, which is
# what puts the unknown in front of the human assembling the dossier.
#
# THE SOURCE OF EVERY VALUE THIS FILE PROPOSES
# --------------------------------------------
#   - `10`, `"upcoding_complexity_ceiling_indeterminado"` and the motivo wording: the SIBLING
#     TABLES' OWN catch-alls, cited line-by-line above. Nothing invented; the label follows the
#     family's own `<decision_id>_indeterminado` naming (six instances).
#   - `< 2`, `<= 3`, `<= 4`: the exact set-complements of the live table's OWN ceilings
#     `> 2` (:40), `= 2` (:56), `> 3` (:48), `> 4` (:64). No new tier number appears anywhere.
#   - `0` / `"none"` for the within-ceiling rules: the live table's own catch-all outputs
#     (:73-:74), preserved for the population that catch-all was also serving.
#
# WHO MAY ACT ON THIS
# -------------------
# ADR-0028 (docs/adr/0028-dmn-evaluation-engine-side.md:214-216): engineering NEVER corrects the
# table. The correction is the OWNER's act — medico-auditor + auditoria especial + financas, per
# docs/review-queue.md:200 — and it is a spec DATA change.
#
# =================================================================================================
# ACTIVATION PATH — the SINGLE human act (ADR-0028 §7)
# =================================================================================================
# 1. The OWNER reviews `regras_candidatas` and RATIFIES by setting ALL THREE of `ratificado: true`,
#    a non-placeholder `revisor` and a non-placeholder `ratificado_em`. Any missing/blank/
#    `PLACEHOLDER_*` value => NOT ratified (fail-closed).
# 2. The OWNER applies `regras_candidatas` to the LIVE TABLE
#    `spec/processes/dmn/upcoding_complexity_ceiling.dmn`. PER ADR-0028 THE LIVE-TABLE EDIT IS THE
#    OWNER'S ACT.
# 3. Only after step 2 does runtime behaviour change.
#
# REVIEWER GATE: `.github/CODEOWNERS` covers BOTH this file and the live table.
#
# =================================================================================================

version: 1
status: DRAFT
alvo: spec/processes/dmn/upcoding_complexity_ceiling.dmn
decisao_alvo: upcoding_complexity_ceiling
norma_regente: >-
  NENHUMA norma externa. A base e a CONVENCAO DECLARADA PELA PROPRIA FAMILIA de tabelas
  fraude_scoring/* (as seis irmas listadas no cabecalho, cada uma com catch-all
  10 / "<decision_id>_indeterminado"), somada aos tetos que a propria tabela alvo declara.
  Os scores continuam SINTETICOS e pendentes de SME (docs/review-queue.md:200).

# --- RATIFICATION BLOCK -------------------------------------------------------------------------
ratificado: false
revisor: "PLACEHOLDER_DONO_DA_TABELA — medico-auditor + auditoria especial + financas (docs/review-queue.md:200)"
