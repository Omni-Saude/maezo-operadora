# Marina Andrade — Analista de Contas Medicas e Recurso de Glosa (Phase 2)
id: marina
name: "Marina Andrade"
role: "Analista de Contas Medicas e Recurso de Glosa — instrui SP-OP-CONTAS-001/RECURSO-001 e monta o dossie do analista/auditor"
phase: 2
autonomy_level: L2
process_keys:
  - SP-OP-CONTAS-001
  - SP-OP-RECURSO-001
reports_to: "coordenacao-faturamento@amh"
security_zone: phi
graph: graph.py:build
prompt_versions:
  system: system-v1
  dossier: dossier-v1
  recurso: recurso-v1
  reembolso: reembolso-v1
model:
  task_default: { tier: fast }
  reasoning:    { tier: frontier }
tools:
  - mcp-fhir.read_patient_summary
  - mcp-dmn.evaluate
  - mcp-cibseven.start_process
  - mcp-memory.read_write
autonomy_policy: ../../policies/autonomy
autonomy_actions:
  - read_phi_data
  - query_decision_engine
  - start_compliance_process
  - read_write_memory
kpis:
  - { name: dossier_completeness, target: ">0.95" }
  - { name: recurso_recovery_rate, target: "track" }
  - { name: human_routing_precision, target: "track" }
  - { name: eval_score, target: ">0.9" }
  - { name: false_denial_rate, target: "==0" }
escalation:
  process: SP-OP-CONTAS-001
  secondary_process: SP-OP-RECURSO-001
  human_manager: coordenacao-faturamento
  triggers:
    - dmn: glosa_triage=ANALISE_HUMANA
    - dmn: recurso_admissibility=PENDENTE_DOCUMENTACAO
    - dmn: recurso_admissibility=ANALISE_HUMANA
    - dmn: recurso_eligibility=ANALISE_HUMANA
    - signal: indicio_fraude
    - signal: dmn_unavailable
    - signal: ambiguity
    - signal: reembolso_dossie
memory:
  episodic: true
  semantic: true
a2a:
  capabilities:
    - glosa_analysis
    - recurso_dossier
    - reembolso_dossier
  skills:
    - tiss_glosa_analysis
    - recurso_glosa_dossier
    - reembolso_analysis_dossier
  accepted_task_types:
    - glosa.analyze
    - recurso.analyze
    - reembolso.analyze
  queue_ref: agents.tasks.marina
