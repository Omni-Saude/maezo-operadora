<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Página externa — mesma origem que o motor</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 1rem;
  background:#F6F8F8;color:#1D2C33}
@media(prefers-color-scheme:dark){body{background:#131B1E;color:#DCE6E6}}
h1{font-size:1.5rem;margin:0 0 .3rem}
p.hint{color:#57696F;margin:.2rem 0 1.2rem}
button{font:inherit;padding:.45rem .9rem;border:1px solid #0E655D;background:#0E655D;
  color:#fff;border-radius:4px;cursor:pointer}
button.ghost{background:transparent;color:#0E655D}
pre{background:#fff;border:1px solid #D8E0E0;padding:.8rem;overflow-x:auto;white-space:pre-wrap}
@media(prefers-color-scheme:dark){pre{background:#1B2529;border-color:#2A3A3E}}
</style></head><body>
<h1>Página externa servida pelo Canal</h1>
<p class="hint">Esta página é <b>mesma origem</b> que o motor e que o agente. Não há token,
não há CORS, e o acesso continua sendo o Cloudflare Access que protege este hostname.</p>

<p><button class="ghost" onclick="verMotor()">GET /engine/version</button>
<button onclick="pedirAoAgente()">POST /agente/v1/autorizacoes</button></p>
<pre id="saida">clique num botão…</pre>

<script>
const out = document.getElementById("saida");

async function verMotor(){
  out.textContent = "consultando o motor…";
  try{
    const r = await fetch("/engine/version");
    out.textContent = `HTTP ${r.status}\n` + JSON.stringify(await r.json(), null, 2);
  }catch(e){ out.textContent = "falha: " + e.message }
}

async function pedirAoAgente(){
  // Caso FICTICIO: numero de guia fora de qualquer faixa real, pseudonimo explicito.
  const n = 90000000 + Math.floor(Math.random()*99999);
  out.textContent = "executando um turno do agente… (modelo real leva dezenas de segundos)";
  const t0 = performance.now();
  try{
    const r = await fetch("/agente/v1/autorizacoes", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({tenant_id:"amh", numero_guia_tiss:String(n),
        codigo_procedimento_tuss:"40901114", categoria_procedimento:"exame",
        prestador_id:"PREST-FICTICIO-EXT", beneficiario_pseudo_id:"pseudo-ficticio-"+n,
        carater_atendimento:"eletivo", cid10:"M545", valor_estimado_brl:480,
        canal:"portal_tiss"})});
    const j = await r.json();
    const ms = Math.round(performance.now()-t0);
    const res = j.resultado || {};
    out.textContent =
      `HTTP ${r.status} — ${ms} ms de ida e volta, ${j.duracao_ms} ms de turno\n\n` +
      `rota:      ${res.route}\n` +
      `desfecho:  ${res.desfecho}\n` +
      `instância: ${(res.process_ref||{}).instance_id || "—"}\n\n` +
      `NARRATIVA DO DOSSIÊ\n${(res.dossier||{}).narrativa || "—"}`;
  }catch(e){ out.textContent = "falha: " + e.message }
}
</script>
</body></html>
