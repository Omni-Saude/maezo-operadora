  - cefaleia
  - enxaqueca
texto: >-
  A dor de cabeça é muito comum e tem muitas causas, como cansaço, pouco sono e estresse.
  Descansar em lugar calmo e beber água pode ajudar.
  Se a dor voltar com frequência, marque uma consulta.
